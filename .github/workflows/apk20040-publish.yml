{
  "name": "CLOSED Logs30 exact verified installer-correction APK publication",
  "on": {
    "push": {
      "branches": [
        "review/apk20040-publish-20261016"
      ]
    }
  },
  "permissions": {
    "contents": "write",
    "actions": "read"
  },
  "concurrency": {
    "group": "logs30-approved-publication",
    "cancel-in-progress": false
  },
  "jobs": {
    "publish": {
      "if": true,
      "runs-on": "ubuntu-24.04",
      "timeout-minutes": 20,
      "steps": [
        {
          "uses": "actions/checkout@v4",
          "with": {
            "persist-credentials": false
          }
        },
        {
          "name": "Verify immutable CI proofs and publish only approved bytes",
          "env": {
            "GITHUB_TOKEN": "${{ github.token }}"
          },
          "run": "python3 .review/apk20040-publisher/publish.py"
        },
        {
          "uses": "actions/upload-artifact@v4",
          "if": "always()",
          "with": {
            "name": "logs30-publication-${{ github.sha }}",
            "path": "build/logs30-publication/publication-receipt.json",
            "if-no-files-found": "warn",
            "retention-days": 14
          }
        }
      ]
    }
  }
}
