name: PR 487 source audio and subtitle metadata verification
'on':
  push:
    branches:
    - review/source-audio-subtitle-metadata-481-cleanup
permissions:
  contents: read
concurrency:
  group: pr487-cleanup-${{ github.sha }}
  cancel-in-progress: true
jobs:
  native:
    name: Metadata fixtures and native application regressions
    runs-on: macos-14
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false
        fetch-depth: 0
    - name: Verify canonical base and exact three source blobs
      run: python3 .review/pr487-cleanup/verify-source.py
    - name: Native tools
      run: brew install sdl2 sdl2_image sdl2_ttf ffmpeg ripgrep
    - name: Run isolated sanitizer fixtures and normal application regressions
      run: bash .review/pr487-cleanup/run-native-checks.sh
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: pr487-native-${{ github.sha }}
        path: build/review/
        if-no-files-found: warn
        retention-days: 14
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      NUVIO_ANDROID_JOBS: 2
    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false
        fetch-depth: 0
    - name: Verify canonical base and exact three source blobs
      run: python3 .review/pr487-cleanup/verify-source.py
    - uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '17'
    - uses: android-actions/setup-android@v3
      with:
        packages: platform-tools
        log-accepted-android-sdk-licenses: false
    - name: Build tools
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y ninja-build cmake nasm ffmpeg python3-pil zlib1g-dev
        sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'ndk;27.2.12479018' 'cmake;3.22.1'
    - name: Public application configuration and debug signing
      env:
        NUVIO_TOUCH_CORE_PROPERTIES: ${{ secrets.NUVIO_TOUCH_CORE_PROPERTIES }}
        NUVIO_TOUCH_DEBUG_KEYSTORE_B64: ${{ secrets.NUVIO_TOUCH_DEBUG_KEYSTORE_B64 }}
      run: |
        set -euo pipefail
        mkdir -p build/android "$HOME/.android"
        python3 - <<'PY'
        import os
        from pathlib import Path
        body = os.environ.get('NUVIO_TOUCH_CORE_PROPERTIES', '')
        if not body:
            raise SystemExit('Set NUVIO_TOUCH_CORE_PROPERTIES for this debug build')
        path = Path('build/android/product.properties')
        path.write_text(body)
        path.chmod(0o600)
        PY
        test -n "$NUVIO_TOUCH_DEBUG_KEYSTORE_B64" || { echo 'Set NUVIO_TOUCH_DEBUG_KEYSTORE_B64 for repeatable debug builds'; exit 1; }
        printf '%s' "$NUVIO_TOUCH_DEBUG_KEYSTORE_B64" | base64 --decode > "$HOME/.android/debug.keystore"
        chmod 600 "$HOME/.android/debug.keystore"
        echo "NUVIO_PROPERTIES=$GITHUB_WORKSPACE/build/android/product.properties" >> "$GITHUB_ENV"
    - uses: actions/cache/restore@v4
      id: native-cache
      with:
        path: ~/.cache/nuvio-android
        key: android-touch-native-v1-${{ runner.os }}-${{ hashFiles('tools/android/deps.sh', 'tools/android/ffmpeg-android.sh',
          'android/app/src/main/cpp/CMakeLists.txt') }}
        restore-keys: android-touch-native-v1-${{ runner.os }}-
    - uses: actions/cache/restore@v4
      id: gradle-cache
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: android-touch-gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle.kts', 'android/gradle/wrapper/gradle-wrapper.properties')
          }}
        restore-keys: android-touch-gradle-${{ runner.os }}-
    - name: Native ARM dependencies
      run: bash tools/android/deps.sh arm64-v8a armeabi-v7a
    - name: Standard production-tool debug APK
      env:
        NUVIO_P2P_MOTOR: none
        NUVIO_REQUIRE_CORE: '1'
      run: bash tools/android.sh
    - name: Verify standard package and both ARM architectures
      run: |
        python3 - "$ANDROID_HOME/build-tools/35.0.0/aapt" <<'PY'
        import re
        import subprocess
        import sys
        import zipfile
        from pathlib import Path
        apks = list(Path('build/android').glob('*-android-debug.apk'))
        if len(apks) != 1:
            raise SystemExit(f'Expected one standard debug APK, found {len(apks)}')
        apk = apks[0]
        badging = subprocess.run([sys.argv[1], 'dump', 'badging', str(apk)], check=True, capture_output=True, text=True).stdout
        package = re.search(r"^package: name='([^']+)'", badging, re.MULTILINE)
        if package is None or package.group(1) != 'space.nuvio.nativelegacy':
            raise SystemExit('APK must use the standard space.nuvio.nativelegacy application ID')
        label = re.search(r"^application-label:'([^']+)'", badging, re.MULTILINE)
        if label is None:
            raise SystemExit('APK application label is missing')
        print(f'applicationId={package.group(1)} applicationLabel={label.group(1)}')
        with zipfile.ZipFile(apk) as archive:
            names = set(archive.namelist())
        for abi in ('arm64-v8a', 'armeabi-v7a'):
            required = f'lib/{abi}/libmain.so'
            if required not in names:
                raise SystemExit(f'APK missing {required}')
        subprocess.run([sys.executable, 'tools/android-apk-pages.py', str(apk)], check=True)
        import hashlib, json
        proof = json.loads(Path('build/review/source-verified.json').read_text())
        proof.update(apk=str(apk), apk_sha256=hashlib.sha256(apk.read_bytes()).hexdigest(), application_id=package.group(1), abis=['arm64-v8a', 'armeabi-v7a'], pages_verified=True)
        Path('build/review/apk-verified.json').write_text(json.dumps(proof, indent=2) + '\n')
        print(f'{apk}: standard application ID, both ARM native cores and 16 KiB pages verified')
        PY
    - name: Locate build outputs
      id: outputs
      if: always()
      run: |
        if compgen -G 'build/android/*-android-debug.apk' >/dev/null; then
          echo 'standard_apk=true' >> "$GITHUB_OUTPUT"
        fi
        if [[ -d "$HOME/.cache/nuvio-android" ]]; then
          echo 'native_cache=true' >> "$GITHUB_OUTPUT"
        fi
        if [[ -d "$HOME/.gradle/caches" || -d "$HOME/.gradle/wrapper" ]]; then
          echo 'gradle_cache=true' >> "$GITHUB_OUTPUT"
        fi
    - uses: actions/cache/save@v4
      if: always() && steps.outputs.outputs.native_cache == 'true' && steps.native-cache.outputs.cache-hit != 'true'
        && steps.native-cache.outputs.cache-primary-key != ''
      with:
        path: ~/.cache/nuvio-android
        key: ${{ steps.native-cache.outputs.cache-primary-key }}
    - uses: actions/cache/save@v4
      if: always() && steps.outputs.outputs.gradle_cache == 'true' && steps.gradle-cache.outputs.cache-hit != 'true'
        && steps.gradle-cache.outputs.cache-primary-key != ''
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: ${{ steps.gradle-cache.outputs.cache-primary-key }}
    - uses: actions/upload-artifact@v4
      if: always() && steps.outputs.outputs.standard_apk == 'true'
      with:
        name: pr487-standard-apk-${{ github.sha }}
        path: build/android/*-android-debug.apk
        if-no-files-found: error
        retention-days: 14
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: pr487-android-source-${{ github.sha }}
        path: build/review/
        if-no-files-found: warn
        retention-days: 14
    name: Standard debug APK, both ARM architectures and 16 KiB pages
