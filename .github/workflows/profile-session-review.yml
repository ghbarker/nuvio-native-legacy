name: 'Fresh profile sessions: standalone regressions and compatible test APK'
'on':
  push:
    branches:
    - review/profile-session-isolation
permissions:
  contents: read
concurrency:
  group: profile-session-${{ github.ref }}
  cancel-in-progress: true
jobs:
  standalone:
    name: Clean profile session feature on latest upstream (macOS)
    runs-on: macos-14
    timeout-minutes: 55
    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false
        fetch-depth: 0
    - name: Verify exact standalone product commit and source blob manifest
      run: |-
        set -euo pipefail
        python3 - <<'VERIFY'
        import hashlib
        import json
        import os
        from pathlib import Path
        import subprocess
        base = '17bb330373273a3de284d7f2898a3a3e16f1fc3f'
        feature = '389849c5e7a04deb809b975d03f2b6ac8efd8c9d'
        plan = json.loads(Path('.review/profile-session/standalone-files.json').read_text())
        assert plan['base'] == base and plan['feature_commit'] == feature
        subprocess.run(['git', 'merge-base', '--is-ancestor', base, feature], check=True)
        changed = subprocess.check_output(['git', 'diff', '--name-only', '-z', base, feature]).decode().split('\0')
        changed = sorted(p for p in changed if p)
        assert changed == sorted(e['path'] for e in plan['files'])
        assert changed and all((p.startswith('src/') or p in {'tools/android.sh', 'tools/arm.sh'}) and '..' not in Path(p).parts for p in changed)
        target = Path(os.environ['RUNNER_TEMP']) / 'nuvio-profile-session-standalone'
        subprocess.run(['git', 'worktree', 'add', '--detach', str(target), feature], check=True)
        verified = []
        for entry in plan['files']:
            relative = entry['path']
            file = target / relative
            data = file.read_bytes()
            actual = hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest()
            expected = subprocess.check_output(['git', 'rev-parse', feature + ':' + relative], text=True).strip()
            assert actual == entry['sha'] == expected, (relative, actual, entry['sha'], expected)
            assert bool(file.stat().st_mode & 0o111) == (entry['mode'] == '100755')
            verified.append({'path': relative, 'sha': actual, 'mode': entry['mode']})
        output = Path('build/review')
        output.mkdir(parents=True, exist_ok=True)
        proof = {'base': base, 'feature_commit': feature, 'build_commit': os.environ['GITHUB_SHA'],
                 'verified': True, 'feature_changed_paths': changed, 'files': verified}
        (output / 'standalone-source-verified.json').write_text(json.dumps(proof, indent=2) + '\n')
        print('Exact clean profile-session product feature verified:', feature, len(verified), 'source files')
        VERIFY
    - name: Native tools
      run: brew install sdl2 sdl2_image sdl2_ttf ffmpeg
    - name: Run baseline profile, playback, subtitle and session-isolation regressions
      run: |-
        set -uo pipefail
        export NUVIO_PROFILE_REVIEW="$GITHUB_WORKSPACE/.review/profile-session"
        export NUVIO_PROFILE_RESULTS="$GITHUB_WORKSPACE/build/review/profile-session"
        mkdir -p build/review
        cd "$RUNNER_TEMP/nuvio-profile-session-standalone"
        failed=0
        for name in homeestado ordemperfil ajustes_perfil perfilsel fontepref legmemoria fontevolta player_retido addons_legendas fontecache_vod i18n; do
          if bash "tests/$name.sh" 2>&1 | tee "$GITHUB_WORKSPACE/build/review/$name.log"; then
            echo "$name PASS" >> "$GITHUB_WORKSPACE/build/review/results.txt"
          else
            echo "$name FAIL" >> "$GITHUB_WORKSPACE/build/review/results.txt"; failed=1
          fi
        done
        if SANITIZE=1 bash "$NUVIO_PROFILE_REVIEW/tests/run_regressions.sh" 2>&1 | tee "$GITHUB_WORKSPACE/build/review/profile-session.log"; then
          echo 'profile session regressions PASS' >> "$GITHUB_WORKSPACE/build/review/results.txt"
        else
          echo 'profile session regressions FAIL' >> "$GITHUB_WORKSPACE/build/review/results.txt"; failed=1
        fi
        exit "$failed"
    - name: Preserve catalog display geometry, D-pad and profile regression coverage
      run: |
        cd "$RUNNER_TEMP/nuvio-profile-session-standalone"
        mkdir -p .review/hide-watched/tests build/review
        cp "$GITHUB_WORKSPACE/.review/hide-watched/tests/colecao_exibicao_compat.c" .review/hide-watched/tests/
        set -euo pipefail
        task_sources=()
        for task_source in src/*.c src/dts/*.c; do
          case "$task_source" in src/main.c|src/vertudo.c) continue;; esac
          task_sources+=("$task_source")
        done
        cc "${task_sources[@]}" .review/hide-watched/tests/colecao_exibicao_compat.c \
          -Isrc -o build/review/catalog-display-baseline -O1 -g \
          -I/opt/homebrew/include -I/opt/homebrew/include/SDL2 \
          -L/opt/homebrew/lib -lSDL2 -lSDL2_image -lSDL2_ttf -lz -framework OpenGL \
          -Wno-deprecated-declarations -Wno-macro-redefined \
          > build/review/catalog-display-build.log 2>&1
        build/review/catalog-display-baseline | tee build/review/catalog-display-baseline.log
        cp build/review/catalog-display*.log "$GITHUB_WORKSPACE/build/review/"
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: profile-session-standalone-regressions-${{ github.sha }}
        path: build/review/
        retention-days: 14
  native:
    name: Retained features and full profile-session regressions (macOS)
    runs-on: macos-14
    timeout-minutes: 55
    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false
        fetch-depth: 0
    - name: Verify retained app and the frozen profile-session merge
      run: python3 .review/profile-session/build/verify_overlay.py
    - name: Preserve retained Settings assertions after the append-only provider setting
      run: python3 .review/profile-session/build/adapt_retained_tests.py
    - name: Native tools
      run: brew install sdl2 sdl2_image sdl2_ttf ffmpeg
    - name: Verify retained features and watched behavior in TV and Mobile paths
      run: |-
        set -uo pipefail
        export NV_TMP="$RUNNER_TEMP/nuvio-hide-watched-combined-regressions"
        export NUVIO_WATCHED_COMBINED=1
        mkdir -p build/review "$NV_TMP"
        failed=0
        for name in stream_faixas_parse stream_faixas_ui stream_parser streamfit_parser fontefiltro_parse fontefiltro fonte_ordem_addon fontecache_vod fontefalha fontefalha_worker homeestado i18n; do
          if bash "tests/$name.sh" 2>&1 | tee "build/review/$name.log"; then
            echo "$name PASS" >> build/review/results.txt
          else
            echo "$name FAIL" >> build/review/results.txt
            failed=1
          fi
        done
        if bash .review/hide-watched/build/run_regressions.sh 2>&1 | tee build/review/watched.log; then
          echo 'watched review regressions PASS' >> build/review/results.txt
        else
          echo 'watched review regressions FAIL' >> build/review/results.txt
          failed=1
        fi
        cat build/review/results.txt
        exit "$failed"
    - name: Preserve catalog display geometry, D-pad and profile regression coverage
      run: |-
        set -euo pipefail
        task_sources=()
        for task_source in src/*.c src/dts/*.c; do
          case "$task_source" in src/main.c|src/vertudo.c) continue;; esac
          task_sources+=("$task_source")
        done
        cc "${task_sources[@]}" .review/hide-watched/tests/colecao_exibicao_compat.c \
          -Isrc -o build/review/catalog-display-baseline -O1 -g \
          -I/opt/homebrew/include -I/opt/homebrew/include/SDL2 \
          -L/opt/homebrew/lib -lSDL2 -lSDL2_image -lSDL2_ttf -lz -framework OpenGL \
          -Wno-deprecated-declarations -Wno-macro-redefined \
          > build/review/catalog-display-build.log 2>&1
        build/review/catalog-display-baseline | tee build/review/catalog-display-baseline.log
    - name: Verify profile sessions alongside all retained features
      run: |-
        set -euo pipefail
        export NUVIO_PROFILE_REVIEW="$GITHUB_WORKSPACE/.review/profile-session"
        export NUVIO_PROFILE_RESULTS="$GITHUB_WORKSPACE/build/review/profile-session"
        export NUVIO_PROFILE_COMBINED=1
        SANITIZE=1 bash "$NUVIO_PROFILE_REVIEW/tests/run_regressions.sh" 2>&1 | tee build/review/profile-session.log
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: profile-session-combined-regressions-${{ github.sha }}
        path: build/review/
        retention-days: 14
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      NUVIO_ANDROID_JOBS: 2
    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false
        fetch-depth: 0
    - name: Verify retained app and the frozen profile-session merge
      run: python3 .review/profile-session/build/verify_overlay.py
    - uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '17'
    - uses: android-actions/setup-android@v3
      with:
        packages: platform-tools
        log-accepted-android-sdk-licenses: false
    - name: Build tools
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y ninja-build cmake nasm ffmpeg python3-pil zlib1g-dev
        sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'ndk;27.2.12479018' 'cmake;3.22.1'
    - name: Public application configuration and debug signing
      env:
        NUVIO_TOUCH_CORE_PROPERTIES: ${{ secrets.NUVIO_TOUCH_CORE_PROPERTIES }}
        NUVIO_TOUCH_DEBUG_KEYSTORE_B64: ${{ secrets.NUVIO_TOUCH_DEBUG_KEYSTORE_B64 }}
      run: |
        mkdir -p build/android
        python3 - <<'PY'
        import os
        from pathlib import Path
        body = os.environ.get('NUVIO_TOUCH_CORE_PROPERTIES', '')
        if not body:
            raise SystemExit('Set NUVIO_TOUCH_CORE_PROPERTIES for this debug build')
        path = Path('build/android/product.properties')
        path.write_text(body)
        path.chmod(0o600)
        PY
        test -n "$NUVIO_TOUCH_DEBUG_KEYSTORE_B64" || { echo 'Set NUVIO_TOUCH_DEBUG_KEYSTORE_B64 for repeatable debug updates'; exit 1; }
        signing_dir="$RUNNER_TEMP/nuvio-test-signing"
        mkdir -p "$signing_dir"
        printf '%s' "$NUVIO_TOUCH_DEBUG_KEYSTORE_B64" | base64 --decode > "$signing_dir/debug.keystore"
        chmod 600 "$signing_dir/debug.keystore"
        keytool -exportcert -alias androiddebugkey -keystore "$signing_dir/debug.keystore" \
          -storepass android -file "$signing_dir/public-cert.der" >/dev/null
        python3 - "$signing_dir/public-cert.der" <<'VERIFY'
        import hashlib
        import sys
        from pathlib import Path
        actual = hashlib.sha256(Path(sys.argv[1]).read_bytes()).hexdigest()
        expected = '862d7ef63a0dbde2929f6f231cae295510726d9ac28f9292496d2a38304be5e6'
        assert actual == expected, 'Persistent test signing key changed'
        print('Persistent test signing certificate verified:', actual)
        VERIFY
        echo "NUVIO_TEST_DEBUG_KEYSTORE=$signing_dir/debug.keystore" >> "$GITHUB_ENV"
        echo "NUVIO_PROPERTIES=$GITHUB_WORKSPACE/build/android/product.properties" >> "$GITHUB_ENV"
    - name: Explicitly pin debug signing in the CI working copy
      run: |
        python3 - <<'PY'
        from pathlib import Path
        path = Path('android/app/build.gradle.kts')
        body = path.read_text()
        marker = '    signingConfigs {\n'
        assert body.count(marker) == 1, 'Expected exactly one signingConfigs block'
        replacement = '''    signingConfigs {
                getByName("debug") {
                    storeFile = file(System.getenv("NUVIO_TEST_DEBUG_KEYSTORE") ?: error("Persistent test signing key missing"))
                    storePassword = "android"
                    keyAlias = "androiddebugkey"
                    keyPassword = "android"
                }
        '''
        path.write_text(body.replace(marker, replacement, 1))
        PY
    - uses: actions/cache/restore@v4
      id: native-cache
      with:
        path: ~/.cache/nuvio-android
        key: android-touch-native-v1-${{ runner.os }}-${{ hashFiles('tools/android/deps.sh', 'tools/android/ffmpeg-android.sh',
          'android/app/src/main/cpp/CMakeLists.txt') }}
        restore-keys: android-touch-native-v1-${{ runner.os }}-
    - uses: actions/cache/restore@v4
      id: gradle-cache
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: android-touch-gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle.kts', 'android/gradle/wrapper/gradle-wrapper.properties')
          }}
        restore-keys: android-touch-gradle-${{ runner.os }}-
    - name: Native ARM dependencies
      run: bash tools/android/deps.sh arm64-v8a armeabi-v7a
    - name: Standard production-tool debug APK
      env:
        NUVIO_P2P_MOTOR: none
        NUVIO_REQUIRE_CORE: '1'
      run: bash tools/android.sh
    - name: Verify standard package and both ARM architectures
      run: |
        python3 - "$ANDROID_HOME/build-tools/35.0.0/aapt" <<'PY'
        import re
        import subprocess
        import sys
        import zipfile
        from pathlib import Path
        apks = list(Path('build/android').glob('*-android-debug.apk'))
        if len(apks) != 1:
            raise SystemExit(f'Expected one standard debug APK, found {len(apks)}')
        apk = apks[0]
        badging = subprocess.run([sys.argv[1], 'dump', 'badging', str(apk)], check=True, capture_output=True, text=True).stdout
        package = re.search(r"^package: name='([^']+)'", badging, re.MULTILINE)
        if package is None or package.group(1) != 'space.nuvio.nativelegacy':
            raise SystemExit('APK must use the standard space.nuvio.nativelegacy application ID')
        label = re.search(r"^application-label:'([^']+)'", badging, re.MULTILINE)
        if label is None:
            raise SystemExit('APK application label is missing')
        print(f'applicationId={package.group(1)} applicationLabel={label.group(1)}')
        with zipfile.ZipFile(apk) as archive:
            names = set(archive.namelist())
        for abi in ('arm64-v8a', 'armeabi-v7a'):
            required = f'lib/{abi}/libmain.so'
            if required not in names:
                raise SystemExit(f'APK missing {required}')
        print(f'{apk}: standard application ID and both ARM native cores verified')
        PY
    - name: Prepare compatible test installation in CI working copy
      run: |
        python3 - <<'PY'
        from pathlib import Path
        replacements = {
            Path('android/app/build.gradle.kts'): [
                ('applicationId = "space.nuvio.nativelegacy"', 'applicationId = "space.nuvio.nativelegacy.touch"'),
                ('versionCode = vx * 10000 + vy * 100 + vz', 'versionCode = 20007'),
                ('versionName = versao', 'versionName = "2.0.7-testprofiles"'),
            ],
            Path('android/app/src/main/AndroidManifest.xml'): [
                ('android:label="@string/app_name"', 'android:label="Nuvio TV/Mobile Test"'),
                ('android:authorities="space.nuvio.nativelegacy.atualizacao"', 'android:authorities="space.nuvio.nativelegacy.touch.atualizacao"'),
            ],
        }
        updated = {}
        for path, pairs in replacements.items():
            body = path.read_text()
            for old, new in pairs:
                if body.count(old) != 1:
                    raise SystemExit(f'{path}: expected exactly one {old!r}')
                body = body.replace(old, new)
            updated[path] = body
        for path, body in updated.items():
            path.write_text(body)
        print('Temporary CI package, label and provider authority changed; production namespace and classes preserved')
        PY

        # The separately reviewed #472 touch-picker fix stays in the test APK only.
        python3 - <<'PICKER'
        from pathlib import Path
        p=Path('src/ajustes_ux_desenho.inc')
        s=p.read_text()
        needle='      op == AJ_LOGO_APP /* abre o seletor'
        assert s.count(needle)==1
        s=s.replace(needle,'      op == AJ_INTERFACE_MODO /* toque em TV: PR #472 */ ||\n'+needle)
        p.write_text(s)
        print('Test APK also includes the isolated Interface-mode touch fix from PR #472')
        PICKER
    - name: Compatible TV and Mobile test APK
      env:
        NUVIO_P2P_MOTOR: none
      run: |
        task_root="$PWD"
        task_cache="${NUVIO_ANDROID_CACHE:-$HOME/.cache/nuvio-android}"
        task_stage="$task_root/build/android"
        bash android/gradlew -p android --console=plain \
          -Pnuvio.sdlSrc="$task_cache/src" \
          -Pnuvio.estagio="$task_stage" \
          -Pnuvio.ffmpegAar="$task_stage/media3-ffmpeg-16kb.aar" \
          assembleDebug
        task_version="$(python3 -c 'import json; print(json.load(open("deploy/app/appinfo.json"))["version"])')"
        cp android/app/build/outputs/apk/debug/app-debug.apk "build/android/Nuvio-2.0.7-testprofiles-tv-mobile-test.apk"
    - name: Verify compatible test package, label, persistent signature and native packaging
      run: |-
        python3 - "$ANDROID_HOME/build-tools/35.0.0/aapt" "$ANDROID_HOME/build-tools/35.0.0/apksigner" <<'PY'
        import re
        import subprocess
        import sys
        import zipfile
        from pathlib import Path
        apks = list(Path('build/android').glob('*-tv-mobile-test.apk'))
        if len(apks) != 1:
            raise SystemExit(f'Expected one compatible test APK, found {len(apks)}')
        apk = apks[0]
        badging = subprocess.run([sys.argv[1], 'dump', 'badging', str(apk)], check=True, capture_output=True, text=True).stdout
        package = re.search(r"^package: name='([^']+)'", badging, re.MULTILINE)
        label = re.search(r"^application-label:'([^']+)'", badging, re.MULTILINE)
        if package is None or package.group(1) != 'space.nuvio.nativelegacy.touch':
            raise SystemExit('Test APK must use space.nuvio.nativelegacy.touch')
        if label is None or label.group(1) != 'Nuvio TV/Mobile Test':
            raise SystemExit('Test APK must be labeled Nuvio TV/Mobile Test')
        signing = subprocess.check_output([sys.argv[2], 'verify', '--verbose', '--print-certs', str(apk)], text=True)
        expected = '862d7ef63a0dbde2929f6f231cae295510726d9ac28f9292496d2a38304be5e6'
        assert re.search(r"^package: name='space.nuvio.nativelegacy.touch' versionCode='20007'", badging, re.MULTILINE)
        assert re.search(r"versionName='2.0.7-testprofiles'", badging)
        if 'Signer #1 certificate SHA-256 digest: ' + expected not in signing:
            raise SystemExit('Test APK must use the persistent original preview signing certificate')
        print('Test APK persistent signing certificate verified:', expected)
        print(f'applicationId={package.group(1)} applicationLabel={label.group(1)}')
        with zipfile.ZipFile(apk) as archive:
            names = set(archive.namelist())
        for abi in ('arm64-v8a', 'armeabi-v7a'):
            required = f'lib/{abi}/libmain.so'
            if required not in names:
                raise SystemExit(f'APK missing {required}')
        subprocess.run([sys.executable, 'tools/android-apk-pages.py', str(apk)], check=True)
        print(f'{apk}: compatible test identity, both ARM native cores and page packaging verified')
        PY

        python3 - <<'PROOF'
        import hashlib
        import json
        from pathlib import Path
        apk = list(Path('build/android').glob('*-tv-mobile-test.apk'))[0]
        source = json.loads(Path('build/review/combined-source-verified.json').read_text())
        proof = {'apk_sha256': hashlib.sha256(apk.read_bytes()).hexdigest(),
                 'apk_bytes': apk.stat().st_size, 'package': 'space.nuvio.nativelegacy.touch',
                 'label': 'Nuvio TV/Mobile Test', 'version_code': 20007,
                 'version_name': '2.0.7-testprofiles', 'abis': ['arm64-v8a', 'armeabi-v7a'],
                 'certificate_sha256': '862d7ef63a0dbde2929f6f231cae295510726d9ac28f9292496d2a38304be5e6',
                 'source_commit': source['build_commit'], 'feature_commit': source['feature_commit'],
                 'retained_commit': source['retained_commit']}
        Path('build/review/update-identity.json').write_text(json.dumps(proof, indent=2) + '\n')
        print(json.dumps(proof, indent=2))
        PROOF
    - name: Locate build outputs
      id: outputs
      if: always()
      run: |
        if compgen -G 'build/android/*-android-debug.apk' >/dev/null; then
          echo 'standard_apk=true' >> "$GITHUB_OUTPUT"
        fi
        if compgen -G 'build/android/*-tv-mobile-test.apk' >/dev/null; then
          echo 'test_apk=true' >> "$GITHUB_OUTPUT"
        fi
        if [[ -d "$HOME/.cache/nuvio-android" ]]; then
          echo 'native_cache=true' >> "$GITHUB_OUTPUT"
        fi
        if [[ -d "$HOME/.gradle/caches" || -d "$HOME/.gradle/wrapper" ]]; then
          echo 'gradle_cache=true' >> "$GITHUB_OUTPUT"
        fi
    - uses: actions/cache/save@v4
      if: always() && steps.outputs.outputs.native_cache == 'true' && steps.native-cache.outputs.cache-hit != 'true' && steps.native-cache.outputs.cache-primary-key
        != ''
      with:
        path: ~/.cache/nuvio-android
        key: ${{ steps.native-cache.outputs.cache-primary-key }}
    - uses: actions/cache/save@v4
      if: always() && steps.outputs.outputs.gradle_cache == 'true' && steps.gradle-cache.outputs.cache-hit != 'true' && steps.gradle-cache.outputs.cache-primary-key
        != ''
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: ${{ steps.gradle-cache.outputs.cache-primary-key }}
    - uses: actions/upload-artifact@v4
      if: always() && steps.outputs.outputs.standard_apk == 'true'
      with:
        name: Nuvio-profile-session-standard-${{ github.sha }}
        path: build/android/*-android-debug.apk
        if-no-files-found: error
        retention-days: 14
    - uses: actions/upload-artifact@v4
      if: always() && steps.outputs.outputs.test_apk == 'true'
      with:
        name: Nuvio-profile-session-test-${{ github.sha }}
        path: build/android/*-tv-mobile-test.apk
        if-no-files-found: error
        retention-days: 14
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: profile-session-android-source-${{ github.sha }}
        path: build/review/
        if-no-files-found: warn
        retention-days: 14
    name: Compatible profile test APK and standard APK (both ARM architectures)
  publish:
    name: Publish tested profile session APK for issue 488
    needs:
    - standalone
    - native
    - android
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
    - uses: actions/download-artifact@v4
      with:
        name: Nuvio-profile-session-test-${{ github.sha }}
        path: delivery/apk
    - uses: actions/download-artifact@v4
      with:
        name: profile-session-android-source-${{ github.sha }}
        path: delivery/proof
    - name: Verify tested package identity and publish direct download
      env:
        GH_TOKEN: ${{ github.token }}
        GH_REPO: ${{ github.repository }}
      run: |
        set -euo pipefail
        python3 - <<'VERIFY'
        from pathlib import Path
        import hashlib
        import json
        import shutil
        expected_feature = '389849c5e7a04deb809b975d03f2b6ac8efd8c9d'
        proof = json.loads(Path('delivery/proof/update-identity.json').read_text())
        candidates = list(Path('delivery/apk').glob('*-tv-mobile-test.apk'))
        assert len(candidates) == 1
        apk = candidates[0]
        assert proof['feature_commit'] == expected_feature
        assert proof['package'] == 'space.nuvio.nativelegacy.touch'
        assert proof['label'] == 'Nuvio TV/Mobile Test'
        assert proof['version_code'] == 20007
        assert proof['certificate_sha256'] == '862d7ef63a0dbde2929f6f231cae295510726d9ac28f9292496d2a38304be5e6'
        digest = hashlib.sha256(apk.read_bytes()).hexdigest()
        assert digest == proof['apk_sha256']
        target = Path('delivery/Nuvio-TV-Mobile-Test-Profiles.apk')
        shutil.copyfile(apk, target)
        target.with_suffix('.apk.sha256').write_text(digest + '  ' + target.name + '\n')
        Path('delivery/release-notes.txt').write_text('I added fresh profile sessions for issue #488, including the folder/showcase display fix and safeguards against data from a previous profile appearing after switching.\n\nI also added a provider configuration setting: shared on this device or separate for this profile. Existing accounts are preserved. Switching mode preserves both configurations.\n\nThis test APK retains native provider/addon failover, exclusion filters, addon language metadata, Hide watched movies, and TV/Mobile support.\n\nThe macOS standalone and combined regression jobs and both ARM Android builds passed before publication. Device testing of this profile change is still pending.\n\nPackage space.nuvio.nativelegacy.touch; label Nuvio TV/Mobile Test; versionCode 20007. Signed with the original persistent test certificate to update the preceding stable test APK while keeping accounts.\n\nNo PR has been opened for this profile change yet.\nIssue: https://github.com/iqui27/nuvio-native-legacy/issues/488\n')
        print('Verified test APK SHA256:', digest)
        VERIFY
        if gh release view tv-mobile-test-profiles-488 >/dev/null 2>&1; then
          gh release upload tv-mobile-test-profiles-488 delivery/Nuvio-TV-Mobile-Test-Profiles.apk delivery/Nuvio-TV-Mobile-Test-Profiles.apk.sha256 delivery/proof/update-identity.json --clobber
          gh release edit tv-mobile-test-profiles-488 --draft=false --prerelease --latest=false --notes-file delivery/release-notes.txt
        else
          gh release create tv-mobile-test-profiles-488 delivery/Nuvio-TV-Mobile-Test-Profiles.apk delivery/Nuvio-TV-Mobile-Test-Profiles.apk.sha256 delivery/proof/update-identity.json --target 389849c5e7a04deb809b975d03f2b6ac8efd8c9d --prerelease --latest=false --title 'Nuvio TV/Mobile Test: fresh profile sessions' --notes-file delivery/release-notes.txt
        fi
