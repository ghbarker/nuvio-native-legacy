      - name: Collect emulator diagnostics
        if: always()
        run: |
          cat emulator-results/boot.log || true
          timeout 15 adb logcat -d > emulator-results/logcat.txt || true
          timeout 15 adb shell getprop > emulator-results/properties.txt || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Logs41-emulator-diagnostics
          path: emulator-results
      - name: Stop the test emulator
        if: always()
        run: timeout 10 adb emu kill || true
