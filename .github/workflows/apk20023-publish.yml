{
  "name": "Publish the verified compatible Logs13 test update",
  "on": {
    "push": {
      "branches": [
        "review/apk20023-publish-20261015"
      ],
      "paths": [
        ".review/apk20023-publish/**",
        ".github/workflows/apk20023-publish.yml"
      ]
    },
    "workflow_dispatch": {}
  },
  "permissions": {
    "contents": "read",
    "actions": "read"
  },
  "concurrency": {
    "group": "nuvio-test-logs13-release",
    "cancel-in-progress": false
  },
  "env": {
    "APK20023_RELEASE_LOCK_SHA256": "4ef5905c6e0c0f9aa31bcb6230a3a4c62d00ae0aaad8eaab2088ffbee8309727",
    "NUVIO_REVIEW_PLAN_SHA256": "26eb102f1f821adc5e2d840e35b955a4b2ea0cc629dcff23ba08887dd6970437"
  },
  "jobs": {
    "publish": {
      "runs-on": "ubuntu-24.04",
      "timeout-minutes": 30,
      "permissions": {
        "contents": "write",
        "actions": "read"
      },
      "steps": [
        {
          "uses": "actions/checkout@v4",
          "with": {
            "persist-credentials": false,
            "fetch-depth": 0
          }
        },
        {
          "name": "Refuse incomplete or unapproved final pins before tool setup",
          "run": "python3 .review/apk20023-publish/publish.py --check-lock"
        },
        {
          "uses": "actions/setup-java@v4",
          "with": {
            "distribution": "temurin",
            "java-version": "17"
          }
        },
        {
          "uses": "android-actions/setup-android@v3",
          "with": {
            "packages": "platform-tools",
            "log-accepted-android-sdk-licenses": false
          }
        },
        {
          "name": "Install verification tools only; no app build",
          "run": "sdkmanager 'build-tools;35.0.0'"
        },
        {
          "name": "Verify actual green validation/artifacts/APK and publish exact draft by ID",
          "env": {
            "GH_TOKEN": "${{ github.token }}"
          },
          "run": "python3 .review/apk20023-publish/publish.py --publish"
        },
        {
          "uses": "actions/upload-artifact@v4",
          "if": "always()",
          "with": {
            "name": "apk20023-publication-${{ github.sha }}",
            "path": "publication/*-receipt.json\npublication/*-failure.json\npublication/draft-created.json",
            "if-no-files-found": "warn",
            "retention-days": 14
          }
        }
      ]
    }
  }
}
