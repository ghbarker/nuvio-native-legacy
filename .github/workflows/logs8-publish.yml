{
  "name": "Finalize the verified Logs8 draft release",
  "on": {
    "push": {
      "branches": [
        "review/logs8-publish-20261015"
      ]
    },
    "workflow_dispatch": {}
  },
  "permissions": {
    "contents": "read",
    "actions": "read"
  },
  "concurrency": {
    "group": "logs8-test-release",
    "cancel-in-progress": false
  },
  "env": {
    "LOGS8_RELEASE_LOCK_SHA": "d60ba1e9080444716c330b71ef25e174d8dc2a75e448176131ad805a05651a8f"
  },
  "jobs": {
    "publish": {
      "runs-on": "ubuntu-24.04",
      "timeout-minutes": 15,
      "permissions": {
        "contents": "write",
        "actions": "read"
      },
      "steps": [
        {
          "uses": "actions/checkout@v4",
          "with": {
            "persist-credentials": false
          }
        },
        {
          "name": "Verify uploaded bytes and publish only the exact reviewed draft",
          "env": {
            "GH_TOKEN": "${{ github.token }}"
          },
          "run": "python3 .review/logs8-publish/finalize.py"
        },
        {
          "uses": "actions/upload-artifact@v4",
          "if": "always()",
          "with": {
            "name": "logs8-publication-${{ github.sha }}",
            "path": "publication/*.json",
            "if-no-files-found": "warn"
          }
        }
      ]
    }
  }
}
