name: Logs36 macOS subtitle font validation

on:
  workflow_dispatch:

concurrency:
  group: logs36-macos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos-regressions:
    runs-on: macos-15
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Install native test libraries
        run: brew install pkg-config sdl2 sdl2_image sdl2_ttf libass fribidi
      - name: Run macOS subtitle rendering and persistence regressions
        run: |
          set -euo pipefail
          for suite in ass_fonte_local ass_fontes legfontes text_largura faixas_estilo_ctl
          do
            bash "tests/$suite.sh"
          done
          SANITIZE=1 bash tests/legfontes.sh
          SANITIZE=1 bash tests/ass_fonte_local.sh
