name: Drive authorization checks
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 8441240cd769512d935613b8544bb6d42455fe68
          persist-credentials: false
      - name: Check private TV configuration availability
        env:
          DRIVE_TV_SECRET: ${{ secrets.NUVIO_GOOGLE_TV_CLIENT_SECRET }}
        run: |
          if [ -z "$DRIVE_TV_SECRET" ]; then
            echo 'TV client secret is not available to this workflow.'
            exit 1
          fi
          echo 'TV client secret is configured; value is not displayed.'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: drive-auth-gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle.kts', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: logs34-gradle-Linux-
      - name: Prepare Android and SDL Java headers
        run: |
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'ndk;27.2.12479018' 'cmake;3.22.1'
          mkdir -p "$HOME/.cache/nuvio-android/src"
          curl -fsSL https://github.com/libsdl-org/SDL/releases/download/release-2.30.9/SDL2-2.30.9.tar.gz | tar xz -C "$HOME/.cache/nuvio-android/src"
      - name: Compile Android authorization and test profile cancellation
        env:
          NUVIO_GOOGLE_ANDROID_CLIENT_ID: 332670494075-e1ocg7dmruau58n7h0vl1k231pdpstqq.apps.googleusercontent.com
          NUVIO_GOOGLE_TV_CLIENT_ID: 332670494075-u7892oim0t6c0s21uj9ao2houjthkl17.apps.googleusercontent.com
          NUVIO_GOOGLE_TV_CLIENT_SECRET: compile-check-placeholder
        run: |
          bash android/gradlew -p android --console=plain --max-workers=2 :app:compileDebugKotlin :app:testDebugUnitTest --tests space.nuvio.nativelegacy.DriveAuthStateTest
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: drive-android-authorization-tests
          path: android/app/build/reports/tests/testDebugUnitTest
          if-no-files-found: ignore
