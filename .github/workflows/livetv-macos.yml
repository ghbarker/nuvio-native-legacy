name: Logs52 GIF and live recovery macOS regression checks
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-recovery:
    runs-on: macos-15
    timeout-minutes: 15
    env:
      SDL_MAC_BACKGROUND_APP: '1'
      DYLD_LIBRARY_PATH: /opt/homebrew/lib
      ASAN_OPTIONS: detect_leaks=0:halt_on_error=1
      UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
    steps:
      - uses: actions/checkout@v4
        with:
          ref: d485bbe98158340ebac309a0af13bfe3e690c110
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: brew install pkg-config sdl2 sdl2_image sdl2_ttf webp
      - name: GIF decoding, collection selection and live recovery regressions
        run: |
          set -euo pipefail
          for san in 0 1; do
            SANITIZE="$san" bash tests/gif.sh
            SANITIZE="$san" bash tests/gifcolecao.sh
            SANITIZE="$san" bash tests/gifwebp.sh
            SANITIZE="$san" bash tests/livestall_window.sh
            SANITIZE="$san" bash tests/video_android_live_window.sh
            SANITIZE="$san" bash tests/live_error_recovery.sh
          done
          bash tests/livestall.sh
          bash tests/livestall_seco.sh
