name: Logs55 large IPTV guide and retained macOS regression checks
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-recovery:
    runs-on: macos-15
    timeout-minutes: 15
    env:
      SDL_MAC_BACKGROUND_APP: '1'
      DYLD_LIBRARY_PATH: /opt/homebrew/lib
      ASAN_OPTIONS: detect_leaks=0:halt_on_error=1
      UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 98bdc9dc86ca7855b7224e843187e7a897e314c3
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: brew install pkg-config sdl2 sdl2_image sdl2_ttf webp
      - name: Category confirmation, large IPTV guide and retained regressions
        run: |
          set -euo pipefail
          for san in 0 1; do
            SANITIZE="$san" bash tests/ajustes_iptv.sh
            SANITIZE="$san" bash tests/xtream.sh
            SANITIZE="$san" bash tests/guia_grande.sh
            SANITIZE="$san" bash tests/guia_grupos.sh
            SANITIZE="$san" bash tests/guia_loading.sh
            SANITIZE="$san" bash tests/guia_catalogo_tv.sh
            SANITIZE="$san" bash tests/guia_epg_estado.sh
            SANITIZE="$san" bash tests/m3u.sh
            SANITIZE="$san" bash tests/iptv_accounts.sh
            SANITIZE="$san" bash tests/epg_accounts.sh
            SANITIZE="$san" bash tests/epg_memory.sh
            SANITIZE="$san" bash tests/xtepg_bounded.sh
            SANITIZE="$san" bash tests/fonteinfo.sh
            SANITIZE="$san" bash tests/fonteinfo_layout.sh
            SANITIZE="$san" bash tests/fontefalha.sh
            SANITIZE="$san" bash tests/gif.sh
            SANITIZE="$san" bash tests/gifcolecao.sh
            SANITIZE="$san" bash tests/gifwebp.sh
            SANITIZE="$san" bash tests/livestall_window.sh
            SANITIZE="$san" bash tests/video_android_live_window.sh
            SANITIZE="$san" bash tests/live_error_recovery.sh
          done
          bash tests/guiacorte.sh
          bash tests/livestall.sh
          bash tests/livestall_seco.sh
          bash tests/fonteantecipa.sh
          bash tests/ajustes_secoes.sh
          python3 tools/varredura-i18n.py
      - uses: actions/checkout@v4
        with:
          ref: 8cfededfd4b03f89a57ff339f2afdae2ef3d9f74
          path: clean424
          persist-credentials: false
      - name: Check isolated upstream feature branch
        working-directory: clean424
        run: |
          set -euo pipefail
          for san in 0 1; do
            SANITIZE="$san" bash tests/xtream.sh
            SANITIZE="$san" bash tests/guia_grande.sh
          done
