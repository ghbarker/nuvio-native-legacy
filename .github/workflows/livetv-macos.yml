name: Drive authorization checks
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 20de02c81a99732b168ed5a68f83f36e445dd0e7
          persist-credentials: false
      - name: Check private TV configuration availability
        env:
          DRIVE_TV_SECRET: ${{ secrets.NUVIO_GOOGLE_TV_CLIENT_SECRET }}
        run: |
          if [ -z "$DRIVE_TV_SECRET" ]; then
            echo 'TV client secret is not available to this workflow.'
            exit 1
          fi
          echo 'TV client secret is configured; value is not displayed.'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: drive-auth-gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle.kts', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: logs34-gradle-Linux-
      - name: Prepare Android and SDL Java headers
        run: |
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'ndk;27.2.12479018' 'cmake;3.22.1'
          mkdir -p "$HOME/.cache/nuvio-android/src"
          for url in https://github.com/libsdl-org/SDL/releases/download/release-2.30.9/SDL2-2.30.9.tar.gz https://github.com/libsdl-org/SDL_image/releases/download/release-2.8.2/SDL2_image-2.8.2.tar.gz https://github.com/libsdl-org/SDL_ttf/releases/download/release-2.22.0/SDL2_ttf-2.22.0.tar.gz; do
            curl -fsSL "$url" | tar xz -C "$HOME/.cache/nuvio-android/src"
          done
      - name: Check native Android bridge on both ARM ABIs
        run: |
          mkdir -p build/check-headers/SDL2
          cp "$HOME/.cache/nuvio-android/src/SDL2-2.30.9/include/"*.h build/check-headers/SDL2/
          cp "$HOME/.cache/nuvio-android/src/SDL2_image-2.8.2/include/SDL_image.h" "$HOME/.cache/nuvio-android/src/SDL2_ttf-2.22.0/SDL_ttf.h" build/check-headers/SDL2/
          compiler="$ANDROID_HOME/ndk/27.2.12479018/toolchains/llvm/prebuilt/linux-x86_64/bin"
          for arch in aarch64-linux-android24 armv7a-linux-androideabi24; do
            "$compiler/$arch-clang" -std=gnu11 -Wall -Wextra -Werror -DNV_ANDROID -DNV_TOUCH_UI -Isrc -Ibuild/check-headers -Ibuild/check-headers/SDL2 -fsyntax-only src/android.c src/drivetv.c src/drivebackup.c
            "$compiler/$arch-clang" -std=gnu11 -DNV_ANDROID -DNV_TOUCH_UI -Isrc -Ibuild/check-headers -Ibuild/check-headers/SDL2 -fsyntax-only src/ajustes.c src/app.c
          done
      - name: Compile Android authorization and test profile cancellation
        env:
          NUVIO_GOOGLE_ANDROID_CLIENT_ID: 332670494075-e1ocg7dmruau58n7h0vl1k231pdpstqq.apps.googleusercontent.com
          NUVIO_GOOGLE_TV_CLIENT_ID: 332670494075-u7892oim0t6c0s21uj9ao2houjthkl17.apps.googleusercontent.com
          NUVIO_GOOGLE_TV_CLIENT_SECRET: compile-check-placeholder
        run: |
          bash android/gradlew -p android --console=plain --max-workers=2 :app:compileDebugKotlin :app:testDebugUnitTest --tests space.nuvio.nativelegacy.DriveAuthStateTest
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: drive-android-authorization-tests
          path: android/app/build/reports/tests/testDebugUnitTest
          if-no-files-found: ignore
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    env:
      ASAN_OPTIONS: detect_leaks=0:halt_on_error=1
      UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 20de02c81a99732b168ed5a68f83f36e445dd0e7
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Native dependencies
        shell: bash
        run: |
          if [ '${{ runner.os }}' = macOS ]; then
            brew install pkg-config sdl2 sdl2_image sdl2_ttf webp
          else
            sudo apt-get update -qq
            sudo apt-get install -y -qq pkg-config libegl1-mesa-dev libsdl2-dev libsdl2-image-dev libsdl2-ttf-dev libwebp-dev libass-dev libfribidi-dev libgles2-mesa-dev
          fi
      - name: TV OAuth protocol normal and sanitizers
        shell: bash
        run: |
          bash tests/drivetv.sh
          SANITIZE=1 bash tests/drivetv.sh
      - name: Visible Drive folder transfers normal and sanitizers
        shell: bash
        run: |
          bash tests/drivelocal.sh
          SANITIZE=1 bash tests/drivelocal.sh
      - name: Actual native modal workers and profile isolation
        shell: bash
        run: |
          bash tests/drivebackup.sh
          SANITIZE=1 bash tests/drivebackup.sh
      - name: Translation tables
        run: python3 tools/idiomas.py
