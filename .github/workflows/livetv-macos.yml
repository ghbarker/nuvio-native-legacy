name: Fonts PR macOS validation
on:
  push:
    branches: [review/logs34-integration-20261017]
    paths: [.github/workflows/livetv-macos.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  interface-fonts:
    runs-on: macos-15
    timeout-minutes: 25
    env:
      SDL_MAC_BACKGROUND_APP: '1'
      DYLD_LIBRARY_PATH: /opt/homebrew/lib
      ASAN_OPTIONS: detect_leaks=0:halt_on_error=1
      UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 7f359731e6841c6645929a817a1d16de1095efce
          persist-credentials: false
      - run: brew install pkg-config sdl2 sdl2_image sdl2_ttf libass fribidi
      - name: Registry, Settings, UI renderer and subtitle regressions
        run: |
          set -euo pipefail
          bash tests/legfontes.sh
          bash tests/ass_fonte_local.sh
          bash tests/faixas_estilo_ctl.sh
          bash tests/interface_font.sh
      - name: Font ASan and UBSan regressions
        env:
          SANITIZE: '1'
        run: |
          set -euo pipefail
          bash tests/legfontes.sh
          bash tests/ass_fonte_local.sh
          bash tests/interface_font.sh
