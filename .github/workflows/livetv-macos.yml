name: Logs46 multiple Live TV accounts macOS validation
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-accounts:
    runs-on: macos-15
    timeout-minutes: 30
    env:
      SDL_MAC_BACKGROUND_APP: '1'
      DYLD_LIBRARY_PATH: /opt/homebrew/lib
      ASAN_OPTIONS: detect_leaks=0:halt_on_error=1
      UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 365fd565778981edc2dfefc3b61e41cada8da796
          fetch-depth: 3
          persist-credentials: false
      - run: brew install pkg-config sdl2 sdl2_image sdl2_ttf libass fribidi
      - name: Full-source account Settings regressions
        run: |
          set -euo pipefail
          bash tests/ajustes_secoes.sh
          bash tests/ajustes_iptv.sh
      - name: Full-source account Settings ASan and UBSan regressions
        env:
          SANITIZE: '1'
        run: |
          set -euo pipefail
          bash tests/ajustes_iptv.sh
