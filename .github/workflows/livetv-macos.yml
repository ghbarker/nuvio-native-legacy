name: Logs40 macOS large EPG validation
on:
  push:
    branches: [review/logs34-integration-20261017]
    paths: [.github/workflows/livetv-macos.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  live-tv:
    runs-on: macos-15
    timeout-minutes: 15
    env:
      SDL_MAC_BACKGROUND_APP: '1'
      DYLD_LIBRARY_PATH: /opt/homebrew/lib
      ASAN_OPTIONS: detect_leaks=0:halt_on_error=1
      UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
    steps:
      - uses: actions/checkout@v4
        with:
          ref: b573e9ffcc8a74d97b7db968e0edc59692a9f532
          persist-credentials: false
      - run: brew install pkg-config sdl2 sdl2_image sdl2_ttf
      - name: Guide, playlist and EPG regressions
        run: |
          set -euo pipefail
          for suite in epg_streaming guiaepg guia_epg_estado guia_loading guia_stream_headers m3u xtepg_bounded; do
            bash "tests/$suite.sh"
          done
      - name: ASan and UBSan on large-guide parsing and guide integration
        run: |
          set -euo pipefail
          for suite in epg_streaming guiaepg guia_epg_estado guia_loading guia_stream_headers m3u xtepg_bounded; do
            SANITIZE=1 NV_TEST_SANITIZE=1 bash "tests/$suite.sh"
          done
