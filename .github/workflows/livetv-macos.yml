name: Drive backup transfer protocol checks
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  protocol:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    env:
      ASAN_OPTIONS: detect_leaks=0:halt_on_error=1
      UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 5f538ccb49ffa78ac3f8605a3393991b56fc3b33
          persist-credentials: false
      - name: Normal and ASan UBSan Drive protocol tests (mock transport)
        shell: bash
        run: |
          set -euo pipefail
          for san in 0 1; do
            SANITIZE="$san" bash tests/drivelocal.sh
          done
