name: Logs51 live recovery macOS regression checks
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-recovery:
    runs-on: macos-15
    timeout-minutes: 15
    env:
      SDL_MAC_BACKGROUND_APP: '1'
      DYLD_LIBRARY_PATH: /opt/homebrew/lib
      ASAN_OPTIONS: detect_leaks=0:halt_on_error=1
      UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
    steps:
      - uses: actions/checkout@v4
        with:
          ref: a1f8f66286b39470403e4938d9c6cdc0476350b9
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: brew install pkg-config sdl2 sdl2_image sdl2_ttf
      - name: Real Android JNI and stale source error regressions
        run: |
          set -euo pipefail
          for san in 0 1; do
            SANITIZE="$san" bash tests/livestall_window.sh
            SANITIZE="$san" bash tests/video_android_live_window.sh
            SANITIZE="$san" bash tests/live_error_recovery.sh
          done
          bash tests/livestall.sh
          bash tests/livestall_seco.sh
