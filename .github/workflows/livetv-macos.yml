name: Logs49 multiple Live TV accounts macOS validation
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-accounts:
    runs-on: macos-15
    timeout-minutes: 30
    env:
      SDL_MAC_BACKGROUND_APP: '1'
      DYLD_LIBRARY_PATH: /opt/homebrew/lib
      ASAN_OPTIONS: detect_leaks=0:halt_on_error=1
      UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
    steps:
      - uses: actions/checkout@v4
        with:
          ref: a07380183c23a85c8be67dc18ea6f4c07db91fab
          fetch-depth: 3
          persist-credentials: false
      - run: brew install pkg-config sdl2 sdl2_image sdl2_ttf libass fribidi
      - name: Full-source account Settings regressions
        run: |
          set -euo pipefail
          bash tests/ajustes_secoes.sh
          for suite in epg_memory epg_accounts epg_streaming guia_grupos guia_loading guia_epg_estado guiaepg guia_catalogo_tv guia_stream_headers guiaaddons guiacorte; do bash "tests/$suite.sh"; done
          bash tests/ajustes_iptv.sh
      - name: Full-source account Settings ASan and UBSan regressions
        env:
          SANITIZE: '1'
        run: |
          set -euo pipefail
          for suite in epg_memory epg_accounts epg_streaming guia_grupos guia_loading guia_epg_estado guiaepg guia_catalogo_tv guia_stream_headers guiaaddons guiacorte; do bash "tests/$suite.sh"; done
          bash tests/ajustes_iptv.sh
