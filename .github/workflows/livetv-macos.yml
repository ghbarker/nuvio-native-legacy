name: Logs42 multiple Live TV accounts macOS validation
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-accounts:
    runs-on: macos-15
    timeout-minutes: 30
    env:
      SDL_MAC_BACKGROUND_APP: '1'
      DYLD_LIBRARY_PATH: /opt/homebrew/lib
      ASAN_OPTIONS: detect_leaks=0:halt_on_error=1
      UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 91eeeab458dc3d9b3af48ce743a421516936024e
          persist-credentials: false
      - run: brew install pkg-config sdl2 sdl2_image sdl2_ttf libass fribidi
      - name: Native accounts, Settings and guide regressions
        run: |
          set -euo pipefail
          for suite in iptv_accounts epg_accounts epg_streaming m3u xtream stalker guia_loading guia_epg_estado guiaepg guia_catalogo_tv guia_stream_headers guiaaddons guiacorte livetv_regras xtepg xtepg_bounded; do bash "tests/$suite.sh"; done
          bash tests/ajustes_secoes.sh
          bash tests/ajustes_iptv.sh
      - name: Native account and guide ASan and UBSan regressions
        env:
          SANITIZE: '1'
        run: |
          set -euo pipefail
          for suite in iptv_accounts epg_accounts epg_streaming m3u guia_loading guia_epg_estado guiaepg xtepg_bounded; do bash "tests/$suite.sh"; done
          bash tests/ajustes_iptv.sh
