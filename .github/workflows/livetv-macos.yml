name: Live TV search Linux and macOS native checks
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    env:
      SDL_MAC_BACKGROUND_APP: '1'
      DYLD_LIBRARY_PATH: /opt/homebrew/lib
      ASAN_OPTIONS: detect_leaks=0:halt_on_error=1
      UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 8934c1837013a88e6327c0ff506d20f07aa05de5
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Native dependencies
        shell: bash
        run: |
          if [ '${{ runner.os }}' = macOS ]; then
            brew install pkg-config sdl2 sdl2_image sdl2_ttf webp
          else
            sudo apt-get update -qq
            sudo apt-get install -y -qq pkg-config xvfb xauth libegl1-mesa-dev libsdl2-dev libsdl2-image-dev libsdl2-ttf-dev libwebp-dev libass-dev libfribidi-dev libgles2-mesa-dev
          fi
      - name: Normal and ASan UBSan Live TV regression suites
        shell: bash
        run: |
          set -euo pipefail
          for san in 0 1; do
            for suite in guiabusca_incremental guiabusca_paginacao guia_grupos guia_loading guia_epg_estado; do
              SANITIZE="$san" bash "tests/$suite.sh"
            done
          done
          bash tests/guiacorte.sh
          python3 tools/varredura-i18n.py
