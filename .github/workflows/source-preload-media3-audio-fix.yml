name: 'Frozen early source-preload Media3 probe: isolated audio capability descriptors'
'on':
  push:
    branches:
    - review/source-preload-audio-fix-v1
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  media3:
    name: 'Frozen early backend: real Media3 (review-only isolated audio capability descriptors)'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false
        fetch-depth: 0
    - name: Materialize exact Media3 test source and record probe or full-app scope
      run: python3 .review/source-preload/build/verify_source.py --case backend-probe --source-commit 6c8e7c82df95c0fd487c8fcd72f347da651c991d
        --target source-app --proof build/review/source-verified.json
    - uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '17'
    - uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: '8.9'
    - uses: android-actions/setup-android@v3
      with:
        packages: platform-tools
        log-accepted-android-sdk-licenses: false
    - name: Install probe SDK, NDK, CMake and deterministic media tools
      run: 'sudo apt-get update -qq

        sudo apt-get install -y ffmpeg

        sdkmanager ''platforms;android-35'' ''build-tools;35.0.0'' ''ndk;27.2.12479018'' ''cmake;3.22.1'''
    - name: Stage exact NvPlayer and helpers and generate local MP4/HLS assets
      run: 'bash .review/source-preload/android/stage.sh "$GITHUB_WORKSPACE/source-app"

        bash .review/source-preload/android/generate-fixture.sh

        gradle -p .review/source-preload/android --console=plain :probe:assembleDebug :probe:assembleDebugAndroidTest'
    - name: Enable KVM permissions
      run: 'echo ''KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"'' | sudo tee /etc/udev/rules.d/99-kvm4all.rules

        sudo udevadm control --reload-rules

        sudo udevadm trigger --name-match=kvm'
    - uses: reactivecircus/android-emulator-runner@v2
      with:
        api-level: 35
        arch: x86_64
        target: google_apis
        disable-animations: true
        script: gradle -p .review/source-preload/android --console=plain :probe:connectedDebugAndroidTest
    - name: Require all real-player contracts with no ignored tests
      run: python3 .review/source-preload/build/verify_instrumentation.py
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: source-preload-media3-early-fix-${{ github.sha }}
        path: 'build/review/

          .review/source-preload/android/player-source.sha256

          .review/source-preload/android/probe/build/reports/

          .review/source-preload/android/probe/build/outputs/androidTest-results/'
        retention-days: 14
