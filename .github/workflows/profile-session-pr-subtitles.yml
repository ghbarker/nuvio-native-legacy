name: 'Profile PR: remaining subtitle fixture with fixed-session dependency'
'on':
  push:
    branches:
    - review/profile-session-pr-subtitles
permissions:
  contents: read
concurrency:
  group: profile-pr-subtitles-${{ github.ref }}
  cancel-in-progress: true
jobs:
  subtitles:
    name: Original subtitle assertions with omitted session dependency (macOS)
    runs-on: macos-14
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false
        fetch-depth: 0
    - name: Verify exact unchanged product source and all source blobs
      run: "set -euo pipefail\npython3 - <<'VERIFY'\nimport hashlib\nimport json\nimport os\nfrom pathlib import Path\nimport\
        \ subprocess\nbase = '17b7769dac4273557e1b07f5fb8734df91dd718f'\nfeature = '4cc89807e4c3248a7768360c0a7f23696f11698a'\n\
        plan = json.loads(Path('.review/profile-session/standalone-files.json').read_text())\nassert plan['base'] == base\
        \ and plan['feature_commit'] == feature\nsubprocess.run(['git', 'merge-base', '--is-ancestor', base, feature], check=True)\n\
        changed = subprocess.check_output(['git', 'diff', '--name-only', '-z', base, feature]).decode().split('\\0')\nchanged\
        \ = sorted(path for path in changed if path)\nassert changed == sorted(entry['path'] for entry in plan['files'])\n\
        allowed_tools = {'tools/android.sh', 'tools/arm.sh', 'tools/varredura-i18n.py'}\nassert changed and all((path.startswith('src/')\
        \ or path in allowed_tools) and\n                       '..' not in Path(path).parts for path in changed)\ntarget\
        \ = Path(os.environ['GITHUB_WORKSPACE']) / 'ci-profile-feature'\nsubprocess.run(['git', 'worktree', 'add', '--detach',\
        \ str(target), feature], check=True)\nverified = []\nfor entry in plan['files']:\n    relative = entry['path']\n \
        \   file = target / relative\n    data = file.read_bytes()\n    actual = hashlib.sha1(b'blob ' + str(len(data)).encode()\
        \ + b'\\0' + data).hexdigest()\n    expected = subprocess.check_output(['git', 'rev-parse', feature + ':' + relative],\
        \ text=True).strip()\n    assert actual == entry['sha'] == expected, (relative, actual, entry['sha'], expected)\n\
        \    assert bool(file.stat().st_mode & 0o111) == (entry['mode'] == '100755')\n    verified.append({'path': relative,\
        \ 'sha': actual, 'mode': entry['mode']})\noutput = Path(os.environ['GITHUB_WORKSPACE']) / 'build/review'\noutput.mkdir(parents=True,\
        \ exist_ok=True)\nproof = {'base': base, 'feature_commit': feature, 'build_commit': os.environ['GITHUB_SHA'],\n  \
        \       'verified': True, 'feature_changed_paths': changed, 'files': verified}\n(output / 'standalone-source-verified.json').write_text(json.dumps(proof,\
        \ indent=2) + '\\n')\nprint('Exact latest-upstream profile feature verified:', feature, len(verified), 'product paths')\n\
        VERIFY"
    - name: Native SDK tools
      run: brew install sdl2 sdl2_image sdl2_ttf ffmpeg ripgrep
    - name: Prepare faithful reduced-fixture neighbours
      run: "set -euo pipefail\ncd \"$GITHUB_WORKSPACE/ci-profile-feature\"\npython3 \"$GITHUB_WORKSPACE/.review/profile-session/build/prepare_pr_legacy_tests.py\"\
        \ \\\n  --probe-log \"$GITHUB_WORKSPACE/build/review/optional-import.log\""
    - name: 'Remaining original check: addons_legendas'
      if: ${{ !cancelled() }}
      timeout-minutes: 8
      run: "set -euo pipefail\nexport ASAN_OPTIONS=detect_leaks=0\ncd \"$GITHUB_WORKSPACE/ci-profile-feature\"\nSANITIZE=1\
        \ FONTEFALHA_SANITIZE=1 bash tests/addons_legendas.sh \\\n  2>&1 | tee \"$GITHUB_WORKSPACE/build/review/addons_legendas.log\"\
        \necho 'addons_legendas PASS' >> \"$GITHUB_WORKSPACE/build/review/results.txt\""
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: profile-pr-subtitles-${{ github.sha }}
        path: build/review/
        retention-days: 14
