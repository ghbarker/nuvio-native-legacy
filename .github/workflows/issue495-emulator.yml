name: Logs20 real Android translator recovery
on:
  push:
    branches: [review/issue495-logs20-emulator-recovery-20261016]
permissions:
  contents: read
concurrency:
  group: issue495-logs20-emulator-recovery
  cancel-in-progress: false
jobs:
  emulator:
    if: true
    name: Real Logs20 ${{ matrix.route }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - route: api30-arm32
            api: 30
            install_args: --install-abi armeabi-v7a
          - route: api35-arm64
            api: 35
            install_args: ""
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Download the exact already-published Logs20 APK
        run: |
          mkdir -p build/issue495-emulator
          curl --fail --location --retry 2 --output build/issue495-emulator/Logs20.apk 'https://github.com/ghbarker/nuvio-native-legacy/releases/download/tv-mobile-test-logs-v20/Nuvio-TV-Mobile-Test-Logs20.apk'
          echo '8a826174b2035a65a0c280500af79b2345ac73ef464c5a251dc357b625df7c8c  build/issue495-emulator/Logs20.apk' | sha256sum --check
          sdkmanager 'build-tools;35.0.0'
      - name: Enable real KVM acceleration
        run: |
          test -c /dev/kvm
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run the unchanged ARM APK on the selected real native bridge
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          profile: pixel_2
          cores: 2
          ram-size: 4096M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none -no-snapshot -skin 1280x720
          script: python3 .review/issue495-emulator/smoke.py --apk build/issue495-emulator/Logs20.apk --output build/issue495-emulator/proof --api-level ${{ matrix.api }} ${{ matrix.install_args }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: issue495-logs20-real-emulator-${{ matrix.route }}-${{ github.sha }}
          path: build/issue495-emulator/proof
          if-no-files-found: warn
          retention-days: 14
