name: Simkl and account-profile checks
on:
  workflow_dispatch:
jobs:
  checks:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      ASAN_OPTIONS: detect_leaks=0:halt_on_error=1
      UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 2f0f3d34324b0846f4b10fa0f15dce143a4384a8
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq pkg-config libsdl2-dev
      - name: macOS dependencies
        if: runner.os == 'macOS'
        run: |
          brew install pkg-config sdl2
          echo "C_INCLUDE_PATH=$(brew --prefix)/include:$(brew --prefix)/include/SDL2" >> "$GITHUB_ENV"
          echo "LIBRARY_PATH=$(brew --prefix)/lib" >> "$GITHUB_ENV"
          echo "DYLD_LIBRARY_PATH=$(brew --prefix)/lib" >> "$GITHUB_ENV"
      - name: Account ownership and direct profile pairing
        run: node --test servidor/recomendacoes/teste-identidade.mjs > account-server-checks.log 2>&1
      - name: Normal and sanitizer regressions
        shell: bash
        run: |
          set -euo pipefail
          for script in tests/simklauth.sh tests/simklauth_v2.sh tests/simkl_scrobble.sh tests/amigosperfis.sh; do
            logfile="$(basename "$script" .sh)-checks.log"
            bash "$script" > "$logfile" 2>&1
            SANITIZE=1 bash "$script" >> "$logfile" 2>&1
            tail -12 "$logfile"
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: logs94-auth-profile-checks-${{ matrix.os }}
          path: '*-checks.log'
