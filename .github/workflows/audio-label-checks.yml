name: Compatible account-profile Friends checks
on:
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        options: [all, mac]
        default: all
permissions:
  contents: read
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: ${{ inputs.mode == 'mac' && fromJSON('["macos-15-intel"]') || fromJSON('["ubuntu-24.04","macos-15-intel"]') }}
        source: [product, preview]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      ASAN_OPTIONS: detect_leaks=0:halt_on_error=1
      UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
      HOMEBREW_NO_AUTO_UPDATE: '1'
      SDL_MAC_BACKGROUND_APP: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ matrix.source == 'product' && 'c259d5969bbf740a01b17d1f371f3f0406d082ed' || 'cd75ea9e3878f59eabb9df2c9b987575b19260f7' }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq pkg-config libsdl2-dev libsdl2-image-dev libsdl2-ttf-dev libgles2-mesa-dev libegl1-mesa-dev
      - name: macOS dependencies
        if: runner.os == 'macOS'
        run: |
          brew install pkg-config sdl2 sdl2_image sdl2_ttf
          echo "C_INCLUDE_PATH=$(brew --prefix)/include:$(brew --prefix)/include/SDL2" >> "$GITHUB_ENV"
          echo "LIBRARY_PATH=$(brew --prefix)/lib" >> "$GITHUB_ENV"
          echo "DYLD_LIBRARY_PATH=$(brew --prefix)/lib" >> "$GITHUB_ENV"
      - name: Profile-pairing protocol and ownership checks
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'CHECK'
          import os,signal,subprocess,sys
          with open('worker-checks.log','w') as f:
              for sanitize in ('0','1'):
                  print('RUN profile worker SANITIZE='+sanitize,flush=True)
                  p=subprocess.Popen(['bash','tests/amigosperfis.sh'],env={**os.environ,'SANITIZE':sanitize},stdout=f,stderr=subprocess.STDOUT,start_new_session=True)
                  try: rc=p.wait(timeout=75)
                  except subprocess.TimeoutExpired:
                      subprocess.run(['ps','-eo','pid,ppid,etime,comm'],stdout=f,stderr=subprocess.STDOUT)
                      if sys.platform=='darwin':
                          for line in subprocess.check_output(['ps','-axo','pid=,comm='],text=True).splitlines():
                              if '/nuvio-profile-friends.' in line and line.rstrip().endswith('/test'):
                                  subprocess.run(['sample',line.split()[0],'3','-file','macos-worker-sample.log'],timeout=15)
                      os.killpg(p.pid,signal.SIGKILL);p.wait()
                      raise SystemExit('Profile worker exceeded 75 seconds; diagnostics are not a pass')
                  if rc: raise SystemExit(rc)
          CHECK
          node --test servidor/recomendacoes/teste-identidade.mjs > server-checks.log 2>&1
          cc -fsyntax-only -std=gnu11 -Isrc $(pkg-config --cflags sdl2 SDL2_ttf SDL2_image) src/recomenda.c > syntax-checks.log 2>&1
          if [ '${{ runner.os }}' = Linux ]; then
            for platform in NV_WEBOS NV_TPK; do
              cc -fsyntax-only -std=gnu11 -D$platform -Isrc $(pkg-config --cflags sdl2 SDL2_ttf SDL2_image) src/recomenda.c >> syntax-checks.log 2>&1
            done
          fi
          tail -3 worker-checks.log
          tail -9 server-checks.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Logs97-friends-${{ matrix.os }}-${{ matrix.source }}
          path: |
            *-checks.log
            macos-worker-sample.log
          if-no-files-found: error
  wasm:
    if: inputs.mode != 'mac'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: cd75ea9e3878f59eabb9df2c9b987575b19260f7
      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: '4.0.17'
          actions-cache-folder: emsdk-cache
      - name: WGT shared worker and protocol fixture compilation
        run: |
          emcc -fsyntax-only -std=gnu11 -sUSE_SDL=2 -sUSE_SDL_TTF=2 -sUSE_SDL_IMAGE=2 -Isrc src/recomenda.c tests/amigosperfis_compat.c > wasm-checks.log 2>&1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Logs97-friends-wasm
          path: '*-checks.log'
          if-no-files-found: error
