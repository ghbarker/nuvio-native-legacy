name: Sports league-card navigation and cache regression checks
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      ASAN_OPTIONS: detect_leaks=0:halt_on_error=1
      UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
      HOMEBREW_NO_AUTO_UPDATE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: c38c0268595998b1ea504a30af70312770e067dc
      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq pkg-config libsdl2-dev libgles2-mesa-dev
      - name: macOS dependencies
        if: runner.os == 'macOS'
        run: |
          brew install pkg-config sdl2
          echo "C_INCLUDE_PATH=$(brew --prefix)/include:$(brew --prefix)/include/SDL2" >> "$GITHUB_ENV"
          echo "LIBRARY_PATH=$(brew --prefix)/lib" >> "$GITHUB_ENV"
          echo "DYLD_LIBRARY_PATH=$(brew --prefix)/lib" >> "$GITHUB_ENV"
      - name: Sports navigation, source matching and bounded cache checks
        shell: bash
        run: |
          set -euo pipefail
          for check in esportes esportes_ui esportes_estado; do
            bash tests/$check.sh > "$check-checks.log" 2>&1
            SANITIZE=1 bash tests/$check.sh >> "$check-checks.log" 2>&1
            tail -2 "$check-checks.log"
          done
          cc -fsyntax-only -std=gnu11 -Wall -Wextra -Werror -Isrc $(pkg-config --cflags sdl2) src/esportesui.c
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Logs99-sports-${{ matrix.os }}
          path: '*-checks.log'
          if-no-files-found: error
  wasm:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: c38c0268595998b1ea504a30af70312770e067dc
      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: '4.0.17'
          actions-cache-folder: emsdk-cache
      - name: WGT shared Sports compilation with and without touch UI
        run: |
          emcc -fsyntax-only -std=gnu11 -sUSE_SDL=2 -sUSE_SDL_TTF=2 -sUSE_SDL_IMAGE=2 -Isrc src/esportes.c src/esportes_parse.c src/esportesui.c src/fontescanais.c > wasm-checks.log 2>&1
          emcc -fsyntax-only -std=gnu11 -DNV_TOUCH_UI -sUSE_SDL=2 -sUSE_SDL_TTF=2 -sUSE_SDL_IMAGE=2 -Isrc src/esportes.c src/esportes_parse.c src/esportesui.c src/fontescanais.c >> wasm-checks.log 2>&1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Logs99-sports-wasm
          path: '*-checks.log'
          if-no-files-found: error
