name: Logs80 IntroDB fallback Linux and macOS checks

on:
  workflow_dispatch:
    inputs:
      extended_sanitizers:
        description: Also sanitize the complete font, Settings and search UI fixtures
        type: boolean
        default: false

permissions:
  contents: read

env:
  # Pin once the final integration commit contains the adapted guide fixtures.
  SOURCE_SHA: affe70f448807b5aad2ff7c1127d483149271e8b
  SDL_MAC_BACKGROUND_APP: '1'
  ASAN_OPTIONS: detect_leaks=0:halt_on_error=1
  UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1

jobs:
  native:
    strategy:
      fail-fast: false
      max-parallel: 12
      matrix:
        os: [ubuntu-24.04, macos-15]
        group:
          - intro-backup
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 2
          persist-credentials: false
      - name: Prepare diagnostics and verify exact source
        run: |
          mkdir -p diagnostics
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          python3 - <<'PY'
          import json,pathlib,subprocess
          pathlib.Path('diagnostics/source.json').write_text(json.dumps({'source_commit':subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),'source_tree':subprocess.check_output(['git','rev-parse','HEAD^{tree}'],text=True).strip()},indent=2)+'\n')
          PY
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Linux native dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ripgrep pkg-config libsdl2-dev libsdl2-image-dev libsdl2-ttf-dev libwebp-dev libass-dev libfribidi-dev libgles2-mesa-dev libegl1-mesa-dev libgl1-mesa-dri libmbedtls-dev xvfb x11-utils
      - name: macOS native dependencies
        if: runner.os == 'macOS'
        run: |
          packages=(ripgrep pkg-config sdl2 sdl2_image sdl2_ttf webp libass fribidi mbedtls@3)
          missing=()
          for package in "${packages[@]}"; do
            if ! brew list --versions "$package" >/dev/null 2>&1; then missing+=("$package"); fi
          done
          if [ "${#missing[@]}" -gt 0 ]; then brew install "${missing[@]}"; fi
          prefix=$(brew --prefix mbedtls@3)
          echo "MBEDTLS_PREFIX=$prefix" >> "$GITHUB_ENV"
          echo "MBEDTLS_INCLUDE=$prefix/include" >> "$GITHUB_ENV"
          echo "MBEDTLS_LIBRARY=$prefix/lib/libmbedcrypto.dylib" >> "$GITHUB_ENV"
          echo 'DYLD_LIBRARY_PATH=/opt/homebrew/lib' >> "$GITHUB_ENV"
      - name: Crypto interoperability dependency
        if: matrix.group == 'backup-state'
        run: python3 -m pip install cryptography
      - name: Native include paths and dependency validation
        run: |
          python3 - <<'PY'
          import json,os,pathlib,shlex,shutil,subprocess,sys
          commands=['bash','cc','git','python3','pkg-config','rg','dirname','uname','mktemp','rm','mkdir','ld','ar']
          commands += ['Xvfb','xdpyinfo'] if sys.platform=='linux' else ['brew']
          available={command:shutil.which(command) for command in commands}
          pathlib.Path('diagnostics/runtime-commands.json').write_text(json.dumps(available,indent=2)+'\n')
          missing=[command for command,path in available.items() if not path]
          assert not missing,'Missing runtime commands: '+', '.join(missing)
          if '${{ matrix.group }}'=='backup-state':
              import cryptography
          packages=['sdl2','SDL2_image','SDL2_ttf','libass','fribidi']
          subprocess.run(['pkg-config','--exists',*packages],check=True)
          flags=shlex.split(subprocess.check_output(['pkg-config','--cflags-only-I',*packages],text=True))
          paths=[flag[2:] for flag in flags if flag.startswith('-I')]
          java=pathlib.Path(os.environ['JAVA_HOME'])/'include'
          assert (java/'jni.h').is_file(), 'Java JNI headers missing'
          paths += [str(java),str(java/('darwin' if sys.platform=='darwin' else 'linux'))]
          if os.environ.get('MBEDTLS_INCLUDE'): paths.append(os.environ['MBEDTLS_INCLUDE'])
          if os.environ.get('CPATH'): paths.append(os.environ['CPATH'])
          with open(os.environ['GITHUB_ENV'],'a') as env:
              env.write('CPATH='+':'.join(dict.fromkeys(paths))+'\n')
              env.write('NUVIO_CFLAGS='+subprocess.check_output(['pkg-config','--cflags','sdl2'],text=True).strip()+'\n')
          with open('diagnostics/dependencies.txt','w') as log:
              subprocess.run(['cc','--version'],stdout=log,stderr=subprocess.STDOUT,check=True)
              subprocess.run(['pkg-config','--modversion',*packages],stdout=log,stderr=subprocess.STDOUT,check=True)
          PY
          # These declarations are needed by the real Drive crypto path; an
          # installed package name alone does not prove the headers are usable.
          printf '#include <mbedtls/version.h>\n#include <mbedtls/gcm.h>\n#include <mbedtls/pkcs5.h>\nint main(void){return 0;}\n' > diagnostics/mbedtls-check.c
          if [ -n "${MBEDTLS_INCLUDE:-}" ]; then
            cc -I"$MBEDTLS_INCLUDE" -fsyntax-only diagnostics/mbedtls-check.c
          else
            cc -fsyntax-only diagnostics/mbedtls-check.c
          fi
      - name: Linux software GL display
        if: runner.os == 'Linux'
        run: |
          echo 'DISPLAY=:99' >> "$GITHUB_ENV"
          echo 'LIBGL_ALWAYS_SOFTWARE=1' >> "$GITHUB_ENV"
          echo 'EGL_PLATFORM=x11' >> "$GITHUB_ENV"
          runtime="$RUNNER_TEMP/nuvio-xdg"
          mkdir -p "$runtime"
          chmod 700 "$runtime"
          echo "XDG_RUNTIME_DIR=$runtime" >> "$GITHUB_ENV"
          Xvfb :99 -screen 0 1920x1080x24 +extension GLX +render -noreset > diagnostics/xvfb.log 2>&1 &
          python3 - <<'PY'
          import subprocess,time
          for attempt in range(50):
              if subprocess.run(['xdpyinfo','-display',':99'],stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL).returncode==0: break
              time.sleep(0.1)
          else: raise SystemExit('Xvfb failed to start')
          PY
      - name: Historical guide cache contrast fixture
        if: matrix.group == 'guide'
        run: git fetch --no-tags --depth=1 origin ba0639cf077b45b1540e4a48b0374fcac6fe9c0f
      - name: Integration checks with a 600-second per-invocation limit
        timeout-minutes: 30
        env:
          TEST_GROUP: ${{ matrix.group }}
          EXTENDED_SANITIZERS: ${{ inputs.extended_sanitizers }}
        run: |
          python3 - <<'PY'
          import json,os,pathlib,signal,subprocess,time
          both=lambda *names:[(name,san) for name in names for san in ('0','1')]
          normal=lambda *names:[(name,'0') for name in names]
          profiles={
              'intro-backup':both('intro','creditos_limitados')+normal('player_identity524','player_identity524_guards','cwinicio'),
              'providers':both('iptv_accounts','xtream','m3u','epg_accounts','epg_memory','epg_streaming')+normal('livetv_regras'),
              'guide':both('guiacache','guia_grupos','guia_epg_estado','guia_grande','guia_loading','guiabusca_incremental'),
              'guide-ui':normal('guiabusca_reabrir'),
              'sources':both('source_audio_language'),
              'source-policy':both('source_cache_filter','fontefalha')+normal('source_exclusion_languages','fonteregra'),
              'live-buffer':both('backupapp')+normal('buffer_tamanho','ajustes_iptv'),
              'live-watchdog':both('livestall_window','video_android_live_window','live_error_recovery')+normal('livestall','livestall_seco'),
              'backup-state':both('backupapp','backupfonts','backuplocal','backupcrypto'),
              'backup-drive':both('drivebackup'),
              'backup-addons':both('backup_restore_addons'),
              'fonts':normal('interface_font')+both('legfontes','ass_fonte_local','ass_fontes'),
              'settings':normal('ajustes_padroes','ajustes_secoes'),
              'identity':both('player_scrobble_trailer','episode_identity512','catalog_episode_identity512'),
          }
          group=os.environ['TEST_GROUP']
          checks=profiles[group]
          if os.environ.get('EXTENDED_SANITIZERS','').lower()=='true':
              extras={'fonts':['interface_font'],'settings':['ajustes_padroes'],'guide-ui':['guiabusca_reabrir']}
              checks += [(name,'1') for name in extras.get(group,[])]
          results=[]
          output=pathlib.Path('diagnostics')
          for suite,sanitize in checks:
              script=pathlib.Path('tests',suite+'.sh')
              name=suite+('-asan-ubsan' if sanitize=='1' else '-normal')
              log=output/(name+'.log')
              print('START '+name,flush=True)
              start=time.monotonic()
              failure=None
              if not script.is_file(): failure='Required integration fixture missing: '+str(script)
              elif sanitize=='1':
                  content=script.read_text()
                  if 'SANITIZE' not in content or '-fsanitize=address,undefined' not in content:
                      failure='Script does not enable requested ASan/UBSan; refusing to report a sanitizer pass'
              if failure:
                  log.write_text(failure+'\n'); code=2
              else:
                  with log.open('w') as stream:
                      proc=subprocess.Popen(['bash',str(script)],env={**os.environ,'SANITIZE':sanitize},stdout=stream,stderr=subprocess.STDOUT,start_new_session=True)
                      try: code=proc.wait(timeout=600)
                      except subprocess.TimeoutExpired:
                          os.killpg(proc.pid,signal.SIGKILL);proc.wait();code=124
                          stream.write('\nTIMEOUT after 600 seconds; process group killed. This is not a pass.\n')
              result={'suite':suite,'sanitizers':sanitize=='1','code':code,'seconds':round(time.monotonic()-start,2)}
              results.append(result)
              (output/'results.json').write_text(json.dumps(results,indent=2)+'\n')
              print('\n'.join(log.read_text(errors='replace').splitlines()[-16:]),flush=True)
              print(('PASS ' if code==0 else 'FAIL ')+name+' '+str(result['seconds'])+'s',flush=True)
          failed=[item for item in results if item['code']]
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as summary:
              summary.write('Integration source: `'+os.environ['SOURCE_SHA']+'`\n\n')
              summary.write('| Fixture | Mode | Result | Seconds |\n|---|---|---|---|\n')
              for item in results:
                  summary.write('| '+item['suite']+' | '+('ASan/UBSan' if item['sanitizers'] else 'Normal')+' | '+('Pass' if item['code']==0 else 'Fail ('+str(item['code'])+')')+' | '+str(item['seconds'])+' |\n')
          if failed: raise SystemExit('Integration checks failed: '+', '.join(item['suite'] for item in failed))
          PY
      - name: Upload logs even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-${{ matrix.os }}-${{ matrix.group }}
          path: diagnostics
          if-no-files-found: error
          retention-days: 14
