name: Logs88 sports Linux and macOS Intel checks
on:
  push:
    branches: [review/logs34-integration-20261017]
    paths: [.github/workflows/audio-label-checks.yml]
  workflow_dispatch:
permissions:
  contents: read
env:
  SOURCE_SHA: cfc730ad1721d4f12b197b03b5e7c2fb046b5f59
  ASAN_OPTIONS: detect_leaks=0:halt_on_error=1
  UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
jobs:
  native:
    if: github.event_name != 'push' || contains(github.event.head_commit.message, '[logs88-native-intel]')
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false
      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq pkg-config libsdl2-dev
      - name: macOS dependencies
        if: runner.os == 'macOS'
        run: |
          for pkg in pkg-config sdl2; do
            if ! brew list --versions "$pkg" >/dev/null 2>&1; then brew install "$pkg"; fi
          done
      - name: Sports checks
        run: |
          if [ "$RUNNER_OS" = macOS ]; then export C_INCLUDE_PATH="$(brew --prefix)/include${C_INCLUDE_PATH:+:$C_INCLUDE_PATH}"; fi
          python3 - <<'PYCODE'
          import json,os,pathlib,subprocess,time
          p=pathlib.Path('diagnostics');p.mkdir()
          sha=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()
          tree=subprocess.check_output(['git','rev-parse','HEAD^{tree}'],text=True).strip()
          assert sha==os.environ['SOURCE_SHA']
          (p/'source.json').write_text(json.dumps({'source_commit':sha,'source_tree':tree,'runner_os':os.environ['RUNNER_OS'],'runner_arch':os.environ['RUNNER_ARCH']}))
          results=[]
          for suite in ['esportes','esportes_estado','esportes_ui','fontescanais_folha','streamfit_sheet']:
            for san in [False,True]:
              start=time.monotonic()
              with (p/(suite+('-san' if san else '')+'.log')).open('w') as f:
                try:r=subprocess.run(['bash','tests/'+suite+'.sh'],env={**os.environ,'SANITIZE':str(int(san))},stdout=f,stderr=subprocess.STDOUT,timeout=180);code=r.returncode
                except subprocess.TimeoutExpired:code=124
              results.append({'suite':suite,'sanitizers':san,'code':code,'seconds':round(time.monotonic()-start,2)})
              (p/'results.json').write_text(json.dumps(results,indent=2))
              print(results[-1],flush=True)
          assert len(results)==10 and all(x['code']==0 for x in results),results
          PYCODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integration-${{ matrix.os }}-sports
          path: diagnostics
          if-no-files-found: error
