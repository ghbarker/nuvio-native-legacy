name: Live recovery Linux and macOS Intel checks
on:
  push:
    branches: [review/logs34-integration-20261017]
    paths: [.github/workflows/audio-label-checks.yml]
  workflow_dispatch:
permissions:
  contents: read
env:
  SOURCE_SHA: 3c8d71f95cc79512fa6b877c08065fa2da103619
  ASAN_OPTIONS: detect_leaks=0:halt_on_error=1
  UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
jobs:
  native:
    if: github.event_name != 'push' || contains(github.event.head_commit.message, '[logs92-native]')
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Native fixture dependencies
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            sudo apt-get update -qq && sudo apt-get install -y -qq pkg-config libsdl2-dev libgles2-mesa-dev
          else
            for pkg in pkg-config sdl2; do
              if ! brew list --versions "$pkg" >/dev/null 2>&1; then brew install "$pkg"; fi
            done
            echo "C_INCLUDE_PATH=$(brew --prefix)/include" >> "$GITHUB_ENV"
          fi
      - name: Live recovery checks
        run: |
          python3 - <<'PYCODE'
          import json,os,pathlib,subprocess,time
          p=pathlib.Path('diagnostics');p.mkdir()
          sha=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()
          tree=subprocess.check_output(['git','rev-parse','HEAD^{tree}'],text=True).strip()
          assert sha==os.environ['SOURCE_SHA']
          (p/'source.json').write_text(json.dumps({'source_commit':sha,'source_tree':tree,'runner_os':os.environ['RUNNER_OS'],'runner_arch':os.environ['RUNNER_ARCH']}))
          results=[]
          for suite in ['livestall_window','video_android_live_window','live_error_recovery']:
            for san in [False,True]:
              start=time.monotonic()
              with (p/(suite+('-san' if san else '')+'.log')).open('w') as f:
                try:r=subprocess.run(['bash','tests/'+suite+'.sh'],env={**os.environ,'SANITIZE':str(int(san))},stdout=f,stderr=subprocess.STDOUT,timeout=180);code=r.returncode
                except subprocess.TimeoutExpired:code=124
              results.append({'suite':suite,'sanitizers':san,'code':code,'seconds':round(time.monotonic()-start,2)})
              (p/'results.json').write_text(json.dumps(results,indent=2))
              print(results[-1],flush=True)
          assert len(results)==6 and all(x['code']==0 for x in results),results
          PYCODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integration-${{ matrix.os }}-live-recovery
          path: diagnostics
          if-no-files-found: error

  android-bench:
    runs-on: ubuntu-24.04
    if: github.event_name != 'push' || contains(github.event.head_commit.message, '[logs92-native]')
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: live-bench-gradle-v1-${{ runner.os }}
          restore-keys: |
            logs34-gradle-${{ runner.os }}-
      - name: Record exact benchmark source
        run: |
          python3 - <<'SOURCE'
          import json,os,pathlib,subprocess
          sha=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()
          tree=subprocess.check_output(['git','rev-parse','HEAD^{tree}'],text=True).strip()
          assert sha==os.environ['SOURCE_SHA']
          pathlib.Path('live-bench-source.json').write_text(json.dumps({'source_commit':sha,'source_tree':tree}))
          SOURCE
      - name: Generate finite synthetic HLS broadcast
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-dejavu-core
          bash tests/android-live-bench/make-fixture.sh
      - name: Compile production policy and run coordinator fixtures
        run: |
          bash android/gradlew -p tests/android-live-bench testDebugUnitTest assembleDebug assembleDebugAndroidTest --no-daemon --stacktrace > live-bench-build.log 2>&1 || { head -140 live-bench-build.log; exit 1; }
          python3 - <<'PYTEST'
          import pathlib,xml.etree.ElementTree as E
          suites=[E.parse(p).getroot() for p in pathlib.Path('tests/android-live-bench/build/test-results/testDebugUnitTest').glob('TEST-*.xml')]
          assert sum(int(s.attrib['tests']) for s in suites)>=16
          assert all(int(s.attrib['failures'])==int(s.attrib['errors'])==0 for s in suites)
          print('Coordinator tests:',sum(int(s.attrib['tests']) for s in suites),'passed')
          PYTEST
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Real Media3 playback under controlled HLS delivery failure
        uses: reactivecircus/android-emulator-runner@v2
        with:
          emulator-boot-timeout: 180
          api-level: 29
          target: default
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            rc=0
            bash android/gradlew -p tests/android-live-bench connectedDebugAndroidTest --no-daemon --stacktrace > live-bench-connected.log 2>&1 || rc=$?
            adb exec-out run-as space.nuvio.livebench cat files/live-bench-results.json > live-bench-results.json || true
            adb logcat -d -v threadtime > live-bench-logcat.txt
            exit "$rc"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-live-bench
          path: |
            live-bench-*.log
            live-bench-*.json
            live-bench-*.txt
            tests/android-live-bench/build/test-results
            tests/android-live-bench/build/outputs/androidTest-results
            tests/android-live-bench/build/reports
          if-no-files-found: error
