{
  "name": "APK20019 Android verifier-only retry",
  "on": {
    "push": {
      "branches": [
        "review/apk20019-android-retry-20261015"
      ],
      "paths": [
        ".review/apk20019/android/*_retry.py",
        ".review/apk20019-android-retry/**",
        ".github/workflows/apk20019-android-retry.yml"
      ]
    }
  },
  "permissions": {
    "contents": "read",
    "actions": "read"
  },
  "env": {
    "NUVIO_REVIEW_PLAN_SHA256": "a5198e61b5f3d9c998de95000e4c2b9b43a9bbfeceac90a6d66d72a6d947595e",
    "APK20019_RETRY_LOCK_SHA256": "a7be9ee4736acfb6f249735052069b7b51ed5cb1709baf5e545b5e45cb00f828"
  },
  "jobs": {
    "android": {
      "name": "APK20019 clean product and compatible test APK (ARM32/ARM64)",
      "runs-on": "ubuntu-24.04",
      "timeout-minutes": 90,
      "permissions": {
        "contents": "read"
      },
      "env": {
        "APK20019_REVIEW_ROOT": ".review/apk20019",
        "NUVIO_ANDROID_JOBS": "2",
        "NUVIO_BUILD_JOBS": "2"
      },
      "steps": [
        {
          "uses": "actions/checkout@v4",
          "with": {
            "persist-credentials": false,
            "fetch-depth": 0
          }
        },
        {
          "name": "Verify approved exact checker-only retry before build work",
          "run": "python3 .review/apk20019-android-retry/check_recipe.py"
        },
        {
          "name": "Materialize and verify final product and isolated test layers",
          "run": "python3 .review/apk20019/materialize.py --layer product --output \"$GITHUB_WORKSPACE/source-product\" --proof \"$GITHUB_WORKSPACE/build/review/apk20019/product-source.json\" --base-repository \"$GITHUB_WORKSPACE\"\npython3 .review/apk20019/materialize.py --layer test --output \"$GITHUB_WORKSPACE/source-test\" --proof \"$GITHUB_WORKSPACE/build/review/apk20019/test-source.json\" --base-repository \"$GITHUB_WORKSPACE\""
        },
        {
          "uses": "actions/setup-java@v4",
          "with": {
            "distribution": "temurin",
            "java-version": "17"
          }
        },
        {
          "uses": "android-actions/setup-android@v3",
          "with": {
            "packages": "platform-tools",
            "log-accepted-android-sdk-licenses": false
          }
        },
        {
          "name": "Install real Android and native build SDKs",
          "run": "command -v sdkmanager >/dev/null\nsudo apt-get update -qq\nsudo apt-get install -y ninja-build cmake nasm ffmpeg python3-pil zlib1g-dev\nsdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'ndk;27.2.12479018' 'cmake;3.22.1'"
        },
        {
          "name": "Prepare private configuration and persistent debug signing",
          "env": {
            "NUVIO_TOUCH_CORE_PROPERTIES": "${{ secrets.NUVIO_TOUCH_CORE_PROPERTIES }}",
            "NUVIO_TOUCH_DEBUG_KEYSTORE_B64": "${{ secrets.NUVIO_TOUCH_DEBUG_KEYSTORE_B64 }}"
          },
          "run": "python3 .review/apk20019/android/prepare_env.py --output \"$RUNNER_TEMP/nuvio-apk20019-private\""
        },
        {
          "uses": "actions/cache/restore@v4",
          "id": "native-cache",
          "with": {
            "path": "~/.cache/nuvio-android",
            "key": "apk20019-native-v1-${{ runner.os }}-${{ hashFiles('source-product/tools/android/deps.sh', 'source-product/tools/android/ffmpeg-android.sh', 'source-product/android/app/src/main/cpp/CMakeLists.txt') }}",
            "restore-keys": "apk20019-native-v1-${{ runner.os }}-\nlogs8-native-v2-${{ runner.os }}-\nandroid-touch-native-v1-${{ runner.os }}-"
          }
        },
        {
          "uses": "actions/cache/restore@v4",
          "id": "gradle-cache",
          "with": {
            "path": "~/.gradle/caches\n~/.gradle/wrapper",
            "key": "apk20019-gradle-v1-${{ runner.os }}-${{ hashFiles('source-product/android/**/*.gradle.kts', 'source-product/android/gradle/wrapper/gradle-wrapper.properties', 'source-test/android/**/*.gradle.kts') }}",
            "restore-keys": "apk20019-gradle-v1-${{ runner.os }}-\nlogs8-gradle-v2-${{ runner.os }}-\nandroid-touch-gradle-${{ runner.os }}-"
          }
        },
        {
          "name": "Record safe cache restoration outcomes",
          "env": {
            "APK20019_NATIVE_CACHE_PRIMARY": "${{ steps.native-cache.outputs.cache-primary-key }}",
            "APK20019_NATIVE_CACHE_MATCHED": "${{ steps.native-cache.outputs.cache-matched-key }}",
            "APK20019_NATIVE_CACHE_HIT": "${{ steps.native-cache.outputs.cache-hit }}",
            "APK20019_GRADLE_CACHE_PRIMARY": "${{ steps.gradle-cache.outputs.cache-primary-key }}",
            "APK20019_GRADLE_CACHE_MATCHED": "${{ steps.gradle-cache.outputs.cache-matched-key }}",
            "APK20019_GRADLE_CACHE_HIT": "${{ steps.gradle-cache.outputs.cache-hit }}"
          },
          "run": "python3 .review/apk20019/android/record_cache.py --output build/review/apk20019/cache-restoration.json"
        },
        {
          "name": "Build and verify clean standard product APK with both ARM cores",
          "run": "python3 .review/apk20019/android/run_retry.py --layer product --source source-product --source-proof build/review/apk20019/product-source.json --output build/review/apk20019/android-product --jobs 2"
        },
        {
          "name": "Build and verify account-compatible APK20019 update with isolated diagnostics",
          "run": "python3 .review/apk20019/android/run_retry.py --layer test --source source-test --source-proof build/review/apk20019/test-source.json --output build/review/apk20019/android-test --jobs 2"
        },
        {
          "name": "Record only safe cache/output presence",
          "id": "outputs",
          "if": "always()",
          "run": "if [[ -d \"$HOME/.cache/nuvio-android\" ]]; then echo 'native_cache=true' >> \"$GITHUB_OUTPUT\"; fi\nif [[ -d \"$HOME/.gradle/caches\" || -d \"$HOME/.gradle/wrapper\" ]]; then echo 'gradle_cache=true' >> \"$GITHUB_OUTPUT\"; fi"
        },
        {
          "uses": "actions/cache/save@v4",
          "if": "always() && steps.outputs.outputs.native_cache == 'true' && steps.native-cache.outputs.cache-hit != 'true' && steps.native-cache.outputs.cache-primary-key != ''",
          "with": {
            "path": "~/.cache/nuvio-android",
            "key": "${{ steps.native-cache.outputs.cache-primary-key }}"
          }
        },
        {
          "uses": "actions/cache/save@v4",
          "if": "always() && steps.outputs.outputs.gradle_cache == 'true' && steps.gradle-cache.outputs.cache-hit != 'true' && steps.gradle-cache.outputs.cache-primary-key != ''",
          "with": {
            "path": "~/.gradle/caches\n~/.gradle/wrapper",
            "key": "${{ steps.gradle-cache.outputs.cache-primary-key }}"
          }
        },
        {
          "uses": "actions/upload-artifact@v4",
          "if": "always()",
          "with": {
            "name": "apk20019-android-${{ github.sha }}",
            "path": "build/review/apk20019/",
            "if-no-files-found": "error",
            "retention-days": 14
          }
        },
        {
          "name": "Delete private runner configuration",
          "if": "always()",
          "run": "python3 .review/apk20019/android/cleanup_private.py --directory \"$RUNNER_TEMP/nuvio-apk20019-private\""
        }
      ]
    },
    "all-gates": {
      "name": "Require five retained successes and fresh Android gates",
      "runs-on": "ubuntu-24.04",
      "needs": [
        "android"
      ],
      "if": "always()",
      "timeout-minutes": 20,
      "env": {
        "APK20019_RETRY_JOB_RESULTS": "${{ toJSON(needs) }}"
      },
      "steps": [
        {
          "uses": "actions/checkout@v4",
          "with": {
            "persist-credentials": false,
            "fetch-depth": 0
          }
        },
        {
          "name": "Verify exact approved retry lock",
          "run": "python3 .review/apk20019-android-retry/check_recipe.py"
        },
        {
          "name": "Validate immutable retained origins and fresh exact Android artifacts",
          "env": {
            "GH_TOKEN": "${{ github.token }}"
          },
          "run": "python3 .review/apk20019-android-retry/aggregate_retry.py --repository \"$GITHUB_REPOSITORY\" --job-results-json \"$APK20019_RETRY_JOB_RESULTS\" --output build/review/apk20019-retry/final"
        },
        {
          "uses": "actions/upload-artifact@v4",
          "if": "always()",
          "with": {
            "name": "apk20019-retry-all-gates-${{ github.sha }}",
            "path": "build/review/apk20019-retry/final/all-gates-verified.json\nbuild/review/apk20019-retry/final/validation-origin.json",
            "if-no-files-found": "error",
            "retention-days": 14
          }
        }
      ]
    }
  }
}
