name: Expanded encrypted Drive backup checks
on:
  workflow_dispatch:
  push:
    branches: [review/logs34-integration-20261017]
    paths: [.github/workflows/drive-expanded-checks.yml]
permissions:
  contents: read
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
        suite: [small, backupapp, drivebackup, backup_restore_addons]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      SDL_MAC_BACKGROUND_APP: '1'
      DYLD_LIBRARY_PATH: /opt/homebrew/lib
      ASAN_OPTIONS: detect_leaks=0:halt_on_error=1
      UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 71238dbe7991ec25ade6b2ddbbed5ae4781bebc7
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq pkg-config libsdl2-dev libsdl2-image-dev libsdl2-ttf-dev libwebp-dev libass-dev libfribidi-dev libgles2-mesa-dev libmbedtls-dev
      - if: runner.os == 'macOS'
        run: brew install pkg-config sdl2 sdl2_image sdl2_ttf webp mbedtls
      - run: python3 -m pip install cryptography
      - name: Normal and ASan/UBSan checks, each with a timeout
        env:
          BACKUP_TEST_GROUP: ${{ matrix.suite }}
        run: |
          mkdir -p diagnostics
          python3 - <<'PY'
          import os, pathlib, signal, subprocess
          small = ('backupcrypto','backuplocal','backupstores','backupconnections','backupfonts','backupdisco','backuprestauro','playerbackup','fontefalha_backup','drivelocal','drivefontes','drivetv','legfontes','ajustes_backup')
          group = os.environ['BACKUP_TEST_GROUP']
          suites = small if group == 'small' else (group,)
          failures = []
          for suite in suites:
              for sanitize in ('0', '1'):
                  name = suite + ('-sanitizers' if sanitize == '1' else '-normal')
                  path = pathlib.Path('diagnostics', name + '.log')
                  print('Starting ' + name, flush=True)
                  with path.open('w') as output:
                      process = subprocess.Popen(['bash', 'tests/' + suite + '.sh'], env={**os.environ, 'SANITIZE': sanitize}, stdout=output, stderr=subprocess.STDOUT, start_new_session=True)
                      try:
                          code = process.wait(timeout=300)
                      except subprocess.TimeoutExpired:
                          os.killpg(process.pid, signal.SIGKILL)
                          process.wait()
                          code = 124
                  print('\n'.join(path.read_text().splitlines()[-20:]), flush=True)
                  if code:
                      failures.append(name + ': ' + str(code))
          if failures:
              raise SystemExit('\n'.join(failures))
          PY
      - run: python3 tools/idiomas.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: drive-expanded-${{ matrix.os }}-${{ matrix.suite }}
          path: diagnostics
