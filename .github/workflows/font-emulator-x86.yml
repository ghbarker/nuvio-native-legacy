name: Logs41 native x86 Android font verification
# Probe translated runtime filesystem and support fixture repair.
on:
  push:
    branches: [review/logs34-integration-20261017]
    paths: [.github/workflows/font-emulator-x86.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  emulator:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
      ANDROID_AVD_HOME: /tmp/nuvio-font-avds
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: 56efd14595a7c535fe867992a5e930d0e69f90a3
          path: font-app
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Require KVM and install Android emulator image
        run: |
          set -euo pipefail
          test -e /dev/kvm
          sudo chmod 666 /dev/kvm
          sudo apt-get update -qq
          sudo apt-get install -y -qq libpulse0 libegl1 libgl1 libnss3 libxcomposite1 libxcursor1 libxdamage1 libxfixes3 libxi6 libxrandr2 libxrender1 libxtst6 libxcb-cursor0 libxkbcommon-x11-0
          sdkmanager 'platform-tools' 'emulator' 'system-images;android-30;google_apis;x86_64'
          mkdir -p "$ANDROID_AVD_HOME"
          echo no | avdmanager create avd --force -n nuvio-fonts -k 'system-images;android-30;google_apis;x86_64' --device pixel_4 -p "$ANDROID_AVD_HOME/nuvio-fonts.avd"
          python3 - <<'PYAVD'
          import os,pathlib
          root=pathlib.Path(os.environ['ANDROID_AVD_HOME'])
          assert (root/'nuvio-fonts.avd/config.ini').exists()
          (root/'nuvio-fonts.ini').write_text('avd.ini.encoding=UTF-8\npath='+str(root/'nuvio-fonts.avd')+'\ntarget=android-30\n')
          PYAVD
      - name: Download the exact verified APK
        run: |
          mkdir -p emulator-results
          gh release download tv-mobile-test-logs-v41 --repo ghbarker/nuvio-native-legacy --pattern Nuvio-TV-Mobile-Test-Logs41.apk
          echo '9cf10c3a9e42712e6c1e57fa6bc6b98caa9404fff9390b37e05a03247c26c4d2  Nuvio-TV-Mobile-Test-Logs41.apk' | sha256sum -c -
      - uses: actions/cache/restore@v4
        with:
          path: ~/.cache/nuvio-android
          key: logs34-native-v1-${{ runner.os }}-${{ hashFiles('tools/android/deps.sh', 'tools/android/ffmpeg-android.sh') }}
          restore-keys: logs34-native-v1-Linux-
      - uses: actions/cache/restore@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: logs34-gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle.kts', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: logs34-gradle-Linux-
      - name: Build identical font feature for native emulator CPU
        run: |
          set -euo pipefail
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'ndk;27.2.12479018' 'cmake;3.22.1'
          cp -r tools/emulator font-app/tools/
          cd font-app
          test "$(git rev-parse HEAD)" = 56efd14595a7c535fe867992a5e930d0e69f90a3
          mkdir -p build/android/assets
          unzip -q ../Nuvio-TV-Mobile-Test-Logs41.apk 'assets/*' -d build/android/released-assets
          cp -r build/android/released-assets/assets/. build/android/assets/
          python3 - <<'PYBUILD'
          from pathlib import Path
          p=Path('android/app/build.gradle.kts')
          s=p.read_text().replace('listOf("arm64-v8a", "armeabi-v7a")','listOf("x86_64")')
          assert 'listOf("x86_64")' in s;p.write_text(s)
          Path('build/android/nuvio-env.cmake').write_text('set(NV_VERSAO "2.0.51-emulator")\n')
          p=Path('tools/emulator/font-driver.py');s=p.read_text().replace(".get(str(n))", ".get('x86-'+str(n))");p.write_text(s)
          PYBUILD
          cache="$HOME/.cache/nuvio-android"
          mkdir -p "$cache/src"
          for u in https://github.com/libsdl-org/SDL/releases/download/release-2.30.9/SDL2-2.30.9.tar.gz https://github.com/libsdl-org/SDL_image/releases/download/release-2.8.2/SDL2_image-2.8.2.tar.gz https://github.com/libsdl-org/SDL_ttf/releases/download/release-2.22.0/SDL2_ttf-2.22.0.tar.gz https://storage.googleapis.com/downloads.webmproject.org/releases/webp/libwebp-1.4.0.tar.gz; do
            test -d "$cache/src/$(basename "$u" .tar.gz)" || curl -fsSL "$u" | tar xz -C "$cache/src"
          done
          mkdir -p "$HOME/.android"
          test -f "$HOME/.android/debug.keystore" || keytool -genkeypair -keystore "$HOME/.android/debug.keystore" -storepass android -keypass android -alias androiddebugkey -dname 'CN=Isolated Emulator' -keyalg RSA -validity 30
          export NUVIO_TEST_DEBUG_KEYSTORE="$HOME/.android/debug.keystore"
          bash android/gradlew -p android --console=plain --max-workers=2 -Pnuvio.testLocalLogs=true -Pnuvio.sdlSrc="$cache/src" -Pnuvio.estagio="$PWD/build/android" assembleDebug
          git diff -- android/app/build.gradle.kts > ../emulator-results/emulator-only-abi.patch
          test -z "$(git diff --name-only -- src)"
      - uses: actions/upload-artifact@v4
        with:
          name: Logs41-native-x86-emulator-apk
          path: font-app/android/app/build/outputs/apk/debug/app-debug.apk
      - name: Boot a persistent hardware-accelerated phone emulator
        run: |
          set -euo pipefail
          "$ANDROID_HOME/emulator/emulator" -accel-check
          "$ANDROID_HOME/emulator/emulator" -list-avds | tee emulator-results/avds.txt
          grep -qx nuvio-fonts emulator-results/avds.txt
          nohup "$ANDROID_HOME/emulator/emulator" -avd nuvio-fonts -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect -camera-back none -camera-front none -memory 3072 -cores 2 -feature -Vulkan > emulator-results/boot.log 2>&1 &
          if ! timeout 150 adb wait-for-device; then cat emulator-results/boot.log; exit 1; fi
          python3 - <<'PYBOOT'
          import subprocess,time
          for i in range(120):
              r=subprocess.run(['adb','shell','getprop','sys.boot_completed'],capture_output=True,text=True,timeout=10)
              if r.stdout.strip()=='1':break
              time.sleep(2)
          else:
              print(open('emulator-results/boot.log').read(),flush=True)
              raise RuntimeError('Emulator did not finish booting')
          PYBOOT
          adb shell getprop ro.product.cpu.abilist | tee emulator-results/abis.txt
          adb shell getprop ro.dalvik.vm.native.bridge | tee emulator-results/native-bridge.txt
          adb install -r font-app/android/app/build/outputs/apk/debug/app-debug.apk
          adb shell dumpsys package space.nuvio.nativelegacy.touch | grep primaryCpuAbi | tee emulator-results/installed-abi.txt
      - name: Start the actual APK with isolated offline font fixtures
        run: cd font-app && python3 tools/emulator/font-driver.py --bootstrap
      - uses: actions/upload-artifact@v4
        with:
          name: Logs41-x86-emulator-phase-1
          path: font-app/emulator-results/phase-1
      - name: Interactive emulator checks - phase 2
        run: cd font-app && python3 tools/emulator/font-driver.py --phase 2
      - uses: actions/upload-artifact@v4
        with:
          name: Logs41-x86-emulator-phase-2
          path: font-app/emulator-results/phase-2
          if-no-files-found: ignore
      - name: Interactive emulator checks - phase 3
        run: cd font-app && python3 tools/emulator/font-driver.py --phase 3
      - uses: actions/upload-artifact@v4
        with:
          name: Logs41-x86-emulator-phase-3
          path: font-app/emulator-results/phase-3
          if-no-files-found: ignore
      - name: Interactive emulator checks - phase 4
