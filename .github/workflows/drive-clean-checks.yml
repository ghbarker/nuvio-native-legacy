name: Clean encrypted Drive backup checks
on:
  workflow_dispatch:
  push:
    branches: [review/logs34-integration-20261017]
    paths: [.github/workflows/drive-clean-checks.yml]
permissions:
  contents: read
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
        suite: [small, backupapp, drivebackup, backup_restore_addons]
        source: [e66296b16179ba695d9b343b2c0b8f5c94d99610]
        include:
          - os: ubuntu-24.04
            suite: preview
            source: 0a3026ce6a415146b710f9815b67888ad9363b21
          - os: macos-15
            suite: preview
            source: 0a3026ce6a415146b710f9815b67888ad9363b21
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      SDL_MAC_BACKGROUND_APP: '1'
      DYLD_LIBRARY_PATH: /opt/homebrew/lib
      ASAN_OPTIONS: detect_leaks=0:halt_on_error=1
      UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.source }}
          fetch-depth: 5
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq pkg-config libsdl2-dev libsdl2-image-dev libsdl2-ttf-dev libwebp-dev libass-dev libfribidi-dev libgles2-mesa-dev libmbedtls-dev
      - if: runner.os == 'macOS'
        run: brew install pkg-config sdl2 sdl2_image sdl2_ttf webp mbedtls@3
      - run: python3 -m pip install cryptography
      - name: Normal and ASan/UBSan checks, each with a timeout
        env:
          BACKUP_TEST_GROUP: ${{ matrix.suite }}
        run: |
          mkdir -p diagnostics
          python3 - <<'PY'
          import os, pathlib, signal, subprocess
          small = ('backupcrypto','backuplocal','backupstores','backupconnections','backupfonts','backupdisco','backuprestauro','drivelocal','drivefontes','drivetv','ime_context')
          group = os.environ['BACKUP_TEST_GROUP']
          suites = small if group == 'small' else ('backupapp','legfontes') if group == 'preview' else (group,)
          failures = []
          for suite in suites:
              for sanitize in ('0', '1'):
                  name = suite + ('-sanitizers' if sanitize == '1' else '-normal')
                  path = pathlib.Path('diagnostics', name + '.log')
                  print('Starting ' + name, flush=True)
                  with path.open('w') as output:
                      process = subprocess.Popen(['bash', 'tests/' + suite + '.sh'], env={**os.environ, 'SANITIZE': sanitize}, stdout=output, stderr=subprocess.STDOUT, start_new_session=True)
                      try:
                          code = process.wait(timeout=300)
                      except subprocess.TimeoutExpired:
                          os.killpg(process.pid, signal.SIGKILL)
                          process.wait()
                          code = 124
                  print('\n'.join(path.read_text().splitlines()[-20:]), flush=True)
                  if code:
                      failures.append(name + ': ' + str(code))
          if failures:
              raise SystemExit('\n'.join(failures))
          PY
      - name: Compare translation lint with unchanged upstream
        if: matrix.suite == 'small'
        run: |
          python3 - <<'PYI18N'
          import pathlib,subprocess,tempfile,re
          root=pathlib.Path.cwd()
          with tempfile.TemporaryDirectory() as temp:
              baseline=pathlib.Path(temp)
              for part in ('tools','src','deploy/app'): (baseline/part).mkdir(parents=True,exist_ok=True)
              (baseline/'tools/idiomas.py').write_bytes((root/'tools/idiomas.py').read_bytes())
              (baseline/'deploy/app/fonts').symlink_to(root/'deploy/app/fonts',target_is_directory=True)
              for path in (root/'src').glob('idioma_*.h'):
                  result=subprocess.run(['git','show','0fa8979c60cdd373d09d24a103db80398c94f6fe:src/'+path.name],capture_output=True)
                  if result.returncode==0:(baseline/'src'/path.name).write_bytes(result.stdout)
              old=subprocess.run(['python3',str(baseline/'tools/idiomas.py')],capture_output=True,text=True)
              new=subprocess.run(['python3','tools/idiomas.py'],capture_output=True,text=True)
              normalize=lambda s:re.sub(r':\d+:',':LINE:',s)
              assert old.returncode==new.returncode and normalize(old.stdout+old.stderr)==normalize(new.stdout+new.stderr),(old.stdout,new.stdout)
              print('PASS: no added translation-lint failures; unchanged upstream reports 47 pre-existing errors.')
          PYI18N
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: drive-clean-${{ matrix.os }}-${{ matrix.suite }}
          path: diagnostics
