name: Publish verified Logs80 IntroDB fallback APK
on:
  workflow_dispatch:
    inputs:
      instructions_only:
        description: Repair the released test instructions only
        type: boolean
        default: false
      android_run_id:
        description: Successful Logs80 Android build run
        required: true
        type: string
      native_run_id:
        description: Successful Logs80 Linux/macOS marker checks
        required: true
        type: string
permissions:
  contents: read
jobs:
  instructions:
    if: inputs.instructions_only
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ghbarker/nuvio-native-legacy
    steps:
      - name: Restore corrected instructions asset
        run: |
          cat > Logs80-test-steps.txt <<'STEPS'
          Logs80: IntroDB skip-marker backup and season-button fix
          Version 2.0.90-test-logs80 (20090).
          
          Install as an UPDATE to Nuvio TV/Mobile Test. Do not uninstall or clear
          app data; the package and persistent signing key retain your accounts.
          
          1. Confirm the season-button fix: open Game of Thrones, select seasons
             1 and 8, then leave and reopen. Episode cards and tabs should agree.
          2. To test MANUAL buttons, temporarily disable automatic Skip intro,
             Skip recap and Skip credits in Playback settings.
             lookup enabled. Automatic skipping can hide the manual button.
          3. Open Supernatural S01E01. Allow about 20 seconds for both databases
             to respond, then seek to 2:25 and let it play. The public IntroDB
             backup currently lists an intro from 2:30 to 3:30. A Skip intro
             button should appear in that interval; press it to seek to 3:30.
             Availability and timings depend on the databases and your video cut.
          4. Control: Game of Thrones S01E02 has TheIntroDB intro markers around
             0:05-1:46. After lookup finishes, seek to 0:15. Its existing marker
             should still work. If the button auto-hid, reopen playback controls.
          5. Re-enable your usual automatic skip choices and repeat a known intro.
             Check one anime whose AniSkip/chapter markers already worked too.
          6. Leave during lookup, then open another episode. A late response must
             not show the old episode's skip markers on the new one.
          7. If a button is missing, save a log and include title, season/episode,
             source, playback time, and whether automatic skipping was enabled.
             Look for IntroDB backup HTTP/status and added-marker diagnostics.
          
          Computer ADB: adb logcat -d -v threadtime > Nuvio-Logs80.txt
          In a phone ADB shell app: logcat -d -v threadtime
          
          These are test instructions, not a guarantee of database coverage for
          every episode or video cut. Existing timing safeguards remain enabled.
          Awaiting approval of this build before publishing the IntroDB PR.
          STEPS
          gh release upload tv-mobile-test-logs-v80 Logs80-test-steps.txt --clobber
  publish:
    if: ${{ !inputs.instructions_only }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      actions: read
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ghbarker/nuvio-native-legacy
      SOURCE_SHA: 20638b6e37d79496f500243c92f7a91541ddd995
      SOURCE_TREE: f82f9efe72ab792cd8df39dad2c2463dba89ce84
      ANDROID_CONFIG_COMMIT: 251f3da3ee37b57bf34c283d7ca4382ad79c01ba
      NATIVE_CONFIG_COMMIT: c0d74b5d5b49721a5b5f819aeda97f8095731ede
      NATIVE_SOURCE_SHA: affe70f448807b5aad2ff7c1127d483149271e8b
      NATIVE_SOURCE_TREE: 2fdae25f83b76ab88e1a0fe0924c908ee67b89a1
      ANDROID_RUN: ${{ inputs.android_run_id }}
      NATIVE_RUN: ${{ inputs.native_run_id }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install APK signature verifier dependency
        run: python3 -m pip install 'cryptography>=42,<47'
      - name: Verify exact successful build
        run: |
          python3 - <<'PY'
          import json,os,re,subprocess
          run=os.environ['ANDROID_RUN']
          assert re.fullmatch(r'[0-9]+',run)
          repo='repos/ghbarker/nuvio-native-legacy/'
          api=lambda path:json.loads(subprocess.check_output(['gh','api',repo+path]))
          data=api('actions/runs/'+run)
          assert data['status']=='completed' and data['conclusion']=='success'
          assert data['head_sha']==os.environ['ANDROID_CONFIG_COMMIT']
          assert data['path']=='.github/workflows/logs35-build.yml'
          assert data['head_repository']['full_name']=='ghbarker/nuvio-native-legacy'
          jobs=api('actions/runs/'+run+'/jobs?per_page=100')['jobs']
          assert any(j['name']=='apk-build' and j['conclusion']=='success' for j in jobs)
          assert all(j['conclusion'] in ('success','skipped') for j in jobs)
          run=os.environ['NATIVE_RUN'];assert re.fullmatch(r'[0-9]+',run)
          data=api('actions/runs/'+run)
          assert data['status']=='completed' and data['conclusion']=='success'
          assert data['head_sha']==os.environ['NATIVE_CONFIG_COMMIT']
          assert data['path']=='.github/workflows/audio-label-checks.yml'
          assert data['head_repository']['full_name']=='ghbarker/nuvio-native-legacy'
          jobs=api('actions/runs/'+run+'/jobs?per_page=100')['jobs']
          assert len(jobs)==2 and all(j['conclusion']=='success' for j in jobs)
          PY
      - uses: actions/download-artifact@v4
        with:
          name: Nuvio-TV-Mobile-Test-Logs80-${{ env.ANDROID_CONFIG_COMMIT }}
          run-id: ${{ inputs.android_run_id }}
          github-token: ${{ github.token }}
      - name: Download native metadata evidence
        uses: actions/download-artifact@v4
        with:
          pattern: integration-*
          path: native-evidence
          run-id: ${{ inputs.native_run_id }}
          github-token: ${{ github.token }}
      - name: Verify APK signature, identity, version and ARM libraries
        run: |
          python3 - <<'PY'
          import hashlib,json,os,pathlib,subprocess
          apk=pathlib.Path('Nuvio-TV-Mobile-Test-Logs80.apk')
          p=pathlib.Path('Logs80-validation.json');data=json.loads(p.read_text())
          assert data['source_commit']==os.environ['SOURCE_SHA']
          assert data['source_tree']==os.environ['SOURCE_TREE']
          assert data['workflow_commit']==os.environ['ANDROID_CONFIG_COMMIT']
          assert data['workflow_run_id']==int(os.environ['ANDROID_RUN'])
          assert data['apk_sha256']==hashlib.sha256(apk.read_bytes()).hexdigest()
          assert data['apk_bytes']==apk.stat().st_size
          assert data['android_unit_tests']==[] and not data['tests_skipped_by_request']
          subprocess.run(['python3','tools/verify-test-apk.py',str(apk),'--expected-sha256',data['apk_sha256'],'--version-code','20090','--version-name','2.0.90-test-logs80','--output','Logs80-independent-verification.json'],check=True)
          dirs={p.name:p for p in pathlib.Path('native-evidence').iterdir() if p.is_dir()}
          assert set(dirs)=={'integration-'+system+'-intro-backup' for system in ('ubuntu-24.04','macos-15')}
          results=[]
          for directory in dirs.values():
              source=json.loads((directory/'source.json').read_text())
              assert source['source_commit']==os.environ['NATIVE_SOURCE_SHA'] and source['source_tree']==os.environ['NATIVE_SOURCE_TREE']
              checks=json.loads((directory/'results.json').read_text())
              assert len(checks)==7 and all(c['code']==0 for c in checks)
              assert {(c['suite'],c['sanitizers']) for c in checks}=={(n,b) for n in ('intro','creditos_limitados') for b in (False,True)} | {(n,False) for n in ('player_identity524','player_identity524_guards','cwinicio')}
              results.extend(checks)
          data['native_check_source_commit']=os.environ['NATIVE_SOURCE_SHA']
          data['native_metadata_check_invocations']=len(results)
          data['sanitizer_invocations']=sum(c['sanitizers'] for c in results)
          data['check_runs']={'android':int(os.environ['ANDROID_RUN']),'linux_macos':int(os.environ['NATIVE_RUN'])}
          data['validation_note']='Android build and APK identity verification; Linux/macOS native skip-marker and identity tests; marker suites also under ASan/UBSan. These are not packaged macOS/webOS/Tizen application builds.'
          p.write_text(json.dumps(data,indent=2)+'\n')
          PY
      - name: Verify test harness repairs preserve Android product source
        run: |
          git fetch --no-tags --depth=5 origin "$SOURCE_SHA" "$NATIVE_SOURCE_SHA"
          python3 - <<'PY'
          import os,subprocess
          changed=set(subprocess.check_output(['git','diff','--name-only',os.environ['SOURCE_SHA'],os.environ['NATIVE_SOURCE_SHA']],text=True).splitlines())
          assert changed=={'tests/cwinicio.sh','tests/player_identity524.c','tests/player_identity524.sh','tests/player_identity524_guards.c','tests/player_identity524_guards.sh'},changed
          print('Native source differs only in test harnesses; Android product source is identical.')
          PY
      - name: Write instructions
        run: |
          cat > Logs80-test-steps.txt <<'STEPS'
          Logs80: IntroDB skip-marker backup and season-button fix
          Version 2.0.90-test-logs80 (20090).

          Install as an UPDATE to Nuvio TV/Mobile Test. Do not uninstall or clear
          app data; the package and persistent signing key retain your accounts.

          1. Confirm the season-button fix: open Game of Thrones, select seasons
             1 and 8, then leave and reopen. Episode cards and tabs should agree.
          2. To test MANUAL buttons, temporarily disable automatic Skip intro,
             Skip recap and Skip credits in Playback settings. Keep skip-marker
             lookup enabled. Automatic skipping can hide the manual button.
          3. Open Supernatural S01E01. Allow about 20 seconds for both databases
             to respond, then seek to 2:25 and let it play. The public IntroDB
             backup currently lists an intro from 2:30 to 3:30. A Skip intro
             button should appear in that interval; press it to seek to 3:30.
             Availability and timings depend on the databases and your video cut.
          4. Control: Game of Thrones S01E02 has TheIntroDB intro markers around
             0:05-1:46. After lookup finishes, seek to 0:15. Its existing marker
             should still work. If the button auto-hid, reopen playback controls.
          5. Re-enable your usual automatic skip choices and repeat a known intro.
             Check one anime whose AniSkip/chapter markers already worked too.
          6. Leave during lookup, then open another episode. A late response must
             not show the old episode's skip markers on the new one.
          7. If a button is missing, save a log and include title, season/episode,
             source, playback time, and whether automatic skipping was enabled.
             Look for IntroDB backup HTTP/status and added-marker diagnostics.

          Computer ADB: adb logcat -d -v threadtime > Nuvio-Logs80.txt
          In a phone ADB shell app: logcat -d -v threadtime

          These are test instructions, not a guarantee of database coverage for
          every episode or video cut. Existing timing safeguards remain enabled.
          Awaiting approval of this build before publishing the IntroDB PR.
          STEPS
          cat > notes.txt <<'NOTES'
          Adds IntroDB (api.introdb.app) as a backup for missing intro, recap and
          credits markers. Existing TheIntroDB, AniSkip and file chapters retain
          priority. Existing markers publish before the bounded backup lookup.
          Requests use original IMDb episode coordinates, and malformed or wrong
          identities are rejected. Results are cached for 30 minutes; failures
          remain retryable. Existing timing guards and post-credit scenes remain
          protected. This build also retains the Logs79 season-button fix.

          Android build and independent signer/package/version/ARM checks are
          verified. Linux/macOS skip-marker and playback-identity checks passed
          (14 invocations, including four ASan/UBSan runs). These native checks
          are not packaged macOS, webOS or Tizen application builds.

          Install as an update and follow Logs80-test-steps.txt. Awaiting device
          approval before publishing the IntroDB product PR. Test packaging and
          local log-export code stay out of that PR.
          NOTES
      - name: Publish diagnostic download
        run: |
          gh release create tv-mobile-test-logs-v80 Nuvio-TV-Mobile-Test-Logs80.apk Logs80-validation.json Logs80-independent-verification.json Logs80-test-steps.txt --target "$SOURCE_SHA" --title 'TV/Mobile Test Logs80: IntroDB marker backup' --notes-file notes.txt --prerelease
