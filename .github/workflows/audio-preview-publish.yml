name: Publish verified Logs88 Sports preview
on:
  push:
    branches: [review/logs34-integration-20261017]
    paths: [.github/workflows/audio-preview-publish.yml]
  workflow_dispatch:
    inputs:
      android_run_id:
        required: true
        type: string
      native_run_id:
        required: true
        type: string
permissions:
  contents: read
jobs:
  publish:
    if: github.event_name != 'push' || contains(github.event.head_commit.message, '[publish-logs88]')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ghbarker/nuvio-native-legacy
      SOURCE_SHA: cfc730ad1721d4f12b197b03b5e7c2fb046b5f59
      SOURCE_TREE: 37f46a7d6a7fd0e22b13a4673e2d636d65192beb
      BUILD_CONFIG: bc115d0641fd0da65c55356eea9a64e6250b570a
      NATIVE_CONFIG: bc115d0641fd0da65c55356eea9a64e6250b570a
      NATIVE_SOURCE_SHA: cfc730ad1721d4f12b197b03b5e7c2fb046b5f59
      NATIVE_SOURCE_TREE: 37f46a7d6a7fd0e22b13a4673e2d636d65192beb
      ANDROID_RUN: ${{ inputs.android_run_id || '39312152688' }}
      NATIVE_RUN: ${{ inputs.native_run_id || '39312158665' }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Wait for the pinned checks
        run: |
          python3 - <<'WAIT'
          import json,os,subprocess,time
          for key,config in [('ANDROID_RUN','BUILD_CONFIG'),('NATIVE_RUN','NATIVE_CONFIG')]:
              for attempt in range(60):
                  r=json.loads(subprocess.check_output(['gh','api','repos/'+os.environ['GH_REPO']+'/actions/runs/'+os.environ[key]]))
                  assert r['head_sha']==os.environ[config]
                  if r['status']=='completed':
                      assert r['conclusion']=='success',r['conclusion']
                      break
                  print(key,r['status'],flush=True)
                  time.sleep(10)
              else:raise RuntimeError(key+' did not finish in time')
          WAIT
      - name: Verify successful pinned checks
        run: |
          python3 - <<'CHECK'
          import json,os,re,subprocess
          api=lambda path:json.loads(subprocess.check_output(['gh','api','repos/'+os.environ['GH_REPO']+'/'+path]))
          for key,path in [('ANDROID_RUN','.github/workflows/logs35-build.yml'),('NATIVE_RUN','.github/workflows/audio-label-checks.yml')]:
              run=os.environ[key];assert re.fullmatch('[0-9]+',run)
              r=api('actions/runs/'+run)
              assert r['status']=='completed' and r['conclusion']=='success'
              assert r['head_sha']==os.environ['BUILD_CONFIG' if key=='ANDROID_RUN' else 'NATIVE_CONFIG'] and r['path']==path
              assert r['head_repository']['full_name']==os.environ['GH_REPO']
              jobs=api('actions/runs/'+run+'/jobs?per_page=100')['jobs']
              assert all(j['conclusion'] in ('success','skipped') for j in jobs)
              if key=='ANDROID_RUN':assert any(j['name']=='apk-build' and j['conclusion']=='success' for j in jobs)
              else:assert len(jobs)==2 and all(j['conclusion']=='success' for j in jobs)
          CHECK
      - uses: actions/download-artifact@v4
        with:
          name: Nuvio-TV-Mobile-Test-Logs88-${{ env.BUILD_CONFIG }}
          run-id: ${{ env.ANDROID_RUN }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          pattern: integration-*
          path: native-evidence
          run-id: ${{ env.NATIVE_RUN }}
          github-token: ${{ github.token }}
      - name: Verify APK and native test evidence
        run: |
          python3 -m pip install 'cryptography>=42,<47'
          python3 - <<'VERIFY'
          import hashlib,json,os,pathlib,subprocess
          apk=pathlib.Path('Nuvio-TV-Mobile-Test-Logs88.apk');p=pathlib.Path('Logs88-validation.json');v=json.loads(p.read_text())
          assert v['source_commit']==os.environ['SOURCE_SHA'] and v['source_tree']==os.environ['SOURCE_TREE']
          assert v['workflow_commit']==os.environ['BUILD_CONFIG'] and v['workflow_run_id']==int(os.environ['ANDROID_RUN'])
          assert v['apk_sha256']==hashlib.sha256(apk.read_bytes()).hexdigest() and v['apk_bytes']==apk.stat().st_size
          subprocess.run(['python3','tools/verify-test-apk.py',str(apk),'--expected-sha256',v['apk_sha256'],'--version-code','20098','--version-name','2.0.98-test-logs88','--output','Logs88-independent-verification.json'],check=True)
          dirs={p.name:p for p in pathlib.Path('native-evidence').iterdir() if p.is_dir()}
          assert set(dirs)=={'integration-ubuntu-24.04-sports','integration-macos-15-intel-sports'}
          results=[]
          for d in dirs.values():
              s=json.loads((d/'source.json').read_text());assert s['source_commit']==os.environ['NATIVE_SOURCE_SHA'] and s['source_tree']==os.environ['NATIVE_SOURCE_TREE']
              checks=json.loads((d/'results.json').read_text());assert len(checks)==10 and all(x['code']==0 for x in checks)
              assert {(x['suite'],x['sanitizers']) for x in checks}=={(n,b) for n in ['esportes','esportes_estado','esportes_ui','fontescanais_folha','streamfit_sheet'] for b in [False,True]}
              results+=checks
          v['native_check_source_commit']=os.environ['NATIVE_SOURCE_SHA']
          v['native_check_invocations']=len(results);v['sanitizer_invocations']=sum(x['sanitizers'] for x in results)
          v['check_runs']={'android':int(os.environ['ANDROID_RUN']),'linux_macos':int(os.environ['NATIVE_RUN'])}
          v['validation_note']='Android APK build and independent identity/signature/ABI verification; Linux/macOS sports parsing, state, headless input/guide-match and shared source-picker ownership fixtures, normal and ASan/UBSan. These are not packaged macOS/webOS/Tizen builds or visual/device tests.'
          p.write_text(json.dumps(v,indent=2)+'\n')
          VERIFY
      - name: Verify identical Android and native-check product source
        run: |
          git fetch --no-tags --depth=3 origin "$SOURCE_SHA" "$NATIVE_SOURCE_SHA"
          python3 - <<'DIFF'
          import os,subprocess
          changed=set(subprocess.check_output(['git','diff','--name-only',os.environ['SOURCE_SHA'],os.environ['NATIVE_SOURCE_SHA']],text=True).splitlines())
          assert not changed,changed
          print('Android and native checks use the identical source tree.')
          DIFF
      - name: Write test instructions
        run: |
          cat > Logs88-test-steps.txt <<'STEPS'
          Logs88: Sports league rows and visibility. Version 2.0.98-test-logs88 (20098).
          Install as an UPDATE to Nuvio TV/Mobile Test. Do not uninstall or clear data.

          1. Open Sports. All should show horizontal rows named for leagues such as
             NFL, NBA or Premier League, with that league's match cards in each row.
             The combined Favorites row remains at the top if teams are saved.
          2. Swipe horizontally within a league row and vertically between rows.
             A horizontal swipe must not move another row, and a subsequent
             vertical swipe must scroll the page rather than the old horizontal row.
             Remote Left/Right browses cards; Up/Down changes league rows.
          3. Select a sport chip. It should show only that sport's league rows.
             Select All to return to all enabled sports/leagues.
          4. Select Leagues in the top toolbar. Every league in the current sport
             filter should have the app's ordinary On/Off row. With All selected,
             the list covers enabled sports. Search can help find a league.
          5. Turn one league Off and go Back. Its whole row must disappear while
             other leagues remain. Reopen Leagues: the disabled league stays listed
             so you can turn it back On. Its row should return after doing so.
          6. Leave the league Off, return to Home and reopen Sports, then restart
             the app. The league must remain hidden for that profile. A different
             profile keeps its own choices. Whole-sport switches still work too.
             Hiding a league row does not remove saved favorite-team matches from
             the combined Favorites row. Disabling an entire sport still does.
          7. Short-tap a match card or press and release remote OK. The normal
             Sources sheet must open; selecting a matching guide channel should play.
             Long-press/hold OK must open only team favorite options, and releasing
             that hold must not open Sources or favorite a team accidentally.
          8. Tap a league's heading or select its heading with a remote and press OK.
             The full existing event grid should open. Short-tap a match for Sources.
          9. Favorite teams from different leagues/sports. All should show one
             combined Favorites row with their live/upcoming fixtures. Soccer
             favorites still include cup matches supplied by ESPN. Remove the last
             favorite and return: navigation must focus a valid league row. From a
             full league grid, Favorites must return to All with every enabled
             league visible, rather than retaining the league's sport filter.
          10. Open and close the left app menu: content must stay in place. Leave
              Sports and return: it should open at All, with hidden choices retained.
              English dates remain MM/DD. Normal Home/movie/episode Sources should
              continue to work. Check Leagues/On/Off labels in another app language.

          League metadata loads progressively. Match requests are limited to visible
          rows, with at most eight row payloads retained in memory. An empty row
          shows Loading until its bounded date scan finishes, then No results;
          a failed request shows the retry message. Refresh retries visible rows.
          No stream is opened while loading Sports metadata.
          Limits: 1024 leagues per sport, 400 events per league, 400 combined favorite
          events and 64 confirmed channel matches. Matching depends on your loaded
          IPTV EPG. No upstream Sports PR until this updated build is approved.
          Computer ADB: adb logcat -d -v threadtime > Nuvio-Logs88.txt
          STEPS
          cat > notes.txt <<'NOTES'
          Sports now groups matches into horizontal league rows, with a Leagues
          toolbar action to turn each league on/off for the active profile.
          All shows visible leagues across enabled sports; sport chips narrow the
          league rows. Hidden leagues remain in the settings list for re-enabling.
          The single combined team Favorites row remains above the league rows.
          Match data loads only for visible rows, using the existing metadata worker
          and an eight-row memory cache. Short tap opens Sources; long press opens
          only favorite options. Existing playback/source matching is retained.

          Android build and independent APK verification passed. Linux/macOS
          parsing, profile/state and headless UI fixtures passed in normal and
          ASan/UBSan modes (20 invocations). These are not visual/device tests
          or packaged macOS/webOS/Tizen builds. Install as an update and follow
          Logs88-test-steps.txt. No upstream Sports PR has been published.
          NOTES
      - name: Publish verified preview
        run: |
          gh release create tv-mobile-test-logs-v88 Nuvio-TV-Mobile-Test-Logs88.apk Logs88-validation.json Logs88-independent-verification.json Logs88-test-steps.txt --target "$SOURCE_SHA" --title 'TV/Mobile Test Logs88: League rows and visibility' --notes-file notes.txt --prerelease
