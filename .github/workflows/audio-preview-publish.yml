name: Publish verified Logs89 add-on order preview
on:
  push:
    branches: [review/logs34-integration-20261017]
    paths: [.github/workflows/audio-preview-publish.yml]
  workflow_dispatch:
    inputs:
      android_run_id:
        required: true
        type: string
      native_run_id:
        required: true
        type: string
permissions:
  contents: read
jobs:
  publish:
    if: github.event_name != 'push' || contains(github.event.head_commit.message, '[publish-logs89]')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ghbarker/nuvio-native-legacy
      SOURCE_SHA: 801206c9a9dd72feeb2c295234589f4d7134a170
      SOURCE_TREE: ec4cbc84cf18dcbefb6c19277734c83c13d6746b
      BUILD_CONFIG: f9a69cf01439f5efbe06b22e5de72a5a8a8c8c6b
      NATIVE_CONFIG: f9a69cf01439f5efbe06b22e5de72a5a8a8c8c6b
      NATIVE_SOURCE_SHA: 801206c9a9dd72feeb2c295234589f4d7134a170
      NATIVE_SOURCE_TREE: ec4cbc84cf18dcbefb6c19277734c83c13d6746b
      ANDROID_RUN: ${{ inputs.android_run_id || '39325251228' }}
      NATIVE_RUN: ${{ inputs.native_run_id || '39325250746' }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Wait for the pinned checks
        run: |
          python3 - <<'WAIT'
          import json,os,subprocess,time
          for key,config in [('ANDROID_RUN','BUILD_CONFIG'),('NATIVE_RUN','NATIVE_CONFIG')]:
              for attempt in range(60):
                  r=json.loads(subprocess.check_output(['gh','api','repos/'+os.environ['GH_REPO']+'/actions/runs/'+os.environ[key]]))
                  assert r['head_sha']==os.environ[config]
                  if r['status']=='completed':
                      assert r['conclusion']=='success',r['conclusion']
                      break
                  print(key,r['status'],flush=True)
                  time.sleep(10)
              else:raise RuntimeError(key+' did not finish in time')
          WAIT
      - name: Verify successful pinned checks
        run: |
          python3 - <<'CHECK'
          import json,os,re,subprocess
          api=lambda path:json.loads(subprocess.check_output(['gh','api','repos/'+os.environ['GH_REPO']+'/'+path]))
          for key,path in [('ANDROID_RUN','.github/workflows/logs35-build.yml'),('NATIVE_RUN','.github/workflows/audio-label-checks.yml')]:
              run=os.environ[key];assert re.fullmatch('[0-9]+',run)
              r=api('actions/runs/'+run)
              assert r['status']=='completed' and r['conclusion']=='success'
              assert r['head_sha']==os.environ['BUILD_CONFIG' if key=='ANDROID_RUN' else 'NATIVE_CONFIG'] and r['path']==path
              assert r['head_repository']['full_name']==os.environ['GH_REPO']
              jobs=api('actions/runs/'+run+'/jobs?per_page=100')['jobs']
              assert all(j['conclusion'] in ('success','skipped') for j in jobs)
              if key=='ANDROID_RUN':assert any(j['name']=='apk-build' and j['conclusion']=='success' for j in jobs)
              else:assert len(jobs)==2 and all(j['conclusion']=='success' for j in jobs)
          CHECK
      - uses: actions/download-artifact@v4
        with:
          name: Nuvio-TV-Mobile-Test-Logs89-${{ env.BUILD_CONFIG }}
          run-id: ${{ env.ANDROID_RUN }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          pattern: integration-*
          path: native-evidence
          run-id: ${{ env.NATIVE_RUN }}
          github-token: ${{ github.token }}
      - name: Verify APK and native test evidence
        run: |
          python3 -m pip install 'cryptography>=42,<47'
          python3 - <<'VERIFY'
          import hashlib,json,os,pathlib,subprocess
          apk=pathlib.Path('Nuvio-TV-Mobile-Test-Logs89.apk');p=pathlib.Path('Logs89-validation.json');v=json.loads(p.read_text())
          assert v['source_commit']==os.environ['SOURCE_SHA'] and v['source_tree']==os.environ['SOURCE_TREE']
          assert v['workflow_commit']==os.environ['BUILD_CONFIG'] and v['workflow_run_id']==int(os.environ['ANDROID_RUN'])
          assert v['apk_sha256']==hashlib.sha256(apk.read_bytes()).hexdigest() and v['apk_bytes']==apk.stat().st_size
          subprocess.run(['python3','tools/verify-test-apk.py',str(apk),'--expected-sha256',v['apk_sha256'],'--version-code','20099','--version-name','2.0.99-test-logs89','--output','Logs89-independent-verification.json'],check=True)
          dirs={p.name:p for p in pathlib.Path('native-evidence').iterdir() if p.is_dir()}
          assert set(dirs)=={'integration-ubuntu-24.04-addon-order','integration-macos-15-intel-addon-order'}
          results=[]
          for d in dirs.values():
              s=json.loads((d/'source.json').read_text());assert s['source_commit']==os.environ['NATIVE_SOURCE_SHA'] and s['source_tree']==os.environ['NATIVE_SOURCE_TREE']
              checks=json.loads((d/'results.json').read_text());assert len(checks)==8 and all(x['code']==0 for x in checks)
              assert {(x['suite'],x['sanitizers']) for x in checks}=={(n,b) for n in ['addon_order_settings','fontefalha_worker','streamfit_sheet','fontefalha'] for b in [False,True]}
              results+=checks
          v['native_check_source_commit']=os.environ['NATIVE_SOURCE_SHA']
          v['native_check_invocations']=len(results);v['sanitizer_invocations']=sum(x['sanitizers'] for x in results)
          v['check_runs']={'android':int(os.environ['ANDROID_RUN']),'linux_macos':int(os.environ['NATIVE_RUN'])}
          v['validation_note']='Android APK build and independent identity/signature/ABI verification; Linux/macOS source settings, actual source worker/preparation, Sources sheet and failover policy fixtures, normal and ASan/UBSan. These are not packaged macOS/webOS/Tizen builds or visual/device tests.'
          p.write_text(json.dumps(v,indent=2)+'\n')
          VERIFY
      - name: Verify identical Android and native-check product source
        run: |
          git fetch --no-tags --depth=3 origin "$SOURCE_SHA" "$NATIVE_SOURCE_SHA"
          python3 - <<'DIFF'
          import os,subprocess
          changed=set(subprocess.check_output(['git','diff','--name-only',os.environ['SOURCE_SHA'],os.environ['NATIVE_SOURCE_SHA']],text=True).splitlines())
          assert not changed,changed
          print('Android and native checks use the identical source tree.')
          DIFF
      - name: Write test instructions
        run: |
          cat > Logs89-test-steps.txt <<'STEPS'
          Logs89: Explicit add-on order. Version 2.0.99-test-logs89 (20099).
          Install as an UPDATE to Nuvio TV/Mobile Test. Do not uninstall or clear data.

          1. Open Settings > Playback > Source selection > What Nuvio prioritizes.
             Select the new fourth choice: From the addon. This does not require Instant.
             Automatic source now shows First in list. The source-memory/reuse rows are
             inactive in this mode; their saved choices return when you switch modes.
          2. Keep the AIOStreams configuration you already sort on the addon side.
             Under Playback > More options > Source selection, check the permitted
             autoplay addons for the current profile. Select your intended AIOStreams.
             Existing required filters, decoder safety and provider failover still apply.
          3. Open a movie and its Sources list. Each addon's results should keep their
             supplied order rather than being grouped by quality or file size. A known
             uncached source may be visible in place but is not eligible for autoplay.
             Note the first permitted/playable source, then tap Play. That source should
             be selected, even if a later source has a higher resolution/quality score
             or a previously watched source was remembered. A failed source can advance
             to the next eligible source under the existing failure budget.
          4. Enable source preparation/video preload if you use them. Open another title,
             wait for preparation, then Play. The prepared selection must follow the same
             order. Repeat for an episode and automatic Next. Changing this priority
             must invalidate preparation made under the old setting.
          5. Pick a different source manually from Sources. That exact choice must still
             play. Selecting From the addon governs automatic selection, not manual taps.
          6. Switch to another profile with a different permitted AIOStreams configuration
             and repeat. The permitted-addon rules must still apply to that profile.
          7. Change What Nuvio prioritizes back to Balanced, Maximum quality or Quick start.
             The original Best source/First in list and source-memory preferences should
             become available again, with their previous saved values preserved.

          If a different source is selected, save a fresh log immediately after Play.
          The normal auto-pick diagnostic identifies priority=addon-order.
          Computer ADB: adb logcat -d -v threadtime > Nuvio-Logs89.txt
          No upstream PR until this build has been tested and approved.
          STEPS
          cat > notes.txt <<'NOTES'
          Test preview for issue #618: explicit From the addon priority, matching
          Sources order/automatic choice, and consistent prepared/next-episode selection.
          Use the APK as an update to Nuvio TV/Mobile Test; do not uninstall.

          Checks: Android APK build, package/signer/ARM ABI verification; four headless
          native suites in normal and ASan/UBSan modes on Linux and macOS Intel (16 runs).
          These are not packaged macOS/webOS/Tizen builds or Android device test passes.
          See Logs89-test-steps.txt for exact verification steps.
          NOTES
      - name: Publish verified preview
        run: |
          gh release create tv-mobile-test-logs-v88 Nuvio-TV-Mobile-Test-Logs89.apk Logs89-validation.json Logs89-independent-verification.json Logs89-test-steps.txt --target "$SOURCE_SHA" --title 'TV/Mobile Test Logs89: League rows and visibility' --notes-file notes.txt --prerelease
