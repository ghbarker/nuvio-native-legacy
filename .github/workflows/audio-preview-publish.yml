name: Publish verified Logs83 Sports preview
on:
  workflow_dispatch:
    inputs:
      android_run_id:
        required: true
        type: string
      native_run_id:
        required: true
        type: string
permissions:
  contents: read
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ghbarker/nuvio-native-legacy
      SOURCE_SHA: 78dbce37cad5013dcf894bca894155c19ed08655
      SOURCE_TREE: acfe2606f6803dfc6a75da6d172857479f81767d
      BUILD_CONFIG: 6e015ab26a56467666f1a837e8ef14be76fc6f4e
      NATIVE_CONFIG: 6e015ab26a56467666f1a837e8ef14be76fc6f4e
      NATIVE_SOURCE_SHA: 78dbce37cad5013dcf894bca894155c19ed08655
      NATIVE_SOURCE_TREE: acfe2606f6803dfc6a75da6d172857479f81767d
      ANDROID_RUN: ${{ inputs.android_run_id }}
      NATIVE_RUN: ${{ inputs.native_run_id }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify successful pinned checks
        run: |
          python3 - <<'CHECK'
          import json,os,re,subprocess
          api=lambda path:json.loads(subprocess.check_output(['gh','api','repos/'+os.environ['GH_REPO']+'/'+path]))
          for key,path in [('ANDROID_RUN','.github/workflows/logs35-build.yml'),('NATIVE_RUN','.github/workflows/audio-label-checks.yml')]:
              run=os.environ[key];assert re.fullmatch('[0-9]+',run)
              r=api('actions/runs/'+run)
              assert r['status']=='completed' and r['conclusion']=='success'
              assert r['head_sha']==os.environ['BUILD_CONFIG' if key=='ANDROID_RUN' else 'NATIVE_CONFIG'] and r['path']==path
              assert r['head_repository']['full_name']==os.environ['GH_REPO']
              jobs=api('actions/runs/'+run+'/jobs?per_page=100')['jobs']
              assert all(j['conclusion'] in ('success','skipped') for j in jobs)
              if key=='ANDROID_RUN':assert any(j['name']=='apk-build' and j['conclusion']=='success' for j in jobs)
              else:assert len(jobs)==2 and all(j['conclusion']=='success' for j in jobs)
          CHECK
      - uses: actions/download-artifact@v4
        with:
          name: Nuvio-TV-Mobile-Test-Logs83-${{ env.BUILD_CONFIG }}
          run-id: ${{ inputs.android_run_id }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          pattern: integration-*
          path: native-evidence
          run-id: ${{ inputs.native_run_id }}
          github-token: ${{ github.token }}
      - name: Verify APK and native test evidence
        run: |
          python3 -m pip install 'cryptography>=42,<47'
          python3 - <<'VERIFY'
          import hashlib,json,os,pathlib,subprocess
          apk=pathlib.Path('Nuvio-TV-Mobile-Test-Logs83.apk');p=pathlib.Path('Logs83-validation.json');v=json.loads(p.read_text())
          assert v['source_commit']==os.environ['SOURCE_SHA'] and v['source_tree']==os.environ['SOURCE_TREE']
          assert v['workflow_commit']==os.environ['BUILD_CONFIG'] and v['workflow_run_id']==int(os.environ['ANDROID_RUN'])
          assert v['apk_sha256']==hashlib.sha256(apk.read_bytes()).hexdigest() and v['apk_bytes']==apk.stat().st_size
          subprocess.run(['python3','tools/verify-test-apk.py',str(apk),'--expected-sha256',v['apk_sha256'],'--version-code','20093','--version-name','2.0.93-test-logs83','--output','Logs83-independent-verification.json'],check=True)
          dirs={p.name:p for p in pathlib.Path('native-evidence').iterdir() if p.is_dir()}
          assert set(dirs)=={'integration-ubuntu-24.04-sports','integration-macos-15-sports'}
          results=[]
          for d in dirs.values():
              s=json.loads((d/'source.json').read_text());assert s['source_commit']==os.environ['NATIVE_SOURCE_SHA'] and s['source_tree']==os.environ['NATIVE_SOURCE_TREE']
              checks=json.loads((d/'results.json').read_text());assert len(checks)==6 and all(x['code']==0 for x in checks)
              assert {(x['suite'],x['sanitizers']) for x in checks}=={(n,b) for n in ['esportes','esportes_estado','esportes_ui'] for b in [False,True]}
              results+=checks
          v['native_check_source_commit']=os.environ['NATIVE_SOURCE_SHA']
          v['native_check_invocations']=len(results);v['sanitizer_invocations']=sum(x['sanitizers'] for x in results)
          v['check_runs']={'android':int(os.environ['ANDROID_RUN']),'linux_macos':int(os.environ['NATIVE_RUN'])}
          v['validation_note']='Android APK build and independent identity/signature/ABI verification; Linux/macOS sports parsing, state and headless input/guide-match fixtures, normal and ASan/UBSan. These are not packaged macOS/webOS/Tizen builds or visual/device tests.'
          p.write_text(json.dumps(v,indent=2)+'\n')
          VERIFY
      - name: Verify identical Android and native-check product source
        run: |
          git fetch --no-tags --depth=3 origin "$SOURCE_SHA" "$NATIVE_SOURCE_SHA"
          python3 - <<'DIFF'
          import os,subprocess
          changed=set(subprocess.check_output(['git','diff','--name-only',os.environ['SOURCE_SHA'],os.environ['NATIVE_SOURCE_SHA']],text=True).splitlines())
          assert not changed,changed
          print('Android and native checks use the identical source tree.')
          DIFF
      - name: Write test instructions
        run: |
          cat > Logs83-test-steps.txt <<'STEPS'
          Logs83: Sports catalog preview. Version 2.0.93-test-logs83 (20093).
          Install as an UPDATE to Nuvio TV/Mobile Test. Do not uninstall or clear data.

          1. Open Sports from the normal app menu. Sports now form a horizontal
             menu above league cards. Swipe that menu on mobile or use Left/Right
             on the remote. Disabled sports should not appear in it.
          2. Choose American football, then open the NFL card. Its ESPN logo
             should appear on the league card. Other leagues without supplied
             artwork use a text fallback. Check Basketball > NBA too.
          3. Open a league and check the event-card grid. Team logos should be
             visible without being stretched; cards show names, time/live state,
             scores when supplied and venue. Open a card for event details.
          4. Use Back, search, scrolling and remote grid navigation. Up from the
             first league row returns to the sports menu. Check enlarged text/UI
             sizes. Home, existing collections and Live TV should be unchanged.
          5. In the top Sports button, disable a sport, return and restart.
             It should stay absent. Re-enable it. Choices remain per profile.
          6. Repeat Oklahoma Sooners at North Carolina Tar Heels > Find channels.
             Generic ESPN/ESPN+ channels and channels listing unrelated NFL games
             must NOT appear merely because their names contain ESPN.
          7. For an event explicitly listed in your IPTV guide, Find channels
             should show programmes naming BOTH opponents at a compatible time.
             Check account and channel labels, then open a currently airing match.
             If the guide cannot confirm the event, an empty result is expected.
             Upcoming matches must not start playing before programme time.
          8. Hide a guide category containing a matching channel. Repeat the
             search and confirm hidden categories remain excluded in Sports.
          9. Check favorites on an event and the league's Favorites filter.
             If a match is missing or wrong, send a log with the selected event,
             channel/account, local kickoff and exact guide programme title.

          Existing bounds remain: up to 1024 leagues per sport, 400 events per
          league (current scoreboard plus today and the next six UTC dates),
          and 64 confirmed channel matches. There is no pagination yet.
          ESPN provides metadata and artwork where available; no SportsDB key
          is required. No upstream Sports PR until this build is approved.
          Computer ADB: adb logcat -d -v threadtime > Nuvio-Logs83.txt
          STEPS
          cat > notes.txt <<'NOTES'
          Separate Sports destination using the app's existing UI components.
          Home-style sports menu, league/event cards with ESPN artwork, current and
          upcoming events, scores and per-profile sport
          toggles/favorites. Find channels searches the existing IPTV guide;
          only programmes matching the selected event are returned.
          No video stream is opened or probed while browsing sports metadata.

          Android build and independent APK verification passed. Linux/macOS
          parsing, profile/state and headless UI fixtures passed in normal and
          ASan/UBSan modes (12 invocations). These are not visual/device tests
          or packaged macOS/webOS/Tizen builds. Install as an update and follow
          Logs83-test-steps.txt. No upstream Sports PR has been published.
          NOTES
      - name: Publish verified preview
        run: |
          gh release create tv-mobile-test-logs-v83 Nuvio-TV-Mobile-Test-Logs83.apk Logs83-validation.json Logs83-independent-verification.json Logs83-test-steps.txt --target "$SOURCE_SHA" --title 'TV/Mobile Test Logs83: Sports cards and exact event matches' --notes-file notes.txt --prerelease
