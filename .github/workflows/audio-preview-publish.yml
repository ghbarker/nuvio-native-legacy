name: Publish verified Logs93 integration preview
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ghbarker/nuvio-native-legacy
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Require pinned successful Android build
        run: |
          gh api repos/$GH_REPO/actions/runs/39539485335 > android-run.json
          python3 - <<'CHECK'
          import json
          r=json.load(open('android-run.json'))
          assert r['head_sha']=='f7a343d0cf2f900b0d0a186bdd626d08b81f88fb'
          assert r['status']=='completed' and r['conclusion']=='success'
          CHECK
      - uses: actions/download-artifact@v4
        with:
          name: Nuvio-TV-Mobile-Test-Logs93-f7a343d0cf2f900b0d0a186bdd626d08b81f88fb
          run-id: 39539485335
          github-token: ${{ github.token }}
      - name: Independently verify and publish the APK
        run: |
          python3 -m pip install 'cryptography>=42,<47'
          python3 tools/verify-test-apk.py Nuvio-TV-Mobile-Test-Logs93.apk --expected-sha256 0a5aef25698a50ccfddf603a8a36005ac7043abec86f4aa86ecc7a1224075f6e --expected-bytes 64971387 --version-code 20103 --version-name 2.0.103-test-logs93 --certificate-sha256 862d7ef63a0dbde2929f6f231cae295510726d9ac28f9292496d2a38304be5e6 --output Logs93-independent-verification.json
          python3 - <<'METADATA'
          import json
          p='Logs93-validation.json';v=json.load(open(p))
          assert v['source_commit']=='8f4bef954da75ccf529b6e0c95553930edd1cc09'
          assert v['source_tree']=='64eaa8245f5ad0267bb403df27771db66be6e607'
          v['native_validation_in_progress']=True
          open(p,'w').write(json.dumps(v,indent=2)+'\n')
          METADATA
          gh release create tv-mobile-test-logs-v93 Nuvio-TV-Mobile-Test-Logs93.apk Logs93-validation.json Logs93-independent-verification.json preview-release/Logs93-test-steps.txt --target 8f4bef954da75ccf529b6e0c95553930edd1cc09 --title 'Nuvio TV/Mobile Test Logs93 — latest upstream integration' --notes-file preview-release/Logs93-release-notes.txt --prerelease
