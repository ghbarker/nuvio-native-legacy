name: Publish verified Logs82 Sports preview
on:
  workflow_dispatch:
    inputs:
      android_run_id:
        required: true
        type: string
      native_run_id:
        required: true
        type: string
permissions:
  contents: read
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ghbarker/nuvio-native-legacy
      SOURCE_SHA: c33a7ce71fa68377883672196991e90f5137406d
      SOURCE_TREE: dc9a2d7824757317c18e46e96e4246e9e5d49e9e
      BUILD_CONFIG: 6e015ab26a56467666f1a837e8ef14be76fc6f4e
      NATIVE_CONFIG: 6e015ab26a56467666f1a837e8ef14be76fc6f4e
      NATIVE_SOURCE_SHA: c33a7ce71fa68377883672196991e90f5137406d
      NATIVE_SOURCE_TREE: dc9a2d7824757317c18e46e96e4246e9e5d49e9e
      ANDROID_RUN: ${{ inputs.android_run_id }}
      NATIVE_RUN: ${{ inputs.native_run_id }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify successful pinned checks
        run: |
          python3 - <<'CHECK'
          import json,os,re,subprocess
          api=lambda path:json.loads(subprocess.check_output(['gh','api','repos/'+os.environ['GH_REPO']+'/'+path]))
          for key,path in [('ANDROID_RUN','.github/workflows/logs35-build.yml'),('NATIVE_RUN','.github/workflows/audio-label-checks.yml')]:
              run=os.environ[key];assert re.fullmatch('[0-9]+',run)
              r=api('actions/runs/'+run)
              assert r['status']=='completed' and r['conclusion']=='success'
              assert r['head_sha']==os.environ['BUILD_CONFIG' if key=='ANDROID_RUN' else 'NATIVE_CONFIG'] and r['path']==path
              assert r['head_repository']['full_name']==os.environ['GH_REPO']
              jobs=api('actions/runs/'+run+'/jobs?per_page=100')['jobs']
              assert all(j['conclusion'] in ('success','skipped') for j in jobs)
              if key=='ANDROID_RUN':assert any(j['name']=='apk-build' and j['conclusion']=='success' for j in jobs)
              else:assert len(jobs)==2 and all(j['conclusion']=='success' for j in jobs)
          CHECK
      - uses: actions/download-artifact@v4
        with:
          name: Nuvio-TV-Mobile-Test-Logs82-${{ env.BUILD_CONFIG }}
          run-id: ${{ inputs.android_run_id }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          pattern: integration-*
          path: native-evidence
          run-id: ${{ inputs.native_run_id }}
          github-token: ${{ github.token }}
      - name: Verify APK and native test evidence
        run: |
          python3 -m pip install 'cryptography>=42,<47'
          python3 - <<'VERIFY'
          import hashlib,json,os,pathlib,subprocess
          apk=pathlib.Path('Nuvio-TV-Mobile-Test-Logs82.apk');p=pathlib.Path('Logs82-validation.json');v=json.loads(p.read_text())
          assert v['source_commit']==os.environ['SOURCE_SHA'] and v['source_tree']==os.environ['SOURCE_TREE']
          assert v['workflow_commit']==os.environ['BUILD_CONFIG'] and v['workflow_run_id']==int(os.environ['ANDROID_RUN'])
          assert v['apk_sha256']==hashlib.sha256(apk.read_bytes()).hexdigest() and v['apk_bytes']==apk.stat().st_size
          subprocess.run(['python3','tools/verify-test-apk.py',str(apk),'--expected-sha256',v['apk_sha256'],'--version-code','20092','--version-name','2.0.92-test-logs82','--output','Logs82-independent-verification.json'],check=True)
          dirs={p.name:p for p in pathlib.Path('native-evidence').iterdir() if p.is_dir()}
          assert set(dirs)=={'integration-ubuntu-24.04-sports','integration-macos-15-sports'}
          results=[]
          for d in dirs.values():
              s=json.loads((d/'source.json').read_text());assert s['source_commit']==os.environ['NATIVE_SOURCE_SHA'] and s['source_tree']==os.environ['NATIVE_SOURCE_TREE']
              checks=json.loads((d/'results.json').read_text());assert len(checks)==6 and all(x['code']==0 for x in checks)
              assert {(x['suite'],x['sanitizers']) for x in checks}=={(n,b) for n in ['esportes','esportes_estado','esportes_ui'] for b in [False,True]}
              results+=checks
          v['native_check_source_commit']=os.environ['NATIVE_SOURCE_SHA']
          v['native_check_invocations']=len(results);v['sanitizer_invocations']=sum(x['sanitizers'] for x in results)
          v['check_runs']={'android':int(os.environ['ANDROID_RUN']),'linux_macos':int(os.environ['NATIVE_RUN'])}
          v['validation_note']='Android APK build and independent identity/signature/ABI verification; Linux/macOS sports parsing, state and headless input/guide-match fixtures, normal and ASan/UBSan. These are not packaged macOS/webOS/Tizen builds or visual/device tests.'
          p.write_text(json.dumps(v,indent=2)+'\n')
          VERIFY
      - name: Verify identical Android and native-check product source
        run: |
          git fetch --no-tags --depth=3 origin "$SOURCE_SHA" "$NATIVE_SOURCE_SHA"
          python3 - <<'DIFF'
          import os,subprocess
          changed=set(subprocess.check_output(['git','diff','--name-only',os.environ['SOURCE_SHA'],os.environ['NATIVE_SOURCE_SHA']],text=True).splitlines())
          assert not changed,changed
          print('Android and native checks use the identical source tree.')
          DIFF
      - name: Write test instructions
        run: |
          cat > Logs82-test-steps.txt <<'STEPS'
          Logs82: Sports catalog preview. Version 2.0.92-test-logs82 (20092).
          Install as an UPDATE to Nuvio TV/Mobile Test. Do not uninstall or clear data.

          1. Open the normal navigation menu and choose Sports. On mobile, use
             the existing sidebar gesture/menu. On TV, use the remote arrows.
          2. Open the Sports button at the top. Turn one sport off, go Back and
             confirm it disappears. Restart and check that the choice persists.
             Another profile should retain its own choices. Re-enable it afterward.
          3. Choose Basketball > NBA, or American football > NFL. Events should
             appear without waiting for the entire upcoming schedule to download.
             ESPN supplies current results and the next six days where available.
             An empty or unavailable league must not freeze navigation.
          4. Open an event. Check participants, venue/time and live scores where
             ESPN supplies them. Choose a participant to add/remove a favorite.
             Back on that league's event list, Favorites filters to those teams.
          5. For an event your IPTV guide actually lists, select Find channels.
             Confirmed matches should name BOTH opponents and have a compatible
             programme time. Check the channel and account labels, then open a
             currently airing match. Playback uses the existing Live TV player.
          6. Broader broadcaster suggestions are explicitly labelled unconfirmed.
             A channel carrying a different match in the same league must not be
             presented as a confirmed match. Missing EPG cannot confirm an event.
             Future confirmed events do not play early; use a currently live one.
          7. Test scrolling, Back, search within lists and top controls on phone
             or remote. Check that Sports fits the existing theme, text sizing,
             cards and button style. Existing Home and Live TV should behave normally.
          8. Hide a guide category that contains a matching channel. Repeat Find
             channels and confirm that category stays hidden in Sports too.
          9. Send a log if matching is wrong; include the event, channel/account,
             local kickoff time and the exact EPG programme title shown.

          This first preview uses ESPN; no TheSportsDB key is required. It offers
          16 validated sports categories; other providers can expand coverage later.
          Coverage and live-score freshness depend on ESPN and your loaded EPG.
          Awaiting this APK's approval before any upstream Sports PR.
          Computer ADB: adb logcat -d -v threadtime > Nuvio-Logs82.txt
          STEPS
          cat > notes.txt <<'NOTES'
          Separate Sports destination using the app's existing UI components.
          ESPN leagues, current/upcoming events, scores and per-profile sport
          toggles/favorites. Find channels searches the existing IPTV guide;
          confirmed event matches precede explicitly unconfirmed broadcasters.
          No video stream is opened or probed while browsing sports metadata.

          Android build and independent APK verification passed. Linux/macOS
          parsing, profile/state and headless UI fixtures passed in normal and
          ASan/UBSan modes (12 invocations). These are not visual/device tests
          or packaged macOS/webOS/Tizen builds. Install as an update and follow
          Logs82-test-steps.txt. No upstream Sports PR has been published.
          NOTES
      - name: Publish verified preview
        run: |
          gh release create tv-mobile-test-logs-v82 Nuvio-TV-Mobile-Test-Logs82.apk Logs82-validation.json Logs82-independent-verification.json Logs82-test-steps.txt --target "$SOURCE_SHA" --title 'TV/Mobile Test Logs82: Sports catalog' --notes-file notes.txt --prerelease
