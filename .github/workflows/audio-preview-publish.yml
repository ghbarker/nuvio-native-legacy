name: Publish Logs78 diagnostic APK
on:
  workflow_dispatch:
    inputs:
      android_run_id:
        description: Successful diagnostics-only Android build run
        required: true
        type: string
permissions:
  contents: read
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      actions: read
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ghbarker/nuvio-native-legacy
      SOURCE_SHA: f1c7fe38f0f257b9b98dd7dba8634fa29d0b1796
      SOURCE_TREE: 07c014e08e6fdb692f9cec1bb5cda91ef7e2fef7
      ANDROID_CONFIG_COMMIT: 81a972d8472e32f9d10ab7b6794d48c040ec7e17
      ANDROID_RUN: ${{ inputs.android_run_id }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install APK signature verifier dependency
        run: python3 -m pip install 'cryptography>=42,<47'
      - name: Verify exact successful build
        run: |
          python3 - <<'PY'
          import json,os,re,subprocess
          run=os.environ['ANDROID_RUN']
          assert re.fullmatch(r'[0-9]+',run)
          repo='repos/ghbarker/nuvio-native-legacy/'
          api=lambda path:json.loads(subprocess.check_output(['gh','api',repo+path]))
          data=api('actions/runs/'+run)
          assert data['status']=='completed' and data['conclusion']=='success'
          assert data['head_sha']==os.environ['ANDROID_CONFIG_COMMIT']
          assert data['path']=='.github/workflows/logs35-build.yml'
          assert data['head_repository']['full_name']=='ghbarker/nuvio-native-legacy'
          jobs=api('actions/runs/'+run+'/jobs?per_page=100')['jobs']
          assert any(j['name']=='apk-build' and j['conclusion']=='success' for j in jobs)
          assert all(j['conclusion'] in ('success','skipped') for j in jobs)
          PY
      - uses: actions/download-artifact@v4
        with:
          name: Nuvio-TV-Mobile-Test-Logs78-${{ env.ANDROID_CONFIG_COMMIT }}
          run-id: ${{ inputs.android_run_id }}
          github-token: ${{ github.token }}
      - name: Verify APK signature, identity, version and ARM libraries
        run: |
          python3 - <<'PY'
          import hashlib,json,os,pathlib,subprocess
          apk=pathlib.Path('Nuvio-TV-Mobile-Test-Logs78.apk')
          p=pathlib.Path('Logs78-validation.json');data=json.loads(p.read_text())
          assert data['source_commit']==os.environ['SOURCE_SHA']
          assert data['source_tree']==os.environ['SOURCE_TREE']
          assert data['workflow_commit']==os.environ['ANDROID_CONFIG_COMMIT']
          assert data['workflow_run_id']==int(os.environ['ANDROID_RUN'])
          assert data['apk_sha256']==hashlib.sha256(apk.read_bytes()).hexdigest()
          assert data['apk_bytes']==apk.stat().st_size
          assert data['android_unit_tests']==[] and data['tests_skipped_by_request']
          subprocess.run(['python3','tools/verify-test-apk.py',str(apk),'--expected-sha256',data['apk_sha256'],'--version-code','20088','--version-name','2.0.88-test-logs78','--output','Logs78-independent-verification.json'],check=True)
          data['validation_note']='Android build and APK packaging/signature verification only. Test suites skipped at user request. No new playback recovery changes.'
          p.write_text(json.dumps(data,indent=2)+'\n')
          PY
      - name: Write instructions
        run: |
          cat > Logs78-test-steps.txt <<'STEPS'
          Logs78: Live TV diagnostics only
          Version 2.0.88-test-logs78 (20088).

          Install as an UPDATE to Nuvio TV/Mobile Test. Do not uninstall or clear data.
          This keeps Logs77 playback behavior. The proposed stuck/403 retries are excluded.

          1. Keep your current Live TV buffer setting. Play an affected channel for
             10-15 minutes, or until a repeat, pause or error occurs.
          2. Note the approximate time and channel. Export the log promptly before
             closing the app. If playback is smooth, that log is useful too.
          3. Send the log and say whether the picture paused, repeated, jumped,
             or showed an error while audio continued.

          App: use Download log or View log.
          Phone ADB shell app: logcat -d -v threadtime
          Computer: adb logcat -d -v threadtime > Nuvio-Live-Logs78.txt

          New live-request lines identify repeated requests with session-salted
          fingerprints and record buffer at first failure, current buffer, failure
          count, manifest sequence and request timing. Live-playlist lines explain
          refresh rejection. The new entries contain no raw URLs or credentials.

          Android compilation and APK identity/signature/ARM checks passed.
          Test suites were skipped as requested; no functional test pass is claimed.
          STEPS
          cat > notes.txt <<'NOTES'
          Adds privacy-safe Live TV request and playlist diagnostics to Logs77.
          Keeps its playback/recovery behavior; the experimental stuck/403 retries
          are excluded. Test-only changes are not being published to the upstream PR.

          Install as an update to retain accounts and settings. Persistent signing,
          package, increased version code, both ARM ABIs and 16-KiB ARM64 alignment
          verified. Test suites skipped at user request.
          Follow Logs78-test-steps.txt and send the captured log.
          NOTES
      - name: Publish diagnostic download
        run: |
          gh release create tv-mobile-test-logs-v78 Nuvio-TV-Mobile-Test-Logs78.apk Logs78-validation.json Logs78-independent-verification.json Logs78-test-steps.txt --target "$SOURCE_SHA" --title 'TV/Mobile Test Logs78: Live TV diagnostics' --notes-file notes.txt --prerelease
