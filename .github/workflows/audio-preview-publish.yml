name: Publish verified Logs79 season tabs APK
on:
  workflow_dispatch:
    inputs:
      android_run_id:
        description: Successful Logs79 Android build run
        required: true
        type: string
      native_run_id:
        description: Successful Logs79 Linux/macOS metadata checks
        required: true
        type: string
permissions:
  contents: read
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      actions: read
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ghbarker/nuvio-native-legacy
      SOURCE_SHA: bfcc4737b42e6bff77105f1b32ecea311b311762
      SOURCE_TREE: 814c6a09216a2a7a1c6960bf3867351ec22f5142
      ANDROID_CONFIG_COMMIT: 411b8d6a3eb47b35a38440666f5892c6f7dca83a
      NATIVE_CONFIG_COMMIT: 0fa4c31de3e5536ff417bdfd36c238b920e655f5
      NATIVE_SOURCE_SHA: c088e5514488220c3aff1c331a1f7873ee8bd5ec
      NATIVE_SOURCE_TREE: 05a3d2c58e89816e060cfb05bfcc95936931c83c
      ANDROID_RUN: ${{ inputs.android_run_id }}
      NATIVE_RUN: ${{ inputs.native_run_id }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install APK signature verifier dependency
        run: python3 -m pip install 'cryptography>=42,<47'
      - name: Verify exact successful build
        run: |
          python3 - <<'PY'
          import json,os,re,subprocess
          run=os.environ['ANDROID_RUN']
          assert re.fullmatch(r'[0-9]+',run)
          repo='repos/ghbarker/nuvio-native-legacy/'
          api=lambda path:json.loads(subprocess.check_output(['gh','api',repo+path]))
          data=api('actions/runs/'+run)
          assert data['status']=='completed' and data['conclusion']=='success'
          assert data['head_sha']==os.environ['ANDROID_CONFIG_COMMIT']
          assert data['path']=='.github/workflows/logs35-build.yml'
          assert data['head_repository']['full_name']=='ghbarker/nuvio-native-legacy'
          jobs=api('actions/runs/'+run+'/jobs?per_page=100')['jobs']
          assert any(j['name']=='apk-build' and j['conclusion']=='success' for j in jobs)
          assert all(j['conclusion'] in ('success','skipped') for j in jobs)
          run=os.environ['NATIVE_RUN'];assert re.fullmatch(r'[0-9]+',run)
          data=api('actions/runs/'+run)
          assert data['status']=='completed' and data['conclusion']=='success'
          assert data['head_sha']==os.environ['NATIVE_CONFIG_COMMIT']
          assert data['path']=='.github/workflows/audio-label-checks.yml'
          assert data['head_repository']['full_name']=='ghbarker/nuvio-native-legacy'
          jobs=api('actions/runs/'+run+'/jobs?per_page=100')['jobs']
          assert len(jobs)==2 and all(j['conclusion']=='success' for j in jobs)
          PY
      - uses: actions/download-artifact@v4
        with:
          name: Nuvio-TV-Mobile-Test-Logs79-${{ env.ANDROID_CONFIG_COMMIT }}
          run-id: ${{ inputs.android_run_id }}
          github-token: ${{ github.token }}
      - name: Download native metadata evidence
        uses: actions/download-artifact@v4
        with:
          pattern: integration-*
          path: native-evidence
          run-id: ${{ inputs.native_run_id }}
          github-token: ${{ github.token }}
      - name: Verify APK signature, identity, version and ARM libraries
        run: |
          python3 - <<'PY'
          import hashlib,json,os,pathlib,subprocess
          apk=pathlib.Path('Nuvio-TV-Mobile-Test-Logs79.apk')
          p=pathlib.Path('Logs79-validation.json');data=json.loads(p.read_text())
          assert data['source_commit']==os.environ['SOURCE_SHA']
          assert data['source_tree']==os.environ['SOURCE_TREE']
          assert data['workflow_commit']==os.environ['ANDROID_CONFIG_COMMIT']
          assert data['workflow_run_id']==int(os.environ['ANDROID_RUN'])
          assert data['apk_sha256']==hashlib.sha256(apk.read_bytes()).hexdigest()
          assert data['apk_bytes']==apk.stat().st_size
          assert data['android_unit_tests']==[] and not data['tests_skipped_by_request']
          subprocess.run(['python3','tools/verify-test-apk.py',str(apk),'--expected-sha256',data['apk_sha256'],'--version-code','20089','--version-name','2.0.89-test-logs79','--output','Logs79-independent-verification.json'],check=True)
          dirs={p.name:p for p in pathlib.Path('native-evidence').iterdir() if p.is_dir()}
          assert set(dirs)=={'integration-'+system+'-season-metadata' for system in ('ubuntu-24.04','macos-15')}
          results=[]
          for directory in dirs.values():
              source=json.loads((directory/'source.json').read_text())
              assert source['source_commit']==os.environ['NATIVE_SOURCE_SHA'] and source['source_tree']==os.environ['NATIVE_SOURCE_TREE']
              checks=json.loads((directory/'results.json').read_text())
              assert len(checks)==6 and all(c['code']==0 for c in checks)
              assert {(c['suite'],c['sanitizers']) for c in checks}=={(n,b) for n in ('episodiosdup','epsrapido','detalheanime') for b in (False,True)}
              results.extend(checks)
          data['native_check_source_commit']=os.environ['NATIVE_SOURCE_SHA']
          data['native_metadata_check_invocations']=len(results)
          data['sanitizer_invocations']=sum(c['sanitizers'] for c in results)
          data['check_runs']={'android':int(os.environ['ANDROID_RUN']),'linux_macos':int(os.environ['NATIVE_RUN'])}
          data['validation_note']='Android build and APK identity verification; Linux/macOS native metadata tests normal and ASan/UBSan. These are not packaged macOS/webOS/Tizen application builds.'
          p.write_text(json.dumps(data,indent=2)+'\n')
          PY
      - name: Verify repaired test inputs preserve the built product source
        run: |
          git fetch --no-tags --depth=5 origin "$SOURCE_SHA" "$NATIVE_SOURCE_SHA"
          python3 - <<'PY'
          import os,subprocess
          changed=set(subprocess.check_output(['git','diff','--name-only',os.environ['SOURCE_SHA'],os.environ['NATIVE_SOURCE_SHA']],text=True).splitlines())
          assert changed=={'tests/epsrapido.sh','tests/detalheanime.sh'},changed
          print('Product source unchanged; native evidence uses repaired test link inputs.')
          PY
      - name: Write instructions
        run: |
          cat > Logs79-test-steps.txt <<'STEPS'
          Logs79: publish season tabs with episode cards
          Version 2.0.89-test-logs79 (20089).

          Install as an UPDATE to Nuvio TV/Mobile Test. Keep your accounts and settings;
          do not uninstall or clear app data.

          1. Open Game of Thrones. Once episode cards appear, season buttons should
             also be present. Expect regular seasons 1-8; Specials depends on the
             metadata source supplying season 0.
          2. Select season 1, then season 8. Check that the episode cards switch to
             the selected season (10 episodes in S1 and 6 in S8 with standard metadata).
          3. Leave the title page and reopen it. The buttons must remain available.
             Also close/reopen the app and check the saved/cached title.
          4. Open a series whose Specials previously worked. Confirm season 0 and
             its episodes are still accessible.
          5. If buttons are missing, save a log immediately after opening the page
             and note whether episode cards were already visible.

          App: Download log or View log.
          Phone ADB shell app: logcat -d -v threadtime
          Computer: adb logcat -d -v threadtime > Nuvio-Logs79.txt

          Android build, persistent signer, identity/version, both ARM ABIs and
          ARM64 16-KiB alignment verified. Linux/macOS native metadata tests passed
          normally and under ASan/UBSan (12 invocations). No packaged desktop/TV
          build is claimed. Awaiting device approval before publishing a product PR.
          STEPS
          cat > notes.txt <<'NOTES'
          Fixes episode cards appearing without season buttons. Every selected
          episode-list publication now updates the matching season tabs; cached
          lists with missing tabs are allowed to refresh on reopening.

          Before/after reproduction with public Game of Thrones metadata:
          73 episodes / zero published tabs becomes 73 episodes / eight tabs.
          Cinemeta also preserves season 0 when specials are provided.

          Android build and independent APK signing/package/version/ARM checks
          passed. Twelve Linux/macOS native metadata test invocations passed,
          including six under ASan/UBSan. Native checks are not packaged macOS,
          webOS or Tizen builds.

          Install as an update to keep accounts and settings. Follow Logs79-test-steps.txt.
          Awaiting device approval before a product PR. Test packaging and local
          diagnostics stay outside the product change.
          NOTES
      - name: Publish diagnostic download
        run: |
          gh release create tv-mobile-test-logs-v78 Nuvio-TV-Mobile-Test-Logs79.apk Logs79-validation.json Logs79-independent-verification.json Logs79-test-steps.txt --target "$SOURCE_SHA" --title 'TV/Mobile Test Logs79: Restore season buttons' --notes-file notes.txt --prerelease
