name: Publish verified Logs69 combined test APK
on:
  workflow_dispatch:
    inputs:
      android_run_id:
        description: Successful Logs69 Android APK workflow run ID
        required: true
        type: string
      native_run_id:
        description: Successful 2-job Logs68 native backup workflow run ID (unchanged C sources)
        required: true
        type: string
      apk_sha256:
        description: SHA256 of the downloaded and independently verified APK
        required: true
        type: string
permissions:
  contents: read
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      actions: read
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ghbarker/nuvio-native-legacy
      SOURCE_SHA: 8046d1835a0bf12f3eaea9a0503e01553b994ca0
      SOURCE_TREE: 1483d11dcd85e25079b0c4caef671e22ee5ea093
      # Android is already building this exact immutable source; retain it.
      ANDROID_CONFIG_COMMIT: ${{ github.sha }}
      NATIVE_CONFIG_COMMIT: 2c357859de53284b86ac7c9a39c2238f499fe9df
      NATIVE_SOURCE_SHA: 9e23de2c6b2eee6ed631486b89dc33b93fdfbce7
      NATIVE_SOURCE_TREE: a5b82ebf5bac95019d8363cd2915f52ad793f8e4
      ANDROID_RUN: ${{ inputs.android_run_id }}
      NATIVE_RUN: ${{ inputs.native_run_id }}
      APK_SHA256: ${{ inputs.apk_sha256 }}
    steps:
      - name: Require the exact successful Android and native workflow runs
        run: |
          python3 - <<'VERIFY'
          import json,os,re,subprocess
          repo='ghbarker/nuvio-native-legacy'
          api=lambda path:json.loads(subprocess.check_output(['gh','api','repos/'+repo+'/'+path]))
          assert re.fullmatch(r'[0-9a-f]{40}',os.environ['SOURCE_SHA'])
          assert re.fullmatch(r'[0-9a-f]{40}',os.environ['SOURCE_TREE'])
          assert re.fullmatch(r'[0-9a-f]{64}',os.environ['APK_SHA256'])
          comparison=api('compare/'+os.environ['NATIVE_SOURCE_SHA']+'...'+os.environ['SOURCE_SHA'])
          allowed={'android/app/build.gradle.kts','android/app/src/main/java/space/nuvio/nativelegacy/NvPlayer.kt','android/app/src/main/java/space/nuvio/nativelegacy/LiveSegmentTrace.kt','android/app/src/test/java/space/nuvio/nativelegacy/LiveSegmentTraceTest.kt'}
          assert comparison['status']=='ahead' and comparison['total_commits']==1
          assert {file['filename'] for file in comparison['files']}==allowed,'Native evidence is reusable only with unchanged native sources'
          for name,path in [('ANDROID_RUN','.github/workflows/logs35-build.yml'),('NATIVE_RUN','.github/workflows/audio-label-checks.yml')]:
              run=os.environ[name];assert re.fullmatch(r'[0-9]+',run)
              data=api('actions/runs/'+run)
              assert data['status']=='completed' and data['conclusion']=='success',(name,data['status'],data['conclusion'])
              expected_config=os.environ['NATIVE_CONFIG_COMMIT' if name=='NATIVE_RUN' else 'ANDROID_CONFIG_COMMIT']
              assert data['head_sha']==expected_config,(name,'Unexpected fork CI configuration commit')
              assert data['path']==path,(name,data['path'])
              assert data['head_repository']['full_name']==repo
              jobs=api('actions/runs/'+run+'/jobs?per_page=100')['jobs']
              if name=='NATIVE_RUN':
                  assert len(jobs)==2 and all(job['conclusion']=='success' for job in jobs),'Both native jobs must pass'
              else:
                  assert len(jobs)==2 and any(job['name']=='apk-build' and job['conclusion']=='success' for job in jobs)
                  assert all(job['conclusion'] in ('success','skipped') for job in jobs)
          VERIFY
      - name: Download exact Android artifact
        uses: actions/download-artifact@v4
        with:
          name: Nuvio-TV-Mobile-Test-Logs69-${{ env.ANDROID_CONFIG_COMMIT }}
          run-id: ${{ inputs.android_run_id }}
          github-token: ${{ github.token }}
      - name: Download all native evidence
        uses: actions/download-artifact@v4
        with:
          pattern: integration-*
          path: native-evidence
          run-id: ${{ inputs.native_run_id }}
          github-token: ${{ github.token }}
      - name: Verify bytes, source, identity and actual test results
        run: |
          python3 - <<'VERIFY'
          import hashlib,json,os,pathlib,zipfile
          apk=pathlib.Path('Nuvio-TV-Mobile-Test-Logs69.apk')
          expected=os.environ['APK_SHA256']
          assert hashlib.sha256(apk.read_bytes()).hexdigest()==expected
          validation=pathlib.Path('Logs69-validation.json');data=json.loads(validation.read_text())
          assert data['apk_sha256']==expected and data['apk_bytes']==apk.stat().st_size
          assert data['source_commit']==os.environ['SOURCE_SHA'] and data['source_tree']==os.environ['SOURCE_TREE']
          assert data['workflow_commit']==os.environ['ANDROID_CONFIG_COMMIT'] and data['workflow_run_id']==int(os.environ['ANDROID_RUN'])
          assert data['package']=='space.nuvio.nativelegacy.touch' and data['version_code']==20079
          assert data['version_name']=='2.0.79-test-logs69'
          assert data['certificate_sha256']=='862d7ef63a0dbde2929f6f231cae295510726d9ac28f9292496d2a38304be5e6'
          assert data['android_build'] and data['both_arm_abis'] and data['arm64_16kb_alignment']
          assert set(data['android_unit_tests'])=={'LiveWindowRecoveryTest','ParaleloDataSourceTest','FontImportTest','DriveAuthStateTest','LiveSegmentTraceTest'}
          assert set(data['included_prs'])=={573,575,576,587,596,597,598,601,602,609,611}
          with zipfile.ZipFile(apk) as archive:
              assert archive.testzip() is None
              assert {name.split('/')[1] for name in archive.namelist() if name.startswith('lib/') and name.endswith('.so')}=={'arm64-v8a','armeabi-v7a'}
          groups={'backup-drive'}
          expected_artifacts={'integration-'+system+'-'+group for system in ('ubuntu-24.04','macos-15') for group in groups}
          directories={p.name:p for p in pathlib.Path('native-evidence').iterdir() if p.is_dir()}
          assert set(directories)==expected_artifacts,'Missing or unexpected native evidence'
          invocations=[]
          for name,directory in directories.items():
              source=json.loads((directory/'source.json').read_text())
              assert source['source_commit']==os.environ['NATIVE_SOURCE_SHA'] and source['source_tree']==os.environ['NATIVE_SOURCE_TREE'],name
              results=json.loads((directory/'results.json').read_text())
              assert results and all(result['code']==0 for result in results),name
              invocations.extend(results)
          data.update(android_build=True,linux_native_checks=True,macos_native_checks=True,native_matrix_jobs=2,native_suite_invocations=len(invocations),sanitizer_suite_invocations=sum(result['sanitizers'] for result in invocations))
          data['check_configuration_commits']={'android':os.environ['ANDROID_CONFIG_COMMIT'],'linux_macos':os.environ['NATIVE_CONFIG_COMMIT']}
          data['check_runs']={'android':int(os.environ['ANDROID_RUN']),'linux_macos':int(os.environ['NATIVE_RUN'])}
          data['translation_lint']='No added diagnostics against unchanged upstream415544; baseline contains pre-existing empty translations.'
          data['native_source_commit']=os.environ['NATIVE_SOURCE_SHA']
          data['native_source_tree']=os.environ['NATIVE_SOURCE_TREE']
          data['native_checks_note']='Retains Logs68 normal/ASan+UBSan checks on identical native source files; guarded comparison permits only the four Android diagnostic/packaging files. Not macOS, webOS or Tizen packaged builds.'
          validation.write_text(json.dumps(data,indent=2)+'\n')
          VERIFY
      - name: Write release inventory and instructions
        run: |
          python3 - <<'INVENTORY'
          import json,os,pathlib
          items=[{'number': 573, 'title': 'Fonts: import local TTF/OTF for subtitles and interface', 'url': 'https://github.com/iqui27/nuvio-native-legacy/pull/573'}, {'number': 575, 'title': 'Sources: add persistent cached/uncached filtering', 'url': 'https://github.com/iqui27/nuvio-native-legacy/pull/575'}, {'number': 576, 'title': 'Episodes: keep canonical identity after metadata updates', 'url': 'https://github.com/iqui27/nuvio-native-legacy/pull/576'}, {'number': 587, 'title': 'Live TV: bypass source filters and add per-add-on overrides', 'url': 'https://github.com/iqui27/nuvio-native-legacy/pull/587'}, {'number': 596, 'title': 'Live TV: add M3U, multiple accounts and responsive EPG loading', 'url': 'https://github.com/iqui27/nuvio-native-legacy/pull/596'}, {'number': 597, 'title': 'Live TV: prevent false stall restarts and recover expired live windows', 'url': 'https://github.com/iqui27/nuvio-native-legacy/pull/597'}, {'number': 598, 'title': 'Details: show prepared-source specifications below Play', 'url': 'https://github.com/iqui27/nuvio-native-legacy/pull/598'}, {'number': 601, 'title': 'Live TV: fix large category lists and category Confirm/Cancel', 'url': 'https://github.com/iqui27/nuvio-native-legacy/pull/601'}, {'number': 602, 'title': 'Live TV: keep repeated search results visible and responsive', 'url': 'https://github.com/iqui27/nuvio-native-legacy/pull/602'}, {'number': 609, 'title': 'Backup: add encrypted Google Drive backup and restore for local settings', 'url': 'https://github.com/iqui27/nuvio-native-legacy/pull/609'}, {'number': 611, 'title': 'Sources: match audio-language filters against release labels', 'url': 'https://github.com/iqui27/nuvio-native-legacy/pull/611'}]
          pathlib.Path('Logs69-inventory.json').write_text(json.dumps({'integration_base':'4155445395a94cbd40a9f1f9558311e3ebb26da0','source_commit':os.environ['SOURCE_SHA'],'source_tree':os.environ['SOURCE_TREE'],'approved_feature_prs':items,'integration_note':'Newest upstream development plus the11approved features, adapted together to the source-keyed streaming Live TV guide. This combined test APK is awaiting device testing.'},indent=2)+'\n')
          INVENTORY
          cat > Logs69-test-steps.txt <<'TESTSTEPS'
          Logs69 — live segment diagnostics and corrected backup menu

          Install Nuvio-TV-Mobile-Test-Logs69.apk as an UPDATE to Nuvio TV/Mobile Test.
          Do not uninstall or clear data. Version: 2.0.79-test-logs69 (20079).
          This retains all changes in Logs68 and adds bounded numeric HLS diagnostics. No new playback fix is claimed.

          1. On the TV, open Settings > Google Drive backup.
          2. Move up and down through every option. The focused row should have a
             rounded highlight behind its text, using the same accent as Settings.
             No displaced circle should appear to the right.
          3. Choose Restore backup and select an existing backup.
          4. The password screen should say: Enter the password you used to create
             this backup. Enter that original password, not a new one.
          5. Check that the restore confirmation has the same clean row highlighting.
             You can cancel here without restoring settings.
          6. Choose Back up now. Its prompt should still say to create a password,
             then confirm it. Cancel if you do not need another backup.
          7. Check the same menu on your phone; choices and text should remain usable.

          Live TV replay check:
          1. On the affected Ugoos, open the same channel in Nuvio.
          2. Watch until the picture/audio repeats. Note the clock time.
          3. Leave the channel playing for another 20 seconds, then save a fresh log.
          4. Send the log with the channel name and the other player that works.
          5. The added [live-segments] lines record segment time ranges and playlist
             sequence numbers. URLs, credentials and media payloads are excluded.
          No product PR update is included in this test release.
          TESTSTEPS
          cat > notes.txt <<'NOTES'
          Install as an UPDATE to Nuvio TV/Mobile Test. Do not uninstall or clear data.

          Fixes the misplaced TV backup-menu focus highlight and uses the Settings accent with contrasting text. Restore now explicitly asks for the password used to create the selected backup, with translated guidance.

          Adds a bounded, numeric HLS segment trace for the repeat/jump investigation, including playlist sequence and segment time ranges. No URLs, credentials or payloads are logged. This is diagnostic instrumentation, not a new playback fix. Retains the Logs68 backup menu and password guidance fixes.

          Android build/unit checks passed, including segment-history bounds and rate limiting. Retains successful Linux/macOS Drive backup normal/ASan+UBSan checks on unchanged native sources; publishing verifies the changes are limited to four Android diagnostic/packaging files. Native checks are not packaged macOS/webOS/Tizen builds.

          Please follow the attached TV and phone verification steps before the product PR is updated.
          NOTES
      - name: Publish verified update APK
        run: |
          gh release create tv-mobile-test-logs-v69 Nuvio-TV-Mobile-Test-Logs69.apk Logs69-validation.json Logs69-inventory.json Logs69-test-steps.txt --target "$SOURCE_SHA" --title 'TV/Mobile Test Logs69: live segment trace and backup menu' --notes-file notes.txt --prerelease
