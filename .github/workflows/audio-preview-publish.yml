name: Publish verified Logs91 artwork cache preview
on:
  push:
    branches: [review/logs34-integration-20261017]
    paths: [.github/workflows/audio-preview-publish.yml]
  workflow_dispatch:
    inputs:
      android_run_id:
        required: true
        type: string
      native_run_id:
        required: true
        type: string
permissions:
  contents: read
jobs:
  publish:
    if: github.event_name != 'push' || contains(github.event.head_commit.message, '[publish-logs91]')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ghbarker/nuvio-native-legacy
      SOURCE_SHA: 5ab3c53d1d89c8f757d4d9331834df8072e8c901
      SOURCE_TREE: d53c228d2ad9be32572c222408e267ba2851ec2a
      BUILD_CONFIG: a3b88045bffddca43aad9780f31ec5dc6bad5a74
      NATIVE_CONFIG: a3b88045bffddca43aad9780f31ec5dc6bad5a74
      NATIVE_SOURCE_SHA: 5ab3c53d1d89c8f757d4d9331834df8072e8c901
      NATIVE_SOURCE_TREE: d53c228d2ad9be32572c222408e267ba2851ec2a
      ANDROID_RUN: ${{ inputs.android_run_id || '39429538289' }}
      NATIVE_RUN: ${{ inputs.native_run_id || '39429537222' }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Wait for the pinned checks
        run: |
          python3 - <<'WAIT'
          import json,os,subprocess,time
          for key,config in [('ANDROID_RUN','BUILD_CONFIG'),('NATIVE_RUN','NATIVE_CONFIG')]:
              for attempt in range(60):
                  r=json.loads(subprocess.check_output(['gh','api','repos/'+os.environ['GH_REPO']+'/actions/runs/'+os.environ[key]]))
                  assert r['head_sha']==os.environ[config]
                  if r['status']=='completed':
                      assert r['conclusion']=='success',r['conclusion']
                      break
                  print(key,r['status'],flush=True)
                  time.sleep(10)
              else:raise RuntimeError(key+' did not finish in time')
          WAIT
      - name: Verify successful pinned checks
        run: |
          python3 - <<'CHECK'
          import json,os,re,subprocess
          api=lambda path:json.loads(subprocess.check_output(['gh','api','repos/'+os.environ['GH_REPO']+'/'+path]))
          for key,path in [('ANDROID_RUN','.github/workflows/logs35-build.yml'),('NATIVE_RUN','.github/workflows/audio-label-checks.yml')]:
              run=os.environ[key];assert re.fullmatch('[0-9]+',run)
              r=api('actions/runs/'+run)
              assert r['status']=='completed' and r['conclusion']=='success'
              assert r['head_sha']==os.environ['BUILD_CONFIG' if key=='ANDROID_RUN' else 'NATIVE_CONFIG'] and r['path']==path
              assert r['head_repository']['full_name']==os.environ['GH_REPO']
              jobs=api('actions/runs/'+run+'/jobs?per_page=100')['jobs']
              assert all(j['conclusion'] in ('success','skipped') for j in jobs)
              if key=='ANDROID_RUN':assert any(j['name']=='apk-build' and j['conclusion']=='success' for j in jobs)
              else:assert len(jobs)==2 and all(j['conclusion']=='success' for j in jobs)
          CHECK
      - uses: actions/download-artifact@v4
        with:
          name: Nuvio-TV-Mobile-Test-Logs91-${{ env.BUILD_CONFIG }}
          run-id: ${{ env.ANDROID_RUN }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          pattern: integration-*
          path: native-evidence
          run-id: ${{ env.NATIVE_RUN }}
          github-token: ${{ github.token }}
      - name: Verify APK and native test evidence
        run: |
          python3 -m pip install 'cryptography>=42,<47'
          python3 - <<'VERIFY'
          import hashlib,json,os,pathlib,subprocess
          apk=pathlib.Path('Nuvio-TV-Mobile-Test-Logs91.apk');p=pathlib.Path('Logs91-validation.json');v=json.loads(p.read_text())
          assert v['source_commit']==os.environ['SOURCE_SHA'] and v['source_tree']==os.environ['SOURCE_TREE']
          assert v['workflow_commit']==os.environ['BUILD_CONFIG'] and v['workflow_run_id']==int(os.environ['ANDROID_RUN'])
          assert v['apk_sha256']==hashlib.sha256(apk.read_bytes()).hexdigest() and v['apk_bytes']==apk.stat().st_size
          subprocess.run(['python3','tools/verify-test-apk.py',str(apk),'--expected-sha256',v['apk_sha256'],'--version-code','20101','--version-name','2.0.101-test-logs91','--output','Logs91-independent-verification.json'],check=True)
          dirs={p.name:p for p in pathlib.Path('native-evidence').iterdir() if p.is_dir()}
          assert set(dirs)=={'integration-ubuntu-24.04-artwork-cache','integration-macos-15-intel-artwork-cache'}
          results=[]
          for d in dirs.values():
              s=json.loads((d/'source.json').read_text());assert s['source_commit']==os.environ['NATIVE_SOURCE_SHA'] and s['source_tree']==os.environ['NATIVE_SOURCE_TREE']
              checks=json.loads((d/'results.json').read_text());assert len(checks)==2 and all(x['code']==0 for x in checks)
              assert {(x['suite'],x['sanitizers']) for x in checks}=={(n,b) for n in ['cache_android'] for b in [False,True]}
              results+=checks
          v['native_check_source_commit']=os.environ['NATIVE_SOURCE_SHA']
          v['native_check_invocations']=len(results);v['sanitizer_invocations']=sum(x['sanitizers'] for x in results)
          v['check_runs']={'android':int(os.environ['ANDROID_RUN']),'linux_macos':int(os.environ['NATIVE_RUN'])}
          v['validation_note']='Android APK build and independent package/signature/ABI verification; artwork migration, cache clearing, protected file pruning and retry fixtures, normal and ASan/UBSan on Linux/macOS Intel (4 runs). Not packaged macOS/webOS/Tizen builds or Android device tests.'
          p.write_text(json.dumps(v,indent=2)+'\n')
          VERIFY
      - name: Verify identical Android and native-check product source
        run: |
          git fetch --no-tags --depth=3 origin "$SOURCE_SHA" "$NATIVE_SOURCE_SHA"
          python3 - <<'DIFF'
          import os,subprocess
          changed=set(subprocess.check_output(['git','diff','--name-only',os.environ['SOURCE_SHA'],os.environ['NATIVE_SOURCE_SHA']],text=True).splitlines())
          assert not changed,changed
          print('Android and native checks use the identical source tree.')
          DIFF
      - name: Write test instructions
        run: |
          cat > Logs91-test-steps.txt <<'STEPS'
          Logs91: Android clearable artwork cache.
          Version 2.0.101-test-logs91 (20101).
          Install as an UPDATE to Nuvio TV/Mobile Test. Do not uninstall.

          1. Before updating, note Android Settings > Apps > Nuvio TV/Mobile Test >
             Storage: Total, User data and Cache. Take a photo if convenient.
          2. Install this APK over the test app, open it once and browse several
             collections/title pages. Confirm accounts, preferences and artwork.
             The existing artwork cache moves automatically on this first launch.
          3. Force stop the app. Reopen Android's Storage page and check Cache.
             Cached artwork should now count there rather than as User data.
             Android may take a short time to refresh the numbers.
          4. Tap CLEAR CACHE only. Do NOT tap Clear data/storage: that resets accounts.
             The Cache figure should fall, along with total storage used.
          5. Reopen the app. Accounts/settings should still be present. Artwork will
             download again as needed. Browse and confirm it returns normally.
          6. Repeat Clear cache once to verify the recreated cache remains clearable.

          This addresses artwork placement, not every byte of User data. Settings,
          accounts, installed assets and other persistent files still use User data.
          Existing artwork disk limits and pruning remain unchanged.
          All Logs90 features remain included. No upstream PR before approval.
          If anything fails, share before/after storage figures and a fresh app log.
          ADB: adb logcat -d -v threadtime > Nuvio-Logs91.txt
          STEPS
          cat > notes.txt <<'NOTES'
          Moves downloaded artwork to Android's clearable cache directory, safely
          migrating existing recognized images while preserving accounts/settings.
          Keeps Logs90 features. Update Nuvio TV/Mobile Test without uninstalling.

          Checks: Android build, package/signer/ARM ABI verification and four headless
          Linux/macOS Intel migration/pruning checks (normal and ASan/UBSan).
          These are not packaged macOS/webOS/Tizen builds or Android device tests.
          See Logs91-test-steps.txt for exact storage and account-preservation checks.
          NOTES
      - name: Publish verified preview
        run: |
          gh release create tv-mobile-test-logs-v91 Nuvio-TV-Mobile-Test-Logs91.apk Logs91-validation.json Logs91-independent-verification.json Logs91-test-steps.txt --target "$SOURCE_SHA" --title 'TV/Mobile Test Logs91: clearable artwork cache' --notes-file notes.txt --prerelease
