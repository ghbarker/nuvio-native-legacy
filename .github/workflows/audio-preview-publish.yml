name: Export issue687 partial Android emulator diagnostics
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ghbarker/nuvio-native-legacy
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Issue687-Android-emulator-results-e62a843576b95accd980d9afd7b468d223a538b0
          run-id: 40016952101
          github-token: ${{ github.token }}
          path: evidence
      - name: Export failed Home scenario and completed case evidence
        run: |
          cp evidence/home-autoplay-french/logcat.txt home-autoplay-logcat.txt
          cp evidence/home-autoplay-french/04-final-diagnostic.png home-autoplay-diagnostic.png
          cp evidence/summary.json partial-results.json
          zip -qr partial-evidence.zip evidence
          gh release create issue687-emulator-diagnostics-run1-20261023 home-autoplay-logcat.txt home-autoplay-diagnostic.png partial-results.json partial-evidence.zip --target e62a843576b95accd980d9afd7b468d223a538b0 --title 'Issue687 emulator diagnostics: five completed cases, Home under investigation' --notes 'Partial Android emulator diagnostics. Five playback cases passed; Home autoplay did not start in the no-account fixture and is being investigated. This is not a claim that the complete test suite passed.' --prerelease
