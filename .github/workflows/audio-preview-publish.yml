name: Publish issue675 Android emulator evidence
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ghbarker/nuvio-native-legacy
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Require completed Android emulator test
        run: |
          gh api repos/$GH_REPO/actions/runs/39902754013 > run.json
          python3 - <<'PY'
          import json
          r=json.load(open('run.json'))
          assert r['head_sha']=='098e200c705cb1fcec717efc3304eba05b86e920'
          assert r['status']=='completed' and r['conclusion']=='success'
          PY
      - uses: actions/download-artifact@v4
        with:
          name: Issue675-Android-emulator-results-098e200c705cb1fcec717efc3304eba05b86e920
          run-id: 39902754013
          github-token: ${{ github.token }}
          path: evidence
      - name: Validate and publish screenshots and logs
        run: |
          python3 - <<'PY'
          import json,pathlib,shutil,hashlib
          p=pathlib.Path('evidence');r=json.load(open(p/'summary.json'))
          assert r['real_android_apk'] and r['real_media3_decoding']
          cases={c['scenario']:c for c in r['completed_cases']}
          assert set(cases)=={'normal-baseline','two-second-gap-baseline','two-second-gap-guarded'}
          for name,c in cases.items():
              assert c['passed'] and c['real_media3_end']['duration_ms']>=120000
              f=p/name/'03-after-ended.png';assert f.read_bytes().startswith(b'\x89PNG\r\n\x1a\n')
              shutil.copyfile(f,name+'.png')
          shutil.copyfile(p/'summary.json','Android-emulator-results.json')
          pathlib.Path('README.txt').write_text('Actual Android 11/API 30 x86_64 emulator running Nuvio and Media3.\nNormal case plays a local generated 125-second MP4 and exits normally.\nFault case offsets only the clock reported to native UI by two seconds AFTER the real Media3 STATE_ENDED signal. It demonstrates the end-position guard failure; it does not establish the original reporter had that exact clock mismatch.\nThe guarded candidate uses a three-second tolerance and requires playback to be stopped.\nThese are isolated emulator builds. No product PR or installable update is published.\n')
          PY
          zip -qr Android-emulator-logs.zip evidence
          gh release create issue675-android-emulator-20261023 normal-baseline.png two-second-gap-baseline.png two-second-gap-guarded.png Android-emulator-results.json Android-emulator-logs.zip README.txt --target 098e200c705cb1fcec717efc3304eba05b86e920 --title 'Issue 675 — actual Android emulator playback-end evidence' --notes-file README.txt --prerelease
