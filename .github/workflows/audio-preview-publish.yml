name: Publish verified Logs90 GIF avatar preview
on:
  push:
    branches: [review/logs34-integration-20261017]
    paths: [.github/workflows/audio-preview-publish.yml]
  workflow_dispatch:
    inputs:
      android_run_id:
        required: true
        type: string
      native_run_id:
        required: true
        type: string
permissions:
  contents: read
jobs:
  publish:
    if: github.event_name != 'push' || contains(github.event.head_commit.message, '[publish-logs90]')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ghbarker/nuvio-native-legacy
      SOURCE_SHA: de609e87e719630058cfb94fa42fa291b5de2b97
      SOURCE_TREE: 46205e3dada96afdf2f60aa6875b239100edf2b4
      BUILD_CONFIG: 5c6fd0ace8bbc756ddd2e5e79ae50b9b44191bc6
      NATIVE_CONFIG: 5c6fd0ace8bbc756ddd2e5e79ae50b9b44191bc6
      NATIVE_SOURCE_SHA: de609e87e719630058cfb94fa42fa291b5de2b97
      NATIVE_SOURCE_TREE: 46205e3dada96afdf2f60aa6875b239100edf2b4
      ANDROID_RUN: ${{ inputs.android_run_id || '39333530996' }}
      NATIVE_RUN: ${{ inputs.native_run_id || '39333517538' }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Wait for the pinned checks
        run: |
          python3 - <<'WAIT'
          import json,os,subprocess,time
          for key,config in [('ANDROID_RUN','BUILD_CONFIG'),('NATIVE_RUN','NATIVE_CONFIG')]:
              for attempt in range(60):
                  r=json.loads(subprocess.check_output(['gh','api','repos/'+os.environ['GH_REPO']+'/actions/runs/'+os.environ[key]]))
                  assert r['head_sha']==os.environ[config]
                  if r['status']=='completed':
                      assert r['conclusion']=='success',r['conclusion']
                      break
                  print(key,r['status'],flush=True)
                  time.sleep(10)
              else:raise RuntimeError(key+' did not finish in time')
          WAIT
      - name: Verify successful pinned checks
        run: |
          python3 - <<'CHECK'
          import json,os,re,subprocess
          api=lambda path:json.loads(subprocess.check_output(['gh','api','repos/'+os.environ['GH_REPO']+'/'+path]))
          for key,path in [('ANDROID_RUN','.github/workflows/logs35-build.yml'),('NATIVE_RUN','.github/workflows/audio-label-checks.yml')]:
              run=os.environ[key];assert re.fullmatch('[0-9]+',run)
              r=api('actions/runs/'+run)
              assert r['status']=='completed' and r['conclusion']=='success'
              assert r['head_sha']==os.environ['BUILD_CONFIG' if key=='ANDROID_RUN' else 'NATIVE_CONFIG'] and r['path']==path
              assert r['head_repository']['full_name']==os.environ['GH_REPO']
              jobs=api('actions/runs/'+run+'/jobs?per_page=100')['jobs']
              assert all(j['conclusion'] in ('success','skipped') for j in jobs)
              if key=='ANDROID_RUN':assert any(j['name']=='apk-build' and j['conclusion']=='success' for j in jobs)
              else:assert len(jobs)==2 and all(j['conclusion']=='success' for j in jobs)
          CHECK
      - uses: actions/download-artifact@v4
        with:
          name: Nuvio-TV-Mobile-Test-Logs90-${{ env.BUILD_CONFIG }}
          run-id: ${{ env.ANDROID_RUN }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          pattern: integration-*
          path: native-evidence
          run-id: ${{ env.NATIVE_RUN }}
          github-token: ${{ github.token }}
      - name: Verify APK and native test evidence
        run: |
          python3 -m pip install 'cryptography>=42,<47'
          python3 - <<'VERIFY'
          import hashlib,json,os,pathlib,subprocess
          apk=pathlib.Path('Nuvio-TV-Mobile-Test-Logs90.apk');p=pathlib.Path('Logs90-validation.json');v=json.loads(p.read_text())
          assert v['source_commit']==os.environ['SOURCE_SHA'] and v['source_tree']==os.environ['SOURCE_TREE']
          assert v['workflow_commit']==os.environ['BUILD_CONFIG'] and v['workflow_run_id']==int(os.environ['ANDROID_RUN'])
          assert v['apk_sha256']==hashlib.sha256(apk.read_bytes()).hexdigest() and v['apk_bytes']==apk.stat().st_size
          subprocess.run(['python3','tools/verify-test-apk.py',str(apk),'--expected-sha256',v['apk_sha256'],'--version-code','20100','--version-name','2.0.100-test-logs90','--output','Logs90-independent-verification.json'],check=True)
          dirs={p.name:p for p in pathlib.Path('native-evidence').iterdir() if p.is_dir()}
          assert set(dirs)=={'integration-ubuntu-24.04-gif-avatar','integration-macos-15-intel-gif-avatar'}
          results=[]
          for d in dirs.values():
              s=json.loads((d/'source.json').read_text());assert s['source_commit']==os.environ['NATIVE_SOURCE_SHA'] and s['source_tree']==os.environ['NATIVE_SOURCE_TREE']
              checks=json.loads((d/'results.json').read_text());assert len(checks)==10 and all(x['code']==0 for x in checks)
              assert {(x['suite'],x['sanitizers']) for x in checks}=={(n,b) for n in ['perfilsel_avatar','gif_avatar','gif','gifcolecao','perfilsel'] for b in [False,True]}
              results+=checks
          v['native_check_source_commit']=os.environ['NATIVE_SOURCE_SHA']
          v['native_check_invocations']=len(results);v['sanitizer_invocations']=sum(x['sanitizers'] for x in results)
          v['check_runs']={'android':int(os.environ['ANDROID_RUN']),'linux_macos':int(os.environ['NATIVE_RUN'])}
          v['validation_note']='Android APK build and independent identity/signature/ABI verification; Linux/macOS profile-avatar draw, Android animation decode/upload, GIF decoder, collection GIF and profile-session fixtures, normal and ASan/UBSan. These are not packaged macOS/webOS/Tizen builds or visual/device tests.'
          p.write_text(json.dumps(v,indent=2)+'\n')
          VERIFY
      - name: Verify identical Android and native-check product source
        run: |
          git fetch --no-tags --depth=3 origin "$SOURCE_SHA" "$NATIVE_SOURCE_SHA"
          python3 - <<'DIFF'
          import os,subprocess
          changed=set(subprocess.check_output(['git','diff','--name-only',os.environ['SOURCE_SHA'],os.environ['NATIVE_SOURCE_SHA']],text=True).splitlines())
          assert not changed,changed
          print('Android and native checks use the identical source tree.')
          DIFF
      - name: Write test instructions
        run: |
          cat > Logs90-test-steps.txt <<'STEPS'
          Logs90: Preserve animated avatar proportions (#621).
          Version 2.0.100-test-logs90 (20100).
          Install as an UPDATE to Nuvio TV/Mobile Test. Do not uninstall or clear data.

          1. Use a profile with one of the two GIF avatars linked in issue #621:
             https://github.com/iqui27/nuvio-native-legacy/issues/621
             If needed, download a sample and assign it using your usual Nuvio
             account/profile editor, then refresh profiles in the test app.
             One sample is wide (500x207); the other is tall (280x498).
          2. Open the profile selector. Leave Reduced animations Off so the selected
             profile's avatar can animate. Move focus onto the GIF profile.
          3. Watch the transition from its still preview into animation. Faces and
             other shapes should retain their proportions, without being stretched
             or squeezed into the circle. Normal center cropping is expected:
             a wide image loses its side edges; a tall image loses top/bottom edges.
          4. Move focus to another profile, then back. Repeat with the other sample
             and with an ordinary square/static avatar. Each should keep its shape.
          5. Turn Reduced animations On and reopen the profile selector. The still
             fallback should retain the correct crop too. Restore your preference.

          The previous approved features, including From the addon ordering, remain
          included. No upstream PR until this build has been tested and approved.
          If distortion remains, save a fresh log and a screenshot of the focused
          avatar. ADB: adb logcat -d -v threadtime > Nuvio-Logs90.txt
          STEPS
          cat > notes.txt <<'NOTES'
          Test preview for issue #621: preserve rectangular GIF avatar proportions
          when the focused profile starts animating. Keeps all approved Logs89 features.
          Use the APK as an update to Nuvio TV/Mobile Test; do not uninstall.

          Checks: Android APK build, package/signer/ARM ABI verification; five headless
          native suites in normal and ASan/UBSan modes on Linux and macOS Intel (20 runs).
          The original issue's 24 GIF frames also matched FFmpeg's visible pixels.
          These are not packaged macOS/webOS/Tizen builds or Android device test passes.
          See Logs90-test-steps.txt for exact verification steps.
          NOTES
      - name: Publish verified preview
        run: |
          gh release create tv-mobile-test-logs-v90 Nuvio-TV-Mobile-Test-Logs90.apk Logs90-validation.json Logs90-independent-verification.json Logs90-test-steps.txt --target "$SOURCE_SHA" --title 'TV/Mobile Test Logs90: GIF avatar proportions' --notes-file notes.txt --prerelease
