name: Publish verified Logs86 Sports preview
on:
  push:
    branches: [review/logs34-integration-20261017]
    paths: [.github/workflows/audio-preview-publish.yml]
  workflow_dispatch:
    inputs:
      android_run_id:
        required: true
        type: string
      native_run_id:
        required: true
        type: string
permissions:
  contents: read
jobs:
  publish:
    if: github.event_name != 'push' || contains(github.event.head_commit.message, '[publish-logs86]')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ghbarker/nuvio-native-legacy
      SOURCE_SHA: dc2d236eac4883691fb1687e36808c890d220d46
      SOURCE_TREE: d94354e643fbd03cf56423942d7f3029ed72fac6
      BUILD_CONFIG: 8d6db8f4da6fe682e10579d937cbaa20a1a2afc3
      NATIVE_CONFIG: 8d6db8f4da6fe682e10579d937cbaa20a1a2afc3
      NATIVE_SOURCE_SHA: dc2d236eac4883691fb1687e36808c890d220d46
      NATIVE_SOURCE_TREE: d94354e643fbd03cf56423942d7f3029ed72fac6
      ANDROID_RUN: ${{ inputs.android_run_id || '39304727384' }}
      NATIVE_RUN: ${{ inputs.native_run_id || '39304732381' }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Wait for the pinned checks
        run: |
          python3 - <<'WAIT'
          import json,os,subprocess,time
          for key,config in [('ANDROID_RUN','BUILD_CONFIG'),('NATIVE_RUN','NATIVE_CONFIG')]:
              for attempt in range(60):
                  r=json.loads(subprocess.check_output(['gh','api','repos/'+os.environ['GH_REPO']+'/actions/runs/'+os.environ[key]]))
                  assert r['head_sha']==os.environ[config]
                  if r['status']=='completed':
                      assert r['conclusion']=='success',r['conclusion']
                      break
                  print(key,r['status'],flush=True)
                  time.sleep(10)
              else:raise RuntimeError(key+' did not finish in time')
          WAIT
      - name: Verify successful pinned checks
        run: |
          python3 - <<'CHECK'
          import json,os,re,subprocess
          api=lambda path:json.loads(subprocess.check_output(['gh','api','repos/'+os.environ['GH_REPO']+'/'+path]))
          for key,path in [('ANDROID_RUN','.github/workflows/logs35-build.yml'),('NATIVE_RUN','.github/workflows/audio-label-checks.yml')]:
              run=os.environ[key];assert re.fullmatch('[0-9]+',run)
              r=api('actions/runs/'+run)
              assert r['status']=='completed' and r['conclusion']=='success'
              assert r['head_sha']==os.environ['BUILD_CONFIG' if key=='ANDROID_RUN' else 'NATIVE_CONFIG'] and r['path']==path
              assert r['head_repository']['full_name']==os.environ['GH_REPO']
              jobs=api('actions/runs/'+run+'/jobs?per_page=100')['jobs']
              assert all(j['conclusion'] in ('success','skipped') for j in jobs)
              if key=='ANDROID_RUN':assert any(j['name']=='apk-build' and j['conclusion']=='success' for j in jobs)
              else:assert len(jobs)==2 and all(j['conclusion']=='success' for j in jobs)
          CHECK
      - uses: actions/download-artifact@v4
        with:
          name: Nuvio-TV-Mobile-Test-Logs86-${{ env.BUILD_CONFIG }}
          run-id: ${{ env.ANDROID_RUN }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          pattern: integration-*
          path: native-evidence
          run-id: ${{ env.NATIVE_RUN }}
          github-token: ${{ github.token }}
      - name: Verify APK and native test evidence
        run: |
          python3 -m pip install 'cryptography>=42,<47'
          python3 - <<'VERIFY'
          import hashlib,json,os,pathlib,subprocess
          apk=pathlib.Path('Nuvio-TV-Mobile-Test-Logs86.apk');p=pathlib.Path('Logs86-validation.json');v=json.loads(p.read_text())
          assert v['source_commit']==os.environ['SOURCE_SHA'] and v['source_tree']==os.environ['SOURCE_TREE']
          assert v['workflow_commit']==os.environ['BUILD_CONFIG'] and v['workflow_run_id']==int(os.environ['ANDROID_RUN'])
          assert v['apk_sha256']==hashlib.sha256(apk.read_bytes()).hexdigest() and v['apk_bytes']==apk.stat().st_size
          subprocess.run(['python3','tools/verify-test-apk.py',str(apk),'--expected-sha256',v['apk_sha256'],'--version-code','20096','--version-name','2.0.96-test-logs86','--output','Logs86-independent-verification.json'],check=True)
          dirs={p.name:p for p in pathlib.Path('native-evidence').iterdir() if p.is_dir()}
          assert set(dirs)=={'integration-ubuntu-24.04-sports','integration-macos-15-intel-sports'}
          results=[]
          for d in dirs.values():
              s=json.loads((d/'source.json').read_text());assert s['source_commit']==os.environ['NATIVE_SOURCE_SHA'] and s['source_tree']==os.environ['NATIVE_SOURCE_TREE']
              checks=json.loads((d/'results.json').read_text());assert len(checks)==10 and all(x['code']==0 for x in checks)
              assert {(x['suite'],x['sanitizers']) for x in checks}=={(n,b) for n in ['esportes','esportes_estado','esportes_ui','fontescanais_folha','streamfit_sheet'] for b in [False,True]}
              results+=checks
          v['native_check_source_commit']=os.environ['NATIVE_SOURCE_SHA']
          v['native_check_invocations']=len(results);v['sanitizer_invocations']=sum(x['sanitizers'] for x in results)
          v['check_runs']={'android':int(os.environ['ANDROID_RUN']),'linux_macos':int(os.environ['NATIVE_RUN'])}
          v['validation_note']='Android APK build and independent identity/signature/ABI verification; Linux/macOS sports parsing, state, headless input/guide-match and shared source-picker ownership fixtures, normal and ASan/UBSan. These are not packaged macOS/webOS/Tizen builds or visual/device tests.'
          p.write_text(json.dumps(v,indent=2)+'\n')
          VERIFY
      - name: Verify identical Android and native-check product source
        run: |
          git fetch --no-tags --depth=3 origin "$SOURCE_SHA" "$NATIVE_SOURCE_SHA"
          python3 - <<'DIFF'
          import os,subprocess
          changed=set(subprocess.check_output(['git','diff','--name-only',os.environ['SOURCE_SHA'],os.environ['NATIVE_SOURCE_SHA']],text=True).splitlines())
          assert not changed,changed
          print('Android and native checks use the identical source tree.')
          DIFF
      - name: Write test instructions
        run: |
          cat > Logs86-test-steps.txt <<'STEPS'
          Logs86: Sports catalog preview. Version 2.0.96-test-logs86 (20096).
          Install as an UPDATE to Nuvio TV/Mobile Test. Do not uninstall or clear data.

          1. Install Logs86 as an UPDATE. Open Sports > a sport > a league.
          2. Tap an event card once, or press and release OK on the remote.
             The normal Sources sheet must open immediately over the event grid.
             No event-details page or separate channel-list page comes first.
          3. The sheet shows a search indicator, then matching guide channels.
             Check channel name, account and programme. The right side of each row
             must show Live while that matched programme is airing, or its local
             start time otherwise. Other days include a date. Tap a result:
             Sources should close and open the selected Live TV channel.
          4. Close the sheet with Back or X. You should return to the same league
             and event position. Open another event: no old results may appear.
             Refresh in the sheet should search the selected event again.
          5. Repeat with NFL and college football, then another sport such as
             NBA, soccer, hockey, tennis or UFC where your guide lists a match.
             Both opponents and a compatible programme time are required.
             Explicit short-code pairings such as KC @ SF should match too.
             ESPN/ESPN+ affiliation, a different opponent/game, replays, highlights
             and programmes from the wrong day must not count as event matches.
          6. If your guide has no identifying EPG programme, an empty result is
             expected. The app must not substitute generic broadcaster channels.
             For an upcoming event, selecting a source must tune its live channel
             immediately. It shows whatever is airing now, until the event starts.
          7. Hide a matching channel category and repeat the search. The hidden
             channel must remain excluded. Check labels for different accounts.
          8. Long-press an event (or hold remote OK) for the secondary team-favorite
             actions. Short tap/OK must continue to open Sources directly.
          9. Confirm league/team artwork, sport toggles, grid navigation and normal
             Home movie/episode Sources still work. Check the chooser while a
             mini-player is active: it should not replace that video's source list.

          10. Change the app's clock format between 12-hour and 24-hour.
              Source start times should follow that choice. Long channel names
              should shorten without overlapping the Live/time label.

          Limits remain 1024 leagues per sport, 400 events per league and 64
          confirmed channel matches. Metadata is ESPN; channel matches use your
          loaded IPTV guide. No upstream Sports PR until this build is approved.
          Computer ADB: adb logcat -d -v threadtime > Nuvio-Logs86.txt
          STEPS
          cat > notes.txt <<'NOTES'
          Separate Sports destination using the app's existing UI components.
          Event cards open the existing Sources sheet directly, using channel choices
          separate from the active playback source list. Matches require both
          opponents and a compatible EPG time. ESPN/ESPN+ names alone do not match.
          Source rows show translated Live during the matched EPG programme, or
          local start time with a date for other days. Existing 12/24-hour clock
          preference applies; long channel names cannot overlap the time.
          Channels can still be watched before an upcoming event starts.
          Channel-selection and playback handoff logs help diagnose failures.
          Existing sports artwork, menu, scores and per-profile favorites remain.
          No video stream is opened or probed while browsing sports metadata.

          Android build and independent APK verification passed. Linux/macOS
          parsing, profile/state and headless UI fixtures passed in normal and
          ASan/UBSan modes (20 invocations). These are not visual/device tests
          or packaged macOS/webOS/Tizen builds. Install as an update and follow
          Logs86-test-steps.txt. No upstream Sports PR has been published.
          NOTES
      - name: Publish verified preview
        run: |
          gh release create tv-mobile-test-logs-v86 Nuvio-TV-Mobile-Test-Logs86.apk Logs86-validation.json Logs86-independent-verification.json Logs86-test-steps.txt --target "$SOURCE_SHA" --title 'TV/Mobile Test Logs86: Sports source Live/time labels' --notes-file notes.txt --prerelease
