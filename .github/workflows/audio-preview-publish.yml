name: Publish verified Logs64 combined test APK
on:
  workflow_dispatch:
    inputs:
      android_run_id:
        description: Successful Logs64 Android APK workflow run ID
        required: true
        type: string
      native_run_id:
        description: Successful 22-job Logs64 native integration workflow run ID
        required: true
        type: string
      apk_sha256:
        description: SHA256 of the downloaded and independently verified APK
        required: true
        type: string
permissions:
  contents: read
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      actions: read
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ghbarker/nuvio-native-legacy
      SOURCE_SHA: 0abe666aadbd3e3013c271ae5b3d93260d1c6dd8
      SOURCE_TREE: 44baf3b305e6e4404fb29193bb93ee6f6685d41f
      # Android is already building this exact immutable source; retain it.
      ANDROID_CONFIG_COMMIT: 2a8cb2b1d1d5cd69359c1deca40a6005f5b1ee74
      ANDROID_RUN: ${{ inputs.android_run_id }}
      NATIVE_RUN: ${{ inputs.native_run_id }}
      APK_SHA256: ${{ inputs.apk_sha256 }}
    steps:
      - name: Require the exact successful Android and native workflow runs
        run: |
          python3 - <<'VERIFY'
          import json,os,re,subprocess
          repo='ghbarker/nuvio-native-legacy'
          api=lambda path:json.loads(subprocess.check_output(['gh','api','repos/'+repo+'/'+path]))
          assert re.fullmatch(r'[0-9a-f]{40}',os.environ['SOURCE_SHA'])
          assert re.fullmatch(r'[0-9a-f]{40}',os.environ['SOURCE_TREE'])
          assert re.fullmatch(r'[0-9a-f]{64}',os.environ['APK_SHA256'])
          for name,path in [('ANDROID_RUN','.github/workflows/logs35-build.yml'),('NATIVE_RUN','.github/workflows/audio-label-checks.yml')]:
              run=os.environ[name];assert re.fullmatch(r'[0-9]+',run)
              data=api('actions/runs/'+run)
              assert data['status']=='completed' and data['conclusion']=='success',(name,data['status'],data['conclusion'])
              expected_config=os.environ['ANDROID_CONFIG_COMMIT'] if name=='ANDROID_RUN' else os.environ['GITHUB_SHA']
              assert data['head_sha']==expected_config,(name,'Unexpected fork CI configuration commit')
              assert data['path']==path,(name,data['path'])
              assert data['head_repository']['full_name']==repo
              jobs=api('actions/runs/'+run+'/jobs?per_page=100')['jobs']
              if name=='NATIVE_RUN':
                  assert len(jobs)==22 and all(job['conclusion']=='success' for job in jobs),'All22 native jobs must pass'
              else:
                  assert len(jobs)==2 and any(job['name']=='apk-build' and job['conclusion']=='success' for job in jobs)
                  assert all(job['conclusion'] in ('success','skipped') for job in jobs)
          VERIFY
      - name: Download exact Android artifact
        uses: actions/download-artifact@v4
        with:
          name: Nuvio-TV-Mobile-Test-Logs64-${{ env.ANDROID_CONFIG_COMMIT }}
          run-id: ${{ inputs.android_run_id }}
          github-token: ${{ github.token }}
      - name: Download all native evidence
        uses: actions/download-artifact@v4
        with:
          pattern: integration-*
          path: native-evidence
          run-id: ${{ inputs.native_run_id }}
          github-token: ${{ github.token }}
      - name: Verify bytes, source, identity and actual test results
        run: |
          python3 - <<'VERIFY'
          import hashlib,json,os,pathlib,zipfile
          apk=pathlib.Path('Nuvio-TV-Mobile-Test-Logs64.apk')
          expected=os.environ['APK_SHA256']
          assert hashlib.sha256(apk.read_bytes()).hexdigest()==expected
          validation=pathlib.Path('Logs64-validation.json');data=json.loads(validation.read_text())
          assert data['apk_sha256']==expected and data['apk_bytes']==apk.stat().st_size
          assert data['source_commit']==os.environ['SOURCE_SHA'] and data['source_tree']==os.environ['SOURCE_TREE']
          assert data['workflow_commit']==os.environ['ANDROID_CONFIG_COMMIT'] and data['workflow_run_id']==int(os.environ['ANDROID_RUN'])
          assert data['package']=='space.nuvio.nativelegacy.touch' and data['version_code']==20074
          assert data['version_name']=='2.0.74-test-logs64'
          assert data['certificate_sha256']=='862d7ef63a0dbde2929f6f231cae295510726d9ac28f9292496d2a38304be5e6'
          assert data['android_build'] and data['both_arm_abis'] and data['arm64_16kb_alignment']
          assert set(data['android_unit_tests'])=={'LiveWindowRecoveryTest','ParaleloDataSourceTest','FontImportTest','DriveAuthStateTest'}
          assert set(data['included_prs'])=={573,575,576,587,596,597,598,601,602,609,611}
          with zipfile.ZipFile(apk) as archive:
              assert archive.testzip() is None
              assert {name.split('/')[1] for name in archive.namelist() if name.startswith('lib/') and name.endswith('.so')}=={'arm64-v8a','armeabi-v7a'}
          groups={'providers','guide','guide-ui','sources','source-policy','backup-state','backup-drive','backup-addons','fonts','settings','identity'}
          expected_artifacts={'integration-'+system+'-'+group for system in ('ubuntu-24.04','macos-15') for group in groups}
          directories={p.name:p for p in pathlib.Path('native-evidence').iterdir() if p.is_dir()}
          assert set(directories)==expected_artifacts,'Missing or unexpected native evidence'
          invocations=[]
          for name,directory in directories.items():
              source=json.loads((directory/'source.json').read_text())
              assert source['source_commit']==os.environ['SOURCE_SHA'] and source['source_tree']==os.environ['SOURCE_TREE'],name
              results=json.loads((directory/'results.json').read_text())
              assert results and all(result['code']==0 for result in results),name
              invocations.extend(results)
          data.update(android_build=True,linux_native_checks=True,macos_native_checks=True,native_matrix_jobs=22,native_suite_invocations=len(invocations),sanitizer_suite_invocations=sum(result['sanitizers'] for result in invocations))
          data['check_configuration_commits']={'android':os.environ['ANDROID_CONFIG_COMMIT'],'linux_macos':os.environ['GITHUB_SHA']}
          data['check_runs']={'android':int(os.environ['ANDROID_RUN']),'linux_macos':int(os.environ['NATIVE_RUN'])}
          data['translation_lint']='No added diagnostics against unchanged upstream415544; baseline contains pre-existing empty translations.'
          data['native_checks_note']='Native normal/ASan+UBSan regressions are not macOS, webOS or Tizen packaged application builds.'
          validation.write_text(json.dumps(data,indent=2)+'\n')
          VERIFY
      - name: Write release inventory and instructions
        run: |
          python3 - <<'INVENTORY'
          import json,os,pathlib
          items=[{'number': 573, 'title': 'Fonts: import local TTF/OTF for subtitles and interface', 'url': 'https://github.com/iqui27/nuvio-native-legacy/pull/573'}, {'number': 575, 'title': 'Sources: add persistent cached/uncached filtering', 'url': 'https://github.com/iqui27/nuvio-native-legacy/pull/575'}, {'number': 576, 'title': 'Episodes: keep canonical identity after metadata updates', 'url': 'https://github.com/iqui27/nuvio-native-legacy/pull/576'}, {'number': 587, 'title': 'Live TV: bypass source filters and add per-add-on overrides', 'url': 'https://github.com/iqui27/nuvio-native-legacy/pull/587'}, {'number': 596, 'title': 'Live TV: add M3U, multiple accounts and responsive EPG loading', 'url': 'https://github.com/iqui27/nuvio-native-legacy/pull/596'}, {'number': 597, 'title': 'Live TV: prevent false stall restarts and recover expired live windows', 'url': 'https://github.com/iqui27/nuvio-native-legacy/pull/597'}, {'number': 598, 'title': 'Details: show prepared-source specifications below Play', 'url': 'https://github.com/iqui27/nuvio-native-legacy/pull/598'}, {'number': 601, 'title': 'Live TV: fix large category lists and category Confirm/Cancel', 'url': 'https://github.com/iqui27/nuvio-native-legacy/pull/601'}, {'number': 602, 'title': 'Live TV: keep repeated search results visible and responsive', 'url': 'https://github.com/iqui27/nuvio-native-legacy/pull/602'}, {'number': 609, 'title': 'Backup: add encrypted Google Drive backup and restore for local settings', 'url': 'https://github.com/iqui27/nuvio-native-legacy/pull/609'}, {'number': 611, 'title': 'Sources: match audio-language filters against release labels', 'url': 'https://github.com/iqui27/nuvio-native-legacy/pull/611'}]
          pathlib.Path('Logs64-inventory.json').write_text(json.dumps({'integration_base':'4155445395a94cbd40a9f1f9558311e3ebb26da0','source_commit':os.environ['SOURCE_SHA'],'source_tree':os.environ['SOURCE_TREE'],'approved_feature_prs':items,'integration_note':'Newest upstream development plus the11approved features, adapted together to the source-keyed streaming Live TV guide. This combined test APK is awaiting device testing.'},indent=2)+'\n')
          INVENTORY
          cat > Logs64-test-steps.txt <<'TESTSTEPS'
          Logs64 — newest development plus all 11 approved PRs
          
          Install Nuvio-TV-Mobile-Test-Logs64.apk as an UPDATE to Nuvio TV/Mobile Test.
          Do not uninstall or clear app data. Package: space.nuvio.nativelegacy.touch.
          Version: 2.0.74-test-logs64 (20074). Your accounts and settings should remain.
          This combines the newest development guide with the previously approved changes.
          Please check these integration points before using it as your everyday build.
          Record changed settings first and restore them after each check.
          
          1. Startup and accounts
             Open the app and the usual profile. Confirm existing provider keys, add-ons,
             Live TV accounts and saved settings remain. Open a collection and a title.
          
          2. Live TV accounts, categories and search (#596, #601, #602)
             Open Settings > Live TV. Xtream, M3U and Stalker open their current accounts
             and Add account actions. Existing accounts must not be replaced by Add.
             Open the TV guide, then its Categories button. Check categories from each
             enabled account; scroll past the old short-list boundary.
             In Hide categories, hide one nonessential category and Confirm. It should
             disappear from both the guide and the Categories list. Unhide it afterward.
             Search for a channel/programme (for example Jaguars if in your guide), close
             the results, and repeat the same search. Results must reappear each time.
             Restart and reopen the guide: channels and guide data should reload. Refresh
             should finish or show a useful empty/error state rather than load forever.
          
          3. Live playback and filter bypass (#587, #597)
             Play a familiar live channel for at least five minutes. Check for the former
             8–15-second reopen loop or an error overlay while audio keeps playing.
             Open a live add-on from a Home/collection row too: movie/series source filters
             must not remove its live streams. Keep per-add-on Live TV overrides as needed
             for add-ons that label their channels as movies or series.
          
          4. Source cache and language filters (#575, #611)
             Open Sources for a familiar movie. Cached means confirmed cached; Uncached
             means explicitly uncached. Unknown status must not count as confirmed cached.
             Try the persistent cache choice under Source filters, then restore it.
             For the audio fallback check, record Audio language, choose Turkish, open
             Frozen (2013) or a movie whose Turkish-labelled source you already found,
             choose All add-ons and switch Audio: TR on. MP4/Cached and saved exclusion
             rules may narrow results further. Turkish audio metadata or recognizable
             audio labels should match; Turkish subtitles alone must not match. No fixed
             number of Turkish sources is expected. Restore the original audio language.
          
          5. Fonts, episodes and prepared details (#573, #576, #598)
             Choose an imported interface font and confirm menu text changes. For a plain
             downloaded subtitle, choose another built-in/imported font in the player;
             its checkmark and appearance should change. Restore your preferred fonts.
             Open a familiar series (including Kaiju No. 8 if available), select an episode
             and confirm the player, next episode and watched/Continue Watching identity
             all refer to the same actual episode after metadata updates.
             With Prepare source/Preload video and Prepared source details enabled, open a
             title. Once its automatic source is prepared, specifications should appear
             below Play without clipping, including when the phone changes orientation.
          
          6. Google Drive backup integration (#609)
             In the current profile, back up to your own Drive with a chosen password.
             Restore that backup with hardware choices left Off. Add-ons should return
             immediately without restarting the app; existing connections should remain.
             Nuvio-managed account settings remain separate, rotating service logins are
             excluded, and hardware options apply only when explicitly selected.
             Keep the password: it cannot be recovered from the encrypted file.
          
          If anything regresses, capture a log immediately and include the step, title or
          channel, account type and what appeared. Do not post provider keys or playlist
          URLs. The test-only log tools and test package/signing stay out of product PRs.
          TESTSTEPS
          cat > notes.txt <<'NOTES'
          Install as an UPDATE to Nuvio TV/Mobile Test. Do not uninstall or clear data.

          Newest development code plus all11approved feature PRs: imported subtitle/interface fonts(#573), cached/uncached source rules(#575), canonical episode identity(#576), Live TV filter bypass(#587), multiple IPTV accounts/M3U/EPG(#596), live-window recovery(#597), prepared-source details(#598), complete category lists and Confirm/Cancel(#601), repeated guide search(#602), encrypted Google Drive backup(#609), and dubbed-language metadata fallback(#611).

          The latest upstream source-keyed streaming guide and EPG are retained. This combined build needs the integration checks in Logs64-test-steps.txt; the individual features were already approved. Android build/unit checks and all22Linux/macOS native matrix jobs passed. Those native checks do not constitute packaged macOS/webOS/Tizen builds.

          Package, increasing version, persistent signer, ARM64+ARMv7 and ARM6416KB alignment verified. Exact source, feature inventory, test totals and run links are attached.
          NOTES
      - name: Publish verified update APK
        run: |
          gh release create tv-mobile-test-logs-v64 Nuvio-TV-Mobile-Test-Logs64.apk Logs64-validation.json Logs64-inventory.json Logs64-test-steps.txt --target "$SOURCE_SHA" --title 'TV/Mobile Test Logs64: latest development and approved features' --notes-file notes.txt --prerelease
