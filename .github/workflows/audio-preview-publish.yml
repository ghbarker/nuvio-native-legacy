name: Publish verified Logs104 Sports photo-background preview
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ghbarker/nuvio-native-legacy
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Require successful pinned Android and Sports checks
        run: |
          gh api repos/$GH_REPO/actions/runs/39872535945 > android-run.json
          gh api repos/$GH_REPO/actions/runs/39870871779 > shared-run.json
          gh api repos/$GH_REPO/actions/runs/39870871779/jobs > shared-jobs.json
          python3 - <<'CHECK'
          import json
          for name,head in [('android-run.json','40980be6d0d6e8b1866ef787bde6aa976659c8ae'),('shared-run.json','52f3dd9d3cc7cb7928ad45110443106d0c3d03c8')]:
              r=json.load(open(name));assert r['head_sha']==head and r['status']=='completed' and r['conclusion']=='success'
          jobs={j['name']:j for j in json.load(open('shared-jobs.json'))['jobs']}
          for name in ['native (ubuntu-24.04)','native (macos-15-intel)','wasm']:
              assert jobs[name]['status']=='completed' and jobs[name]['conclusion']=='success'
          CHECK
      - uses: actions/download-artifact@v4
        with:
          name: Nuvio-TV-Mobile-Test-Logs104-40980be6d0d6e8b1866ef787bde6aa976659c8ae
          run-id: 39872535945
          github-token: ${{ github.token }}
      - name: Independently verify and publish the APK
        run: |
          python3 -m pip install 'cryptography>=42,<47'
          python3 - <<'VERIFY'
          import json,subprocess
          v=json.load(open('Logs104-validation.json'))
          assert v['source_commit']=='f5b47ef2d1d5ffdd4a0c304ad3bf8b382c2be913'
          assert v['source_tree']=='97927c24a7038f29a4ce0a662f898da25c892674'
          assert v['workflow_commit']=='40980be6d0d6e8b1866ef787bde6aa976659c8ae'
          assert v['workflow_run_id']==39872535945
          assert v['social_service_configured'] and v['simkl_client_configured']
          subprocess.run(['python3','tools/verify-test-apk.py','Nuvio-TV-Mobile-Test-Logs104.apk',
            '--expected-sha256',v['apk_sha256'],'--expected-bytes',str(v['apk_bytes']),
            '--version-code','20114','--version-name','2.0.114-test-logs104',
            '--certificate-sha256','862d7ef63a0dbde2929f6f231cae295510726d9ac28f9292496d2a38304be5e6',
            '--output','Logs104-independent-verification.json'],check=True)
          v.update({'sports_product_commit':'d98dab565a883b5557583c70ea40633e81b34d0e','sports_checks_run':39870871779,'sports_checks':'Linux and macOS Sports navigation, matching, bounded cache, quality persistence, artwork dimensions and deterministic match order; normal and ASan/UBSan; WGT shared compilation with and without touch','platform_package_builds':{'android_apk':True,'webos_ipk':False,'tizen_tpk':False,'tizen_wgt':False},'scope':'Preserve dark multitone Sports logo colours; upstream PR619 unchanged pending approval'})
          open('Logs104-validation.json','w').write(json.dumps(v,indent=2)+'\n')
          VERIFY
          gh release create tv-mobile-test-logs-v103 Nuvio-TV-Mobile-Test-Logs104.apk Logs104-validation.json Logs104-independent-verification.json preview-release/Logs104-test-steps.txt --target f5b47ef2d1d5ffdd4a0c304ad3bf8b382c2be913 --title 'Nuvio TV/Mobile Test Logs104 — Sports logo colour fix' --notes-file preview-release/Logs104-release-notes.txt --prerelease
