name: Publish verified Logs87 Sports preview
on:
  push:
    branches: [review/logs34-integration-20261017]
    paths: [.github/workflows/audio-preview-publish.yml]
  workflow_dispatch:
    inputs:
      android_run_id:
        required: true
        type: string
      native_run_id:
        required: true
        type: string
permissions:
  contents: read
jobs:
  publish:
    if: github.event_name != 'push' || contains(github.event.head_commit.message, '[publish-logs87]')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ghbarker/nuvio-native-legacy
      SOURCE_SHA: c774a1c8f0d47ec08c78e0196eabdf31382bafd0
      SOURCE_TREE: f6f6daa8f578f08ba0c1e054822b808de3ade842
      BUILD_CONFIG: e884f6d3c9d821207f9937189febfda579c43e35
      NATIVE_CONFIG: e884f6d3c9d821207f9937189febfda579c43e35
      NATIVE_SOURCE_SHA: c774a1c8f0d47ec08c78e0196eabdf31382bafd0
      NATIVE_SOURCE_TREE: f6f6daa8f578f08ba0c1e054822b808de3ade842
      ANDROID_RUN: ${{ inputs.android_run_id || '39309174655' }}
      NATIVE_RUN: ${{ inputs.native_run_id || '39309179401' }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Wait for the pinned checks
        run: |
          python3 - <<'WAIT'
          import json,os,subprocess,time
          for key,config in [('ANDROID_RUN','BUILD_CONFIG'),('NATIVE_RUN','NATIVE_CONFIG')]:
              for attempt in range(60):
                  r=json.loads(subprocess.check_output(['gh','api','repos/'+os.environ['GH_REPO']+'/actions/runs/'+os.environ[key]]))
                  assert r['head_sha']==os.environ[config]
                  if r['status']=='completed':
                      assert r['conclusion']=='success',r['conclusion']
                      break
                  print(key,r['status'],flush=True)
                  time.sleep(10)
              else:raise RuntimeError(key+' did not finish in time')
          WAIT
      - name: Verify successful pinned checks
        run: |
          python3 - <<'CHECK'
          import json,os,re,subprocess
          api=lambda path:json.loads(subprocess.check_output(['gh','api','repos/'+os.environ['GH_REPO']+'/'+path]))
          for key,path in [('ANDROID_RUN','.github/workflows/logs35-build.yml'),('NATIVE_RUN','.github/workflows/audio-label-checks.yml')]:
              run=os.environ[key];assert re.fullmatch('[0-9]+',run)
              r=api('actions/runs/'+run)
              assert r['status']=='completed' and r['conclusion']=='success'
              assert r['head_sha']==os.environ['BUILD_CONFIG' if key=='ANDROID_RUN' else 'NATIVE_CONFIG'] and r['path']==path
              assert r['head_repository']['full_name']==os.environ['GH_REPO']
              jobs=api('actions/runs/'+run+'/jobs?per_page=100')['jobs']
              assert all(j['conclusion'] in ('success','skipped') for j in jobs)
              if key=='ANDROID_RUN':assert any(j['name']=='apk-build' and j['conclusion']=='success' for j in jobs)
              else:assert len(jobs)==2 and all(j['conclusion']=='success' for j in jobs)
          CHECK
      - uses: actions/download-artifact@v4
        with:
          name: Nuvio-TV-Mobile-Test-Logs87-${{ env.BUILD_CONFIG }}
          run-id: ${{ env.ANDROID_RUN }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          pattern: integration-*
          path: native-evidence
          run-id: ${{ env.NATIVE_RUN }}
          github-token: ${{ github.token }}
      - name: Verify APK and native test evidence
        run: |
          python3 -m pip install 'cryptography>=42,<47'
          python3 - <<'VERIFY'
          import hashlib,json,os,pathlib,subprocess
          apk=pathlib.Path('Nuvio-TV-Mobile-Test-Logs87.apk');p=pathlib.Path('Logs87-validation.json');v=json.loads(p.read_text())
          assert v['source_commit']==os.environ['SOURCE_SHA'] and v['source_tree']==os.environ['SOURCE_TREE']
          assert v['workflow_commit']==os.environ['BUILD_CONFIG'] and v['workflow_run_id']==int(os.environ['ANDROID_RUN'])
          assert v['apk_sha256']==hashlib.sha256(apk.read_bytes()).hexdigest() and v['apk_bytes']==apk.stat().st_size
          subprocess.run(['python3','tools/verify-test-apk.py',str(apk),'--expected-sha256',v['apk_sha256'],'--version-code','20097','--version-name','2.0.97-test-logs87','--output','Logs87-independent-verification.json'],check=True)
          dirs={p.name:p for p in pathlib.Path('native-evidence').iterdir() if p.is_dir()}
          assert set(dirs)=={'integration-ubuntu-24.04-sports','integration-macos-15-intel-sports'}
          results=[]
          for d in dirs.values():
              s=json.loads((d/'source.json').read_text());assert s['source_commit']==os.environ['NATIVE_SOURCE_SHA'] and s['source_tree']==os.environ['NATIVE_SOURCE_TREE']
              checks=json.loads((d/'results.json').read_text());assert len(checks)==10 and all(x['code']==0 for x in checks)
              assert {(x['suite'],x['sanitizers']) for x in checks}=={(n,b) for n in ['esportes','esportes_estado','esportes_ui','fontescanais_folha','streamfit_sheet'] for b in [False,True]}
              results+=checks
          v['native_check_source_commit']=os.environ['NATIVE_SOURCE_SHA']
          v['native_check_invocations']=len(results);v['sanitizer_invocations']=sum(x['sanitizers'] for x in results)
          v['check_runs']={'android':int(os.environ['ANDROID_RUN']),'linux_macos':int(os.environ['NATIVE_RUN'])}
          v['validation_note']='Android APK build and independent identity/signature/ABI verification; Linux/macOS sports parsing, state, headless input/guide-match and shared source-picker ownership fixtures, normal and ASan/UBSan. These are not packaged macOS/webOS/Tizen builds or visual/device tests.'
          p.write_text(json.dumps(v,indent=2)+'\n')
          VERIFY
      - name: Verify identical Android and native-check product source
        run: |
          git fetch --no-tags --depth=3 origin "$SOURCE_SHA" "$NATIVE_SOURCE_SHA"
          python3 - <<'DIFF'
          import os,subprocess
          changed=set(subprocess.check_output(['git','diff','--name-only',os.environ['SOURCE_SHA'],os.environ['NATIVE_SOURCE_SHA']],text=True).splitlines())
          assert not changed,changed
          print('Android and native checks use the identical source tree.')
          DIFF
      - name: Write test instructions
        run: |
          cat > Logs87-test-steps.txt <<'STEPS'
          Logs87: Sports All and combined Favorites. Version 2.0.97-test-logs87 (20097).
          Install as an UPDATE to Nuvio TV/Mobile Test. Do not uninstall or clear data.

          1. Open Sports. All should be selected, with cards for every enabled sport.
             Select a sport to see its leagues, then a league for its event cards.
          2. Open and close the left app menu. The Sports content must stay in place.
          3. In Sports > Sports, hide one sport. Return to Home, then open Sports.
             All should be selected again, and the hidden sport must stay absent.
             Selecting Sports again in the left app menu must also reset to All.
          4. Short-tap an event or press and release remote OK. The existing Sources
             sheet should open, and selecting a matched channel should play it.
          5. Long-press the same event or hold remote OK. Only team favorite options
             should open. Releasing the hold must not open Sources or favorite a team.
             Add a team, then add a team from a different sport or league.
          6. Return to All. One combined Favorites row should show live/upcoming
             matches for both teams, followed by the enabled sport cards.
             It must not require reopening each team's league. Soccer favorites
             include cup competitions when ESPN supplies those fixtures.
             A game between two favorite teams must appear only once.
          7. Swipe the Favorites row horizontally. Swipe vertically to reach sports.
             On a remote, Left/Right moves through favorites; Down reaches sports.
             No full-screen background artwork should appear behind this row.
          8. Short-tap a favorite match for Sources. Long-press for favorite options.
             Remove a favorite, leave Sports and return. Its games should be removed
             unless the other participant remains a favorite.
          9. With app language English, event dates and other-day source dates must
             use MM/DD. Source rows still show Live during the matched programme,
             otherwise the start time, respecting the existing 12/24-hour setting.
          10. Check the Favorites/Add/Remove/search labels in another app language.
              App-owned labels are translated; ESPN team/event names depend on its
              coverage of that language. Normal movie/episode Sources should work.

          Limits: 1024 leagues per sport, 400 events per league, 400 combined favorite
          events and 64 confirmed channel matches. Favorites load progressively in
          one background metadata worker, separate from league loading. Finished
          games are excluded. Unsupported team schedules fall back to league data.
          ESPN data and your loaded IPTV EPG determine coverage and channel matches.
          No upstream Sports PR until this build is approved.
          Computer ADB: adb logcat -d -v threadtime > Nuvio-Logs87.txt
          STEPS
          cat > notes.txt <<'NOTES'
          Sports now opens at All: one combined Favorites row above cards for all
          enabled sports. Selecting a sport opens its leagues. Leaving and reopening
          Sports resets to All; hidden sports remain hidden.
          Favorite teams load independently of the currently selected league, with
          soccer schedules covering multiple competitions. Long press opens only
          team favorite options; short tap opens the existing Sources chooser.
          Opening the app sidebar no longer shifts Sports content. English dates
          use MM/DD, and Favorites/search labels have translation keys in all locales.
          Existing channel matching and playback behavior is retained.

          Android build and independent APK verification passed. Linux/macOS
          parsing, profile/state and headless UI fixtures passed in normal and
          ASan/UBSan modes (20 invocations). These are not visual/device tests
          or packaged macOS/webOS/Tizen builds. Install as an update and follow
          Logs87-test-steps.txt. No upstream Sports PR has been published.
          NOTES
      - name: Publish verified preview
        run: |
          gh release create tv-mobile-test-logs-v87 Nuvio-TV-Mobile-Test-Logs87.apk Logs87-validation.json Logs87-independent-verification.json Logs87-test-steps.txt --target "$SOURCE_SHA" --title 'TV/Mobile Test Logs87: All sports and combined Favorites' --notes-file notes.txt --prerelease
