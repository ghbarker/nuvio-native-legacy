{
  "name": "Publish the verified compatible Logs9 test update",
  "on": {
    "push": {
      "branches": [
        "review/apk20019-publish-20261015"
      ],
      "paths": [
        ".review/apk20019-publish/**",
        ".github/workflows/apk20019-publish.yml"
      ]
    },
    "workflow_dispatch": {}
  },
  "permissions": {
    "contents": "read",
    "actions": "read"
  },
  "concurrency": {
    "group": "nuvio-test-logs9-release",
    "cancel-in-progress": false
  },
  "env": {
    "APK20019_RELEASE_LOCK_SHA256": "6c2da6f6647a7456bb6e4f5fdcd469647537c77fbfb3ee6548d7e6b87e95e363",
    "NUVIO_REVIEW_PLAN_SHA256": "a5198e61b5f3d9c998de95000e4c2b9b43a9bbfeceac90a6d66d72a6d947595e"
  },
  "jobs": {
    "publish": {
      "runs-on": "ubuntu-24.04",
      "timeout-minutes": 30,
      "permissions": {
        "contents": "write",
        "actions": "read"
      },
      "steps": [
        {
          "uses": "actions/checkout@v4",
          "with": {
            "persist-credentials": false,
            "fetch-depth": 0
          }
        },
        {
          "uses": "actions/setup-java@v4",
          "with": {
            "distribution": "temurin",
            "java-version": "17"
          }
        },
        {
          "uses": "android-actions/setup-android@v3",
          "with": {
            "packages": "platform-tools",
            "log-accepted-android-sdk-licenses": false
          }
        },
        {
          "name": "Install verification tools only; no app build",
          "run": "sdkmanager 'build-tools;35.0.0'"
        },
        {
          "name": "Verify actual green validation/artifacts/APK and publish exact draft by ID",
          "env": {
            "GH_TOKEN": "${{ github.token }}"
          },
          "run": "python3 .review/apk20019-publish/publish.py --publish"
        },
        {
          "uses": "actions/upload-artifact@v4",
          "if": "always()",
          "with": {
            "name": "apk20019-publication-${{ github.sha }}",
            "path": "publication/*-receipt.json\npublication/*-failure.json\npublication/draft-created.json",
            "if-no-files-found": "warn",
            "retention-days": 14
          }
        }
      ]
    }
  }
}
