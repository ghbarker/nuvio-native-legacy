name: Permanently signed TV and mobile test APK
'on':
  push:
    branches:
    - review/test-apk-signing-identity
permissions:
  contents: write
  actions: read
jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false
    - uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '17'
    - name: Download exact validated APK
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        mkdir -p build/apk build/apk-proof "$RUNNER_TEMP/source-apk"
        gh run download 38454168514 --repo "$GITHUB_REPOSITORY" \
          --name Nuvio-source-metadata-test-c5a58123ddbb1ea18356d22a303de13f4a76a57d \
          --dir "$RUNNER_TEMP/source-apk"
        python3 - "$RUNNER_TEMP/source-apk" <<'PY'
        import hashlib
        import shutil
        import sys
        from pathlib import Path
        files = list(Path(sys.argv[1]).glob('*-tv-mobile-test.apk'))
        assert len(files) == 1, files
        expected = '3d8312b09c0a6193971ed9e9955794e62d4189b81c4cfd91fb81f8da40120130'
        actual = hashlib.sha256(files[0].read_bytes()).hexdigest()
        assert actual == expected, (actual, expected)
        shutil.copyfile(files[0], 'build/apk-proof/validated-input.apk')
        print('Exact previously tested APK SHA256 verified:', actual)
        PY
    - name: Sign with the persistent original test key
      env:
        NUVIO_TOUCH_DEBUG_KEYSTORE_B64: ${{ secrets.NUVIO_TOUCH_DEBUG_KEYSTORE_B64 }}
      run: |
        set -euo pipefail
        signing_dir="$RUNNER_TEMP/nuvio-test-signing"
        mkdir -p "$signing_dir"
        trap 'rm -rf "$signing_dir"' EXIT
        test -n "$NUVIO_TOUCH_DEBUG_KEYSTORE_B64"
        printf '%s' "$NUVIO_TOUCH_DEBUG_KEYSTORE_B64" | base64 --decode > "$signing_dir/debug.keystore"
        chmod 600 "$signing_dir/debug.keystore"
        keytool -exportcert -alias androiddebugkey -keystore "$signing_dir/debug.keystore" \
          -storepass android -file "$signing_dir/public-cert.der" >/dev/null
        python3 - "$signing_dir/public-cert.der" <<'PY'
        import hashlib
        import sys
        from pathlib import Path
        expected = '862d7ef63a0dbde2929f6f231cae295510726d9ac28f9292496d2a38304be5e6'
        actual = hashlib.sha256(Path(sys.argv[1]).read_bytes()).hexdigest()
        assert actual == expected, 'Persistent test signing key changed'
        print('Original preview signing certificate verified:', actual)
        PY
        "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign \
          --ks "$signing_dir/debug.keystore" --ks-key-alias androiddebugkey \
          --ks-pass pass:android --key-pass pass:android \
          --v1-signing-enabled false --v2-signing-enabled true --v3-signing-enabled true \
          --v4-signing-enabled false \
          --out build/apk/Nuvio-TV-Mobile-Test.apk build/apk-proof/validated-input.apk
    - name: Verify signing, app identity and unchanged app payload
      run: |
        set -euo pipefail
        "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs \
          build/apk/Nuvio-TV-Mobile-Test.apk | tee build/apk-proof/signing.txt
        python3 - "$ANDROID_HOME/build-tools/35.0.0/aapt" <<'PY'
        import hashlib
        import json
        import re
        import subprocess
        import sys
        import zipfile
        from pathlib import Path
        apk = Path('build/apk/Nuvio-TV-Mobile-Test.apk')
        original = Path('build/apk-proof/validated-input.apk')
        certificate = '862d7ef63a0dbde2929f6f231cae295510726d9ac28f9292496d2a38304be5e6'
        text = Path('build/apk-proof/signing.txt').read_text()
        assert 'Signer #1 certificate SHA-256 digest: ' + certificate in text
        badging = subprocess.check_output([sys.argv[1], 'dump', 'badging', str(apk)], text=True)
        assert re.search(r"^package: name='space.nuvio.nativelegacy.touch' versionCode='20005'", badging, re.MULTILINE)
        assert re.search(r"^application-label:'Nuvio TV/Mobile Test'", badging, re.MULTILINE)
        def signing_entry(name):
            return name.startswith('META-INF/') and (name.endswith(('.RSA', '.DSA', '.EC', '.SF')) or name == 'META-INF/MANIFEST.MF')
        with zipfile.ZipFile(original) as before, zipfile.ZipFile(apk) as after:
            old_names = {n for n in before.namelist() if not signing_entry(n)}
            new_names = {n for n in after.namelist() if not signing_entry(n)}
            assert old_names == new_names
            for name in old_names:
                assert hashlib.sha256(before.read(name)).digest() == hashlib.sha256(after.read(name)).digest(), name
            for abi in ('arm64-v8a', 'armeabi-v7a'):
                assert 'lib/' + abi + '/libmain.so' in new_names
        subprocess.run([sys.executable, 'tools/android-apk-pages.py', str(apk)], check=True)
        proof = {
            'input_run': 38454168514,
            'input_commit': 'c5a58123ddbb1ea18356d22a303de13f4a76a57d',
            'input_apk_sha256': hashlib.sha256(original.read_bytes()).hexdigest(),
            'apk_sha256': hashlib.sha256(apk.read_bytes()).hexdigest(),
            'apk_bytes': apk.stat().st_size,
            'certificate_sha256': certificate,
            'matches_original_touch_preview_11': True,
            'app_payload_identical_to_tested_apk': True,
            'package': 'space.nuvio.nativelegacy.touch',
            'label': 'Nuvio TV/Mobile Test',
            'version_code': 20005,
            'abis': ['arm64-v8a', 'armeabi-v7a'],
        }
        Path('build/apk-proof/validated-input.apk').unlink()
        Path('build/apk-proof/update-identity.json').write_text(json.dumps(proof, indent=2) + '\n')
        print(json.dumps(proof, indent=2))
        PY
    - uses: actions/upload-artifact@v4
      with:
        name: Nuvio-TV-Mobile-Test-permanent-signing-${{ github.sha }}
        path: build/apk/Nuvio-TV-Mobile-Test.apk
        if-no-files-found: error
        retention-days: 14
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: apk-signing-proof-${{ github.sha }}
        path: |
          build/apk-proof/signing.txt
          build/apk-proof/update-identity.json
        if-no-files-found: warn
        retention-days: 14
    - name: Publish verified direct APK download
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        python3 - <<'PY'
        import hashlib
        from pathlib import Path
        apk = Path('build/apk/Nuvio-TV-Mobile-Test.apk')
        expected = '179fc2763cbddeec302c9dbfbb5f7a29e1165e8600ce4118bfb8bba0a7d38ed6'
        actual = hashlib.sha256(apk.read_bytes()).hexdigest()
        assert actual == expected, (actual, expected)
        Path(str(apk) + '.sha256').write_text(actual + '  ' + apk.name + '\n')
        Path('build/apk/release-notes.txt').write_text(
            'Nuvio TV/Mobile Test with permanent signing and AIOStreams language metadata support.\n\n'
            'Download Nuvio-TV-Mobile-Test.apk directly. It uses the original Touch preview 11 signing key.\n'
            'Newer Actions ZIP builds used temporary keys and require a verified local account backup and transfer before reinstalling. Keep the installed app until its backup is verified.\n'
            'Future APKs will use this same permanent test key.\n\n'
            'The app payload is identical to tested run 38454168514. Signing, payload hashes, package identity, both ARM architectures and native page packaging passed verification.\n\n'
            'No new PR has been opened.\n')
        PY
        if gh release view tv-mobile-test-languages-481 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
          gh release upload tv-mobile-test-languages-481 \
            build/apk/Nuvio-TV-Mobile-Test.apk build/apk/Nuvio-TV-Mobile-Test.apk.sha256 \
            --repo "$GITHUB_REPOSITORY" --clobber
          gh release edit tv-mobile-test-languages-481 --repo "$GITHUB_REPOSITORY" \
            --draft=false --prerelease --latest=false --notes-file build/apk/release-notes.txt
        else
          gh release create tv-mobile-test-languages-481 \
            build/apk/Nuvio-TV-Mobile-Test.apk build/apk/Nuvio-TV-Mobile-Test.apk.sha256 \
            --repo "$GITHUB_REPOSITORY" --target 6c88d15777fe1ec7030120dd846b7e01dad31c2f \
            --prerelease --latest=false --title 'Nuvio TV/Mobile Test: stable signing and languages' \
            --notes-file build/apk/release-notes.txt
        fi
