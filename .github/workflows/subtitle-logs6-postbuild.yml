name: Logs6 exact-APK JNI validation and corrected fresh20 runtime
'on':
  push:
    branches:
    - review/subtitle-logs6-postbuild-20261015
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: subtitle-logs6-postbuild-${{ github.sha }}
  cancel-in-progress: true
jobs:
  postbuild:
    name: Validate exact built APKs and reuse successful macOS checks
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false
        fetch-depth: 0
    - uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '17'
    - uses: android-actions/setup-android@v3
      with:
        packages: platform-tools
        log-accepted-android-sdk-licenses: false
    - name: Install APK inspection tools without ARM toolchains
      run: 'sdkmanager ''build-tools;35.0.0''

        echo "AAPT=$ANDROID_HOME/build-tools/35.0.0/aapt" >> "$GITHUB_ENV"

        echo "APKSIGNER=$ANDROID_HOME/build-tools/35.0.0/apksigner" >> "$GITHUB_ENV"'
    - name: Verify actual built APK DEX/static JNI, source, signature and native pages
      run: python3 .review/subtitle-logs6-postbuild/validate_android.py
    - name: Reuse only successful source-bound macOS checks and captures
      run: python3 .review/subtitle-logs6-postbuild/reuse_native.py
    - name: Stage exact delivery APK and validation proofs without changing source
      run: 'python3 - <<''PY''

        from pathlib import Path

        import shutil

        root=Path(''build/android-artifacts'');delivery=Path(''delivery'')

        shutil.copytree(root/''combined-delivery/apk'',delivery/''apk'')

        shutil.copytree(root/''combined-delivery/proof'',delivery/''proof'')

        shutil.copy2(root/''android-postbuild-verified.json'',delivery/''android-postbuild-verified.json'')

        shutil.copytree(''build/reused/verified'',delivery/''reused-native'')

        PY'
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: logs6-postbuild-evidence-${{ github.sha }}
        path: 'build/android-artifacts/*/postbuild-verified.json

          build/android-artifacts/android-postbuild-verified.json

          '
        if-no-files-found: warn
        retention-days: 14
    - uses: actions/upload-artifact@v4
      with:
        name: logs6-postbuild-delivery-${{ github.sha }}
        path: delivery/
        if-no-files-found: error
        retention-days: 14
  media3:
    name: Fresh real Media3 playback/download runtime (all20 contracts)
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false
        fetch-depth: 0
    - name: Materialize exact Media3 test source and record probe or full-app scope
      run: python3 .review/subtitle-logs6/build/verify_source.py --case combined-delivery --source-commit 04612e42fc58776d947062e908d32ce7322e58cf
        --target source-app --proof build/review/source-verified.json
    - uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '17'
    - uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: '8.9'
    - uses: android-actions/setup-android@v3
      with:
        packages: platform-tools
        log-accepted-android-sdk-licenses: false
    - name: Install probe SDK, NDK, CMake and deterministic media tools
      run: 'sudo apt-get update -qq

        sudo apt-get install -y ffmpeg

        sdkmanager ''platforms;android-35'' ''build-tools;35.0.0'' ''ndk;27.2.12479018'' ''cmake;3.22.1'''
    - name: Stage exact NvPlayer and helpers and generate local MP4/HLS assets
      run: 'bash .review/subtitle-logs6/android/stage.sh "$GITHUB_WORKSPACE/source-app"

        bash .review/subtitle-logs6/android/generate-fixture.sh

        gradle -p .review/subtitle-logs6/android --console=plain :probe:assembleDebug :probe:assembleDebugAndroidTest'
    - name: Enable KVM permissions
      run: 'echo ''KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"'' | sudo tee /etc/udev/rules.d/99-kvm4all.rules

        sudo udevadm control --reload-rules

        sudo udevadm trigger --name-match=kvm'
    - uses: reactivecircus/android-emulator-runner@v2
      with:
        api-level: 35
        arch: x86_64
        target: google_apis
        disable-animations: true
        script: bash .review/subtitle-logs6/android/startup-diagnostics/run-runtime.sh "$GITHUB_WORKSPACE/.review/subtitle-logs6/android"
          "$GITHUB_WORKSPACE/build/review/startup-runtime" all
    - name: Record exact failed or skipped runtime assertions
      if: always()
      run: python3 .review/subtitle-logs6/build/report_instrumentation_failures.py
    - name: Verify staged compiled NvPlayer JNI lookup descriptors
      run: python3 .review/subtitle-logs6/build/verify_jni.py --source source-app --classes .review/subtitle-logs6/android/probe/build/tmp/kotlin-classes/debug
        --source-proof build/review/source-verified.json --output build/review/probe-jni-verified.json
    - name: Require all real-player contracts with no ignored tests
      run: python3 .review/subtitle-logs6/build/verify_instrumentation.py
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: subtitle-logs6-media3-${{ github.sha }}
        path: 'build/review/

          .review/subtitle-logs6/android/player-source.sha256

          .review/subtitle-logs6/android/probe/build/reports/

          .review/subtitle-logs6/android/probe/build/outputs/androidTest-results/'
        retention-days: 14
        include-hidden-files: true
  publish:
    name: Publish compatible update after fresh runtime and exact-APK validation
    needs:
    - postbuild
    - media3
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false
        fetch-depth: 0
    - uses: actions/download-artifact@v4
      with:
        name: logs6-postbuild-delivery-${{ github.sha }}
        path: delivery
    - uses: actions/download-artifact@v4
      with:
        name: subtitle-logs6-media3-${{ github.sha }}
        path: delivery/media3-artifact
    - name: Verify fresh20runtime passes, actual APKs and honest validation provenance, then publish
      env:
        GH_TOKEN: ${{ github.token }}
        GH_REPO: ${{ github.repository }}
        PLANNED_SOURCE: 04612e42fc58776d947062e908d32ce7322e58cf
      run: "python3 .review/subtitle-logs6-postbuild/prepare_release.py\nif gh release view tv-mobile-test-local-logs-v6 >/dev/null\
        \ 2>&1; then\n  echo 'The unique Logs6 tag already exists; no assets will be overwritten.'\n  exit 1\nfi\npython3\
        \ .review/subtitle-logs6/build/create_release_tag.py\ngh release create tv-mobile-test-local-logs-v6 --verify-tag\
        \ delivery/Nuvio-TV-Mobile-Test-Logs6.apk delivery/Nuvio-TV-Mobile-Test-Logs6.apk.sha256 delivery/proof/update-identity.json\
        \ delivery/proof/media3-verified.json delivery/proof/native-gates-verified.json delivery/proof/standalone-native-gates-verified.json\
        \ delivery/proof/android-postbuild-verified.json delivery/proof/validation-origin.json delivery/proof/release-tag.json\
        \ --target \"$PLANNED_SOURCE\" --prerelease --latest=false --title 'Nuvio TV/Mobile Test: Subtitle names and log actions\
        \ 6' --notes-file delivery/release-notes.txt"
