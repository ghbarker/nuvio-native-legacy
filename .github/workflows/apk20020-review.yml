{
  "name": "APK20020 exact integrated source review",
  "run-name": "APK20020 full fresh gates ${{ github.sha }}",
  "on": {
    "push": {
      "branches": [
        "review/apk20020-20261015"
      ],
      "paths": [
        ".review/apk20020/**",
        ".github/workflows/apk20020-review.yml"
      ]
    },
    "workflow_dispatch": {}
  },
  "permissions": {
    "contents": "read",
    "actions": "read"
  },
  "concurrency": {
    "group": "apk20020-${{ github.ref }}",
    "cancel-in-progress": false
  },
  "env": {
    "NUVIO_REVIEW_PLAN_SHA256": "cf27a518e8854bfbacdf867204141b2bb3cdbdf331197f80e41b4a1c74ac5935",
    "ASAN_OPTIONS": "detect_leaks=0:halt_on_error=1",
    "UBSAN_OPTIONS": "halt_on_error=1:print_stacktrace=1"
  },
  "jobs": {
    "native": {
      "name": "Complete macOS TV/Mobile + actual changed native contracts",
      "runs-on": "macos-14",
      "timeout-minutes": 90,
      "steps": [
        {
          "uses": "actions/checkout@v4",
          "with": {
            "persist-credentials": false,
            "fetch-depth": 0
          }
        },
        {
          "name": "Materialize exact approved product source",
          "run": "python3 .review/apk20020/materialize.py --layer product --output source-product --proof build/review/apk20020/product-source.json --base-repository \"$GITHUB_WORKSPACE\""
        },
        {
          "name": "Materialize exact approved test source",
          "run": "python3 .review/apk20020/materialize.py --layer test --output source-test --proof build/review/apk20020/test-source.json --base-repository \"$GITHUB_WORKSPACE\""
        },
        {
          "name": "Install real SDKs and capture system driver before wrappers",
          "run": "brew install sdl2 sdl2_image sdl2_ttf sdl3\nreview_driver=\"$(command -v cc)\"\ntest \"$review_driver\" = /usr/bin/cc\necho \"NUVIO_REVIEW_REAL_CC=$review_driver\" >> \"$GITHUB_ENV\"\n\"$review_driver\" --version\n"
        },
        {
          "name": "Install reader metric dependency in isolated Python environment",
          "run": "python3 -m venv \"$RUNNER_TEMP/apk20020-python\"\n\"$RUNNER_TEMP/apk20020-python/bin/python\" -m pip install fonttools==4.60.1\necho \"$RUNNER_TEMP/apk20020-python/bin\" >> \"$GITHUB_PATH\""
        },
        {
          "name": "Fresh SDK sanity, actual contracts and four complete application links",
          "run": "python3 .review/apk20020/native/run.py --product source-product --test source-test --product-proof build/review/apk20020/product-source.json --test-proof build/review/apk20020/test-source.json --cc \"$NUVIO_REVIEW_REAL_CC\" --output build/review/apk20020/native"
        },
        {
          "uses": "actions/upload-artifact@v4",
          "if": "always()",
          "with": {
            "name": "apk20020-native-${{ github.sha }}",
            "path": "build/review/apk20020/",
            "if-no-files-found": "error",
            "retention-days": 14
          }
        }
      ]
    },
    "feature-contracts": {
      "name": "Focused caption/libass and collection source contracts",
      "runs-on": "ubuntu-24.04",
      "timeout-minutes": 30,
      "steps": [
        {
          "uses": "actions/checkout@v4",
          "with": {
            "persist-credentials": false,
            "fetch-depth": 0
          }
        },
        {
          "name": "Materialize exact approved product source",
          "run": "python3 .review/apk20020/materialize.py --layer product --output source-product --proof build/review/apk20020/product-source.json --base-repository \"$GITHUB_WORKSPACE\""
        },
        {
          "name": "Materialize exact approved test source",
          "run": "python3 .review/apk20020/materialize.py --layer test --output source-test --proof build/review/apk20020/test-source.json --base-repository \"$GITHUB_WORKSPACE\""
        },
        {
          "name": "Install proven actual libass and fixture compiler dependencies",
          "run": "sudo apt-get update -qq\nsudo apt-get install -y build-essential pkg-config libass-dev python3-fonttools fonts-dejavu-core\n/usr/bin/cc --version\npkg-config --modversion libass"
        },
        {
          "name": "Fresh actual combined caption/style and collection contracts, normal and ASan/UBSan",
          "run": "python3 .review/apk20020/feature-contracts/run.py --product source-product --test source-test --product-proof build/review/apk20020/product-source.json --test-proof build/review/apk20020/test-source.json --cc /usr/bin/cc --output build/review/apk20020/feature-contracts"
        },
        {
          "uses": "actions/upload-artifact@v4",
          "if": "always()",
          "with": {
            "name": "apk20020-features-${{ github.sha }}",
            "path": "build/review/apk20020/",
            "if-no-files-found": "error",
            "retention-days": 14
          }
        }
      ]
    },
    "original-fontepref": {
      "name": "Original complete fontepref normal + ASan/UBSan",
      "runs-on": "macos-14",
      "timeout-minutes": 70,
      "steps": [
        {
          "uses": "actions/checkout@v4",
          "with": {
            "persist-credentials": false,
            "fetch-depth": 0
          }
        },
        {
          "name": "Materialize exact approved product source",
          "run": "python3 .review/apk20020/materialize.py --layer product --output source-product --proof build/review/apk20020/product-source.json --base-repository \"$GITHUB_WORKSPACE\""
        },
        {
          "name": "Install real SDKs and capture system driver before wrappers",
          "run": "brew install sdl2 sdl2_image sdl2_ttf sdl3\nreview_driver=\"$(command -v cc)\"\ntest \"$review_driver\" = /usr/bin/cc\necho \"NUVIO_REVIEW_REAL_CC=$review_driver\" >> \"$GITHUB_ENV\"\n\"$review_driver\" --version\n"
        },
        {
          "name": "Compile and run real system SDK sanity before full-source suites",
          "run": "python3 .review/apk20020/sdk_sanity.py --output build/review/apk20020/sdk-fontepref"
        },
        {
          "name": "Original full-source fontepref normal",
          "run": "python3 .review/apk20020/original3/run.py --source source-product --source-proof build/review/apk20020/product-source.json --suite fontepref --wrapper .review/apk20020/original3/cc_rpath.py --mode normal --output build/review/apk20020/original-fontepref-normal"
        },
        {
          "name": "Original full-source fontepref asan",
          "run": "python3 .review/apk20020/original3/run.py --source source-product --source-proof build/review/apk20020/product-source.json --suite fontepref --wrapper .review/apk20020/original3/cc_rpath.py --mode asan --output build/review/apk20020/original-fontepref-asan"
        },
        {
          "uses": "actions/upload-artifact@v4",
          "if": "always()",
          "with": {
            "name": "apk20020-original-fontepref-${{ github.sha }}",
            "path": "build/review/apk20020/",
            "if-no-files-found": "error",
            "retention-days": 14
          }
        }
      ]
    },
    "original-fontepref_file": {
      "name": "Original complete fontepref_file normal + ASan/UBSan",
      "runs-on": "macos-14",
      "timeout-minutes": 70,
      "steps": [
        {
          "uses": "actions/checkout@v4",
          "with": {
            "persist-credentials": false,
            "fetch-depth": 0
          }
        },
        {
          "name": "Materialize exact approved product source",
          "run": "python3 .review/apk20020/materialize.py --layer product --output source-product --proof build/review/apk20020/product-source.json --base-repository \"$GITHUB_WORKSPACE\""
        },
        {
          "name": "Install real SDKs and capture system driver before wrappers",
          "run": "brew install sdl2 sdl2_image sdl2_ttf sdl3\nreview_driver=\"$(command -v cc)\"\ntest \"$review_driver\" = /usr/bin/cc\necho \"NUVIO_REVIEW_REAL_CC=$review_driver\" >> \"$GITHUB_ENV\"\n\"$review_driver\" --version\n"
        },
        {
          "name": "Compile and run real system SDK sanity before full-source suites",
          "run": "python3 .review/apk20020/sdk_sanity.py --output build/review/apk20020/sdk-fontepref_file"
        },
        {
          "name": "Original full-source fontepref_file normal",
          "run": "python3 .review/apk20020/original3/run.py --source source-product --source-proof build/review/apk20020/product-source.json --suite fontepref_file --wrapper .review/apk20020/original3/cc_rpath.py --mode normal --output build/review/apk20020/original-fontepref_file-normal"
        },
        {
          "name": "Original full-source fontepref_file asan",
          "run": "python3 .review/apk20020/original3/run.py --source source-product --source-proof build/review/apk20020/product-source.json --suite fontepref_file --wrapper .review/apk20020/original3/cc_rpath.py --mode asan --output build/review/apk20020/original-fontepref_file-asan"
        },
        {
          "uses": "actions/upload-artifact@v4",
          "if": "always()",
          "with": {
            "name": "apk20020-original-fontepref_file-${{ github.sha }}",
            "path": "build/review/apk20020/",
            "if-no-files-found": "error",
            "retention-days": 14
          }
        }
      ]
    },
    "original-player_retido": {
      "name": "Original complete player_retido normal + ASan/UBSan",
      "runs-on": "macos-14",
      "timeout-minutes": 70,
      "steps": [
        {
          "uses": "actions/checkout@v4",
          "with": {
            "persist-credentials": false,
            "fetch-depth": 0
          }
        },
        {
          "name": "Materialize exact approved product source",
          "run": "python3 .review/apk20020/materialize.py --layer product --output source-product --proof build/review/apk20020/product-source.json --base-repository \"$GITHUB_WORKSPACE\""
        },
        {
          "name": "Install real SDKs and capture system driver before wrappers",
          "run": "brew install sdl2 sdl2_image sdl2_ttf sdl3\nreview_driver=\"$(command -v cc)\"\ntest \"$review_driver\" = /usr/bin/cc\necho \"NUVIO_REVIEW_REAL_CC=$review_driver\" >> \"$GITHUB_ENV\"\n\"$review_driver\" --version\n"
        },
        {
          "name": "Compile and run real system SDK sanity before full-source suites",
          "run": "python3 .review/apk20020/sdk_sanity.py --output build/review/apk20020/sdk-player_retido"
        },
        {
          "name": "Original full-source player_retido normal",
          "run": "python3 .review/apk20020/original3/run.py --source source-product --source-proof build/review/apk20020/product-source.json --suite player_retido --wrapper .review/apk20020/original3/cc_rpath.py --mode normal --output build/review/apk20020/original-player_retido-normal"
        },
        {
          "name": "Original full-source player_retido asan",
          "run": "python3 .review/apk20020/original3/run.py --source source-product --source-proof build/review/apk20020/product-source.json --suite player_retido --wrapper .review/apk20020/original3/cc_rpath.py --mode asan --output build/review/apk20020/original-player_retido-asan"
        },
        {
          "uses": "actions/upload-artifact@v4",
          "if": "always()",
          "with": {
            "name": "apk20020-original-player_retido-${{ github.sha }}",
            "path": "build/review/apk20020/",
            "if-no-files-found": "error",
            "retention-days": 14
          }
        }
      ]
    },
    "android": {
      "name": "APK20020 clean product and compatible test APK (ARM32/ARM64)",
      "runs-on": "ubuntu-24.04",
      "timeout-minutes": 90,
      "permissions": {
        "contents": "read"
      },
      "env": {
        "APK20020_REVIEW_ROOT": ".review/apk20020",
        "NUVIO_ANDROID_JOBS": "2",
        "NUVIO_BUILD_JOBS": "2"
      },
      "steps": [
        {
          "uses": "actions/checkout@v4",
          "with": {
            "persist-credentials": false,
            "fetch-depth": 0
          }
        },
        {
          "name": "Materialize and verify final product and isolated test layers",
          "run": "python3 .review/apk20020/materialize.py --layer product --output \"$GITHUB_WORKSPACE/source-product\" --proof \"$GITHUB_WORKSPACE/build/review/apk20020/product-source.json\" --base-repository \"$GITHUB_WORKSPACE\"\npython3 .review/apk20020/materialize.py --layer test --output \"$GITHUB_WORKSPACE/source-test\" --proof \"$GITHUB_WORKSPACE/build/review/apk20020/test-source.json\" --base-repository \"$GITHUB_WORKSPACE\""
        },
        {
          "uses": "actions/setup-java@v4",
          "with": {
            "distribution": "temurin",
            "java-version": "17"
          }
        },
        {
          "uses": "android-actions/setup-android@v3",
          "with": {
            "packages": "platform-tools",
            "log-accepted-android-sdk-licenses": false
          }
        },
        {
          "name": "Install real Android and native build SDKs",
          "run": "command -v sdkmanager >/dev/null\nsudo apt-get update -qq\nsudo apt-get install -y ninja-build cmake nasm ffmpeg python3-pil zlib1g-dev\nsdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'ndk;27.2.12479018' 'cmake;3.22.1'"
        },
        {
          "name": "Prepare private configuration and persistent debug signing",
          "env": {
            "NUVIO_TOUCH_CORE_PROPERTIES": "${{ secrets.NUVIO_TOUCH_CORE_PROPERTIES }}",
            "NUVIO_TOUCH_DEBUG_KEYSTORE_B64": "${{ secrets.NUVIO_TOUCH_DEBUG_KEYSTORE_B64 }}"
          },
          "run": "python3 .review/apk20020/android/prepare_env.py --output \"$RUNNER_TEMP/nuvio-apk20020-private\""
        },
        {
          "uses": "actions/cache/restore@v4",
          "id": "native-cache",
          "with": {
            "path": "~/.cache/nuvio-android",
            "key": "apk20020-native-v1-${{ runner.os }}-${{ hashFiles('source-product/tools/android/deps.sh', 'source-product/tools/android/ffmpeg-android.sh', 'source-product/android/app/src/main/cpp/CMakeLists.txt') }}",
            "restore-keys": "apk20020-native-v1-${{ runner.os }}-\napk20019-native-v1-${{ runner.os }}-\nlogs8-native-v2-${{ runner.os }}-\nandroid-touch-native-v1-${{ runner.os }}-"
          }
        },
        {
          "uses": "actions/cache/restore@v4",
          "id": "gradle-cache",
          "with": {
            "path": "~/.gradle/caches\n~/.gradle/wrapper",
            "key": "apk20020-gradle-v1-${{ runner.os }}-${{ hashFiles('source-product/android/**/*.gradle.kts', 'source-product/android/gradle/wrapper/gradle-wrapper.properties', 'source-test/android/**/*.gradle.kts') }}",
            "restore-keys": "apk20020-gradle-v1-${{ runner.os }}-\napk20019-gradle-v1-${{ runner.os }}-\nlogs8-gradle-v2-${{ runner.os }}-\nandroid-touch-gradle-${{ runner.os }}-"
          }
        },
        {
          "name": "Record safe cache restoration outcomes",
          "env": {
            "APK20020_NATIVE_CACHE_PRIMARY": "${{ steps.native-cache.outputs.cache-primary-key }}",
            "APK20020_NATIVE_CACHE_MATCHED": "${{ steps.native-cache.outputs.cache-matched-key }}",
            "APK20020_NATIVE_CACHE_HIT": "${{ steps.native-cache.outputs.cache-hit }}",
            "APK20020_GRADLE_CACHE_PRIMARY": "${{ steps.gradle-cache.outputs.cache-primary-key }}",
            "APK20020_GRADLE_CACHE_MATCHED": "${{ steps.gradle-cache.outputs.cache-matched-key }}",
            "APK20020_GRADLE_CACHE_HIT": "${{ steps.gradle-cache.outputs.cache-hit }}"
          },
          "run": "python3 .review/apk20020/android/record_cache.py --output build/review/apk20020/cache-restoration.json"
        },
        {
          "name": "Build and verify clean standard product APK with both ARM cores",
          "run": "python3 .review/apk20020/android/run.py --layer product --source source-product --source-proof build/review/apk20020/product-source.json --output build/review/apk20020/android-product --jobs 2"
        },
        {
          "name": "Build and verify account-compatible APK20020 update with isolated diagnostics",
          "run": "python3 .review/apk20020/android/run.py --layer test --source source-test --source-proof build/review/apk20020/test-source.json --output build/review/apk20020/android-test --jobs 2"
        },
        {
          "name": "Record only safe cache/output presence",
          "id": "outputs",
          "if": "always()",
          "run": "if [[ -d \"$HOME/.cache/nuvio-android\" ]]; then echo 'native_cache=true' >> \"$GITHUB_OUTPUT\"; fi\nif [[ -d \"$HOME/.gradle/caches\" || -d \"$HOME/.gradle/wrapper\" ]]; then echo 'gradle_cache=true' >> \"$GITHUB_OUTPUT\"; fi"
        },
        {
          "uses": "actions/cache/save@v4",
          "if": "always() && steps.outputs.outputs.native_cache == 'true' && steps.native-cache.outputs.cache-hit != 'true' && steps.native-cache.outputs.cache-primary-key != ''",
          "with": {
            "path": "~/.cache/nuvio-android",
            "key": "${{ steps.native-cache.outputs.cache-primary-key }}"
          }
        },
        {
          "uses": "actions/cache/save@v4",
          "if": "always() && steps.outputs.outputs.gradle_cache == 'true' && steps.gradle-cache.outputs.cache-hit != 'true' && steps.gradle-cache.outputs.cache-primary-key != ''",
          "with": {
            "path": "~/.gradle/caches\n~/.gradle/wrapper",
            "key": "${{ steps.gradle-cache.outputs.cache-primary-key }}"
          }
        },
        {
          "uses": "actions/upload-artifact@v4",
          "if": "always()",
          "with": {
            "name": "apk20020-android-${{ github.sha }}",
            "path": "build/review/apk20020/",
            "if-no-files-found": "error",
            "retention-days": 14
          }
        },
        {
          "name": "Delete private runner configuration",
          "if": "always()",
          "run": "python3 .review/apk20020/android/cleanup_private.py --directory \"$RUNNER_TEMP/nuvio-apk20020-private\""
        }
      ]
    },
    "jvm": {
      "name": "Fresh32 JVM helpers +15 real Media3 contracts",
      "runs-on": "ubuntu-24.04",
      "timeout-minutes": 45,
      "permissions": {
        "contents": "read"
      },
      "steps": [
        {
          "uses": "actions/checkout@v4",
          "with": {
            "persist-credentials": false,
            "fetch-depth": 0
          }
        },
        {
          "name": "Materialize exact root-approved test source",
          "run": "python3 .review/apk20020/materialize.py --layer test --output source-test --proof build/review/apk20020/test-source.json --base-repository \"$GITHUB_WORKSPACE\""
        },
        {
          "uses": "actions/setup-java@v4",
          "with": {
            "distribution": "temurin",
            "java-version": "21"
          }
        },
        {
          "uses": "gradle/actions/setup-gradle@v4",
          "with": {
            "gradle-version": "8.9"
          }
        },
        {
          "uses": "android-actions/setup-android@v3",
          "with": {
            "packages": "platform-tools",
            "log-accepted-android-sdk-licenses": false
          }
        },
        {
          "name": "Install exact probe SDK and media generator",
          "run": "command -v sdkmanager >/dev/null\nsudo apt-get update -qq\nsudo apt-get install -y ffmpeg\nsdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'ndk;27.2.12479018' 'cmake;3.22.1' 'emulator'"
        },
        {
          "uses": "actions/cache@v4",
          "with": {
            "path": "~/.cache/nuvio-kotlin-preflight",
            "key": "apk20020-kotlin-tools-v1-${{ runner.os }}-${{ hashFiles('.review/logs8/kotlin/tools.json') }}",
            "restore-keys": "apk20020-kotlin-tools-v1-${{ runner.os }}-\napk20019-kotlin-tools-v1-${{ runner.os }}-"
          }
        },
        {
          "name": "Run fresh32 actual helper contracts",
          "run": "python3 .review/apk20020/jvm/run.py --phase helpers --source source-test --source-proof build/review/apk20020/test-source.json --output build/review/apk20020/jvm"
        },
        {
          "name": "Stage unchanged assertions and build exact current Media3 probe",
          "run": "python3 .review/apk20020/jvm/run.py --phase prepare-media3 --source source-test --source-proof build/review/apk20020/test-source.json --output build/review/apk20020/jvm"
        },
        {
          "name": "Enable KVM permissions",
          "run": "echo 'KERNEL==\"kvm\", GROUP=\"kvm\", MODE=\"0666\", OPTIONS+=\"static_node=kvm\"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules\nsudo udevadm control --reload-rules\nsudo udevadm trigger --name-match=kvm"
        },
        {
          "uses": "reactivecircus/android-emulator-runner@v2",
          "with": {
            "api-level": 35,
            "arch": "x86_64",
            "target": "google_apis",
            "disable-animations": true,
            "script": "python3 .review/apk20020/jvm/run.py --phase media3 --source source-test --source-proof build/review/apk20020/test-source.json --output build/review/apk20020/jvm"
          }
        },
        {
          "name": "Require all47 fresh contracts from this exact source",
          "run": "python3 .review/apk20020/jvm/run.py --phase verify --source source-test --source-proof build/review/apk20020/test-source.json --output build/review/apk20020/jvm"
        },
        {
          "uses": "actions/upload-artifact@v4",
          "if": "always()",
          "with": {
            "name": "apk20020-jvm47-${{ github.sha }}",
            "path": "build/review/apk20020/jvm/*.json\nbuild/review/apk20020/jvm/*.log\nbuild/review/apk20020/jvm/kotlin/kotlin-verified.json\nbuild/review/apk20020/jvm/kotlin/*.log\nbuild/review/apk20020/jvm/media3-runtime/\nbuild/review/apk20020/jvm/media3-probe/probe/build/outputs/androidTest-results/\nbuild/review/apk20020/jvm/media3-probe/probe/build/reports/androidTests/",
            "if-no-files-found": "error",
            "retention-days": 14
          }
        }
      ]
    },
    "all-gates": {
      "name": "Require every fresh source-bound gate",
      "runs-on": "ubuntu-24.04",
      "needs": [
        "native",
        "feature-contracts",
        "original-fontepref",
        "original-fontepref_file",
        "original-player_retido",
        "android",
        "jvm"
      ],
      "if": "always()",
      "timeout-minutes": 15,
      "env": {
        "APK20020_JOB_RESULTS": "${{ toJSON(needs) }}"
      },
      "steps": [
        {
          "uses": "actions/checkout@v4",
          "with": {
            "persist-credentials": false,
            "fetch-depth": 0
          }
        },
        {
          "uses": "actions/download-artifact@v4",
          "with": {
            "pattern": "apk20020-*-${{ github.sha }}",
            "path": "gate-artifacts",
            "merge-multiple": false
          }
        },
        {
          "name": "Verify actual receipts, six original modes and pristine compatible APK",
          "run": "python3 .review/apk20020/aggregate.py --artifacts gate-artifacts --output build/review/apk20020/all-gates-verified.json --job-results-json \"$APK20020_JOB_RESULTS\""
        },
        {
          "uses": "actions/upload-artifact@v4",
          "if": "always()",
          "with": {
            "name": "apk20020-all-gates-${{ github.sha }}",
            "path": "build/review/apk20020/",
            "if-no-files-found": "error",
            "retention-days": 14
          }
        }
      ]
    }
  }
}
