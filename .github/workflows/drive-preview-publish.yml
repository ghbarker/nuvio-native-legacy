name: Publish verified Drive test APK
on:
  workflow_dispatch:
  push:
    branches: [review/logs34-integration-20261017]
    paths: [.github/workflows/drive-preview-publish.yml]
jobs:
  publish:
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Nuvio-TV-Mobile-Test-Logs58-f94dc17713a3e49cc725969df221277bc5fecc90
          run-id: 39154147636
          github-token: ${{ github.token }}
      - name: Verify exact checked artifact and attach final check results
        run: |
          python3 - <<'PY'
          import hashlib,json,pathlib,zipfile
          apk=pathlib.Path('Nuvio-TV-Mobile-Test-Logs58.apk')
          assert hashlib.sha256(apk.read_bytes()).hexdigest()=='f606b704531baabb2462ae3a1791b5fb619af7c3073d1277860ca0182fd67caf'
          report=pathlib.Path('Logs58-validation.json');d=json.loads(report.read_text())
          assert d['source_commit']=='3cc639cc6ee29314f194f4547905041ac65c093c'
          assert d['source_tree']=='66a7eb96c8305ca5a343150159e1de56b477d215'
          assert d['package']=='space.nuvio.nativelegacy.touch' and d['version_code']==20068
          assert d['certificate_sha256']=='862d7ef63a0dbde2929f6f231cae295510726d9ac28f9292496d2a38304be5e6'
          with zipfile.ZipFile(apk) as z:
              assert 'lib/arm64-v8a/libmain.so' in z.namelist() and 'lib/armeabi-v7a/libmain.so' in z.namelist()
          d.update(automated_checks_passed=True,native_account_regressions=True,sanitizer_regressions=True,macos_full_source_checks=True,live_google_roundtrip='user confirmed save and restore on Logs57; addon reload fix awaits Logs58 verification',android_authorization_result_routing_test=True)
          d['check_runs']={'android':39154147636,'linux_native':39154254021,'macos_native':39154253636}
          d['native_test_source']='33f6eff3172ff43ffb308552bf0c7d1795c9f1e7; production code identical to APK source; only test export expectation corrected'
          report.write_text(json.dumps(d,indent=2)+'\n')
          PY
      - name: Check completed runs and upload the test release assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ghbarker/nuvio-native-legacy
        run: |
          set -euo pipefail
          for id in 39154254021 39154253636; do
            test "$(gh api "repos/$GH_REPO/actions/runs/$id" --jq .conclusion)" = success
          done
          test "$(gh api "repos/$GH_REPO/actions/runs/39154147636/jobs" --jq '[.jobs[] | select(.name=="apk-build" and .conclusion=="success")] | length')" = 1
          test "$(gh api "repos/$GH_REPO/compare/3cc639cc6ee29314f194f4547905041ac65c093c...33f6eff3172ff43ffb308552bf0c7d1795c9f1e7" --jq '.files | map(.filename) | join(",")')" = tests/backup_restore_addons.c
          cat > notes.txt <<'NOTES'
          Fix the empty addon list after Google Drive restore. Reload the current profile addon cache and resume sync before returning Home. Update the existing Nuvio TV/Mobile Test app; keep accounts and settings.

          Settings > Account and services > Google Drive backup.

          Phones use Google account authorization. TVs use the Google device-code screen. Backups are stored in your own private Nuvio Backups folder using drive.file permission.

          This preview backs up local scalar settings, playback/subtitle appearance, and native source/filter/failover preferences. Nuvio-synced data, account credentials, logs, imported font files, collection presentation overrides and Live TV account definitions are not exported.

          Android APK and unit tests passed. Linux and macOS native backup/restore and profile isolation passed normally and under ASan/UBSan. Package, version, persistent signer, ARM64/ARMv7 and 16KB alignment verified. Check links are in Logs58-validation.json.

          Google sign-in, save and restore were tested on Logs57. This update needs verification that addons and collections are available immediately after repeated restores. This is a limited settings backup preview; it does not yet cover all local settings or API keys. No upstream Drive PR has been submitted.
          NOTES
          gh release create tv-mobile-test-logs-v58 Nuvio-TV-Mobile-Test-Logs58.apk Logs58-validation.json --target 3cc639cc6ee29314f194f4547905041ac65c093c --title 'TV/Mobile Test Logs58: Google Drive backup preview' --notes-file notes.txt --prerelease
