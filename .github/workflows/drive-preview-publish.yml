name: Publish verified encrypted Drive test APK
on:
  workflow_dispatch:
  push:
    branches: [review/logs34-integration-20261017]
    paths: [.github/workflows/drive-preview-publish.yml]
jobs:
  publish:
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ghbarker/nuvio-native-legacy
    steps:
      - name: Require completed Android and Linux/macOS checks
        run: |
          python3 - <<'PYVERIFY'
          import json,subprocess
          for run in (39160901016,39160900704):
              d=json.loads(subprocess.check_output(['gh','api',f'repos/ghbarker/nuvio-native-legacy/actions/runs/{run}']))
              assert d['status']=='completed' and d['conclusion']=='success'
              assert d['head_sha']=='0bd1ba4ca386126a7babc27e56fc2787acf7744a'
          jobs=json.loads(subprocess.check_output(['gh','api','repos/ghbarker/nuvio-native-legacy/actions/runs/39160900704/jobs']))['jobs']
          assert len(jobs)==8 and all(j['conclusion']=='success' for j in jobs)
          PYVERIFY
      - uses: actions/download-artifact@v4
        with:
          name: Nuvio-TV-Mobile-Test-Logs60-0bd1ba4ca386126a7babc27e56fc2787acf7744a
          run-id: 39160901016
          github-token: ${{ github.token }}
      - name: Verify exact APK and record validation
        run: |
          python3 - <<'PYVERIFY'
          import hashlib,json,pathlib,zipfile
          apk=pathlib.Path('Nuvio-TV-Mobile-Test-Logs60.apk')
          assert hashlib.sha256(apk.read_bytes()).hexdigest()=='631bd906265fd50670183294e9fcb3648ff2952723c1a672e5c6f0e927986c9b'
          p=pathlib.Path('Logs60-validation.json');d=json.loads(p.read_text())
          assert d['source_commit']=='fbe68ad946d7c818e547cd1ee3b39e353a974106'
          assert d['source_tree']=='c334b87453f0d28800e22e166b9df2b8824cf2f8'
          assert d['package']=='space.nuvio.nativelegacy.touch' and d['version_code']==20070
          assert d['version_name']=='2.0.70-test-logs60'
          assert d['certificate_sha256']=='862d7ef63a0dbde2929f6f231cae295510726d9ac28f9292496d2a38304be5e6'
          with zipfile.ZipFile(apk) as z:
              assert z.testzip() is None
              assert 'lib/arm64-v8a/libmain.so' in z.namelist() and 'lib/armeabi-v7a/libmain.so' in z.namelist()
          d.pop('all_passed',None)
          d.update(automated_checks_passed=True,native_account_regressions=True,sanitizer_regressions=True,macos_full_source_checks=True,android_unit_tests=True,arm64_16kb_alignment=True)
          d['check_runs']={'android':39160901016,'linux_macos':39160900704}
          d['live_encrypted_drive_roundtrip']='Awaiting user test; no upstream PR published'
          d['excluded_logins']='Nuvio, Google Drive, Trakt, Discord and Simkl login sessions remain device-local'
          d['password']='Chosen by user in app, never uploaded or persisted'
          p.write_text(json.dumps(d,indent=2)+'\n')
          PYVERIFY
      - name: Publish update-compatible preview and test steps
        run: |
          set -euo pipefail
          cat > notes.txt <<'NOTES'
          Update Nuvio TV/Mobile Test without uninstalling.
          
          The mobile keyboard now shows Create, Confirm and Restore password instructions. Native subtitle/audio language overrides and other missed native-only choices are included in new encrypted backups. Nuvio-synced settings remain separate; rotating service logins remain excluded and hardware restore remains opt-in.
          
          Create a NEW backup after updating. Older backups did not contain the missing language fields. Update both devices to Logs60 before testing cross-device restore.
          
          Android build/unit tests and Linux/macOS normal and ASan/UBSan backup/restore checks passed. Package, increasing version, persistent signer, ARM64/ARMv7 and 16KB alignment verified. Exact checks are recorded in Logs60-validation.json.
          
          See Logs60-test-steps.txt. The Drive PR is waiting for approval of this build.
          NOTES
          cat > Logs60-test-steps.txt <<'TESTSTEPS'
          Logs60 — native settings coverage and password instructions
          
          Install this APK as an UPDATE to Nuvio TV/Mobile Test. Do not uninstall.
          Create a NEW backup in Logs60: earlier backups never contained the missing language fields.
          
          1. In Settings, choose your desired main and second subtitle languages and main and second audio languages. Choose two recognizable native settings too, such as synopsis size and the Continue Watching card tap action. Note the values.
          2. Open Settings > Account and services > Google Drive backup > Make backup now. The phone input panel should say Create a backup password. Enter at least 8 characters and press the keyboard Done/confirm key. The next panel should say Confirm the backup password; enter exactly the same password. Wait for Backup saved.
          3. Change those language choices and native settings to different values. Return to Drive backup > Restore backup and select the NEW backup. The input panel should identify that it needs the password for this backup.
          4. Try a wrong password first. It must report a password error and leave settings unchanged. Select the backup again and enter the correct password. Leave Include hardware settings Off and confirm Restore.
          5. Verify all four language choices and the native settings returned. Addons and collections should work immediately. Close and reopen the app and verify the restored choices persist.
          6. Open Search or another normal text input. It must show its own heading, with no old password instructions. Optional TV check: remote keyboard entry still works normally.
          
          Nuvio-synced settings remain separate. Existing service logins are preserved; rotating Trakt/Discord tokens are not backed up. Hardware settings still require opt-in. New backups remain encrypted on the device with your password.
          
          No upstream Drive backup PR will be submitted until this build is approved.
          TESTSTEPS
          gh release create tv-mobile-test-logs-v60 Nuvio-TV-Mobile-Test-Logs60.apk Logs60-validation.json Logs60-test-steps.txt --target fbe68ad946d7c818e547cd1ee3b39e353a974106 --title 'TV/Mobile Test Logs60: backup languages and password instructions' --notes-file notes.txt --prerelease
