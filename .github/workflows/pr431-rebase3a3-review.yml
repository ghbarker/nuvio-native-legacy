{
  "name": "PR431 Android-only external fixture compatibility recovery",
  "on": {
    "push": {
      "branches": [
        "review/pr431-rebase3a3-android-recovery-20261015"
      ]
    }
  },
  "permissions": {
    "contents": "read"
  },
  "concurrency": {
    "group": "pr431-rebase3a3-android-recovery-${{ github.sha }}-${{ github.run_attempt }}",
    "cancel-in-progress": false
  },
  "env": {
    "REBASE_PLAN_SHA256": "98b26e61eb1c2c8c1503528295d330fc607599331c4ab752e60e443244dd52a7",
    "PYTHONPATH": "${{ github.workspace }}/.review/pr431-rebase3a3",
    "ASAN_OPTIONS": "detect_leaks=0:halt_on_error=1",
    "UBSAN_OPTIONS": "halt_on_error=1:print_stacktrace=1",
    "REBASE_PR": "431"
  },
  "jobs": {
    "android": {
      "name": "PR431 Linux runtime70, Kotlin2 and Android ARM32/ARM64",
      "runs-on": "ubuntu-24.04",
      "timeout-minutes": 90,
      "env": {
        "NUVIO_ANDROID_JOBS": "2",
        "NUVIO_BUILD_JOBS": "2",
        "NUVIO_P2P_MOTOR": "none",
        "REBASE_PR": "431"
      },
      "steps": [
        {
          "uses": "actions/checkout@v4",
          "with": {
            "persist-credentials": false,
            "fetch-depth": 0
          }
        },
        {
          "name": "Verify isolated source, recipe and cache limits",
          "run": "python3 .review/pr431-rebase3a3/preflight.py"
        },
        {
          "name": "Materialize exact reviewed candidate on pinned upstream",
          "run": "python3 .review/pr431-rebase3a3/materialize.py --candidate \"431\" --target source-app --proof results/source-verified.json"
        },
        {
          "uses": "actions/setup-java@v4",
          "with": {
            "distribution": "temurin",
            "java-version": "17"
          }
        },
        {
          "name": "Fresh relevant Linux normal/ASan source contracts",
          "run": "python3 .review/pr431-rebase3a3/focused.py --source source-app --proof results/source-verified.json --output results/features"
        },
        {
          "name": "Fresh Android interface and download regressions",
          "run": "python3 .review/pr431-rebase3a3/android_kotlin.py --source source-app --proof results/source-verified.json --output results/kotlin"
        },
        {
          "uses": "android-actions/setup-android@v3",
          "with": {
            "packages": "platform-tools",
            "log-accepted-android-sdk-licenses": false
          }
        },
        {
          "name": "Install normal Android toolchain",
          "run": "sudo apt-get update -qq\nsudo apt-get install -y ninja-build cmake nasm ffmpeg python3-pil zlib1g-dev\nsdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'ndk;27.2.12479018' 'cmake;3.22.1'"
        },
        {
          "name": "Empty compile-only config, no service credentials",
          "run": ": > \"$RUNNER_TEMP/rebases.properties\"\nchmod 600 \"$RUNNER_TEMP/rebases.properties\"\necho \"NUVIO_PROPERTIES=$RUNNER_TEMP/rebases.properties\" >> \"$GITHUB_ENV\""
        },
        {
          "uses": "actions/cache@v4",
          "with": {
            "path": "~/.cache/nuvio-android",
            "key": "rebases10e3-native-v1-${{ runner.os }}-${{ hashFiles('source-app/tools/android/deps.sh', 'source-app/tools/android/ffmpeg-android.sh', 'source-app/android/app/src/main/cpp/CMakeLists.txt') }}",
            "restore-keys": "rebases10e3-native-v1-${{ runner.os }}-\nissue497-native-v1-${{ runner.os }}-\npr527-native-v1-${{ runner.os }}-\napk20028-native-v1-${{ runner.os }}-\napk20027-native-v1-${{ runner.os }}-\napk20026-native-v1-${{ runner.os }}-\napk20025-native-v1-${{ runner.os }}-\nissue362-native-v1-${{ runner.os }}-\nissue477-native-v1-${{ runner.os }}-\n"
          }
        },
        {
          "uses": "actions/cache@v4",
          "with": {
            "path": "~/.gradle/caches\n~/.gradle/wrapper",
            "key": "rebases10e3-gradle-v1-${{ runner.os }}-${{ hashFiles('source-app/android/**/*.gradle.kts', 'source-app/android/gradle/wrapper/gradle-wrapper.properties') }}",
            "restore-keys": "rebases10e3-gradle-v1-${{ runner.os }}-\nissue497-gradle-v1-${{ runner.os }}-\npr527-gradle-v1-${{ runner.os }}-\napk20028-gradle-v1-${{ runner.os }}-\napk20027-gradle-v1-${{ runner.os }}-\napk20026-gradle-v1-${{ runner.os }}-\napk20025-gradle-v1-${{ runner.os }}-\nissue362-gradle-v1-${{ runner.os }}-\nissue477-gradle-v1-${{ runner.os }}-\n"
          }
        },
        {
          "name": "Capture strictly clean Android workspace before build",
          "run": "python3 .review/pr431-rebase3a3/android_workspace.py --source source-app --output results/android-workspace --phase before",
          "id": "workspace_before"
        },
        {
          "name": "Build cached native dependencies for both ARM ABIs",
          "working-directory": "source-app",
          "run": "bash tools/android/deps.sh arm64-v8a armeabi-v7a"
        },
        {
          "name": "Build exact standard debug APK with production tooling",
          "working-directory": "source-app",
          "run": "bash tools/android.sh"
        },
        {
          "name": "Preserve actual standard APK before strict validation",
          "run": "mkdir -p results/android\ncp source-app/build/android/*-android-debug.apk results/android/standard-validation.apk"
        },
        {
          "name": "Preserve and verify post-build Android workspace",
          "if": "${{ always() && steps.workspace_before.conclusion == 'success' }}",
          "run": "python3 .review/pr431-rebase3a3/android_workspace.py --source source-app --output results/android-workspace --phase after"
        },
        {
          "name": "Verify actual APK, changed native units, both ABIs and JNI",
          "run": "python3 .review/pr431-rebase3a3/android.py --source source-app --proof results/source-verified.json --output results/android/android-verified.json --aapt \"$ANDROID_HOME/build-tools/35.0.0/aapt\" --apksigner \"$ANDROID_HOME/build-tools/35.0.0/apksigner\""
        },
        {
          "name": "Reverify exact source after validation",
          "run": "python3 .review/pr431-rebase3a3/materialize.py --candidate \"431\" --target source-app --proof results/source-verified.json --reverify"
        },
        {
          "uses": "actions/upload-artifact@v4",
          "if": "always()",
          "with": {
            "name": "pr431-rebase3a3-android-recovery-${{ github.sha }}-attempt${{ github.run_attempt }}",
            "path": "results/\n!results/**/*.o",
            "if-no-files-found": "error",
            "retention-days": 14
          }
        },
        {
          "uses": "actions/upload-artifact@v4",
          "if": "always()",
          "with": {
            "name": "pr431-rebase3a3-android-recovery-proof-${{ github.sha }}-attempt${{ github.run_attempt }}",
            "path": "results/\n!results/**/*.o\n!results/**/*.apk",
            "if-no-files-found": "error",
            "retention-days": 14
          }
        }
      ],
      "if": true
    }
  }
}
