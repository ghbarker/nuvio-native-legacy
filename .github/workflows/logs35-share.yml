name: Share verified Logs37 test APK
on:
  workflow_dispatch:
permissions:
  actions: read
  contents: write
jobs:
  share:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Require successful Android and Linux checks
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$(gh api repos/ghbarker/nuvio-native-legacy/actions/runs/39036715397 --jq .conclusion)" = success
          echo "MACOS_CONCLUSION=$(gh api repos/ghbarker/nuvio-native-legacy/actions/runs/39036706437 --jq .conclusion)" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
        with:
          ref: 8d2837eca4a9d0495fd9dc2bd97f8fbc5252cff6
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 39036715397
          name: Nuvio-TV-Mobile-Test-Logs37-8b5d43c89e936ce1bbf15fe3f52d5ed026b1fb54
          path: dist
      - name: Verify 16 KiB Android alignment
        run: python3 tools/android-apk-pages.py dist/Nuvio-TV-Mobile-Test-Logs37.apk
      - name: Verify and attach test APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'CHECK'
          import hashlib,json,pathlib,os
          root=pathlib.Path('dist')
          apk=root/'Nuvio-TV-Mobile-Test-Logs37.apk'
          report=json.loads((root/'Logs37-validation.json').read_text())
          assert report['all_passed'] is True
          assert report['source_commit']=='8d2837eca4a9d0495fd9dc2bd97f8fbc5252cff6'
          assert report['package']=='space.nuvio.nativelegacy.touch'
          assert report['version_code']==20047
          assert report['version_name']=='2.0.47-test-logs37'
          assert report['certificate_sha256']=='862d7ef63a0dbde2929f6f231cae295510726d9ac28f9292496d2a38304be5e6'
          assert apk.stat().st_size==report['apk_bytes']
          assert hashlib.sha256(apk.read_bytes()).hexdigest()==report['apk_sha256']
          report['macos_live_tv_regressions']=os.environ.get('MACOS_CONCLUSION')=='success'
          report['android_16k_alignment']=True
          (root/'Logs37-validation.json').write_text(json.dumps(report,indent=2)+'\n')
          (root/'Logs37-testing.txt').write_text('Nuvio TV/Mobile Test - Logs37\n\nInstall using Update over the existing test app; keep app data.\n\n1. Settings > Sources and add-ons > Source filters: choose Cached only and exclude a live event/channel resolution. Note the previous choices.\n2. Open Sports Streams from its Home/collection row. Open a live event and Play: movie filters must not remove or block it.\n3. Open Sources during playback. Movie filter chips should be absent. Reload should still work with the same Sports Streams type.\n4. Open a movie/episode and verify normal filters still apply, then restore your previous filter choices.\n\nIncludes the confirmed Logs36 font fix. Live TV PR587 remains draft pending device approval.\n')
          CHECK
          gh release upload tv-mobile-test-logs-v36 --repo "$GITHUB_REPOSITORY" --clobber dist/Nuvio-TV-Mobile-Test-Logs37.apk dist/Logs37-validation.json dist/Logs37-testing.txt
