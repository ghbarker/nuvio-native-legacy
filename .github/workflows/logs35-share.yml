name: Share verified Logs42 multiple account test APK
on:
  workflow_dispatch:
permissions:
  actions: read
  contents: write
jobs:
  share:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Require successful checks on the final integrated source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(gh api repos/ghbarker/nuvio-native-legacy/actions/runs/39058247267 --jq .conclusion)" = success
          test "$(gh api repos/ghbarker/nuvio-native-legacy/actions/runs/39058249561 --jq .conclusion)" = success
      - uses: actions/checkout@v4
        with:
          ref: 7ee26ad2c46f368399b1f385ea99031cce1a4a38
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 39058247267
          name: Nuvio-TV-Mobile-Test-Logs42-222ca49e2fdabd9c640eae992eea78e5a7fd0f19
          path: dist
      - name: Verify Android page alignment and the retained package identity
        run: |
          python3 tools/android-apk-pages.py dist/Nuvio-TV-Mobile-Test-Logs42.apk
          python3 - <<'PY'
          import hashlib,json,pathlib,zipfile
          root=pathlib.Path('dist');apk=root/'Nuvio-TV-Mobile-Test-Logs42.apk'
          report=json.loads((root/'Logs42-validation.json').read_text())
          assert report['source_commit']=='7ee26ad2c46f368399b1f385ea99031cce1a4a38'
          assert report['source_tree']=='805a557dc1c4eeaba92320b0372e5763334faeb4'
          assert report['package']=='space.nuvio.nativelegacy.touch'
          assert report['version_code']==20052 and report['version_name']=='2.0.52-test-logs42'
          assert report['certificate_sha256']=='862d7ef63a0dbde2929f6f231cae295510726d9ac28f9292496d2a38304be5e6'
          assert apk.stat().st_size==report['apk_bytes']
          assert hashlib.sha256(apk.read_bytes()).hexdigest()==report['apk_sha256']
          with zipfile.ZipFile(apk) as z:
              assert 'lib/arm64-v8a/libmain.so' in z.namelist()
              assert 'lib/armeabi-v7a/libmain.so' in z.namelist()
          report.update(all_passed=True,linux_regressions=True,sanitizer_regressions=True,native_account_regressions=True,macos_native_account_regressions=True,android_16k_alignment=True)
          report['android_linux_run']=39058247267;report['macos_run']=39058249561
          report['macos_test_commit']='7ee26ad2c46f368399b1f385ea99031cce1a4a38'
          report['validation_scope']='Linux and macOS multiple-account registry, real Settings add/select/confirm/delete controls, profile and EPG ownership, native providers, guide loading and sanitizer regressions; Android ARM build and font import unit tests'
          report['new_translation_keys_verified']=True
          report['baseline_release']='tv-mobile-test-logs-v41'
          (root/'Logs42-validation.json').write_text(json.dumps(report,indent=2)+'\n')
          (root/'Logs42-testing.txt').write_text('''Nuvio TV/Mobile Test - Logs42: Multiple Live TV accounts

          Install over Nuvio TV/Mobile Test by choosing Update. Keep the existing app installed and keep its data so accounts/settings remain.

          1. Open Settings > Live TV. Your existing provider accounts should be listed under Live TV account without re-entering them.
          2. Choose Add Xtream account, Add M3U playlist, or Add Stalker portal. Enter that account's details in the fields below. Add a second account of the same type if available; the first must keep its credentials.
          3. Use Live TV account to switch between saved accounts. Confirm your choice, rename one if desired, and check that each account shows its own configuration.
          4. Open the TV guide with Sources set to All sources, or the relevant provider type. Channels from both enabled accounts should load and play. Check their now/next programmes match the correct account.
          5. Disable one account in Settings. Its channels should disappear while the other account still works. Re-enable it and verify its channels return.
          6. Fully close and reopen the app. Accounts, names, enabled states and guide data should survive. Try Refresh channels and schedule to renew the lists and EPG.
          7. Optionally remove the extra test account. The first tap arms removal; the second confirms. Only that account should disappear. Your original account and other Settings must remain.

          Logs42 includes the approved Logs41 interface fonts and earlier approved features. Channel grouping is the next step after multiple accounts are tested. No upstream Live TV PR will be published before approval of this APK.
          '''.replace('\n          ','\n'))
          PY
      - name: Publish the verified test download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if ! gh release view tv-mobile-test-logs-v41 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create tv-mobile-test-logs-v41 --repo "$GITHUB_REPOSITORY" --target 7ee26ad2c46f368399b1f385ea99031cce1a4a38 --title 'Nuvio TV/Mobile Test - Logs42: Multiple Live TV accounts' --notes-file dist/Logs42-testing.txt
          fi
          gh release upload tv-mobile-test-logs-v41 --repo "$GITHUB_REPOSITORY" --clobber dist/Nuvio-TV-Mobile-Test-Logs42.apk dist/Logs42-validation.json dist/Logs42-testing.txt
