name: Share verified Logs38 test APK
on:
  workflow_dispatch:
permissions:
  actions: read
  contents: write
jobs:
  share:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Require successful Android and Linux checks
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$(gh api repos/ghbarker/nuvio-native-legacy/actions/runs/39037787730 --jq .conclusion)" = success
          test "$(gh api repos/ghbarker/nuvio-native-legacy/actions/runs/39037788044 --jq .conclusion)" = success
          echo "MACOS_CONCLUSION=$(gh api repos/ghbarker/nuvio-native-legacy/actions/runs/39037788044 --jq .conclusion)" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
        with:
          ref: cf70db147e5db80f4b3731f05fe5e0827cf3d0f0
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 39037787730
          name: Nuvio-TV-Mobile-Test-Logs38-dbfee47c8c65965c0f69cd72e24c141a8eeba908
          path: dist
      - name: Verify 16 KiB Android alignment
        run: python3 tools/android-apk-pages.py dist/Nuvio-TV-Mobile-Test-Logs38.apk
      - name: Verify and attach test APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'CHECK'
          import hashlib,json,pathlib,os
          root=pathlib.Path('dist')
          apk=root/'Nuvio-TV-Mobile-Test-Logs38.apk'
          report=json.loads((root/'Logs38-validation.json').read_text())
          assert report['all_passed'] is True
          assert report['source_commit']=='cf70db147e5db80f4b3731f05fe5e0827cf3d0f0'
          assert report['package']=='space.nuvio.nativelegacy.touch'
          assert report['version_code']==20048
          assert report['version_name']=='2.0.48-test-logs38'
          assert report['certificate_sha256']=='862d7ef63a0dbde2929f6f231cae295510726d9ac28f9292496d2a38304be5e6'
          assert apk.stat().st_size==report['apk_bytes']
          assert hashlib.sha256(apk.read_bytes()).hexdigest()==report['apk_sha256']
          report['macos_live_tv_regressions']=os.environ.get('MACOS_CONCLUSION')=='success'
          report['android_16k_alignment']=True
          report['live_tv_regressions']=True
          report['sanitizer_regressions']=True
          report['linux_regressions']=True
          (root/'Logs38-validation.json').write_text(json.dumps(report,indent=2)+'\n')
          (root/'Logs38-testing.txt').write_text('Adds Settings → Sources and add-ons → Add-ons → Live TV. Selected add-ons bypass source filters, including Cached/Uncached, even when they declare movie or series resources. Other movie and episode sources retain their filters. Custom resource types also remain outside movie/episode filtering.\n\nInstall over Nuvio TV/Mobile Test using Update. Do not uninstall or clear app data.\n\nTesting:\n1. Open Settings → Sources and add-ons → Add-ons → Live TV. Enable Sports Streams (and any other live-only add-on).\n2. Leave your source filters enabled. Open a live channel/event from a Home or collection row and press Play; source filters should not block it.\n3. Open Sources during live playback. If all sources are live, movie filter chips should be absent. Test Reload.\n4. Restart the app and confirm the Live TV selection is still enabled.\n5. Open a movie or episode from an unmarked add-on and confirm its normal source filters still apply.\n\nIncludes the confirmed Logs36 font fix. The Live TV PR stays draft until this APK is approved.\n')
          CHECK
          gh release upload tv-mobile-test-logs-v38 --repo "$GITHUB_REPOSITORY" --clobber dist/Nuvio-TV-Mobile-Test-Logs38.apk dist/Logs38-validation.json dist/Logs38-testing.txt
