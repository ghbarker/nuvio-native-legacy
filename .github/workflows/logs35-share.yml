name: Share verified Logs41 interface font test APK
on:
  workflow_dispatch:
permissions:
  actions: read
  contents: write
jobs:
  share:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Require successful checks on the final integrated source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(gh api repos/ghbarker/nuvio-native-legacy/actions/runs/39049619070 --jq .conclusion)" = success
          test "$(gh api repos/ghbarker/nuvio-native-legacy/actions/runs/39049618761 --jq .conclusion)" = success
      - uses: actions/checkout@v4
        with:
          ref: 56efd14595a7c535fe867992a5e930d0e69f90a3
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 39049619070
          name: Nuvio-TV-Mobile-Test-Logs41-ba15e4a94b1ec8b4733024c3f2a552dd93111cb0
          path: dist
      - name: Verify Android page alignment and the retained package identity
        run: |
          python3 tools/android-apk-pages.py dist/Nuvio-TV-Mobile-Test-Logs41.apk
          python3 - <<'PY'
          import hashlib,json,pathlib,zipfile
          root=pathlib.Path('dist');apk=root/'Nuvio-TV-Mobile-Test-Logs41.apk'
          report=json.loads((root/'Logs41-validation.json').read_text())
          assert report['source_commit']=='56efd14595a7c535fe867992a5e930d0e69f90a3'
          assert report['source_tree']=='18ad7116a50e5d272fab0693205cebe8484ce7bd'
          assert report['package']=='space.nuvio.nativelegacy.touch'
          assert report['version_code']==20051 and report['version_name']=='2.0.51-test-logs41'
          assert report['certificate_sha256']=='862d7ef63a0dbde2929f6f231cae295510726d9ac28f9292496d2a38304be5e6'
          assert apk.stat().st_size==report['apk_bytes']
          assert hashlib.sha256(apk.read_bytes()).hexdigest()==report['apk_sha256']
          with zipfile.ZipFile(apk) as z:
              assert 'lib/arm64-v8a/libmain.so' in z.namelist()
              assert 'lib/armeabi-v7a/libmain.so' in z.namelist()
          report.update(all_passed=True,linux_regressions=True,sanitizer_regressions=True,interface_font_regressions=True,macos_interface_font_regressions=True,android_16k_alignment=True)
          report['android_linux_run']=39049619070;report['macos_run']=39049618761
          report['macos_test_commit']='56efd14595a7c535fe867992a5e930d0e69f90a3'
          report['validation_scope']='Linux and macOS font registry, real UI rendering, Settings persistence/rollback, subtitle rendering and sanitizer regressions; Android build and font import unit tests'
          report['new_translation_keys_verified']=True
          report['baseline_release']='tv-mobile-test-logs-v40'
          (root/'Logs41-validation.json').write_text(json.dumps(report,indent=2)+'\n')
          (root/'Logs41-testing.txt').write_text('''Nuvio TV/Mobile Test - Logs41: Imported interface fonts

          Install over Nuvio TV/Mobile Test by choosing Update. Keep the existing app installed and keep its data so accounts/settings remain.

          1. Open Settings > Appearance > Interface font. Choose Import TTF/OTF, confirm, and select a font file on your phone. Existing imported subtitle fonts also appear in this list.
          2. Return to Home, open a title, and check Settings and Sources. Ordinary interface text should use the imported font. Check long labels fit and remain readable at your normal Interface size.
          3. Play a video and confirm both main and second subtitle font choices remain independent of the interface choice.
          4. Fully close and reopen the app. The selected interface font should still apply.
          5. Choose a bundled interface font and confirm it changes back. Choose the imported font again, then Delete imported font: the interface should return to its last bundled choice. Deleting a font removes it from subtitle selections too if they use that same file.

          Logs41 retains the approved Logs40 Live TV changes. The in-progress multiple Live TV account feature and channel grouping are not included yet. No upstream PR for interface fonts before approval of this test APK.
          '''.replace('\n          ','\n'))
          PY
      - name: Publish the verified test download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if ! gh release view tv-mobile-test-logs-v41 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create tv-mobile-test-logs-v41 --repo "$GITHUB_REPOSITORY" --target 56efd14595a7c535fe867992a5e930d0e69f90a3 --title 'Nuvio TV/Mobile Test - Logs41: Imported interface fonts' --notes-file dist/Logs41-testing.txt
          fi
          gh release upload tv-mobile-test-logs-v41 --repo "$GITHUB_REPOSITORY" --clobber dist/Nuvio-TV-Mobile-Test-Logs41.apk dist/Logs41-validation.json dist/Logs41-testing.txt
