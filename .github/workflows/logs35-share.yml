name: Share verified Logs56 Live TV search APK
on:
  workflow_dispatch:
permissions:
  actions: read
  contents: write
jobs:
  share:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      TEST_RELEASE: tv-mobile-test-logs-v56
    steps:
      - name: Require Android, Linux and macOS checks
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(gh api repos/ghbarker/nuvio-native-legacy/actions/runs/39136219411 --jq .conclusion)" = success
          test "$(gh api repos/ghbarker/nuvio-native-legacy/actions/runs/39136219411/jobs --jq '.jobs[] | select(.name == "apk-build") | .conclusion')" = success
          test "$(gh api repos/ghbarker/nuvio-native-legacy/actions/runs/39136221894 --jq .conclusion)" = success
      - uses: actions/checkout@v4
        with:
          ref: d843ad531db93793e094209188ab2328a3993c2c
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 39136219411
          name: Nuvio-TV-Mobile-Test-Logs56-e6edaa5bc56768ceb83b428c9065e3b7d2ce8fe4
          path: dist
      - name: Verify APK and record check scope
        run: |
          set -euo pipefail
          python3 tools/android-apk-pages.py dist/Nuvio-TV-Mobile-Test-Logs56.apk
          python3 - <<'PYCODE'
          import hashlib,json,pathlib,zipfile,os
          root=pathlib.Path('dist');apk=root/'Nuvio-TV-Mobile-Test-Logs56.apk'
          p=root/'Logs56-validation.json';r=json.loads(p.read_text())
          assert r['source_commit']=='8934c1837013a88e6327c0ff506d20f07aa05de5' and r['source_tree']=='378ad24e70b17e000a4afcfa490e67ec832a7dc8'
          assert r['package']=='space.nuvio.nativelegacy.touch'
          assert r['version_code']==20066 and r['version_name']=='2.0.66-test-logs56'
          assert r['certificate_sha256']=='862d7ef63a0dbde2929f6f231cae295510726d9ac28f9292496d2a38304be5e6'
          assert apk.stat().st_size==r['apk_bytes'] and hashlib.sha256(apk.read_bytes()).hexdigest()==r['apk_sha256']
          with zipfile.ZipFile(apk) as z:
              assert 'lib/arm64-v8a/libmain.so' in z.namelist() and 'lib/armeabi-v7a/libmain.so' in z.namelist()
          r.update(all_passed=True,android_16k_alignment=True,android_run=39136219411,linux_run=39136219411,macos_run=39136221894,release=os.environ['TEST_RELEASE'],baseline_release='tv-mobile-test-logs-v55',device_approval_pending=True)
          r['apk_url']='https://github.com/ghbarker/nuvio-native-legacy/releases/download/'+os.environ['TEST_RELEASE']+'/'+apk.name
          r['normal_and_asan_ubsan_linux_ui_suites']=['guiabusca_incremental','guia_grupos','guia_loading','guia_epg_estado','guiabusca_reabrir']
          r['normal_and_asan_ubsan_linux_macos_native_suites']=['guiabusca_incremental','guiabusca_paginacao','guia_grupos','guia_loading','guia_epg_estado']
          r['android_jvm_unit_suites']=['LiveWindowRecoveryTest','ParaleloDataSourceTest','FontImportTest']
          r['test_scope']='Native regression and sanitizer tests with controlled EPG data; real Linux UI/pointer rendering. No Android emulator or physical-device pass is claimed. macOS native tests are not a macOS application build.'
          p.write_text(json.dumps(r,indent=2)+'\n')
          PYCODE
      - name: Publish verified test build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "$TEST_RELEASE" --repo "$GITHUB_REPOSITORY" --target 8934c1837013a88e6327c0ff506d20f07aa05de5 --title 'Nuvio TV/Mobile Test - Logs56: Live TV search' --notes-file .github/Logs56-testing.txt dist/Nuvio-TV-Mobile-Test-Logs56.apk dist/Logs56-validation.json .github/Logs56-testing.txt
