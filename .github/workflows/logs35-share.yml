name: Share verified Logs49 provider-account test APK
on:
  workflow_dispatch:
permissions:
  actions: read
  contents: write
jobs:
  share:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      TEST_RELEASE: tv-mobile-test-logs-v49
    steps:
      - name: Require successful checks on the final integrated source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(gh api repos/ghbarker/nuvio-native-legacy/actions/runs/39084222011/jobs --jq '.jobs[] | select(.name == "apk-build") | .conclusion')" = success
          test "$(gh api repos/ghbarker/nuvio-native-legacy/actions/runs/39084222011 --jq .conclusion)" = success
          test "$(gh api repos/ghbarker/nuvio-native-legacy/actions/runs/39084224256 --jq .conclusion)" = success
          test "$(gh api repos/ghbarker/nuvio-native-legacy/actions/runs/39083822801 --jq .conclusion)" = success
      - uses: actions/checkout@v4
        with:
          ref: f4f7e804dc33207199d5fb105dd00e0194ca2a9b
          fetch-depth: 4
          persist-credentials: false
      - name: Verify tested application code and retained Settings baseline
        run: |
          test "$(git rev-parse HEAD)" = f4f7e804dc33207199d5fb105dd00e0194ca2a9b
          git diff --exit-code a07380183c23a85c8be67dc18ea6f4c07db91fab HEAD -- src/ajustes.c 'src/ajustes_*.inc'
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 39084222011
          name: Nuvio-TV-Mobile-Test-Logs49-fe3603aeea900bcb8cdd68e26645092b17f4240f
          path: dist
      - name: Verify Android page alignment and the retained package identity
        run: |
          python3 tools/android-apk-pages.py dist/Nuvio-TV-Mobile-Test-Logs49.apk
          python3 - <<'PY'
          import hashlib,json,pathlib,zipfile,os
          root=pathlib.Path('dist');apk=root/'Nuvio-TV-Mobile-Test-Logs49.apk'
          report=json.loads((root/'Logs49-validation.json').read_text())
          assert report['source_commit']=='f4f7e804dc33207199d5fb105dd00e0194ca2a9b'
          assert report['source_tree']=='e98a5578b2fd082101598e245c5d2d17447e0d9f'
          assert report['package']=='space.nuvio.nativelegacy.touch'
          assert report['version_code']==20059 and report['version_name']=='2.0.59-test-logs49'
          release=os.environ['TEST_RELEASE']
          assert release=='tv-mobile-test-logs-v'+report['version_name'].split('-logs')[-1]
          report['release']=release
          report['apk_url']='https://github.com/ghbarker/nuvio-native-legacy/releases/download/'+release+'/'+apk.name
          assert report['certificate_sha256']=='862d7ef63a0dbde2929f6f231cae295510726d9ac28f9292496d2a38304be5e6'
          assert apk.stat().st_size==report['apk_bytes']
          assert hashlib.sha256(apk.read_bytes()).hexdigest()==report['apk_sha256']
          with zipfile.ZipFile(apk) as z:
              assert 'lib/arm64-v8a/libmain.so' in z.namelist()
              assert 'lib/armeabi-v7a/libmain.so' in z.namelist()
          report.update(all_passed=True,linux_regressions=True,sanitizer_regressions=True,native_account_regressions=True,macos_native_account_regressions=True,android_16k_alignment=True)
          report['android_run']=39084222011;report['linux_run']=39084222011;report['macos_run']=39084224256
          report['android_job']='apk-build'
          report['shared_failover_baseline_run']=39083822801
          report['test_commit']='f4f7e804dc33207199d5fb105dd00e0194ca2a9b'
          report['application_code_matches_test_commit']=True
          report['macos_test_commit']='f4f7e804dc33207199d5fb105dd00e0194ca2a9b'
          report['validation_scope']='Linux/macOS normal regression suites and real full-source Settings; ASan/UBSan coverage for memory policy/windows, serial EPG worker queues and cached restoration, scoped EPG/streamed XMLTV, category visibility and cached grouping, native guide loading/routing, and full-source Settings. The normal-only helpers are listed separately. Linux shared failover Settings normal retained from the preceding successful Logs49 run with identical Settings code. Android both ARM builds and font import unit tests.'
          report['normal_regression_suites']=['epg_memory', 'epg_accounts', 'epg_streaming', 'guia_grupos', 'guia_loading', 'guia_epg_estado', 'guiaepg', 'guia_catalogo_tv', 'guia_stream_headers', 'guiaaddons', 'guiacorte', 'ajustes_iptv', 'ajustes_secoes']
          report['asan_ubsan_suites']=['epg_memory', 'epg_accounts', 'epg_streaming', 'guia_grupos', 'guia_loading', 'guia_epg_estado', 'guiaepg', 'guia_catalogo_tv', 'guia_stream_headers', 'ajustes_iptv']
          report['normal_only_suites']=['guiaaddons', 'guiacorte', 'ajustes_secoes']
          report['new_translation_keys_verified']=True
          report['new_translation_keys']=5;report['translation_tables']=29
          report['full_language_audit_existing_findings']=60;report['full_language_audit_new_findings']=0
          report['baseline_release']='tv-mobile-test-logs-v47'
          (root/'Logs49-validation.json').write_text(json.dumps(report,indent=2)+'\n')
          (root/'Logs49-testing.txt').write_text('Nuvio TV/Mobile Test - Logs49: Live TV memory and category controls\n\nInstall over Nuvio TV/Mobile Test by choosing Update. Keep the app and its data to retain accounts/settings. This has a higher version than Logs47; the package and persistent signing key are unchanged.\n\n1. Main Settings menu: Live TV should show Live TV accounts: N, including your saved M3U playlists, instead of Not set up. With working M3U channels, the guide header must also avoid the old no-IPTV-portal warning. Open Live TV > M3U and confirm your existing accounts remain. Disabled saved accounts are included in the count; this is setup status, not a connection check.\n2. Settings > Live TV > Guide memory: choose Low memory and confirm. It keeps the current programme and next 24 hours loaded and runs one bulk EPG load at a time. Open the guide and check now/next programmes and playback. Channel lists/order remain unchanged. The provider may supply fewer than 24 hours.\n3. Choose Full guide and return to the guide. Later programmes should return if supplied by the provider, within the existing safety limits. Mode changes reuse the compressed disk cache; Low memory reduces loaded programme data, not the downloaded EPG file size. Automatic uses Low memory for devices with up to 2 GiB or unknown RAM (also browser/WASM targets), and Full guide for higher-memory native devices. You can override it.\n4. Keep Guide sources set to All and open the guide once so saved categories are loaded. Settings > Live TV > Hide categories lists every loaded category, including hidden ones, with account names on separate lines. Tap a category or press OK to toggle Hidden in the guide; each change saves immediately. Back closes the picker.\n5. Hide one category from Account A. It should disappear from the guide AND its top-left Categories drawer, while a matching category from Account B remains. Return to Hide categories and tap it again to restore it. Favorites remain available independently; no accounts or channels are deleted. If every category is hidden, the guide shows the path back to this setting.\n6. In the Categories drawer, long category names and account names should appear on separate lines rather than losing the account suffix. Category/Account sorting and saved account order should retain their approved behavior.\n7. Fully close and reopen the app. The account count, memory choice, hidden categories and account order should remain saved. Hidden choices are per profile; memory mode is per device and does not change when switching profiles. Renaming/reordering a saved account should not reset its hidden choices.\n\nNo new upstream Live TV PR will be published until this test build is approved. Test-only local logs and app packaging remain outside upstream product changes.\n')
          PY
      - name: Publish the verified test download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if ! gh release view "$TEST_RELEASE" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$TEST_RELEASE" --repo "$GITHUB_REPOSITORY" --target f4f7e804dc33207199d5fb105dd00e0194ca2a9b --title 'Nuvio TV/Mobile Test - Logs49: Guide memory and categories' --notes-file dist/Logs49-testing.txt
          fi
          for name in Nuvio-TV-Mobile-Test-Logs49.apk Logs49-testing.txt; do
            if ! gh release view "$TEST_RELEASE" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' | grep -Fxq "$name"; then
              gh release upload "$TEST_RELEASE" --repo "$GITHUB_REPOSITORY" "dist/$name"
            fi
          done
          gh release upload "$TEST_RELEASE" --repo "$GITHUB_REPOSITORY" dist/Logs49-validation.json --clobber
