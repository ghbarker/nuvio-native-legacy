name: Share verified Logs44 account-list test APK
on:
  workflow_dispatch:
permissions:
  actions: read
  contents: write
jobs:
  share:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Require successful checks on the final integrated source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(gh api repos/ghbarker/nuvio-native-legacy/actions/runs/39065739015/jobs --jq '.jobs[] | select(.name == "apk-build") | .conclusion')" = success
          test "$(gh api repos/ghbarker/nuvio-native-legacy/actions/runs/39065739015 --jq .conclusion)" = success
          test "$(gh api repos/ghbarker/nuvio-native-legacy/actions/runs/39065740929 --jq .conclusion)" = success
      - uses: actions/checkout@v4
        with:
          ref: ca2a79e14ac923f7dc56947b960fdbcc56c6f176
          fetch-depth: 3
          persist-credentials: false
      - name: Verify tested application code matches the retained APK
        run: test "$(git rev-parse HEAD)" = ca2a79e14ac923f7dc56947b960fdbcc56c6f176
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 39065739015
          name: Nuvio-TV-Mobile-Test-Logs44-b99e631b3f0be10e1e1ed2a469ae62e3bbe042b6
          path: dist
      - name: Verify Android page alignment and the retained package identity
        run: |
          python3 tools/android-apk-pages.py dist/Nuvio-TV-Mobile-Test-Logs44.apk
          python3 - <<'PY'
          import hashlib,json,pathlib,zipfile
          root=pathlib.Path('dist');apk=root/'Nuvio-TV-Mobile-Test-Logs44.apk'
          report=json.loads((root/'Logs44-validation.json').read_text())
          assert report['source_commit']=='ca2a79e14ac923f7dc56947b960fdbcc56c6f176'
          assert report['source_tree']=='f6385c08b4b4264aa721d5b2b5f30e762cba0b80'
          assert report['package']=='space.nuvio.nativelegacy.touch'
          assert report['version_code']==20054 and report['version_name']=='2.0.54-test-logs44'
          assert report['certificate_sha256']=='862d7ef63a0dbde2929f6f231cae295510726d9ac28f9292496d2a38304be5e6'
          assert apk.stat().st_size==report['apk_bytes']
          assert hashlib.sha256(apk.read_bytes()).hexdigest()==report['apk_sha256']
          with zipfile.ZipFile(apk) as z:
              assert 'lib/arm64-v8a/libmain.so' in z.namelist()
              assert 'lib/armeabi-v7a/libmain.so' in z.namelist()
          report.update(all_passed=True,linux_regressions=True,sanitizer_regressions=True,native_account_regressions=True,macos_native_account_regressions=True,android_16k_alignment=True)
          report['android_run']=39065739015;report['linux_run']=39065739015;report['macos_run']=39065740929
          report['android_job']='apk-build'
          report['test_commit']='ca2a79e14ac923f7dc56947b960fdbcc56c6f176'
          report['application_code_matches_test_commit']=True
          report['macos_test_commit']='ca2a79e14ac923f7dc56947b960fdbcc56c6f176'
          report['validation_scope']='Linux and macOS multiple-account registry, real Settings add/select/confirm/delete controls, profile and EPG ownership, native providers, guide loading and sanitizer regressions; Android ARM build and font import unit tests'
          report['new_translation_keys_verified']=True
          report['baseline_release']='tv-mobile-test-logs-v43'
          (root/'Logs44-validation.json').write_text(json.dumps(report,indent=2)+'\n')
          (root/'Logs44-testing.txt').write_text('''Nuvio TV/Mobile Test - Logs44: Multiple Live TV accounts

          Install over Nuvio TV/Mobile Test by choosing Update. Keep the existing app installed and keep its data so accounts/settings remain.

          1. Open Settings > Live TV. Old blank numbered accounts should be gone. Your saved accounts and partially entered credentials must remain.
          2. Tap the separate Add M3U playlist option. A blank URL popup should open immediately, without selecting a slot first. Cancel it; the saved-account count must stay the same.
          3. Tap Add M3U playlist again, enter a second playlist URL and choose Done. Exactly one new saved account should appear. Enter its XMLTV URL if needed.
          4. Open M3U to view your saved playlists. This list should contain only saved accounts; Add has its own Settings option. Switch between the original and new playlists and confirm their details remain separate.
          5. Check the separate Add Xtream account and Add Stalker portal options also open blank address popups. You can cancel these checks without entering new credentials.
          6. Fully close and reopen the app. Saved accounts should remain, blank slots should stay gone, and enabled accounts should still load channels and programmes in the guide.

          Install as an Update over Nuvio TV/Mobile Test. Package identity and signing key are unchanged. Includes the earlier approved fonts and app changes. No upstream Live TV PR will be published until this APK is approved; channel grouping follows account testing.
          '''.replace('\n          ','\n'))
          PY
      - name: Publish the verified test download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if ! gh release view tv-mobile-test-logs-v44 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create tv-mobile-test-logs-v44 --repo "$GITHUB_REPOSITORY" --target ca2a79e14ac923f7dc56947b960fdbcc56c6f176 --title 'Nuvio TV/Mobile Test - Logs44: Separate Add options' --notes-file dist/Logs44-testing.txt
          fi
          gh release upload tv-mobile-test-logs-v44 --repo "$GITHUB_REPOSITORY" dist/Nuvio-TV-Mobile-Test-Logs44.apk dist/Logs44-validation.json dist/Logs44-testing.txt
