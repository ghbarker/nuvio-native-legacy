name: 'Profile PR: all remaining frozen-source gates'
'on':
  push:
    branches:
    - review/profile-session-all-green
permissions:
  contents: read
  actions: read
concurrency:
  group: profile-all-green-${{ github.ref }}
  cancel-in-progress: true
jobs:
  baselines:
    name: Original profile, native failover, debrid and budget baselines (macOS)
    runs-on: macos-14
    timeout-minutes: 35
    env:
      ASAN_OPTIONS: detect_leaks=0
      NUVIO_PROFILE_NATIVE_FAILOVER: '1'
    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false
        fetch-depth: 0
    - name: Verify all123 exact pinned product blobs and unchanged original tests
      id: source
      run: |
        set -euo pipefail
        python3 - <<'VERIFY'
        import hashlib
        import json
        import os
        from pathlib import Path
        import subprocess
        base = '17b7769dac4273557e1b07f5fb8734df91dd718f'
        feature = '4cc89807e4c3248a7768360c0a7f23696f11698a'
        plan = json.loads(Path('.review/profile-session/standalone-files.json').read_text())
        assert plan['base'] == base and plan['feature_commit'] == feature
        assert len(plan['files']) == 123
        subprocess.run(['git', 'merge-base', '--is-ancestor', base, feature], check=True)
        changed = subprocess.check_output(['git', 'diff', '--name-only', '-z', base, feature]).decode().split('\0')
        changed = sorted(path for path in changed if path)
        assert changed == sorted(entry['path'] for entry in plan['files'])
        allowed_tools = {'tools/android.sh', 'tools/arm.sh', 'tools/varredura-i18n.py'}
        assert changed and all((path.startswith('src/') or path in allowed_tools) and
                               '..' not in Path(path).parts for path in changed)
        target = Path(os.environ['GITHUB_WORKSPACE']) / 'ci-profile-feature'
        subprocess.run(['git', 'worktree', 'add', '--detach', str(target), feature], check=True)
        verified = []
        for entry in plan['files']:
            relative = entry['path']
            file = target / relative
            data = file.read_bytes()
            actual = hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest()
            expected = subprocess.check_output(['git', 'rev-parse', feature + ':' + relative], text=True).strip()
            assert actual == entry['sha'] == expected, (relative, actual, entry['sha'], expected)
            assert bool(file.stat().st_mode & 0o111) == (entry['mode'] == '100755')
            verified.append({'path': relative, 'sha': actual, 'mode': entry['mode']})
        output = Path(os.environ['GITHUB_WORKSPACE']) / 'build/review'
        output.mkdir(parents=True, exist_ok=True)
        proof = {'base': base, 'feature_commit': feature, 'build_commit': os.environ['GITHUB_SHA'],
                 'verified': True, 'feature_changed_paths': changed, 'files': verified}
        (output / 'standalone-source-verified.json').write_text(json.dumps(proof, indent=2) + '\n')
        print('Exact latest-upstream profile feature verified:', feature, len(verified), 'product paths')
        VERIFY
        test -z "$(git -C ci-profile-feature diff --name-only 17b7769dac4273557e1b07f5fb8734df91dd718f -- tests)"
        test -z "$(git -C ci-profile-feature status --porcelain)"
    - name: Install real Homebrew SDL and native SDK dependencies
      id: sdk
      run: brew install sdl2 sdl3 sdl2_image sdl2_ttf ffmpeg ripgrep
    - name: Preserve original compiler flags and add only link-time SDL3 rpath
      id: shim
      run: "set -euo pipefail\ncompiler=\"$(command -v cc)\"\nsdl3_library=\"$(brew --prefix sdl3)/lib\"\ntest -d \"$sdl3_library\"\
        \nmkdir -p \"$GITHUB_WORKSPACE/build/review/cc-bin\" \"$GITHUB_WORKSPACE/build/review/compile\"\ncp .review/profile-session/build/final-gates/cc_rpath.py\
        \ \"$GITHUB_WORKSPACE/build/review/cc-bin/cc\"\nchmod +x \"$GITHUB_WORKSPACE/build/review/cc-bin/cc\"\necho \"REVIEW_REAL_CC=$compiler\"\
        \ >> \"$GITHUB_ENV\"\necho \"REVIEW_SDL3_LIBRARY_DIR=$sdl3_library\" >> \"$GITHUB_ENV\"\necho \"REVIEW_CC_OUTPUT=$GITHUB_WORKSPACE/build/review/compile\"\
        \ >> \"$GITHUB_ENV\"\necho \"$GITHUB_WORKSPACE/build/review/cc-bin\" >> \"$GITHUB_PATH\"\necho 'Compiler callers retain\
        \ all original flags; only links receive the real SDL3 rpath' "
    - name: Prepare faithful reduced-fixture neighbours
      id: fixtures
      run: |-
        set -euo pipefail
        cd "$GITHUB_WORKSPACE/ci-profile-feature"
        python3 "$GITHUB_WORKSPACE/.review/profile-session/build/prepare_pr_legacy_tests.py" \
          --probe-log "$GITHUB_WORKSPACE/build/review/optional-import.log"
    - name: 'Original baseline: homeestado'
      timeout-minutes: 8
      if: ${{ !cancelled() && steps.source.outcome == 'success' && steps.sdk.outcome == 'success' && steps.shim.outcome ==
        'success' && steps.fixtures.outcome == 'success' }}
      run: |-
        set -euo pipefail
        cd "$GITHUB_WORKSPACE/ci-profile-feature"
        SANITIZE=1 FONTEFALHA_SANITIZE=1 bash tests/homeestado.sh \
          2>&1 | tee "$GITHUB_WORKSPACE/build/review/homeestado.log"
