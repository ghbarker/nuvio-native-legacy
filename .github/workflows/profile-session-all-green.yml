    - name: Require every gate and reverify all123 product blobs and linker arguments
      if: ${{ !cancelled() && steps.source.outcome == 'success' && steps.sdk.outcome == 'success' && steps.shim.outcome ==
        'success' && steps.fixtures.outcome == 'success' }}
      run: |-
        set -euo pipefail
        python3 - <<'VERIFY'
        import hashlib
        import json
        import os
        from pathlib import Path
        import subprocess
        plan = json.loads(Path('.review/profile-session/standalone-files.json').read_text())
        assert plan['base'] == '17b7769dac4273557e1b07f5fb8734df91dd718f' and plan['feature_commit'] == '4cc89807e4c3248a7768360c0a7f23696f11698a'
        assert len(plan['files']) == 123
        assert subprocess.check_output(['git', '-C', 'ci-profile-feature', 'rev-parse', 'HEAD'], text=True).strip() == '4cc89807e4c3248a7768360c0a7f23696f11698a'
        for entry in plan['files']:
            path = Path('ci-profile-feature') / entry['path']
            data = path.read_bytes()
            actual = hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest()
            assert actual == entry['sha'], (entry['path'], actual, entry['sha'])
            assert bool(path.stat().st_mode & 0o111) == (entry['mode'] == '100755')
        expected = ['homeestado', 'ordemperfil', 'ajustes_perfil', 'perfilsel', 'legmemoria', 'fontevolta', 'addons_legendas', 'fontecache_vod', 'i18n', 'addons_proveniencia', 'fontefalha', 'fontefalha_worker', 'fontefalha_playback', 'debrid', 'fontesmortas_orcamento']
        results = Path('build/review/results.txt').read_text().splitlines()
        assert sorted(results) == sorted(name + ' PASS' for name in expected), (results, expected)

        compiler_records = [json.loads(path.read_text()) for path in Path('build/review/compile').glob('*-invocation.json')]
        assert compiler_records
        expected_rpath = '-Wl,-rpath,' + str(Path(os.environ['REVIEW_SDL3_LIBRARY_DIR']).resolve())
        for record in compiler_records:
            original = record['arguments']
            if record['added_link_rpath'] is None:
                assert record['effective_arguments'] == original
            else:
                assert record['added_link_rpath'] == expected_rpath
                assert record['effective_arguments'] == original + [expected_rpath]
        links = [record for record in compiler_records if 'linked_binary' in record]
        assert links and all(record['returncode'] == 0 and record['load_commands_returncode'] == 0 for record in links)
        commands = list(Path('build/review/compile').glob('*-load-commands.txt'))
        assert len(commands) == len(links)
        assert all('cmd LC_RPATH' in path.read_text() and 'path ' + str(Path(os.environ['REVIEW_SDL3_LIBRARY_DIR']).resolve()) + ' (offset ' in path.read_text() for path in commands)
        proof = {'verified': True, 'outcome': 'PASS', 'base': plan['base'],
                 'feature_commit': plan['feature_commit'], 'review_commit': os.environ['GITHUB_SHA'],
                 'product_paths_reverified': len(plan['files']), 'gates': expected,
                 'compiler_arguments_preserved': True, 'link_only_sdl3_rpath': expected_rpath,
                 'DYLD_LIBRARY_PATH_injected': False, 'original_instrumentation_preserved': True,
                 'separate_original_full_source_asan_tests': ['fontepref', 'fontepref_file', 'player_retido']}
        Path('build/review/remaining-gates-verified.json').write_text(json.dumps(proof, indent=2) + '\n')
        print('All group gates PASS; all123 pinned product blobs and compiler argument preservation verified')
        VERIFY
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: profile-all-green-baselines-${{ github.sha }}
        path: build/review/
        if-no-files-found: error
