name: PR576 rebased episode identity validation
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      ASAN_OPTIONS: detect_leaks=0:halt_on_error=1
      UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 958f6a4fd0132fbbf260cebc3791ea81d7e354bf
          persist-credentials: false
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq libsdl2-dev libsdl2-image-dev libsdl2-ttf-dev libgles2-mesa-dev
      - name: Episode and tracker regressions, normal and ASan/UBSan
        run: |
          set -euo pipefail
          for san in 0 1; do
            export SANITIZE="$san"
            for suite in episode_identity512 catalog_episode_identity512 episodiosdup trakt_episode_identity_512 visto_identidade512 trakt_alvos512 trakt_contracts trakt_scrobble_ids contapend; do bash "tests/$suite.sh"; done
            bash tests/trakt_cw_vistas.sh
          done
  macos:
    runs-on: macos-15
    timeout-minutes: 30
    env:
      SDL_MAC_BACKGROUND_APP: '1'
      DYLD_LIBRARY_PATH: /opt/homebrew/lib
      ASAN_OPTIONS: detect_leaks=0:halt_on_error=1
      UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 958f6a4fd0132fbbf260cebc3791ea81d7e354bf
          persist-credentials: false
      - run: brew install pkg-config sdl2 sdl2_image sdl2_ttf libass fribidi
      - name: Episode, tracker and full-source player regressions
        run: |
          set -euo pipefail
          for san in 0 1; do
            export SANITIZE="$san"
            for suite in episode_identity512 catalog_episode_identity512 episodiosdup trakt_episode_identity_512 visto_identidade512 trakt_alvos512 trakt_contracts trakt_scrobble_ids contapend; do bash "tests/$suite.sh"; done
            bash tests/trakt_cw_vistas.sh
            bash tests/player_visto_trailer.sh
            bash tests/player_scrobble_trailer.sh
          done
