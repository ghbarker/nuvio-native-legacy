{
  "name": "Attach reviewed Windows updater v2 helpers to existing Logs18",
  "on": {
    "push": {
      "branches": [
        "review/ugoos-windows-updater-v2-20261015"
      ]
    }
  },
  "permissions": {
    "contents": "read"
  },
  "jobs": {
    "publish": {
      "if": "${{ true }}",
      "runs-on": "ubuntu-24.04",
      "timeout-minutes": 10,
      "permissions": {
        "contents": "write"
      },
      "steps": [
        {
          "uses": "actions/checkout@v4",
          "with": {
            "persist-credentials": false,
            "fetch-depth": 1
          }
        },
        {
          "name": "Check syntax and native exit handling with a local dummy process",
          "shell": "pwsh",
          "run": "$parseTokens = $null\n$parseErrors = $null\n$helperAst = [System.Management.Automation.Language.Parser]::ParseFile((Join-Path $env:GITHUB_WORKSPACE '.review/ugoos-updater-v2/Nuvio-Ugoos-Update-v2.ps1'), [ref]$parseTokens, [ref]$parseErrors)\nif ($parseErrors) { throw ($parseErrors | Out-String) }\n$functionAst = $helperAst.Find({ param($node) $node -is [System.Management.Automation.Language.FunctionDefinitionAst] -and $node.Name -eq 'Invoke-Adb' }, $true)\nif (-not $functionAst) { throw 'Native invocation function missing' }\n. ([scriptblock]::Create($functionAst.Extent.Text))\n$script:AdbExecutable = '/bin/bash'\n$observed = Invoke-Adb -AdbArguments @('-c', 'echo harmless-notice >&2; echo expected-result; exit 0')\nif ($observed -notmatch 'expected-result') { throw 'Successful native output lost' }\n$expectedFailure = $false\ntry { Invoke-Adb -AdbArguments @('-c', 'exit 7') | Out-Null } catch { $expectedFailure = $true }\nif (-not $expectedFailure) { throw 'Nonzero native status was accepted' }\nWrite-Host 'Syntax and dummy native exit handling passed. No ADB, device or top-level helper execution.'\nexit 0\n"
        },
        {
          "name": "Verify existing release and attach only reviewed helper bytes",
          "env": {
            "GITHUB_TOKEN": "${{ github.token }}"
          },
          "run": "python3 .review/ugoos-updater-v2/publish.py"
        },
        {
          "uses": "actions/upload-artifact@v4",
          "if": "always()",
          "with": {
            "name": "ugoos-updater-v2-publication-${{ github.sha }}",
            "path": "results/ugoos-updater-v2-publication.json",
            "if-no-files-found": "warn",
            "retention-days": 14
          }
        }
      ]
    }
  }
}
