name: Approved Live TV category PR checks
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    env:
      SDL_MAC_BACKGROUND_APP: '1'
      DYLD_LIBRARY_PATH: /opt/homebrew/lib
      ASAN_OPTIONS: detect_leaks=0:halt_on_error=1
      UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 8906f3f7
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Native dependencies
        shell: bash
        run: |
          if [ '${{ runner.os }}' = macOS ]; then
            brew install pkg-config sdl2 sdl2_image sdl2_ttf webp
          else
            sudo apt-get update -qq
            sudo apt-get install -y -qq pkg-config xvfb xauth libegl1-mesa-dev libsdl2-dev libsdl2-image-dev libsdl2-ttf-dev libwebp-dev libass-dev libfribidi-dev libgles2-mesa-dev
          fi
      - name: Normal and ASan UBSan Live TV regression suites
        shell: bash
        run: |
          set -euo pipefail
          for san in 0 1; do
            for suite in ajustes_iptv xtream guia_grande guia_grupos guia_loading guia_catalogo_tv guia_epg_estado m3u iptv_accounts epg_accounts epg_streaming epg_memory xtepg_bounded; do
              SANITIZE="$san" bash "tests/$suite.sh"
            done
          done
          bash tests/guiacorte.sh
          bash tests/ajustes_secoes.sh
          python3 tools/varredura-i18n.py
      - name: Merged Settings defaults
        if: runner.os == 'macOS'
        run: bash tests/ajustes_padroes.sh
      - name: Rendered portrait and TV category editor
        if: runner.os == 'Linux'
        run: xvfb-run -a bash tests/ajustes_categorias_ui.sh
