name: Shared source exclusion filters test APK
'on':
  push:
    branches:
    - review/failover-settings-cleanup
permissions:
  contents: read
concurrency:
  group: source-filters-${{ github.sha }}
  cancel-in-progress: true
jobs:
  native:
    name: Source filters, parser and playback regressions (macOS)
    runs-on: macos-14
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false
        fetch-depth: 0
    - name: Apply and verify reviewed source filters and retained Settings cleanup
      run: |
        set -euo pipefail
        git apply --check --unidiff-zero --unidiff-zero .review/source-filters.patch
        git apply --unidiff-zero .review/source-filters.patch
        python3 - <<'VERIFY'
        import hashlib
        import json
        import os
        import shutil
        from pathlib import Path

        plan_path = Path('.review/source-filters-files.json')
        plan = json.loads(plan_path.read_text())
        assert plan['base'] == '3b5bfc78a0deaa4fe0f2b33b7c33bf3cd2ec81b8', plan['base']
        verified = []
        paths = set()
        for entry in plan['files']:
            relative = entry['path']
            assert relative.startswith(('src/', 'tests/')), relative
            assert '..' not in Path(relative).parts, relative
            assert relative not in paths, relative
            paths.add(relative)
            path = Path(relative)
            data = path.read_bytes()
            actual = hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest()
            assert actual == entry['sha'], (relative, actual, entry['sha'])
            executable = bool(path.stat().st_mode & 0o111)
            assert executable == (entry['mode'] == '100755'), (relative, entry['mode'])
            verified.append({'path': relative, 'sha': actual, 'mode': entry['mode']})
        assert verified, 'Source manifest must contain the reviewed delta'
        output = Path('build/review')
        output.mkdir(parents=True, exist_ok=True)
        shutil.copyfile(plan_path, output / 'source-filters-files.json')
        proof = {'base': plan['base'], 'build_commit': os.environ['GITHUB_SHA'],
                 'files': verified, 'verified': True}
        (output / 'source-verified.json').write_text(json.dumps(proof, indent=2) + '\n')
        print('Verified exact source filters and retained cleanup:', len(verified), 'files')
        VERIFY
    - name: Native tools
      run: brew install sdl2 sdl2_image sdl2_ttf ffmpeg
    - name: Run all affected native regression suites
      run: |
        set -uo pipefail
        mkdir -p build/review "$NV_TMP"
        command -v ffmpeg >/dev/null || { echo 'FFmpeg is required for proxyts coverage'; exit 1; }
        failed=0
        for name in fontefiltro fontefiltro_parse fontefalha fontefalha_worker fontefalha_playback \
        +  ajustes_failover stream_parser streamfit_parser debrid i18n \
        +  p2p pluginjs plugins_fontes proxyts guia_stream_headers \
        +  fhd402 fonte_ordem_addon addonslista addonurl addons_proveniencia \
        +  autoplay_alvo fontecache_vod proxprefetch fontesmortas_orcamento fontesmortas_manual \
        +  player_android_retomada; do
          if bash "tests/$name.sh" 2>&1 | tee "build/review/$name.log"; then
            echo "$name PASS" >> build/review/results.txt
          else
            echo "$name FAIL" >> build/review/results.txt
            failed=1
          fi
        done
        cat build/review/results.txt
        exit "$failed"
    - name: Verify catalogue adds no omissions over the published APK
      run: |
        set -euo pipefail
        mkdir -p build/review
        task_dir="$(mktemp -d "${TMPDIR:-/tmp}/nuvio-settings-baseline.XXXXXX")"
        trap 'rm -rf "$task_dir"' EXIT
        task_base="3b5bfc78a0deaa4fe0f2b33b7c33bf3cd2ec81b8"
        git show "$task_base:tests/ajustes_secoes.py" > "$task_dir/ajustes_secoes.py"
        git show "$task_base:src/ajustes.c" > "$task_dir/ajustes.c"
        git show "$task_base:src/ajustes_ux_tela.inc" > "$task_dir/ajustes_ux_tela.inc"
        set +e
        python3 "$task_dir/ajustes_secoes.py" "$task_dir/ajustes.c" \
          --catalogo "$task_dir/ajustes_ux_tela.inc" > build/review/catalogue-baseline.log 2>&1
        task_baseline_status=$?
        python3 tests/ajustes_secoes.py src/ajustes.c \
          --catalogo src/ajustes_ux_tela.inc > build/review/catalogue-current.log 2>&1
        task_current_status=$?
        set -e
        python3 - "$task_baseline_status" "$task_current_status" <<'CATALOGUE' | tee -a build/review/results.txt
        import sys
        from pathlib import Path

        baseline = Path('build/review/catalogue-baseline.log').read_text()
        current = Path('build/review/catalogue-current.log').read_text()
        baseline_failures = [line for line in baseline.splitlines() if line.startswith('FALHA: ')]
        current_failures = [line for line in current.splitlines() if line.startswith('FALHA: ')]
        assert sys.argv[1] == sys.argv[2] == '1', (sys.argv[1], sys.argv[2], baseline, current)
        assert len(baseline_failures) == 7, baseline
        assert all('AJ_PROF_' in line for line in baseline_failures), baseline
        assert current_failures == baseline_failures, (baseline, current)
        print('Catalogue: no new omissions; baseline has 7 known profile omissions')
        CATALOGUE
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: source-filters-regressions-${{ github.sha }}
        path: build/review/
        retention-days: 14
    env:
      NV_TMP: ${{ runner.temp }}/nuvio-source-filters
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      NUVIO_ANDROID_JOBS: 2
    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false
        fetch-depth: 0
    - name: Apply and verify reviewed source filters and retained Settings cleanup
      run: |
        set -euo pipefail
        git apply --check --unidiff-zero --unidiff-zero .review/source-filters.patch
        git apply --unidiff-zero .review/source-filters.patch
        python3 - <<'VERIFY'
        import hashlib
        import json
        import os
        import shutil
        from pathlib import Path

        plan_path = Path('.review/source-filters-files.json')
        plan = json.loads(plan_path.read_text())
        assert plan['base'] == '3b5bfc78a0deaa4fe0f2b33b7c33bf3cd2ec81b8', plan['base']
        verified = []
        paths = set()
        for entry in plan['files']:
            relative = entry['path']
            assert relative.startswith(('src/', 'tests/')), relative
            assert '..' not in Path(relative).parts, relative
            assert relative not in paths, relative
            paths.add(relative)
            path = Path(relative)
            data = path.read_bytes()
            actual = hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest()
            assert actual == entry['sha'], (relative, actual, entry['sha'])
            executable = bool(path.stat().st_mode & 0o111)
            assert executable == (entry['mode'] == '100755'), (relative, entry['mode'])
            verified.append({'path': relative, 'sha': actual, 'mode': entry['mode']})
        assert verified, 'Source manifest must contain the reviewed delta'
        output = Path('build/review')
        output.mkdir(parents=True, exist_ok=True)
        shutil.copyfile(plan_path, output / 'source-filters-files.json')
        proof = {'base': plan['base'], 'build_commit': os.environ['GITHUB_SHA'],
                 'files': verified, 'verified': True}
        (output / 'source-verified.json').write_text(json.dumps(proof, indent=2) + '\n')
        print('Verified exact source filters and retained cleanup:', len(verified), 'files')
        VERIFY
    - uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '17'
    - uses: android-actions/setup-android@v3
      with:
        packages: platform-tools
        log-accepted-android-sdk-licenses: false
    - name: Build tools
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y ninja-build cmake nasm ffmpeg python3-pil zlib1g-dev
        sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'ndk;27.2.12479018' 'cmake;3.22.1'
    - name: Public application configuration and debug signing
      env:
        NUVIO_TOUCH_CORE_PROPERTIES: ${{ secrets.NUVIO_TOUCH_CORE_PROPERTIES }}
        NUVIO_TOUCH_DEBUG_KEYSTORE_B64: ${{ secrets.NUVIO_TOUCH_DEBUG_KEYSTORE_B64 }}
      run: |
        mkdir -p build/android
        python3 - <<'PY'
        import os
        from pathlib import Path
        body = os.environ.get('NUVIO_TOUCH_CORE_PROPERTIES', '')
        if not body:
            raise SystemExit('Set NUVIO_TOUCH_CORE_PROPERTIES for this debug build')
        path = Path('build/android/product.properties')
        path.write_text(body)
        path.chmod(0o600)
        PY
        test -n "$NUVIO_TOUCH_DEBUG_KEYSTORE_B64" || { echo 'Set NUVIO_TOUCH_DEBUG_KEYSTORE_B64 for repeatable debug updates'; exit 1; }
        mkdir -p "$HOME/.android"
        printf '%s' "$NUVIO_TOUCH_DEBUG_KEYSTORE_B64" | base64 --decode > "$HOME/.android/debug.keystore"
        chmod 600 "$HOME/.android/debug.keystore"
        echo "NUVIO_PROPERTIES=$GITHUB_WORKSPACE/build/android/product.properties" >> "$GITHUB_ENV"
    - uses: actions/cache/restore@v4
      id: native-cache
      with:
        path: ~/.cache/nuvio-android
        key: android-touch-native-v1-${{ runner.os }}-${{ hashFiles('tools/android/deps.sh', 'tools/android/ffmpeg-android.sh',
          'android/app/src/main/cpp/CMakeLists.txt') }}
        restore-keys: android-touch-native-v1-${{ runner.os }}-
    - uses: actions/cache/restore@v4
      id: gradle-cache
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: android-touch-gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle.kts', 'android/gradle/wrapper/gradle-wrapper.properties')
          }}
        restore-keys: android-touch-gradle-${{ runner.os }}-
    - name: Native ARM dependencies
      run: bash tools/android/deps.sh arm64-v8a armeabi-v7a
    - name: Standard production-tool debug APK
      env:
        NUVIO_P2P_MOTOR: none
        NUVIO_REQUIRE_CORE: '1'
      run: bash tools/android.sh
    - name: Verify standard package and both ARM architectures
      run: |
        python3 - "$ANDROID_HOME/build-tools/35.0.0/aapt" <<'PY'
        import re
        import subprocess
        import sys
        import zipfile
        from pathlib import Path
        apks = list(Path('build/android').glob('*-android-debug.apk'))
        if len(apks) != 1:
            raise SystemExit(f'Expected one standard debug APK, found {len(apks)}')
        apk = apks[0]
        badging = subprocess.run([sys.argv[1], 'dump', 'badging', str(apk)], check=True, capture_output=True, text=True).stdout
        package = re.search(r"^package: name='([^']+)'", badging, re.MULTILINE)
        if package is None or package.group(1) != 'space.nuvio.nativelegacy':
            raise SystemExit('APK must use the standard space.nuvio.nativelegacy application ID')
        label = re.search(r"^application-label:'([^']+)'", badging, re.MULTILINE)
        if label is None:
            raise SystemExit('APK application label is missing')
        print(f'applicationId={package.group(1)} applicationLabel={label.group(1)}')
        with zipfile.ZipFile(apk) as archive:
            names = set(archive.namelist())
        for abi in ('arm64-v8a', 'armeabi-v7a'):
            required = f'lib/{abi}/libmain.so'
            if required not in names:
                raise SystemExit(f'APK missing {required}')
        print(f'{apk}: standard application ID and both ARM native cores verified')
        PY
    - name: Prepare compatible test installation in CI working copy
      run: |
        python3 - <<'PY'
        from pathlib import Path
        replacements = {
            Path('android/app/build.gradle.kts'): [
                ('applicationId = "space.nuvio.nativelegacy"', 'applicationId = "space.nuvio.nativelegacy.touch"'),
            ],
            Path('android/app/src/main/AndroidManifest.xml'): [
                ('android:label="@string/app_name"', 'android:label="Nuvio TV/Mobile Test"'),
                ('android:authorities="space.nuvio.nativelegacy.atualizacao"', 'android:authorities="space.nuvio.nativelegacy.touch.atualizacao"'),
            ],
        }
        updated = {}
        for path, pairs in replacements.items():
            body = path.read_text()
            for old, new in pairs:
                if body.count(old) != 1:
                    raise SystemExit(f'{path}: expected exactly one {old!r}')
                body = body.replace(old, new)
            updated[path] = body
        for path, body in updated.items():
            path.write_text(body)
        print('Temporary CI package, label and provider authority changed; production namespace and classes preserved')
        PY

        # The separately reviewed #472 touch-picker fix stays in the test APK only.
        python3 - <<'PICKER'
        from pathlib import Path
        p=Path('src/ajustes_ux_desenho.inc')
        s=p.read_text()
        needle='      op == AJ_LOGO_APP /* abre o seletor'
        assert s.count(needle)==1
        s=s.replace(needle,'      op == AJ_INTERFACE_MODO /* toque em TV: PR #472 */ ||\n'+needle)
        p.write_text(s)
        print('Test APK also includes the isolated Interface-mode touch fix from PR #472')
        PICKER
    - name: Compatible TV and Mobile test APK
      env:
        NUVIO_P2P_MOTOR: none
      run: |
        task_root="$PWD"
        task_cache="${NUVIO_ANDROID_CACHE:-$HOME/.cache/nuvio-android}"
        task_stage="$task_root/build/android"
        bash android/gradlew -p android --console=plain \
          -Pnuvio.sdlSrc="$task_cache/src" \
          -Pnuvio.estagio="$task_stage" \
          -Pnuvio.ffmpegAar="$task_stage/media3-ffmpeg-16kb.aar" \
          assembleDebug
        task_version="$(python3 -c 'import json; print(json.load(open("deploy/app/appinfo.json"))["version"])')"
        cp android/app/build/outputs/apk/debug/app-debug.apk "build/android/Nuvio-$task_version-tv-mobile-test.apk"
    - name: Verify compatible test package, label and native packaging
      run: |
        python3 - "$ANDROID_HOME/build-tools/35.0.0/aapt" <<'PY'
        import re
        import subprocess
        import sys
        import zipfile
        from pathlib import Path
        apks = list(Path('build/android').glob('*-tv-mobile-test.apk'))
        if len(apks) != 1:
            raise SystemExit(f'Expected one compatible test APK, found {len(apks)}')
        apk = apks[0]
        badging = subprocess.run([sys.argv[1], 'dump', 'badging', str(apk)], check=True, capture_output=True, text=True).stdout
        package = re.search(r"^package: name='([^']+)'", badging, re.MULTILINE)
        label = re.search(r"^application-label:'([^']+)'", badging, re.MULTILINE)
        if package is None or package.group(1) != 'space.nuvio.nativelegacy.touch':
            raise SystemExit('Test APK must use space.nuvio.nativelegacy.touch')
        if label is None or label.group(1) != 'Nuvio TV/Mobile Test':
            raise SystemExit('Test APK must be labeled Nuvio TV/Mobile Test')
        print(f'applicationId={package.group(1)} applicationLabel={label.group(1)}')
        with zipfile.ZipFile(apk) as archive:
            names = set(archive.namelist())
        for abi in ('arm64-v8a', 'armeabi-v7a'):
            required = f'lib/{abi}/libmain.so'
            if required not in names:
                raise SystemExit(f'APK missing {required}')
        subprocess.run([sys.executable, 'tools/android-apk-pages.py', str(apk)], check=True)
        print(f'{apk}: compatible test identity, both ARM native cores and page packaging verified')
        PY
    - name: Locate build outputs
      id: outputs
      if: always()
      run: |
        if compgen -G 'build/android/*-android-debug.apk' >/dev/null; then
          echo 'standard_apk=true' >> "$GITHUB_OUTPUT"
        fi
        if compgen -G 'build/android/*-tv-mobile-test.apk' >/dev/null; then
          echo 'test_apk=true' >> "$GITHUB_OUTPUT"
        fi
        if [[ -d "$HOME/.cache/nuvio-android" ]]; then
          echo 'native_cache=true' >> "$GITHUB_OUTPUT"
        fi
        if [[ -d "$HOME/.gradle/caches" || -d "$HOME/.gradle/wrapper" ]]; then
          echo 'gradle_cache=true' >> "$GITHUB_OUTPUT"
        fi
    - uses: actions/cache/save@v4
      if: always() && steps.outputs.outputs.native_cache == 'true' && steps.native-cache.outputs.cache-hit != 'true' && steps.native-cache.outputs.cache-primary-key
        != ''
      with:
        path: ~/.cache/nuvio-android
        key: ${{ steps.native-cache.outputs.cache-primary-key }}
    - uses: actions/cache/save@v4
      if: always() && steps.outputs.outputs.gradle_cache == 'true' && steps.gradle-cache.outputs.cache-hit != 'true' && steps.gradle-cache.outputs.cache-primary-key
        != ''
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: ${{ steps.gradle-cache.outputs.cache-primary-key }}
    - uses: actions/upload-artifact@v4
      if: always() && steps.outputs.outputs.standard_apk == 'true'
      with:
        name: Nuvio-source-filters-standard-${{ github.sha }}
        path: build/android/*-android-debug.apk
        if-no-files-found: error
        retention-days: 14
    - uses: actions/upload-artifact@v4
      if: always() && steps.outputs.outputs.test_apk == 'true'
      with:
        name: Nuvio-source-filters-test-${{ github.sha }}
        path: build/android/*-tv-mobile-test.apk
        if-no-files-found: error
        retention-days: 14
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: source-filters-android-source-${{ github.sha }}
        path: build/review/
        if-no-files-found: warn
        retention-days: 14
    name: Source filters compatible test APK (both ARM architectures)
