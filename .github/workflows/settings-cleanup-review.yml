name: Shared source exclusion filters test APK
'on':
  push:
    branches:
    - review/failover-settings-cleanup
permissions:
  contents: read
  actions: read
concurrency:
  group: source-filters-${{ github.sha }}
  cancel-in-progress: true
jobs:
  native:
    name: Live TV proxy fixture and catalogue validation (macOS)
    runs-on: macos-14
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false
        fetch-depth: 0
    - name: Apply and verify reviewed source filters and retained Settings cleanup
      run: |
        set -euo pipefail
        git apply --check --unidiff-zero .review/source-filters.patch
        git apply --unidiff-zero .review/source-filters.patch
        python3 - <<'VERIFY'
        import hashlib
        import json
        import os
        import shutil
        from pathlib import Path

        plan_path = Path('.review/source-filters-files.json')
        plan = json.loads(plan_path.read_text())
        assert plan['base'] == '3b5bfc78a0deaa4fe0f2b33b7c33bf3cd2ec81b8', plan['base']
        verified = []
        paths = set()
        for entry in plan['files']:
            relative = entry['path']
            assert relative.startswith(('src/', 'tests/')), relative
            assert '..' not in Path(relative).parts, relative
            assert relative not in paths, relative
            paths.add(relative)
            path = Path(relative)
            data = path.read_bytes()
            actual = hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest()
            assert actual == entry['sha'], (relative, actual, entry['sha'])
            executable = bool(path.stat().st_mode & 0o111)
            assert executable == (entry['mode'] == '100755'), (relative, entry['mode'])
            verified.append({'path': relative, 'sha': actual, 'mode': entry['mode']})
        assert verified, 'Source manifest must contain the reviewed delta'
        output = Path('build/review')
        output.mkdir(parents=True, exist_ok=True)
        shutil.copyfile(plan_path, output / 'source-filters-files.json')
        proof = {'base': plan['base'], 'build_commit': os.environ['GITHUB_SHA'],
                 'files': verified, 'verified': True}
        (output / 'source-verified.json').write_text(json.dumps(proof, indent=2) + '\n')
        print('Verified exact source filters and retained cleanup:', len(verified), 'files')
        VERIFY
    - name: Native tools
      run: brew install sdl2 sdl2_image sdl2_ttf ffmpeg
    - name: Run the proxy fixture regression with realistic download deadlines
      run: |
        export NV_TMP="$RUNNER_TEMP/nuvio-source-filters"
        set -uo pipefail
        mkdir -p build/review "$NV_TMP"
        command -v ffmpeg >/dev/null || { echo 'FFmpeg is required for proxyts coverage'; exit 1; }
        failed=0
        for name in proxyts; do
          if bash "tests/$name.sh" 2>&1 | tee "build/review/$name.log"; then
            echo "$name PASS" >> build/review/results.txt
          else
            echo "$name FAIL" >> build/review/results.txt
            failed=1
          fi
        done
        cat build/review/results.txt
        exit "$failed"
    - name: Verify catalogue adds no omissions over the published APK
      run: |
        set -euo pipefail
        mkdir -p build/review
        task_dir="$(mktemp -d "${TMPDIR:-/tmp}/nuvio-settings-baseline.XXXXXX")"
        trap 'rm -rf "$task_dir"' EXIT
        task_base="3b5bfc78a0deaa4fe0f2b33b7c33bf3cd2ec81b8"
        git show "$task_base:tests/ajustes_secoes.py" > "$task_dir/ajustes_secoes.py"
        git show "$task_base:src/ajustes.c" > "$task_dir/ajustes.c"
        git show "$task_base:src/ajustes_ux_tela.inc" > "$task_dir/ajustes_ux_tela.inc"
        set +e
        python3 "$task_dir/ajustes_secoes.py" "$task_dir/ajustes.c" \
          --catalogo "$task_dir/ajustes_ux_tela.inc" > build/review/catalogue-baseline.log 2>&1
        task_baseline_status=$?
        python3 tests/ajustes_secoes.py src/ajustes.c \
          --catalogo src/ajustes_ux_tela.inc > build/review/catalogue-current.log 2>&1
        task_current_status=$?
        set -e
        python3 - "$task_baseline_status" "$task_current_status" <<'CATALOGUE' | tee -a build/review/results.txt
        import sys
        from pathlib import Path

        baseline = Path('build/review/catalogue-baseline.log').read_text()
        current = Path('build/review/catalogue-current.log').read_text()
        baseline_failures = [line for line in baseline.splitlines() if line.startswith('FALHA: ')]
        current_failures = [line for line in current.splitlines() if line.startswith('FALHA: ')]
        assert sys.argv[1] == sys.argv[2] == '1', (sys.argv[1], sys.argv[2], baseline, current)
        assert len(baseline_failures) == 7, baseline
        assert all('AJ_PROF_' in line for line in baseline_failures), baseline
        assert current_failures == baseline_failures, (baseline, current)
        print('Catalogue: no new omissions; baseline has 7 known profile omissions')
        CATALOGUE
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: source-filters-regressions-${{ github.sha }}
        path: build/review/
        retention-days: 14
  android:
    name: Reuse verified compatible APK with identical app source
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false
    - name: Download the successful producer source proof
      uses: actions/download-artifact@v4
      with:
        run-id: 38357166635
        github-token: ${{ github.token }}
        name: source-filters-android-source-aed6b346c39facba9a62c49c91b845a14f4a93bb
        path: build/producer-proof
    - name: Download the unchanged compatible test APK
      uses: actions/download-artifact@v4
      with:
        run-id: 38357166635
        github-token: ${{ github.token }}
        name: Nuvio-source-filters-test-aed6b346c39facba9a62c49c91b845a14f4a93bb
        path: build/android
    - name: Verify producer success and identical app source; hash the reused APK
      id: reuse
      env:
        GITHUB_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        python3 - <<'REUSE'
        import hashlib
        import json
        import os
        import shutil
        import urllib.request
        from pathlib import Path

        producer_commit = 'aed6b346c39facba9a62c49c91b845a14f4a93bb'
        producer_run = 38357166635
        producer_job = 115162624828
        base = '3b5bfc78a0deaa4fe0f2b33b7c33bf3cd2ec81b8'
        plan_path = Path('.review/source-filters-files.json')
        plan = json.loads(plan_path.read_text())
        old = json.loads(Path('build/producer-proof/source-verified.json').read_text())
        assert plan['base'] == old['base'] == base, (plan['base'], old['base'])
        assert old['build_commit'] == producer_commit, old['build_commit']
        assert old['verified'] is True, 'Producer source was not verified'

        # The APK depends on app source; the sole new delta is a test fixture deadline.
        def app_sources(entries):
            result = {}
            for entry in entries:
                relative = entry['path']
                assert '..' not in Path(relative).parts, relative
                if relative.startswith('src/'):
                    assert relative not in result, relative
                    assert entry['mode'] in ('100644', '100755'), (relative, entry['mode'])
                    result[relative] = (entry['sha'], entry['mode'])
            assert result, 'Expected a nonempty app source inventory'
            return result

        current_sources = app_sources(plan['files'])
        producer_sources = app_sources(old['files'])
        assert current_sources == producer_sources, 'App source differs from the successful APK producer'

        api_root = os.environ.get('GITHUB_API_URL', 'https://api.github.com').rstrip('/')
        api_url = api_root + '/repos/' + os.environ['GITHUB_REPOSITORY'] + '/actions/jobs/' + str(producer_job)
        request = urllib.request.Request(api_url, headers={
            'Authorization': 'Bearer ' + os.environ['GITHUB_TOKEN'],
            'Accept': 'application/vnd.github+json',
            'X-GitHub-Api-Version': '2022-11-28',
        })
        with urllib.request.urlopen(request, timeout=30) as response:
            job = json.load(response)
        assert job['id'] == producer_job and job['run_id'] == producer_run, (job['id'], job['run_id'])
        assert job['head_sha'] == producer_commit, job['head_sha']
        assert job['status'] == 'completed' and job['conclusion'] == 'success', (job['status'], job['conclusion'])

        apks = list(Path('build/android').glob('*-tv-mobile-test.apk'))
        assert len(apks) == 1, f'Expected one unchanged compatible APK, found {len(apks)}'
        apk = apks[0]
        assert apk.stat().st_size > 0, 'Producer APK is empty'
        digest = hashlib.sha256()
        with apk.open('rb') as handle:
            for block in iter(lambda: handle.read(1024 * 1024), b''):
                digest.update(block)
        output = Path('build/review')
        output.mkdir(parents=True, exist_ok=True)
        shutil.copyfile(plan_path, output / 'source-filters-files.json')
        proof = {
            'base': base,
            'build_commit': os.environ['GITHUB_SHA'],
            'verified': True,
            'verification': 'App source matches the successful producer; APK reused without modification',
            'files': [{'path': path, 'sha': value[0], 'mode': value[1]}
                      for path, value in sorted(current_sources.items())],
            'producer_commit': producer_commit,
            'producer_run_id': producer_run,
            'producer_job_id': producer_job,
        }
        (output / 'source-verified.json').write_text(json.dumps(proof, indent=2) + '\n')
        report = {
            'producer_commit': producer_commit,
            'producer_run_id': producer_run,
            'producer_job_id': producer_job,
            'producer_job_conclusion': job['conclusion'],
            'current_review_commit': os.environ['GITHUB_SHA'],
            'app_source_files_verified': len(current_sources),
            'apk': apk.name,
            'bytes': apk.stat().st_size,
            'sha256': digest.hexdigest(),
            'reused_without_modification': True,
            'package_and_signing': 'Unchanged producer APK bytes',
        }
        (output / 'apk-reuse.json').write_text(json.dumps(report, indent=2) + '\n')
        (output / 'apk-sha256.txt').write_text(digest.hexdigest() + '  ' + apk.name + '\n')
        print('Producer Android job success verified:', producer_job)
        print('Identical app source SHA/mode inventory:', len(current_sources), 'files')
        print('Reused compatible APK without rebuilding:', apk.name)
        print('APK SHA-256:', digest.hexdigest())
        REUSE
    - uses: actions/upload-artifact@v4
      if: success() && steps.reuse.outcome == 'success'
      with:
        name: Nuvio-source-filters-test-${{ github.sha }}
        path: build/android/*-tv-mobile-test.apk
        if-no-files-found: error
        retention-days: 14
    - uses: actions/upload-artifact@v4
      if: success() && steps.reuse.outcome == 'success'
      with:
        name: source-filters-android-source-${{ github.sha }}
        path: build/review/
        if-no-files-found: error
        retention-days: 14
