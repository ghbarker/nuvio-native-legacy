{
  "name": "Publish the verified compatible Logs12 test update",
  "on": {
    "push": {
      "branches": [
        "review/apk20022-publish-20261015"
      ],
      "paths": [
        ".review/apk20022-publish/**",
        ".github/workflows/apk20022-publish.yml"
      ]
    },
    "workflow_dispatch": {}
  },
  "permissions": {
    "contents": "read",
    "actions": "read"
  },
  "concurrency": {
    "group": "nuvio-test-logs12-release",
    "cancel-in-progress": false
  },
  "env": {
    "APK20022_RELEASE_LOCK_SHA256": "0839fe34e2f98536e9b0d66bb6f2ddef7e70f64481d8824d882779a6bb8bc4bf",
    "NUVIO_REVIEW_PLAN_SHA256": "62676ff601333f7a12b9d9f1dae96af172a42e74e679c0690ef87f31780ba0e0"
  },
  "jobs": {
    "publish": {
      "runs-on": "ubuntu-24.04",
      "timeout-minutes": 30,
      "permissions": {
        "contents": "write",
        "actions": "read"
      },
      "steps": [
        {
          "uses": "actions/checkout@v4",
          "with": {
            "persist-credentials": false,
            "fetch-depth": 0
          }
        },
        {
          "name": "Refuse incomplete or unapproved final pins before tool setup",
          "run": "python3 .review/apk20022-publish/publish.py --check-lock"
        },
        {
          "uses": "actions/setup-java@v4",
          "with": {
            "distribution": "temurin",
            "java-version": "17"
          }
        },
        {
          "uses": "android-actions/setup-android@v3",
          "with": {
            "packages": "platform-tools",
            "log-accepted-android-sdk-licenses": false
          }
        },
        {
          "name": "Install verification tools only; no app build",
          "run": "sdkmanager 'build-tools;35.0.0'"
        },
        {
          "name": "Verify actual green validation/artifacts/APK and publish exact draft by ID",
          "env": {
            "GH_TOKEN": "${{ github.token }}"
          },
          "run": "python3 .review/apk20022-publish/publish.py --publish"
        },
        {
          "uses": "actions/upload-artifact@v4",
          "if": "always()",
          "with": {
            "name": "apk20022-publication-${{ github.sha }}",
            "path": "publication/*-receipt.json\npublication/*-failure.json\npublication/draft-created.json",
            "if-no-files-found": "warn",
            "retention-days": 14
          }
        }
      ]
    }
  }
}
