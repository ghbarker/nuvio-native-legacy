name: 'Frozen PR431 macOS review: Kotlin fixture dependency setup'
'on':
  push:
    branches:
    - review/pr431-jvm-fix-v1
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  native:
    name: Frozen PR431 macOS gates with resolved Kotlin2.0.21 fixtures
    runs-on: macos-14
    timeout-minutes: 75
    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false
        fetch-depth: 0
    - name: Materialize and verify exact pinned product source
      run: python3 .review/source-preload/build/verify_source.py --case automatic-rebase --source-commit e7f58bc8108534e4425867ac04127731962ccf73
        --target source-app --proof build/review/source-verified.json
    - uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '17'
    - uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: '8.9'
    - name: Resolve exact compiler artifacts required by unchanged upstream Window fixture
      run: gradle -p .review/source-preload/window-compiler --console=plain resolveWindowCompiler
    - name: Native SDK and real SDL libraries
      run: brew install sdl2 sdl3 sdl2_image sdl2_ttf ffmpeg ripgrep kotlin
    - name: Add only link-time SDL3 rpath while preserving all original compiler flags
      run: 'set -euo pipefail

        compiler="$(command -v cc)"

        sdl3_library="$(brew --prefix sdl3)/lib"

        test -d "$sdl3_library"

        mkdir -p "$GITHUB_WORKSPACE/build/review/cc-bin" "$GITHUB_WORKSPACE/build/review/compile"

        cp .review/source-preload/build/cc_rpath.py "$GITHUB_WORKSPACE/build/review/cc-bin/cc"

        chmod +x "$GITHUB_WORKSPACE/build/review/cc-bin/cc"

        echo "REVIEW_REAL_CC=$compiler" >> "$GITHUB_ENV"

        echo "REVIEW_SDL3_LIBRARY_DIR=$sdl3_library" >> "$GITHUB_ENV"

        echo "REVIEW_CC_OUTPUT=$GITHUB_WORKSPACE/build/review/compile" >> "$GITHUB_ENV"

        echo "$GITHUB_WORKSPACE/build/review/cc-bin" >> "$GITHUB_PATH"'
    - name: Full app TV/Mobile builds and final behavior gates
      working-directory: source-app
      env:
        NUVIO_SOURCE_PRELOAD_REVIEW: ${{ github.workspace }}/.review/source-preload
        NUVIO_SOURCE_PRELOAD_RESULTS: ${{ github.workspace }}/build/review/native
        NUVIO_SOURCE_PRELOAD_CASE: automatic-rebase
      run: bash "$NUVIO_SOURCE_PRELOAD_REVIEW/build/run_native.sh"
    - name: Reverify pinned product source after native checks
      run: python3 .review/source-preload/build/verify_source.py --case automatic-rebase --source-commit e7f58bc8108534e4425867ac04127731962ccf73
        --target source-app --proof build/review/source-verified.json --reverify
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: source-preload-native-automatic-jvm-fix-${{ github.sha }}
        path: build/review/
        retention-days: 14
