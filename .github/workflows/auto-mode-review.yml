name: Automatic Android interface review
permissions:
  contents: read
concurrency:
  group: android-tv-mobile-product-${{ github.ref }}
  cancel-in-progress: true
jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      NUVIO_ANDROID_JOBS: 2
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '17'
    - uses: android-actions/setup-android@v3
      with:
        packages: platform-tools
        log-accepted-android-sdk-licenses: false
    - name: Build tools
      run: 'sudo apt-get update -qq

        sudo apt-get install -y ninja-build cmake nasm ffmpeg python3-pil zlib1g-dev

        sdkmanager ''platforms;android-35'' ''build-tools;35.0.0'' ''ndk;27.2.12479018'' ''cmake;3.22.1''

        '
    - name: Public application configuration and debug signing
      env:
        NUVIO_TOUCH_CORE_PROPERTIES: ${{ secrets.NUVIO_TOUCH_CORE_PROPERTIES }}
        NUVIO_TOUCH_DEBUG_KEYSTORE_B64: ${{ secrets.NUVIO_TOUCH_DEBUG_KEYSTORE_B64 }}
      run: "mkdir -p build/android\npython3 - <<'PY'\nimport os\nfrom pathlib import Path\nbody = os.environ.get('NUVIO_TOUCH_CORE_PROPERTIES', '')\nif not body:\n    raise SystemExit('Set NUVIO_TOUCH_CORE_PROPERTIES for this debug build')\npath = Path('build/android/product.properties')\npath.write_text(body)\npath.chmod(0o600)\nPY\ntest -n \"$NUVIO_TOUCH_DEBUG_KEYSTORE_B64\" || { echo 'Set NUVIO_TOUCH_DEBUG_KEYSTORE_B64 for repeatable debug updates'; exit 1; }\nmkdir -p \"$HOME/.android\"\nprintf '%s' \"$NUVIO_TOUCH_DEBUG_KEYSTORE_B64\" | base64 --decode > \"$HOME/.android/debug.keystore\"\nchmod 600 \"$HOME/.android/debug.keystore\"\necho \"NUVIO_PROPERTIES=$GITHUB_WORKSPACE/build/android/product.properties\" >> \"$GITHUB_ENV\"\n"
    - uses: actions/cache/restore@v4
      id: native-cache
      with:
        path: ~/.cache/nuvio-android
        key: android-touch-native-v1-${{ runner.os }}-${{ hashFiles('tools/android/deps.sh', 'tools/android/ffmpeg-android.sh', 'android/app/src/main/cpp/CMakeLists.txt') }}
        restore-keys: android-touch-native-v1-${{ runner.os }}-
    - uses: actions/cache/restore@v4
      id: gradle-cache
      with:
        path: '~/.gradle/caches

          ~/.gradle/wrapper

          '
        key: android-touch-gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle.kts', 'android/gradle/wrapper/gradle-wrapper.properties') }}
        restore-keys: android-touch-gradle-${{ runner.os }}-
    - name: Native ARM dependencies
      run: bash tools/android/deps.sh arm64-v8a armeabi-v7a
    - name: Standard production-tool debug APK
      env:
        NUVIO_P2P_MOTOR: none
        NUVIO_REQUIRE_CORE: '1'
      run: bash tools/android.sh
    - name: Verify standard package and both ARM architectures
      run: "python3 - \"$ANDROID_HOME/build-tools/35.0.0/aapt\" <<'PY'\nimport re\nimport subprocess\nimport sys\nimport zipfile\nfrom pathlib import Path\napks = list(Path('build/android').glob('*-android-debug.apk'))\nif len(apks) != 1:\n    raise SystemExit(f'Expected one standard debug APK, found {len(apks)}')\napk = apks[0]\nbadging = subprocess.run([sys.argv[1], 'dump', 'badging', str(apk)], check=True, capture_output=True, text=True).stdout\npackage = re.search(r\"^package: name='([^']+)'\", badging, re.MULTILINE)\nif package is None or package.group(1) != 'space.nuvio.nativelegacy':\n    raise SystemExit('APK must use the standard space.nuvio.nativelegacy application ID')\nlabel = re.search(r\"^application-label:'([^']+)'\", badging, re.MULTILINE)\nif label is None:\n    raise SystemExit('APK application label is missing')\nprint(f'applicationId={package.group(1)} applicationLabel={label.group(1)}')\nwith zipfile.ZipFile(apk) as archive:\n    names = set(archive.namelist())\nfor abi in ('arm64-v8a', 'armeabi-v7a'):\n    required = f'lib/{abi}/libmain.so'\n    if required not in names:\n        raise SystemExit(f'APK missing {required}')\nprint(f'{apk}: standard application ID and both ARM native cores verified')\nPY\n"
    - name: Prepare compatible test installation in CI working copy
      run: "python3 - <<'PY'\nfrom pathlib import Path\nreplacements = {\n    Path('android/app/build.gradle.kts'): [\n        ('applicationId = \"space.nuvio.nativelegacy\"', 'applicationId = \"space.nuvio.nativelegacy.touch\"'),\n    ],\n    Path('android/app/src/main/AndroidManifest.xml'): [\n        ('android:label=\"@string/app_name\"', 'android:label=\"Nuvio TV/Mobile Test\"'),\n        ('android:authorities=\"space.nuvio.nativelegacy.atualizacao\"', 'android:authorities=\"space.nuvio.nativelegacy.touch.atualizacao\"'),\n    ],\n}\nupdated = {}\nfor path, pairs in replacements.items():\n    body = path.read_text()\n    for old, new in pairs:\n        if body.count(old) != 1:\n            raise SystemExit(f'{path}: expected exactly one {old!r}')\n        body = body.replace(old, new)\n    updated[path] = body\nfor path, body in updated.items():\n    path.write_text(body)\nprint('Temporary CI package, label and provider authority changed; production namespace and classes preserved')\nPY\n"
    - name: Compatible TV and Mobile test APK
      env:
        NUVIO_P2P_MOTOR: none
      run: "task_root=\"$PWD\"\ntask_cache=\"${NUVIO_ANDROID_CACHE:-$HOME/.cache/nuvio-android}\"\ntask_stage=\"$task_root/build/android\"\nbash android/gradlew -p android --console=plain \\\n  -Pnuvio.sdlSrc=\"$task_cache/src\" \\\n  -Pnuvio.estagio=\"$task_stage\" \\\n  -Pnuvio.ffmpegAar=\"$task_stage/media3-ffmpeg-16kb.aar\" \\\n  assembleDebug\ntask_version=\"$(python3 -c 'import json; print(json.load(open(\"deploy/app/appinfo.json\"))[\"version\"])')\"\ncp android/app/build/outputs/apk/debug/app-debug.apk \"build/android/Nuvio-$task_version-tv-mobile-test.apk\"\n"
    - name: Verify compatible test package, label and native packaging
      run: "python3 - \"$ANDROID_HOME/build-tools/35.0.0/aapt\" <<'PY'\nimport re\nimport subprocess\nimport sys\nimport zipfile\nfrom pathlib import Path\napks = list(Path('build/android').glob('*-tv-mobile-test.apk'))\nif len(apks) != 1:\n    raise SystemExit(f'Expected one compatible test APK, found {len(apks)}')\napk = apks[0]\nbadging = subprocess.run([sys.argv[1], 'dump', 'badging', str(apk)], check=True, capture_output=True, text=True).stdout\npackage = re.search(r\"^package: name='([^']+)'\", badging, re.MULTILINE)\nlabel = re.search(r\"^application-label:'([^']+)'\", badging, re.MULTILINE)\nif package is None or package.group(1) != 'space.nuvio.nativelegacy.touch':\n    raise SystemExit('Test APK must use space.nuvio.nativelegacy.touch')\nif label is None or label.group(1) != 'Nuvio TV/Mobile Test':\n    raise SystemExit('Test APK must be labeled Nuvio TV/Mobile Test')\nprint(f'applicationId={package.group(1)} applicationLabel={label.group(1)}')\nwith zipfile.ZipFile(apk) as archive:\n    names = set(archive.namelist())\nfor abi in ('arm64-v8a', 'armeabi-v7a'):\n    required = f'lib/{abi}/libmain.so'\n    if required not in names:\n        raise SystemExit(f'APK missing {required}')\nsubprocess.run([sys.executable, 'tools/android-apk-pages.py', str(apk)], check=True)\nprint(f'{apk}: compatible test identity, both ARM native cores and page packaging verified')\nPY\n"
    - name: Locate build outputs
      id: outputs
      if: always()
      run: "if compgen -G 'build/android/*-android-debug.apk' >/dev/null; then\n  echo 'standard_apk=true' >> \"$GITHUB_OUTPUT\"\nfi\nif compgen -G 'build/android/*-tv-mobile-test.apk' >/dev/null; then\n  echo 'test_apk=true' >> \"$GITHUB_OUTPUT\"\nfi\nif [[ -d \"$HOME/.cache/nuvio-android\" ]]; then\n  echo 'native_cache=true' >> \"$GITHUB_OUTPUT\"\nfi\nif [[ -d \"$HOME/.gradle/caches\" || -d \"$HOME/.gradle/wrapper\" ]]; then\n  echo 'gradle_cache=true' >> \"$GITHUB_OUTPUT\"\nfi\n"
    - uses: actions/cache/save@v4
      if: always() && steps.outputs.outputs.native_cache == 'true' && steps.native-cache.outputs.cache-hit != 'true' && steps.native-cache.outputs.cache-primary-key != ''
      with:
        path: ~/.cache/nuvio-android
        key: ${{ steps.native-cache.outputs.cache-primary-key }}
    - uses: actions/cache/save@v4
      if: always() && steps.outputs.outputs.gradle_cache == 'true' && steps.gradle-cache.outputs.cache-hit != 'true' && steps.gradle-cache.outputs.cache-primary-key != ''
      with:
        path: '~/.gradle/caches

          ~/.gradle/wrapper

          '
        key: ${{ steps.gradle-cache.outputs.cache-primary-key }}
    - uses: actions/upload-artifact@v4
      if: always() && steps.outputs.outputs.standard_apk == 'true'
      with:
        name: Nuvio-tv-mobile-product-only-${{ github.sha }}
        path: build/android/*-android-debug.apk
        if-no-files-found: error
        retention-days: 14
    - uses: actions/upload-artifact@v4
      if: always() && steps.outputs.outputs.test_apk == 'true'
      with:
        name: Nuvio-tv-mobile-test-${{ github.sha }}
        path: build/android/*-tv-mobile-test.apk
        if-no-files-found: error
        retention-days: 14
    if: 'false'
  native:
    name: TV rendering and Android window regressions
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        os:
        - ubuntu-24.04
    env:
      LIBGL_ALWAYS_SOFTWARE: '1'
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '17'
    - name: Linux native tools
      if: runner.os == 'Linux'
      run: 'sudo apt-get update -qq

        sudo apt-get install -y libsdl2-dev libsdl2-image-dev libsdl2-ttf-dev libgles2-mesa-dev libegl1-mesa-dev zlib1g-dev pkg-config xvfb python3-pil kotlin

        '
    - name: macOS native tools
      if: runner.os == 'macOS'
      run: brew install sdl2 sdl2_image sdl2_ttf
    - name: Actual Android window layout regression
      if: always() && runner.os == 'Linux'
      run: 'python3 tests/android_window_layout.py

        '
    - name: Checkout upstream TV reference
      if: always() && runner.os == 'Linux'
      uses: actions/checkout@v4
      with:
        repository: iqui27/nuvio-native-legacy
        ref: 8b54d67b5977e8fce8928db9236f0c1ce401aa9d
        path: upstream-tv
    - name: Match combined-APK TV rendering against upstream
      if: always() && runner.os == 'Linux'
      run: "python3 - <<'PY'\nimport shutil\nfrom pathlib import Path\npaths = [\n    'tests/agenda_shot.sh', 'tests/busca_shot.sh', 'tests/ajustes_shot.sh',\n    'tests/native_flags.inc', 'tests/shot_context.h', 'tests/shot_arte.h',\n    'tests/agenda_shot.c', 'tests/busca_shot.c', 'tests/ajustes_shot.c',\n]\nfor name in paths:\n    target = Path('upstream-tv') / name\n    target.parent.mkdir(parents=True, exist_ok=True)\n    shutil.copyfile(name, target)\nPY\nmkdir -p build/review/upstream build/review/combined\ntask_root=\"$PWD\"\nfor task_variant in upstream combined; do\n  if [[ \"$task_variant\" == upstream ]]; then\n    task_source=\"$task_root/upstream-tv\"\n    task_flags=''\n  else\n    task_source=\"$task_root\"\n    task_flags='-DNV_TOUCH_UI'\n  fi\n  (\n    cd \"$task_source\"\n    export NV_TEST_CFLAGS=\"$task_flags\"\n    xvfb-run -a -s '-screen 0 1920x1080x24' bash tests/agenda_shot.sh \"$task_root/build/review/$task_variant/agenda\"\n    xvfb-run -a -s '-screen 0 1920x1080x24' bash tests/busca_shot.sh \"$task_root/build/review/$task_variant/search\"\n    for task_layout in 0 1; do\n      NUVIO_AJ_QUADROS='editor-numero editor-escolha cor' NUVIO_SHOT_LAYOUT=\"$task_layout\" xvfb-run -a -s '-screen 0 1920x1080x24' bash tests/ajustes_shot.sh \"$task_root/build/review/$task_variant/settings-$task_layout\"\n    done\n  )\ndone\npython3 - <<'PY'\nfrom pathlib import Path\nfrom PIL import Image, ImageChops\nbaseline, candidate = Path('build/review/upstream'), Path('build/review/combined')\nfiles = sorted(p for p in baseline.iterdir() if p.suffix in ('.bmp', '.png'))\nif not files:\n    raise SystemExit('No upstream TV captures produced')\nexpected = {p.name for p in files}\nactual = {p.name for p in candidate.iterdir() if p.suffix in ('.bmp', '.png')}\nif expected != actual:\n    raise SystemExit(f'Capture sets differ: missing={expected-actual}, extra={actual-expected}')\nfailures = []\nfor old in files:\n    new = candidate / old.name\n    a, b = Image.open(old).convert('RGB'), Image.open(new).convert('RGB')\n    if a.size != b.size:\n        failures.append(old.name + ': dimensions')\n    elif ImageChops.difference(a, b).getbbox():\n        failures.append(old.name)\n        diff = ImageChops.difference(a, b)\n        diff.save(candidate / (old.stem + '-diff.png'))\n    if old.suffix == '.bmp':\n        a.save(old.with_suffix('.png'))\n        b.save(new.with_suffix('.png'))\n        old.unlink()\n        new.unlink()\nprint(f'Compared {len(files)} TV captures against upstream')\nif failures:\n    raise SystemExit('TV rendering changed: ' + ', '.join(failures))\nPY\n"
    - uses: actions/upload-artifact@v4
      if: always() && runner.os == 'Linux'
      with:
        name: TV-upstream-comparison-${{ github.sha }}
        path: build/review/
        if-no-files-found: warn
        retention-days: 14
'on':
  push:
    branches:
    - review/android-auto-mode-build
