name: Automatic Android interface review

on:
  push:
    branches: [review/android-auto-mode-build]

permissions:
  contents: read

concurrency:
  group: android-tv-mobile-product-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      NUVIO_ANDROID_JOBS: 2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Build tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ninja-build cmake nasm ffmpeg python3-pil zlib1g-dev
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'ndk;27.2.12479018' 'cmake;3.22.1'
      - name: Public application configuration and debug signing
        env:
          NUVIO_TOUCH_CORE_PROPERTIES: ${{ secrets.NUVIO_TOUCH_CORE_PROPERTIES }}
          NUVIO_TOUCH_DEBUG_KEYSTORE_B64: ${{ secrets.NUVIO_TOUCH_DEBUG_KEYSTORE_B64 }}
        run: |
          mkdir -p build/android
          python3 - <<'PY'
          import os
          from pathlib import Path
          body = os.environ.get('NUVIO_TOUCH_CORE_PROPERTIES', '')
          if not body:
              raise SystemExit('Set NUVIO_TOUCH_CORE_PROPERTIES for this debug build')
          path = Path('build/android/product.properties')
          path.write_text(body)
          path.chmod(0o600)
          PY
          test -n "$NUVIO_TOUCH_DEBUG_KEYSTORE_B64" || { echo 'Set NUVIO_TOUCH_DEBUG_KEYSTORE_B64 for repeatable debug updates'; exit 1; }
          mkdir -p "$HOME/.android"
          printf '%s' "$NUVIO_TOUCH_DEBUG_KEYSTORE_B64" | base64 --decode > "$HOME/.android/debug.keystore"
          chmod 600 "$HOME/.android/debug.keystore"
          echo "NUVIO_PROPERTIES=$GITHUB_WORKSPACE/build/android/product.properties" >> "$GITHUB_ENV"
      - uses: actions/cache/restore@v4
        id: native-cache
        with:
          path: ~/.cache/nuvio-android
          key: android-touch-native-v1-${{ runner.os }}-${{ hashFiles('tools/android/deps.sh', 'tools/android/ffmpeg-android.sh', 'android/app/src/main/cpp/CMakeLists.txt') }}
          restore-keys: android-touch-native-v1-${{ runner.os }}-
      - uses: actions/cache/restore@v4
        id: gradle-cache
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: android-touch-gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle.kts', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: android-touch-gradle-${{ runner.os }}-
      - name: Native ARM dependencies
        run: bash tools/android/deps.sh arm64-v8a armeabi-v7a
      - name: Standard production-tool debug APK
        env:
          NUVIO_P2P_MOTOR: none
          NUVIO_REQUIRE_CORE: '1'
        run: bash tools/android.sh
      - name: Verify standard package and both ARM architectures
        run: |
          python3 - "$ANDROID_HOME/build-tools/35.0.0/aapt" <<'PY'
          import re
          import subprocess
          import sys
          import zipfile
          from pathlib import Path
          apks = list(Path('build/android').glob('*-android-debug.apk'))
          if len(apks) != 1:
              raise SystemExit(f'Expected one standard debug APK, found {len(apks)}')
          apk = apks[0]
          badging = subprocess.run([sys.argv[1], 'dump', 'badging', str(apk)], check=True, capture_output=True, text=True).stdout
          package = re.search(r"^package: name='([^']+)'", badging, re.MULTILINE)
          if package is None or package.group(1) != 'space.nuvio.nativelegacy':
              raise SystemExit('APK must use the standard space.nuvio.nativelegacy application ID')
          label = re.search(r"^application-label:'([^']+)'", badging, re.MULTILINE)
          if label is None:
              raise SystemExit('APK application label is missing')
          print(f'applicationId={package.group(1)} applicationLabel={label.group(1)}')
          with zipfile.ZipFile(apk) as archive:
              names = set(archive.namelist())
          for abi in ('arm64-v8a', 'armeabi-v7a'):
              required = f'lib/{abi}/libmain.so'
              if required not in names:
                  raise SystemExit(f'APK missing {required}')
          print(f'{apk}: standard application ID and both ARM native cores verified')
          PY
      - name: Prepare compatible test installation in CI working copy
        run: |
          python3 - <<'PY'
          from pathlib import Path
          replacements = {
              Path('android/app/build.gradle.kts'): [
                  ('applicationId = "space.nuvio.nativelegacy"', 'applicationId = "space.nuvio.nativelegacy.touch"'),
              ],
              Path('android/app/src/main/AndroidManifest.xml'): [
                  ('android:label="@string/app_name"', 'android:label="Nuvio TV/Mobile Test"'),
                  ('android:authorities="space.nuvio.nativelegacy.atualizacao"', 'android:authorities="space.nuvio.nativelegacy.touch.atualizacao"'),
              ],
          }
          updated = {}
          for path, pairs in replacements.items():
              body = path.read_text()
              for old, new in pairs:
                  if body.count(old) != 1:
                      raise SystemExit(f'{path}: expected exactly one {old!r}')
                  body = body.replace(old, new)
              updated[path] = body
          for path, body in updated.items():
              path.write_text(body)
          print('Temporary CI package, label and provider authority changed; production namespace and classes preserved')
          PY
      - name: Compatible TV and Mobile test APK
        env:
          NUVIO_P2P_MOTOR: none
        run: |
          task_root="$PWD"
          task_cache="${NUVIO_ANDROID_CACHE:-$HOME/.cache/nuvio-android}"
          task_stage="$task_root/build/android"
          bash android/gradlew -p android --console=plain \
            -Pnuvio.sdlSrc="$task_cache/src" \
            -Pnuvio.estagio="$task_stage" \
            -Pnuvio.ffmpegAar="$task_stage/media3-ffmpeg-16kb.aar" \
            assembleDebug
          task_version="$(python3 -c 'import json; print(json.load(open("deploy/app/appinfo.json"))["version"])')"
          cp android/app/build/outputs/apk/debug/app-debug.apk "build/android/Nuvio-$task_version-tv-mobile-test.apk"
      - name: Verify compatible test package, label and native packaging
        run: |
          python3 - "$ANDROID_HOME/build-tools/35.0.0/aapt" <<'PY'
          import re
          import subprocess
          import sys
          import zipfile
          from pathlib import Path
          apks = list(Path('build/android').glob('*-tv-mobile-test.apk'))
          if len(apks) != 1:
              raise SystemExit(f'Expected one compatible test APK, found {len(apks)}')
          apk = apks[0]
          badging = subprocess.run([sys.argv[1], 'dump', 'badging', str(apk)], check=True, capture_output=True, text=True).stdout
          package = re.search(r"^package: name='([^']+)'", badging, re.MULTILINE)
          label = re.search(r"^application-label:'([^']+)'", badging, re.MULTILINE)
          if package is None or package.group(1) != 'space.nuvio.nativelegacy.touch':
              raise SystemExit('Test APK must use space.nuvio.nativelegacy.touch')
          if label is None or label.group(1) != 'Nuvio TV/Mobile Test':
              raise SystemExit('Test APK must be labeled Nuvio TV/Mobile Test')
          print(f'applicationId={package.group(1)} applicationLabel={label.group(1)}')
          with zipfile.ZipFile(apk) as archive:
              names = set(archive.namelist())
          for abi in ('arm64-v8a', 'armeabi-v7a'):
              required = f'lib/{abi}/libmain.so'
              if required not in names:
                  raise SystemExit(f'APK missing {required}')
          subprocess.run([sys.executable, 'tools/android-apk-pages.py', str(apk)], check=True)
          print(f'{apk}: compatible test identity, both ARM native cores and page packaging verified')
          PY
      - name: Locate build outputs
        id: outputs
        if: always()
        run: |
          if compgen -G 'build/android/*-android-debug.apk' >/dev/null; then
            echo 'standard_apk=true' >> "$GITHUB_OUTPUT"
          fi
          if compgen -G 'build/android/*-tv-mobile-test.apk' >/dev/null; then
            echo 'test_apk=true' >> "$GITHUB_OUTPUT"
          fi
          if [[ -d "$HOME/.cache/nuvio-android" ]]; then
            echo 'native_cache=true' >> "$GITHUB_OUTPUT"
          fi
          if [[ -d "$HOME/.gradle/caches" || -d "$HOME/.gradle/wrapper" ]]; then
            echo 'gradle_cache=true' >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/cache/save@v4
        if: always() && steps.outputs.outputs.native_cache == 'true' && steps.native-cache.outputs.cache-hit != 'true' && steps.native-cache.outputs.cache-primary-key != ''
        with:
          path: ~/.cache/nuvio-android
          key: ${{ steps.native-cache.outputs.cache-primary-key }}
      - uses: actions/cache/save@v4
        if: always() && steps.outputs.outputs.gradle_cache == 'true' && steps.gradle-cache.outputs.cache-hit != 'true' && steps.gradle-cache.outputs.cache-primary-key != ''
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ steps.gradle-cache.outputs.cache-primary-key }}
      - uses: actions/upload-artifact@v4
        if: always() && steps.outputs.outputs.standard_apk == 'true'
        with:
          name: Nuvio-tv-mobile-product-only-${{ github.sha }}
          path: build/android/*-android-debug.apk
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always() && steps.outputs.outputs.test_apk == 'true'
        with:
          name: Nuvio-tv-mobile-test-${{ github.sha }}
          path: build/android/*-tv-mobile-test.apk
          if-no-files-found: error
          retention-days: 14

  native:
    name: TV regressions and macOS compatibility
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    env:
      LIBGL_ALWAYS_SOFTWARE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Linux native tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libsdl2-dev libsdl2-image-dev libsdl2-ttf-dev libgles2-mesa-dev libegl1-mesa-dev zlib1g-dev pkg-config xvfb python3-pil kotlin
      - name: macOS native tools
        if: runner.os == 'macOS'
        run: brew install sdl2 sdl2_image sdl2_ttf
      - name: Locale catalog verification
        run: python3 tools/idiomas.py
      - name: Actual decoder script portability
        run: python3 tests/android_ffmpeg_bash.py
      - name: Runtime TV and Mobile geometry and state
        run: |
          task_checks_status=0
          bash tests/runtime_modes.sh || task_checks_status=1
          bash tests/interface_mode.sh || task_checks_status=1
          NV_TEST_CFLAGS=-DNV_TOUCH_UI bash tests/ajustes_ux_interacao.sh || task_checks_status=1
          exit "$task_checks_status"
      - name: Android device classification and saved preference policy
        if: always() && runner.os == 'Linux'
        run: |
          python3 tests/android_interface_mode.py
          python3 tests/android_window_layout.py
      - name: Full macOS desktop compilation
        if: always() && runner.os == 'macOS'
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          prefix = subprocess.check_output(['brew', '--prefix'], text=True).strip()
          body = Path('tools/build-local.sh').read_text().replace('/opt/homebrew', prefix)
          Path('tools/build-local-review.sh').write_text(body)
          Path('tools/build-local-hybrid-review.sh').write_text(body.replace('cc src/*.c', 'cc -DNV_TOUCH_UI src/*.c'))
          PY
          /bin/bash tools/build-local-review.sh
          /bin/bash tools/build-local-hybrid-review.sh
      - name: Checkout upstream TV reference
        if: always() && runner.os == 'Linux'
        uses: actions/checkout@v4
        with:
          repository: iqui27/nuvio-native-legacy
          ref: 8b54d67b5977e8fce8928db9236f0c1ce401aa9d
          path: upstream-tv
      - name: Match combined-APK TV rendering against upstream
        if: always() && runner.os == 'Linux'
        run: |
          python3 - <<'PY'
          import shutil
          from pathlib import Path
          paths = [
              'tests/agenda_shot.sh', 'tests/busca_shot.sh', 'tests/ajustes_shot.sh',
              'tests/native_flags.inc', 'tests/shot_context.h',
              'tests/agenda_shot.c', 'tests/busca_shot.c', 'tests/ajustes_shot.c',
          ]
          for name in paths:
              target = Path('upstream-tv') / name
              target.parent.mkdir(parents=True, exist_ok=True)
              shutil.copyfile(name, target)
          PY
          mkdir -p build/review/upstream build/review/combined
          task_root="$PWD"
          for task_variant in upstream combined; do
            if [[ "$task_variant" == upstream ]]; then
              task_source="$task_root/upstream-tv"
              task_flags=''
            else
              task_source="$task_root"
              task_flags='-DNV_TOUCH_UI'
            fi
            (
              cd "$task_source"
              export NV_TEST_CFLAGS="$task_flags"
              xvfb-run -a -s '-screen 0 1920x1080x24' bash tests/agenda_shot.sh "$task_root/build/review/$task_variant/agenda"
              xvfb-run -a -s '-screen 0 1920x1080x24' bash tests/busca_shot.sh "$task_root/build/review/$task_variant/search"
              for task_layout in 0 1; do
                NUVIO_AJ_QUADROS='editor-numero editor-escolha cor' NUVIO_SHOT_LAYOUT="$task_layout" xvfb-run -a -s '-screen 0 1920x1080x24' bash tests/ajustes_shot.sh "$task_root/build/review/$task_variant/settings-$task_layout"
              done
            )
          done
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageChops
          baseline, candidate = Path('build/review/upstream'), Path('build/review/combined')
          files = sorted(p for p in baseline.iterdir() if p.suffix in ('.bmp', '.png'))
          if not files:
              raise SystemExit('No upstream TV captures produced')
          expected = {p.name for p in files}
          actual = {p.name for p in candidate.iterdir() if p.suffix in ('.bmp', '.png')}
          if expected != actual:
              raise SystemExit(f'Capture sets differ: missing={expected-actual}, extra={actual-expected}')
          failures = []
          for old in files:
              new = candidate / old.name
              a, b = Image.open(old).convert('RGB'), Image.open(new).convert('RGB')
              if a.size != b.size:
                  failures.append(old.name + ': dimensions')
              elif ImageChops.difference(a, b).getbbox():
                  failures.append(old.name)
                  diff = ImageChops.difference(a, b)
                  diff.save(candidate / (old.stem + '-diff.png'))
              if old.suffix == '.bmp':
                  a.save(old.with_suffix('.png'))
                  b.save(new.with_suffix('.png'))
                  old.unlink()
                  new.unlink()
          print(f'Compared {len(files)} TV captures against upstream')
          if failures:
              raise SystemExit('TV rendering changed: ' + ', '.join(failures))
          PY
      - uses: actions/upload-artifact@v4
        if: always() && runner.os == 'Linux'
        with:
          name: TV-upstream-comparison-${{ github.sha }}
          path: build/review/
          if-no-files-found: warn
          retention-days: 14
