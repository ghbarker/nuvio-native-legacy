name: Logs57 Google Drive backup APK and Linux validation

on:
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        options: [all, apk, native]
        default: all

concurrency:
  group: logs57-final-apk-${{ github.ref }}-${{ inputs.mode }}
  cancel-in-progress: true

jobs:
  linux-regressions:
    if: ${{ inputs.mode != 'apk' }}
    env:
      ASAN_OPTIONS: detect_leaks=0:halt_on_error=1
      UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ae64dc019f872bbbf871189cf2495b4a76b0cd9d
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install test dependencies
        run: sudo apt-get update -qq && sudo apt-get install -y -qq pkg-config xvfb xauth libegl1-mesa-dev libsdl2-dev libsdl2-image-dev libsdl2-ttf-dev libwebp-dev libass-dev libfribidi-dev libgles2-mesa-dev
      - name: Backup protocol and actual native owner regressions
        run: |
          set -euo pipefail
          for suite in backuplocal backuprestauro backupdisco drivelocal drivetv fontefalha_backup; do
            bash "tests/$suite.sh"
            SANITIZE=1 bash "tests/$suite.sh"
          done
          pids=()
          for suite in backupapp drivebackup; do
            (
              bash "tests/$suite.sh"
              SANITIZE=1 bash "tests/$suite.sh"
            ) > "$suite-checks.log" 2>&1 &
            pids+=("$!")
          done
          status=0
          for pid in "${pids[@]}"; do wait "$pid" || status=1; done
          tail -12 backupapp-checks.log
          tail -12 drivebackup-checks.log
          test "$status" = 0
          python3 tools/idiomas.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: logs57-native-regression-logs
          path: '*-checks.log'
          if-no-files-found: ignore

  apk-build:
    if: ${{ inputs.mode != 'native' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    permissions:
      contents: read
    env:
      NUVIO_ANDROID_JOBS: '2'
      NUVIO_BUILD_JOBS: '2'
      NUVIO_P2P_MOTOR: none
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          ref: ae64dc019f872bbbf871189cf2495b4a76b0cd9d
          persist-credentials: false
      - name: Verify exact integrated source
        run: |
          test "$(git rev-parse HEAD)" = ae64dc019f872bbbf871189cf2495b4a76b0cd9d
          test "$(git rev-parse HEAD^{tree})" = a7f85f0064bcc8e1567344226b192965feae3076
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install build and test tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ninja-build cmake nasm ffmpeg python3-pil zlib1g-dev libsdl2-dev libsdl2-image-dev libsdl2-ttf-dev libwebp-dev libass-dev libfribidi-dev libgles2-mesa-dev libegl1-mesa-dev libgl1-mesa-dev
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'ndk;27.2.12479018' 'cmake;3.22.1'
      - name: Prepare private configuration and persistent signing
        env:
          CORE_PROPERTIES: ${{ secrets.NUVIO_TOUCH_CORE_PROPERTIES }}
          DEBUG_KEYSTORE_B64: ${{ secrets.NUVIO_TOUCH_DEBUG_KEYSTORE_B64 }}
        run: |
          python3 - <<'PY'
          import base64, hashlib, os, pathlib, subprocess
          root=pathlib.Path(os.environ['RUNNER_TEMP'])/'nuvio-logs57'
          root.mkdir(mode=0o700)
          props=root/'product.properties'
          body=os.environ.get('CORE_PROPERTIES','')
          assert body, 'NUVIO_TOUCH_CORE_PROPERTIES is required'
          props.write_text(body); props.chmod(0o600)
          key=root/'debug.keystore'
          encoded=''.join(os.environ.get('DEBUG_KEYSTORE_B64','').split())
          assert encoded, 'NUVIO_TOUCH_DEBUG_KEYSTORE_B64 is required'
          key.write_bytes(base64.b64decode(encoded,validate=True)); key.chmod(0o600)
          cert=subprocess.check_output(['keytool','-exportcert','-alias','androiddebugkey','-keystore',str(key),'-storepass','android'],stderr=subprocess.PIPE)
          assert hashlib.sha256(cert).hexdigest()=='862d7ef63a0dbde2929f6f231cae295510726d9ac28f9292496d2a38304be5e6'
          with open(os.environ['GITHUB_ENV'],'a') as f:
              f.write(f'NUVIO_PROPERTIES={props.resolve()}\nNUVIO_TEST_DEBUG_KEYSTORE={key.resolve()}\n')
          PY
      - uses: actions/cache/restore@v4
        id: native-cache
        with:
          path: ~/.cache/nuvio-android
          key: logs34-native-v1-${{ runner.os }}-${{ hashFiles('tools/android/deps.sh', 'tools/android/ffmpeg-android.sh') }}
          restore-keys: |
            rebases10e3-native-v1-Linux-a84ffeb3bc46020bad0de5e73efad6f0aa72d51f8a714696cd4426466c721a75
            rebases10e3-native-v1-Linux-
      - uses: actions/cache/restore@v4
        id: gradle-cache
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: logs34-gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle.kts', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            logs34-gradle-${{ runner.os }}-
            logs33-gradle-${{ runner.os }}-
            rebases10e3-gradle-v1-${{ runner.os }}-
      - name: Validate source and translations
        run: |
          git diff --check HEAD^
          python3 tools/idiomas.py
          find tests tools -type f -name '*.sh' -print0 | xargs -0 -n1 bash -n
      - name: Build native Android dependencies
        run: bash tools/android/deps.sh arm64-v8a armeabi-v7a
      - name: Build update-compatible Logs57 APK
        env:
          GRADLE_OPTS: -Dorg.gradle.project.nuvio.testLocalLogs=true
          NUVIO_REQUIRE_CORE: '1'
          NUVIO_GOOGLE_ANDROID_CLIENT_ID: 332670494075-e1ocg7dmruau58n7h0vl1k231pdpstqq.apps.googleusercontent.com
          NUVIO_GOOGLE_TV_CLIENT_ID: 332670494075-u7892oim0t6c0s21uj9ao2houjthkl17.apps.googleusercontent.com
          NUVIO_GOOGLE_TV_CLIENT_SECRET: ${{ secrets.NUVIO_GOOGLE_TV_CLIENT_SECRET }}
        run: |
          # Upstream's local default points at /Volumes/ExternalSSD. Use the
          # hosted runner's toolchain and install the two targets the APK ships.
          export RUSTUP_HOME="$HOME/.rustup"
          export CARGO_HOME="$HOME/.cargo"
          export PATH="$CARGO_HOME/bin:$PATH"
          rustup target add aarch64-linux-android armv7-linux-androideabi
          test -n "$NUVIO_GOOGLE_TV_CLIENT_SECRET"
          bash tools/android.sh
      # tools/android.sh prepares the SDL Java sources and generated build
      # inputs that compiling this Android unit-test source set also requires.
      - name: Run live recovery, HTTP source and font import unit tests
        env:
          GRADLE_OPTS: -Dorg.gradle.project.nuvio.testLocalLogs=true
        run: |
          cd android
          ./gradlew --no-daemon testDebugUnitTest --tests space.nuvio.nativelegacy.LiveWindowRecoveryTest --tests space.nuvio.nativelegacy.ParaleloDataSourceTest --tests space.nuvio.nativelegacy.FontImportTest --tests space.nuvio.nativelegacy.DriveAuthStateTest
      - name: Verify package, version, signer and both ABIs
        run: |
          set -euo pipefail
          mapfile -t apks < <(find build/android -maxdepth 1 -type f -name 'Nuvio-*-android-debug.apk' -print)
          test "${#apks[@]}" -eq 1
          apk="${apks[0]}"
          badging="$("$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$apk")"
          grep -F "package: name='space.nuvio.nativelegacy.touch' versionCode='20067' versionName='2.0.67-test-logs57'" <<< "$badging"
          grep -F "application-label:'Nuvio TV/Mobile Test'" <<< "$badging"
          cert="$("$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "$apk" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -1)"
          test "$cert" = 862d7ef63a0dbde2929f6f231cae295510726d9ac28f9292496d2a38304be5e6
          unzip -Z1 "$apk" | grep -qx 'lib/arm64-v8a/libmain.so'
          unzip -Z1 "$apk" | grep -qx 'lib/armeabi-v7a/libmain.so'
          python3 tools/android-apk-pages.py "$apk"
          cp "$apk" Nuvio-TV-Mobile-Test-Logs57.apk
          python3 - <<'PY'
          import hashlib,json,pathlib
          p=pathlib.Path('Nuvio-TV-Mobile-Test-Logs57.apk')
          out={'all_passed':False,'source_commit':'ae64dc019f872bbbf871189cf2495b4a76b0cd9d','source_tree':'a7f85f0064bcc8e1567344226b192965feae3076','package':'space.nuvio.nativelegacy.touch','version_code':20067,'version_name':'2.0.67-test-logs57','certificate_sha256':'862d7ef63a0dbde2929f6f231cae295510726d9ac28f9292496d2a38304be5e6','apk_bytes':p.stat().st_size,'apk_sha256':hashlib.sha256(p.read_bytes()).hexdigest(),'included_prs':[573,575,576,587],'native_account_regressions':False,'sanitizer_regressions':False,'android_font_unit_test':True,'both_arm_abis':True}
          pathlib.Path('Logs57-validation.json').write_text(json.dumps(out,indent=2)+'\n')
          PY
      - uses: actions/cache/save@v4
        if: always() && steps.native-cache.outputs.cache-hit != 'true'
        with:
          path: ~/.cache/nuvio-android
          key: ${{ steps.native-cache.outputs.cache-primary-key }}
      - uses: actions/cache/save@v4
        if: always() && steps.gradle-cache.outputs.cache-hit != 'true'
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ steps.gradle-cache.outputs.cache-primary-key }}
      - uses: actions/upload-artifact@v4
        with:
          name: Nuvio-TV-Mobile-Test-Logs57-${{ github.sha }}
          path: |
            Nuvio-TV-Mobile-Test-Logs57.apk
            Logs57-validation.json
          if-no-files-found: error
          retention-days: 14
      - name: Remove private inputs
        if: always()
        run: rm -rf "$RUNNER_TEMP/nuvio-logs57"

