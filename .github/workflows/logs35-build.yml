name: Logs94 buffer-aware HLS recovery APK

on:
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        options: [all, apk, native]
        default: all

concurrency:
  group: logs94-final-apk-${{ github.ref }}-${{ inputs.mode }}
  cancel-in-progress: true

jobs:
  linux-regressions:
    if: ${{ inputs.mode != 'apk' }}
    env:
      ASAN_OPTIONS: detect_leaks=0:halt_on_error=1
      UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: 56f765bdcc1febcb05868cd656ba5016338a537b
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install test dependencies
        run: sudo apt-get update -qq && sudo apt-get install -y -qq pkg-config xvfb xauth libegl1-mesa-dev libsdl2-dev libsdl2-image-dev libsdl2-ttf-dev libwebp-dev libass-dev libfribidi-dev libgles2-mesa-dev
      - name: Combined source audio smoke regressions
        run: |
          set -euo pipefail
          bash tests/source_audio_language.sh > audio-checks.log 2>&1
          SANITIZE=1 bash tests/source_audio_language.sh >> audio-checks.log 2>&1
          tail -30 audio-checks.log
          # Full Linux/macOS integration coverage runs in logs94-native-checks.yml.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: logs94-native-regression-logs
          path: '*-checks.log'
          if-no-files-found: ignore

  simkl-configuration:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Validate configured Simkl PIN registration
        env:
          SIMKL_CLIENT_ID: ${{ secrets.NUVIO_SIMKL_CLIENT_ID }}
        run: |
          python3 - <<'SIMKL'
          import json,os,urllib.request,urllib.parse,urllib.error
          key=os.environ.get('SIMKL_CLIENT_ID','').strip()
          if not key or any(c.isspace() for c in key):
              raise SystemExit('NUVIO_SIMKL_CLIENT_ID is missing or invalid; add the Client ID to Actions secrets.')
          query=urllib.parse.urlencode({'client_id':key,'app-name':'Nuvio TV/Mobile Test','app-version':'2.0.104-test-logs94'})
          try:
              with urllib.request.urlopen('https://api.simkl.com/oauth/pin?'+query,timeout=25) as response:
                  body=json.load(response)
          except urllib.error.HTTPError as e:
              raise SystemExit('Simkl PIN registration check returned HTTP '+str(e.code)) from None
          except Exception:
              raise SystemExit('Simkl PIN registration check could not reach the service.') from None
          if body.get('result')!='OK' or not body.get('user_code') or not body.get('verification_url'):
              raise SystemExit('Simkl did not accept this registration for the app PIN flow.')
          print('Simkl client ID configured; PIN endpoint accepted the registration. No user account was signed in.')
          SIMKL

  apk-build:
    needs: simkl-configuration
    if: ${{ inputs.mode != 'native' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    permissions:
      contents: read
    env:
      NUVIO_ANDROID_JOBS: '2'
      NUVIO_BUILD_JOBS: '2'
      NUVIO_P2P_MOTOR: none
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          ref: 56f765bdcc1febcb05868cd656ba5016338a537b
          persist-credentials: false
      - name: Verify exact integrated source
        run: |
          test "$(git rev-parse HEAD)" = 56f765bdcc1febcb05868cd656ba5016338a537b
          test "$(git rev-parse HEAD^{tree})" = 21386b07accaf6aedf16612c69a18b16414a76b4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install build and test tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ninja-build cmake nasm ffmpeg python3-pil zlib1g-dev libsdl2-dev libsdl2-image-dev libsdl2-ttf-dev libwebp-dev libass-dev libfribidi-dev libgles2-mesa-dev libegl1-mesa-dev libgl1-mesa-dev
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'ndk;27.2.12479018' 'cmake;3.22.1'
      - name: Prepare private configuration and persistent signing
        env:
          CORE_PROPERTIES: ${{ secrets.NUVIO_TOUCH_CORE_PROPERTIES }}
          SIMKL_CLIENT_ID: ${{ secrets.NUVIO_SIMKL_CLIENT_ID }}
          DEBUG_KEYSTORE_B64: ${{ secrets.NUVIO_TOUCH_DEBUG_KEYSTORE_B64 }}
        run: |
          python3 - <<'PY'
          import base64, hashlib, os, pathlib, subprocess
          root=pathlib.Path(os.environ['RUNNER_TEMP'])/'nuvio-logs94'
          root.mkdir(mode=0o700)
          props=root/'product.properties'
          body=os.environ.get('CORE_PROPERTIES','')
          assert body, 'NUVIO_TOUCH_CORE_PROPERTIES is required'
          simkl=os.environ.get('SIMKL_CLIENT_ID','').strip()
          assert simkl and not any(c.isspace() for c in simkl), 'Simkl Client ID is required'
          body='\n'.join(line for line in body.splitlines() if not line.startswith(('SIMKL_CLIENT_ID=','SIMKL_APP_NAME=')))
          body+='\nSIMKL_CLIENT_ID='+simkl+'\nSIMKL_APP_NAME=Nuvio TV/Mobile Test\n'
          props.write_text(body); props.chmod(0o600)
          key=root/'debug.keystore'
          encoded=''.join(os.environ.get('DEBUG_KEYSTORE_B64','').split())
          assert encoded, 'NUVIO_TOUCH_DEBUG_KEYSTORE_B64 is required'
          key.write_bytes(base64.b64decode(encoded,validate=True)); key.chmod(0o600)
          cert=subprocess.check_output(['keytool','-exportcert','-alias','androiddebugkey','-keystore',str(key),'-storepass','android'],stderr=subprocess.PIPE)
          assert hashlib.sha256(cert).hexdigest()=='862d7ef63a0dbde2929f6f231cae295510726d9ac28f9292496d2a38304be5e6'
          with open(os.environ['GITHUB_ENV'],'a') as f:
              f.write(f'NUVIO_PROPERTIES={props.resolve()}\nNUVIO_TEST_DEBUG_KEYSTORE={key.resolve()}\n')
          PY
      - uses: actions/cache/restore@v4
        id: native-cache
        with:
          path: ~/.cache/nuvio-android
          key: logs34-native-v1-${{ runner.os }}-${{ hashFiles('tools/android/deps.sh', 'tools/android/ffmpeg-android.sh') }}
          restore-keys: |
            rebases10e3-native-v1-Linux-a84ffeb3bc46020bad0de5e73efad6f0aa72d51f8a714696cd4426466c721a75
            rebases10e3-native-v1-Linux-
      - uses: actions/cache/restore@v4
        id: gradle-cache
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: logs34-gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle.kts', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            logs34-gradle-${{ runner.os }}-
            logs33-gradle-${{ runner.os }}-
            rebases10e3-gradle-v1-${{ runner.os }}-
      - name: Fetch unchanged upstream translation baseline
        run: git fetch --no-tags --depth=1 origin 1890f9f674adf646df3360b01d3b303024da3494
      - name: Build native Android dependencies
        run: bash tools/android/deps.sh arm64-v8a armeabi-v7a
      - name: Build update-compatible Logs94 APK
        env:
          GRADLE_OPTS: -Dorg.gradle.project.nuvio.testLocalLogs=true
          NUVIO_REQUIRE_CORE: '1'
          NUVIO_GOOGLE_ANDROID_CLIENT_ID: 332670494075-e1ocg7dmruau58n7h0vl1k231pdpstqq.apps.googleusercontent.com
          NUVIO_GOOGLE_TV_CLIENT_ID: 332670494075-u7892oim0t6c0s21uj9ao2houjthkl17.apps.googleusercontent.com
          NUVIO_GOOGLE_TV_CLIENT_SECRET: ${{ secrets.NUVIO_GOOGLE_TV_CLIENT_SECRET }}
        run: |
          # Upstream's local default points at /Volumes/ExternalSSD. Use the
          # hosted runner's toolchain and install the two targets the APK ships.
          export RUSTUP_HOME="$HOME/.rustup"
          export CARGO_HOME="$HOME/.cargo"
          export PATH="$CARGO_HOME/bin:$PATH"
          rustup target add aarch64-linux-android armv7-linux-androideabi
          test -n "$NUVIO_GOOGLE_TV_CLIENT_SECRET"
          bash tools/android.sh
      - name: Verify package, version, signer and both ABIs
        env:
          SIMKL_CLIENT_ID: ${{ secrets.NUVIO_SIMKL_CLIENT_ID }}
        run: |
          set -euo pipefail
          mapfile -t apks < <(find build/android -maxdepth 1 -type f -name 'Nuvio-*-android-debug.apk' -print)
          test "${#apks[@]}" -eq 1
          apk="${apks[0]}"
          badging="$("$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$apk")"
          grep -F "package: name='space.nuvio.nativelegacy.touch' versionCode='20104' versionName='2.0.104-test-logs94'" <<< "$badging"
          grep -F "application-label:'Nuvio TV/Mobile Test'" <<< "$badging"
          cert="$("$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "$apk" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -1)"
          test "$cert" = 862d7ef63a0dbde2929f6f231cae295510726d9ac28f9292496d2a38304be5e6
          unzip -Z1 "$apk" | grep -qx 'lib/arm64-v8a/libmain.so'
          unzip -Z1 "$apk" | grep -qx 'lib/armeabi-v7a/libmain.so'
          python3 tools/android-apk-pages.py "$apk"
          cp "$apk" Nuvio-TV-Mobile-Test-Logs94.apk
          python3 - <<'PY'
          import hashlib,json,pathlib,os,zipfile
          p=pathlib.Path('Nuvio-TV-Mobile-Test-Logs94.apk')
          key=os.environ['SIMKL_CLIENT_ID'].strip().encode()
          with zipfile.ZipFile(p) as archive:
              for abi in ('arm64-v8a','armeabi-v7a'):
                  assert key in archive.read('lib/'+abi+'/libmain.so'), 'Simkl Client ID missing from native binary'
          print('Simkl Client ID is present in both ARM binaries.')
          out={'source_commit':'56f765bdcc1febcb05868cd656ba5016338a537b','source_tree':'21386b07accaf6aedf16612c69a18b16414a76b4','package':'space.nuvio.nativelegacy.touch','version_code':20104,'version_name':'2.0.104-test-logs94','certificate_sha256':'862d7ef63a0dbde2929f6f231cae295510726d9ac28f9292496d2a38304be5e6','apk_bytes':p.stat().st_size,'apk_sha256':hashlib.sha256(p.read_bytes()).hexdigest(),'integration_base':'1890f9f674adf646df3360b01d3b303024da3494','included_prs':[573,575,576,598,609,611,614,615,619],'upstream_ports':[596,601,602,631],'android_build':True,'simkl_client_configured':True,'simkl_pin_registration_checked':True,'android_unit_tests':[],'tests_skipped_by_request':False,'native_metadata_checks_separate':True,'both_arm_abis':True,'arm64_16kb_alignment':True,'workflow_commit':__import__('os').environ['GITHUB_SHA'],'workflow_run_id':int(__import__('os').environ['GITHUB_RUN_ID'])}
          pathlib.Path('Logs94-validation.json').write_text(json.dumps(out,indent=2)+'\n')
          PY
      - uses: actions/cache/save@v4
        if: always() && steps.native-cache.outputs.cache-hit != 'true'
        with:
          path: ~/.cache/nuvio-android
          key: ${{ steps.native-cache.outputs.cache-primary-key }}
      - uses: actions/cache/save@v4
        if: always() && steps.gradle-cache.outputs.cache-hit != 'true'
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ steps.gradle-cache.outputs.cache-primary-key }}
      - uses: actions/upload-artifact@v4
        with:
          name: Nuvio-TV-Mobile-Test-Logs94-${{ github.sha }}
          path: |
            Nuvio-TV-Mobile-Test-Logs94.apk
            Logs94-validation.json
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Logs94-Android-evidence-${{ github.sha }}
          path: |
            Logs94-translation-*.txt
            android/app/build/test-results/testDebugUnitTest
            android/app/build/reports/tests/testDebugUnitTest
          if-no-files-found: ignore
          retention-days: 14
      - name: Remove private inputs
        if: always()
        run: rm -rf "$RUNNER_TEMP/nuvio-logs94"

