name: Logs21 native provider failover on real Android
on:
  push:
    branches: [review/logs21-native-failover-e2e-20261016]
permissions:
  contents: read
concurrency:
  group: logs21-native-failover-e2e
  cancel-in-progress: false
jobs:
  native-provider-failover:
    if: true
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Bind the isolated recipe to the published APK source
        run: |
          mkdir -p build/logs21-failover/proof
          python3 - <<'PY'
          import hashlib,json,os,pathlib,subprocess
          source='9e55a0cb95010ee25ffb71b81671a596f6451e2e'
          assert subprocess.check_output(['git','rev-parse','HEAD^'],text=True).strip()==source
          paths=subprocess.check_output(['git','diff-tree','--no-commit-id','--name-only','-r','HEAD'],text=True).splitlines()
          assert paths and all(p.startswith('.review/logs21-failover/') or p=='.github/workflows/logs21-native-failover-e2e.yml' for p in paths)
          files={p:hashlib.sha256(pathlib.Path(p).read_bytes()).hexdigest() for p in paths}
          pathlib.Path('build/logs21-failover/proof/recipe-source.json').write_text(json.dumps({'actual_review':os.environ['GITHUB_SHA'],'published_apk_source_parent':source,'recipe_files':files,'app_source_changed':False},indent=2)+'\n')
          PY
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Prepare exact unchanged published Logs21 APK and isolated fixture tools
        run: |
          mkdir -p build/logs21-failover/proof
          curl --fail --location --retry 2 --output build/logs21-failover/Logs21.apk 'https://github.com/ghbarker/nuvio-native-legacy/releases/download/tv-mobile-test-logs-v21/Nuvio-TV-Mobile-Test-Logs21.apk'
          echo 'd5f84067a06c2c23cfce91358b838ee6f8cbc89feea03444ac372860b43a0771  build/logs21-failover/Logs21.apk' | sha256sum --check
          curl --fail --location --retry 2 --output build/logs21-failover/Logs21-validation.json 'https://github.com/ghbarker/nuvio-native-legacy/releases/download/tv-mobile-test-logs-v21/Logs21-validation.json'
          echo 'ac9dfdabe67d4977f602b06877be0e9e7aa20765c8ba92a30eab18df2d70a4e8  build/logs21-failover/Logs21-validation.json' | sha256sum --check
          sdkmanager 'build-tools;35.0.0'
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg mkvtoolnix
          command -v jdb
          command -v ffmpeg
          command -v ffprobe
          command -v mkvmerge
          command -v mkvextract
          bash .review/logs21-failover/generate_media.sh build/logs21-failover/media build/logs21-failover/proof/media
          bash .review/logs21-failover/prepare_certificates.sh "$RUNNER_TEMP/logs21-fixture-private"
      - name: Start closed-world fixture DNS before the AVD boots
        run: |
          sudo python3 .review/logs21-failover/dns_fixture.py --log "$GITHUB_WORKSPACE/build/logs21-failover/proof/fixture-dns.jsonl" > build/logs21-failover/proof/fixture-dns-server.log 2>&1 &
          echo $! > build/logs21-failover/dns.pid
          python3 - <<'PY'
          import socket,time
          deadline=time.monotonic()+10
          while time.monotonic()<deadline:
              try:
                  s=socket.socket(socket.AF_INET,socket.SOCK_DGRAM);s.settimeout(1)
                  s.sendto(bytes.fromhex('495001000001000000000000')+b'\x03api\x06torbox\x03app\x00\x00\x01\x00\x01',('127.0.0.1',53))
                  data,_=s.recvfrom(4096);s.close()
                  assert data.endswith(bytes([10,0,2,2]))
                  break
              except (OSError,AssertionError):time.sleep(.25)
          else:raise SystemExit('Closed fixture DNS did not become ready')
          PY
      - name: Enable real KVM acceleration
        run: |
          test -c /dev/kvm
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Exercise the actual native provider policy and foreground decoder
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          profile: pixel_2
          cores: 2
          ram-size: 4096M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none -no-snapshot -skin 1280x720 -writable-system -dns-server 127.0.0.1
          script: python3 .review/logs21-failover/failover_smoke.py --apk build/logs21-failover/Logs21.apk --validation build/logs21-failover/Logs21-validation.json --output build/logs21-failover/proof --media-dir build/logs21-failover/media --cert-dir "$RUNNER_TEMP/logs21-fixture-private"
      - name: Stop only the private fixture DNS process
        if: always()
        run: |
          if [ -f build/logs21-failover/dns.pid ]; then
            task_dns_pid=$(cat build/logs21-failover/dns.pid)
            if [[ "$task_dns_pid" =~ ^[0-9]+$ ]]; then sudo kill "$task_dns_pid" || true; fi
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: logs21-native-failover-proof-${{ github.sha }}
          path: build/logs21-failover/proof
          if-no-files-found: error
          retention-days: 14
