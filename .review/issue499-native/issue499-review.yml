{
  "name": "Cache #499: native-only fixture portability recovery",
  "on": {
    "push": {
      "branches": [
        "review/issue499-cache-native-v2-20261015"
      ]
    }
  },
  "permissions": {
    "contents": "read"
  },
  "concurrency": {
    "group": "issue499-native-v2-${{ github.sha }}",
    "cancel-in-progress": false
  },
  "env": {
    "CACHE_PLAN_SHA256": "1eeb9a5f374618a3c6763e103f78b98d2cd5ea89a10a095eb29c59046f785585",
    "ASAN_OPTIONS": "detect_leaks=0:halt_on_error=1",
    "UBSAN_OPTIONS": "halt_on_error=1:print_stacktrace=1"
  },
  "jobs": {
    "native": {
      "name": "Fresh macOS TV/Mobile apps and cache truth normal + sanitizers",
      "runs-on": "macos-14",
      "timeout-minutes": 65,
      "steps": [
        {
          "uses": "actions/checkout@v4",
          "with": {
            "persist-credentials": false,
            "fetch-depth": 0
          }
        },
        {
          "name": "Recreate exact clean cache-readiness source",
          "run": "python3 .review/issue499/materialize.py --target source-app --proof results/source-verified.json"
        },
        {
          "uses": "actions/setup-python@v5",
          "with": {
            "python-version": "3.12"
          }
        },
        {
          "name": "Real compiler and SDK sanity before full links",
          "run": "task_native_cc=\"$(command -v cc)\"\ntest \"$task_native_cc\" = /usr/bin/cc\necho \"NUVIO_REVIEW_REAL_CC=$task_native_cc\" >> \"$GITHUB_ENV\"\nbrew install sdl2 sdl2_image sdl2_ttf sdl3\nmkdir -p results/sdk\ncat > results/sdk/probe.c <<'C'\n#include <stdio.h>\n#include <AvailabilityMacros.h>\n#include <SDL2/SDL.h>\n#include <OpenGL/gl3.h>\nint main(void){puts(\"Real SDK ready\");return 0;}\nC\ntask_brew_prefix=\"$(brew --prefix)\"\n\"$task_native_cc\" -O1 -I\"$task_brew_prefix/include\" -I\"$task_brew_prefix/include/SDL2\" results/sdk/probe.c -L\"$task_brew_prefix/lib\" -Wl,-rpath,\"$task_brew_prefix/lib\" -lSDL2 -lSDL2_image -lSDL2_ttf -framework OpenGL -o results/sdk/probe\nresults/sdk/probe\n"
        },
        {
          "name": "Run actual cache parser/native/row/chip cases then full TV/Mobile apps",
          "run": "python3 .review/issue499/native.py --source source-app --proof results/source-verified.json --output results/native"
        },
        {
          "name": "Reverify exact source after validation",
          "run": "python3 .review/issue499/materialize.py --target source-app --proof results/source-verified.json --reverify"
        },
        {
          "uses": "actions/upload-artifact@v4",
          "if": "always()",
          "with": {
            "name": "issue499-native-${{ github.sha }}",
            "path": "results/\n!results/**/*.o",
            "if-no-files-found": "error",
            "retention-days": 14
          }
        }
      ]
    }
  }
}
